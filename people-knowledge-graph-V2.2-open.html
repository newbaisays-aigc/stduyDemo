<!doctype html>

<html lang="zh-CN">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>初中语文学习图谱开源版</title>

  <link rel="stylesheet" href="https://unpkg.com/reactflow@11/dist/style.css">

  <style>

    * { box-sizing: border-box; }

    :root {

      --ink: #1f2a30;

      --muted: #66747c;

      --line: #dce3dc;

      --person: #1f7a8c;

      --work: #6c5ce7;

      --tag: #288a64;

      --era: #bb6b23;

    }

    body {

      margin: 0;

      min-height: 100vh;

      color: var(--ink);

      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;

      background: linear-gradient(135deg, #f5f7f2, #eef5f7 55%, #fbf0e8);

    }

    button, input { font: inherit; }

    .app { display: grid; grid-template-columns: 380px minmax(520px, 1fr) var(--detail-width, 460px); min-height: 100vh; }

    .app.catalog-mode { grid-template-columns: 380px 1fr; }

    .app.catalog-mode.left-collapsed { grid-template-columns: 54px 1fr; }

    .app.left-collapsed { grid-template-columns: 54px minmax(720px, 1fr) var(--detail-width, 460px); }

    .app.right-collapsed { grid-template-columns: 380px minmax(720px, 1fr) 54px; }

    .app.left-collapsed.right-collapsed { grid-template-columns: 54px minmax(820px, 1fr) 54px; }

    /* 题库/目录/专项等非图形视图：左栏固定(右侧滚动时不动)，右侧内容区独立滚动定位 */
    .app.catalog-mode { height: 100vh; overflow: hidden; }
    .app.catalog-mode .side { position: sticky; top: 0; align-self: start; max-height: 100vh; }
    .app.catalog-mode > section:not([hidden]) { height: 100vh; overflow: auto; }
    .app.catalog-mode > section:not([hidden])::-webkit-scrollbar { width: 10px; }
    .app.catalog-mode > section:not([hidden])::-webkit-scrollbar-thumb { background: #c5d2cb; border-radius: 6px; }

    .side, .detail { background: rgba(255,255,255,.88); backdrop-filter: blur(16px); overflow: auto; padding: 22px; }

    .side { border-right: 1px solid var(--line); }

    .detail { border-left: 1px solid var(--line); position: relative; }

    .detail-resizer {

      position: absolute;

      top: 0;

      left: -5px;

      width: 10px;

      height: 100%;

      cursor: col-resize;

      z-index: 20;

      background: transparent;

    }

    .detail-resizer::after {

      content: "";

      position: absolute;

      top: 50%;

      left: 4px;

      width: 3px;

      height: 58px;

      transform: translateY(-50%);

      border-radius: 999px;

      background: rgba(31,42,48,.16);

    }

    .detail-resizing { user-select: none; cursor: col-resize; }

    .panel-toggle {

      position: sticky;

      top: 0;

      z-index: 5;

      width: 34px;

      height: 34px;

      border: 1px solid var(--line);

      border-radius: 12px;

      background: rgba(255,255,255,.86);

      cursor: pointer;

      color: var(--ink);

      box-shadow: 0 8px 18px rgba(0,0,0,.06);

    }

    .side .panel-toggle { float: right; margin: -4px -4px 10px 10px; }

    .detail .panel-toggle { float: none; margin: 0 0 14px; display: block; }

    .detail-action-row {

      display: flex;

      justify-content: flex-start;

      align-items: center;

      min-height: 38px;

      margin: 0 0 12px;

      clear: both;

    }

    .detail-action-row .panel-toggle { margin: 0; }

    .app.left-collapsed .side, .app.right-collapsed .detail { padding: 14px 10px; overflow: hidden; }

    .app.left-collapsed .side > :not(.panel-toggle), .app.right-collapsed .detail > :not(.panel-toggle):not(.detail-action-row) { display: none !important; }

    .app.left-collapsed .side .panel-toggle, .app.right-collapsed .detail .panel-toggle { float: none; margin: 0 auto; display: block; }

    h1 { margin: 0 0 8px; font-size: 24px; }

    .hint { margin: 0 0 18px; color: var(--muted); line-height: 1.7; font-size: 14px; }

    .top-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 16px; }

    .top-tab { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fff; cursor: pointer; color: var(--muted); }

    .top-tab.active { color: #fff; background: var(--person); border-color: var(--person); }

    .search { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; outline: none; background: #fff; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }

    .side-filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }

    .side-filter-row:last-child { margin-bottom: 0; }

    .side-filter-row + .side-filter-row { padding-top: 8px; border-top: 1px dashed var(--line); }

    .catalog-view-toggle { display: inline-flex; gap: 0; margin: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; flex: none; }

    .catalog-view-toggle button { font: inherit; border: 0; padding: 8px 16px; background: rgba(255,255,255,.85); color: var(--muted); cursor: pointer; }

    .catalog-view-toggle button.active { background: var(--person); color: #fff; }

    .catalog-view-bar { display: flex; justify-content: flex-start; margin: 0 0 12px; }

    .catalog-reactflow-wrap { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }

    .catalog-reactflow { width: 100%; height: calc(100vh - 230px); min-height: 520px; background: linear-gradient(160deg, #fbfdfc, #eef5f7); }

    .catalog-rf-node { padding: 9px 14px; border-radius: 12px; background: #fff; border: 2px solid var(--line); border-top-width: 5px; box-shadow: 0 6px 16px rgba(0,0,0,.07); text-align: center; min-width: 118px; cursor: pointer; transition: opacity .35s ease, filter .35s ease, box-shadow .35s ease, transform .35s ease; }

    .catalog-rf-title { font-size: 14px; font-weight: 700; color: #1f2a30; line-height: 1.4; }

    .catalog-rf-author { font-size: 11px; color: #88929a; margin-top: 3px; }

    .catalog-rf-node.active {

      transform: translateY(-2px) scale(1.05);

      border-color: rgba(31,122,140,.65);

      box-shadow: 0 18px 42px rgba(31,42,48,.24), 0 0 0 5px rgba(31,122,140,.32);

      z-index: 5;

    }

    .catalog-rf-node.active .catalog-rf-title { color: var(--person); }

    .catalog-rf-node.dimmed { opacity: .3; filter: grayscale(.5) saturate(.4) brightness(1.06); border-color: rgba(0,0,0,.05); }

    .catalog-reactflow .react-flow__edge.dimmed { opacity: .12; }

    .catalog-legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0 0; color: var(--muted); font-size: 13px; }

    .catalog-legend-item { display: inline-flex; align-items: center; gap: 6px; }

    .catalog-legend-item i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

    /* —— 文章目录·图谱模式：全屏画布 + 顶部悬浮（贴近人物图谱） —— */

    .catalog.catalog-graph-mode {

      position: relative;

      padding: 0;

      overflow: hidden;

      height: 100vh;

      background: linear-gradient(135deg, #f5f7f2, #eef5f7 55%, #fbf0e8);

    }

    .catalog.catalog-graph-mode::before {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      background-image: linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px);

      background-size: 42px 42px;

      mask-image: radial-gradient(circle at center, rgba(0,0,0,.38), transparent 72%);

      -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,.38), transparent 72%);

    }

    .catalog.catalog-graph-mode .catalog-reactflow { width: 100%; height: 100%; min-height: 0; background: transparent; }

    .catalog-graph-bar {

      position: absolute;

      z-index: 20;

      top: 16px;

      left: 18px;

      display: flex;

      align-items: center;

      gap: 10px;

      max-width: calc(100% - 430px);

      padding: 8px 10px;

      border: 1px solid rgba(255,255,255,.68);

      border-radius: 22px;

      background: rgba(255,255,255,.68);

      backdrop-filter: blur(24px) saturate(1.4);

      -webkit-backdrop-filter: blur(24px) saturate(1.4);

      box-shadow: 0 14px 38px rgba(0,0,0,.08);

    }

    .catalog-unit-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 78px; overflow: auto; }

    .catalog-unit-chip {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      font: inherit;

      font-size: 12px;

      color: var(--ink);

      background: rgba(255,255,255,.9);

      border: 1px solid var(--line);

      border-radius: 999px;

      padding: 5px 11px;

      cursor: pointer;

      white-space: nowrap;

    }

    .catalog-unit-chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

    .catalog-unit-chip:hover { border-color: rgba(31,122,140,.5); background: #fff; box-shadow: 0 6px 14px rgba(31,42,48,.1); }

    .catalog-unit-chip.active { border-color: var(--person); background: #eef7f8; color: var(--person); font-weight: 700; box-shadow: 0 6px 14px rgba(31,122,140,.22); }

    .catalog-graph-title {

      position: absolute;

      z-index: 20;

      top: 18px;

      right: 20px;

      max-width: min(380px, 40%);

      padding: 12px 16px;

      border-radius: 20px;

      border: 1px solid rgba(255,255,255,.68);

      background: rgba(255,255,255,.7);

      backdrop-filter: blur(22px) saturate(1.35);

      -webkit-backdrop-filter: blur(22px) saturate(1.35);

      box-shadow: 0 14px 38px rgba(0,0,0,.08);

    }

    .catalog-graph-title strong { display: block; font-size: 15px; margin-bottom: 3px; }

    .catalog-graph-title span { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .catalog-graph-status {

      position: absolute;

      z-index: 20;

      left: 20px;

      right: 20px;

      bottom: 18px;

      display: flex;

      justify-content: space-between;

      gap: 12px;

      align-items: center;

      padding: 10px 14px;

      border-radius: 18px;

      border: 1px solid rgba(255,255,255,.62);

      background: rgba(255,255,255,.64);

      backdrop-filter: blur(22px) saturate(1.35);

      -webkit-backdrop-filter: blur(22px) saturate(1.35);

      box-shadow: 0 14px 38px rgba(0,0,0,.07);

      color: var(--muted);

      font-size: 12px;

    }

    .catalog-graph-status strong { color: var(--ink); }

    .catalog-graph-status .catalog-legend { margin: 0; gap: 10px; }

    /* —— 文章关联：related 与 详情浮层 —— */

    .catalog-rf-node.related {

      transform: translateY(-2px);

      box-shadow: 0 16px 36px rgba(31,42,48,.16), 0 0 0 4px rgba(52,199,89,.26);

    }

    .catalog-detail-panel {

      position: absolute;

      z-index: 30;

      top: 72px;

      right: 16px;

      bottom: 72px;

      width: min(430px, 48%);

      background: rgba(255,255,255,.9);

      backdrop-filter: blur(24px) saturate(1.35);

      -webkit-backdrop-filter: blur(24px) saturate(1.35);

      border: 1px solid rgba(255,255,255,.7);

      border-radius: 22px;

      box-shadow: 0 24px 64px rgba(0,0,0,.18);

      padding: 20px 22px;

      overflow: auto;

      animation: catalogPanelIn .3s cubic-bezier(.2,.8,.3,1);

    }

    @keyframes catalogPanelIn {

      from { opacity: 0; transform: translateX(28px); }

      to { opacity: 1; transform: translateX(0); }

    }

    .catalog-detail-panel h2 { margin: 0 26px 2px 0; font-size: 21px; line-height: 1.35; }

    .catalog-detail-meta { color: var(--muted); font-size: 13px; margin: 0 0 4px; }

    .catalog-author-link {

      font: inherit;

      color: var(--person);

      border: 0;

      background: transparent;

      padding: 0;

      cursor: pointer;

      text-decoration: underline;

      text-underline-offset: 3px;

      text-decoration-color: rgba(31,122,140,.4);

    }

    .catalog-author-link:hover { color: #176a7a; text-decoration-color: rgba(23,106,122,.8); }

    .catalog-detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .catalog-detail-tags .tag-pill { background: #eef7f8; color: var(--person); }

    .catalog-detail-close {

      position: absolute;

      top: 12px;

      right: 14px;

      width: 30px;

      height: 30px;

      border: 0;

      border-radius: 50%;

      background: rgba(31,42,48,.06);

      color: var(--ink);

      font-size: 16px;

      cursor: pointer;

      line-height: 1;

    }

    .catalog-detail-close:hover { background: rgba(31,42,48,.13); }

    .catalog-detail-section { margin-top: 16px; }

    .catalog-detail-section h3 {

      font-size: 13px;

      letter-spacing: .04em;

      color: var(--muted);

      margin: 0 0 8px;

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .catalog-detail-section h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .catalog-detail-intro { font-size: 14px; line-height: 1.75; color: var(--ink); background: rgba(31,122,140,.06); border-radius: 12px; padding: 12px 14px; }

    .catalog-detail-exam { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

    .catalog-detail-exam li {

      position: relative;

      padding: 7px 10px 7px 26px;

      background: rgba(31,122,140,.07);

      border-radius: 9px;

      font-size: 13px;

      line-height: 1.55;

      color: var(--ink);

    }

    .catalog-detail-exam li::before { content: "◆"; position: absolute; left: 10px; top: 8px; color: var(--person); font-size: 9px; }

    .catalog-detail-exam-question { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 13px; line-height: 1.6; color: var(--ink); margin: 0 0 8px; }

    .catalog-detail-exam-question small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }

    .catalog-rel-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .catalog-rel-chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; background: #fff; font-size: 12px; cursor: pointer; color: var(--ink); }

    .catalog-rel-chip:hover { border-color: rgba(31,122,140,.5); background: #f3fafb; }

    .catalog-rel-empty { color: var(--muted); font-size: 13px; }

    .catalog-detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }

    .catalog-detail-head .catalog-detail-meta { margin: 0; }

    .catalog-detail-open {

      flex: none;

      display: inline-block;

      padding: 5px 13px;

      border: 1px solid rgba(31,122,140,.32);

      border-radius: 999px;

      background: rgba(31,122,140,.07);

      color: var(--person);

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;

      line-height: 1.6;

      transition: background .18s ease;

    }

    .catalog-detail-open:hover { background: rgba(31,122,140,.16); }

    .hit-rate-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }

    .hit-rate-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }

    .hit-rate-num { font-size: 26px; font-weight: 800; color: var(--person); line-height: 1; }

    .hit-rate-meta { color: var(--muted); font-size: 12px; }

    .hit-rate-bar { height: 8px; border-radius: 999px; background: #e8efea; overflow: hidden; margin-bottom: 10px; }

    .hit-rate-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #1f7a8c, #55b6c6); }

    .hit-years { display: flex; flex-wrap: wrap; gap: 5px; }

    .hit-year { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #f2f5f2; color: var(--muted); }

    .hit-year.hit { background: #eef7f8; color: var(--person); font-weight: 700; border: 1px solid rgba(31,122,140,.35); }

    .hit-rate-note { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    /* —— 补充题库 —— */

    .qb-card { padding: 12px; }

    .qb-head-btn {

      font: inherit;

      font-size: 12px;

      border: 1px solid var(--line);

      border-radius: 8px;

      background: #fff;

      color: var(--person);

      padding: 3px 10px;

      cursor: pointer;

      float: right;

    }

    .qb-head-btn:hover { background: #eef7f8; }

    .qb-struct-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 8px 0 10px; }
    .qb-struct-stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
    .qb-struct-stat strong { display: block; font-size: 20px; line-height: 1.2; color: var(--person); }
    .qb-struct-stat span { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); font-weight: 700; }
    .qb-struct-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
    .qb-struct-chip { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 7px; border-radius: 999px; background: #eef7f8; color: #1f6f7e; font-size: 11px; font-weight: 700; }
    .qb-struct-chip.warn { background: #fff4e6; color: #a35f12; }
    .qb-struct-chip.miss { background: #fff0f0; color: #b13a30; }
    .qb-answer-inputs { display: grid; gap: 7px; margin: 8px 0 4px; }
    .qb-answer-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; }
    .qb-answer-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .qb-inline-input,
    .qb-answer-input,
    .qb-answer-textarea {
      box-sizing: border-box;
      border: 1px solid #bfd4da;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .qb-inline-input { width: 112px; min-width: 84px; height: 28px; padding: 3px 8px; vertical-align: middle; margin: 0 4px; }
    .qb-answer-input { width: 100%; min-height: 32px; padding: 5px 9px; }
    .qb-answer-textarea { width: 100%; min-height: 72px; resize: vertical; padding: 7px 9px; line-height: 1.65; }
    .qb-option-choice { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 5px; align-items: start; font-size: 13px; line-height: 1.7; }
    .qb-option-choice input { margin-top: 5px; accent-color: var(--person); }
    .qb-reading-material {
      max-width: 820px;
      margin: 8px auto 16px;
      padding: 18px 22px;
      border: 1px solid #dbe7e6;
      border-radius: 10px;
      background: #fffdf8;
      color: #232323;
      font-family: "SimSun", "宋体", "Noto Serif SC", serif;
      box-shadow: 0 10px 22px rgba(38, 52, 48, .04);
    }
    .qb-reading-material-title {
      margin: 2px 0 12px;
      text-align: center;
      font-family: "SimSun", "宋体", "Noto Serif SC", serif;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.45;
      color: #111827;
      letter-spacing: 0;
    }
    .qb-reading-material-guide {
      margin: 0 0 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }
    .qb-reading-material-body {
      max-width: 760px;
      margin: 0 auto;
      font-size: 15px;
      line-height: 2.05;
      text-align: left;
    }
    .qb-reading-material.modern .qb-reading-p {
      margin: 0 0 8px;
      text-indent: 0;
      text-align: left;
    }
    .qb-reading-material.classical {
      background: #fffaf0;
      border-color: #eadfca;
    }
    .qb-reading-material.classical .qb-reading-material-body {
      max-width: 760px;
      margin: 0 auto;
      font-size: 16px;
      line-height: 2.15;
    }
    .qb-reading-material.classical .qb-reading-p {
      margin: 0 0 8px;
      text-indent: 0;
      text-align: left;
    }
    .qb-reading-material.poem .qb-reading-material-body,
    .qb-reading-material.poem .qb-reading-p {
      text-align: left;
    }
    .qb-reading-material.poem .qb-reading-p { text-indent: 0; }
    .qb-reading-material .qb-reading-author {
      margin: -2px 0 10px;
      text-align: center;
      color: #4f5f5d;
      font-size: 13px;
      line-height: 1.6;
      text-indent: 0;
    }
    .qb-reading-material .qb-reading-p.qb-reading-author {
      text-align: center;
    }
    .qb-reading-material .qb-reading-note {
      margin: 10px 0 0;
      color: #5f6f6d;
      font-size: 13px;
      line-height: 1.85;
      text-indent: 0;
    }
    .qb-essay-sample {
      max-width: 820px;
      margin: 10px auto 14px;
      padding: 18px 22px;
      border: 1px solid #dbe7e6;
      border-radius: 10px;
      background: #fffdf8;
      color: #232323;
      font-family: "SimSun", "宋体", "Noto Serif SC", serif;
      box-shadow: 0 10px 22px rgba(38, 52, 48, .04);
    }
    .qb-essay-sample-title {
      margin: 2px 0 12px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.45;
      color: #111827;
      letter-spacing: 0;
    }
    .qb-essay-sample-body {
      max-width: 760px;
      margin: 0 auto;
      font-size: 15px;
      line-height: 2.05;
      text-align: left;
    }
    .qb-essay-sample-p {
      margin: 0 0 8px;
      text-align: left;
      text-indent: 2em;
    }
    .qb-essay-head {
      max-width: 820px;
      margin: 8px auto 10px;
      padding: 14px 18px 12px;
      border: 1px solid #d9e6e5;
      border-radius: 12px;
      background: linear-gradient(180deg, #f8fbff 0%, #fffdf6 100%);
      box-shadow: 0 8px 18px rgba(38, 52, 48, .04);
    }

    /* Apple-inspired visual refresh */

    .app.right-collapsed { grid-template-columns: 380px minmax(720px, 1fr) 54px; }

    const personFunGossip = {

      "柳宗元": ["和好兄弟刘禹锡是文学史上有名的「贬友搭子」：两人同年中进士、同被贬、还约好互相写诗打气。柳宗元先走一步，刘禹锡哭着写《重至衡阳伤柳仪曹》悼念，后来还把他的儿子接到身边抚养——这友情够硬核。记住「刘柳」之交，就不会把《江雪》和《陋室铭》的作者搞混了。", "同为「永贞革新」战友：刘、柳都是王叔文革新集团的核心成员，革新失败后一起被贬——刘禹锡贬朗州，柳宗元贬永州，堪称「难兄难弟」。", "柳宗元去世后，刘禹锡不仅写诗悼念，还真的把柳宗元的儿子接到长安亲自抚养，帮老友把遗孤照顾长大——朋友做到这份上，是真兄弟。", "俩人约定「异日相会、互访」，柳宗元常写信给刘禹锡勉励他「勿以贬谪自弃」，两人隔着千山万水互相写诗打气，留下了文坛最暖的友情。"],

      "刘禹锡": ["绰号「诗豪」，一生被贬二十三年，还能写「沉舟侧畔千帆过，病树前头万木春」给自己打气，妥妥的乐观派。他两次因写《玄都观桃花》讽刺权贵被贬，回京后还故意再写一首——「前度刘郎今又来」，是真·不怕事。和柳宗元并称「刘柳」，是彼此的「精神搭子」。", "刘禹锡和柳宗元同年中进士、同朝为官、同被贬，还经常互相唱和。柳宗元在永州写信问刘禹锡近况，刘禹锡回诗说「莫道谗言如浪深，莫言迁客似沙沉」，两人在贬谪路上互相打气，硬是把苦日子过出了乐观味儿。", "柳宗元临终前把子女托付给刘禹锡，刘禹锡后来亲自把柳宗元的儿子接到长安抚养，还为他撰写了《柳子厚集》的编集序，把老友的文集整理传世——「刘柳」生死之交名不虚传。", "刘禹锡写《竹枝词》《乌衣巷》时，柳宗元是第一个读者加头号粉丝；两人一南一北相隔千里，书信诗词往来不断，被后世称作文坛「双璧」。"],

      "李白": ["「诗仙」也是个社交牛人：让高力士脱靴、让杨贵妃研墨（传说），皇帝请他写诗他还敢醉着来。晚年传说他喝醉后跳进江里捞月亮——虽是传说，但「浪漫得不像话」的人设算是立住了。杜牧那句「李白斗酒诗百篇」说的就是他：越喝越能写。"],

      "杜甫": ["「诗圣」是李白的头号迷弟，写了十几首诗表白「李白」，李白只回过几首。杜甫一生坎坷，从「会当凌绝顶」的豪情到「南村群童欺我老无力」的辛酸，全写进诗里，所以他的诗被称为「诗史」——读他的诗，就是读那段历史。"],

      "王维": ["「诗佛」是妥妥的佛系青年：中年后「晚年惟好静，万事不关心」，吃素、参禅、画画、写山水诗，一样不落。他是状元出身、官做到尚书右丞，却总想着隐居——「行到水穷处，坐看云起时」就是他的日常心态。记住「诗中有画，画中有诗」，是苏轼给他的官方认证。"],

      "韩愈": ["「唐宋八大家」之首，发起古文运动，反对骈文，还带头「推敲」——不对，推敲是贾岛和韩愈的故事：贾岛骑驴想「推」还是「敲」，撞了韩愈的仪仗队，韩愈非但没怪他，还帮他想出了「敲」字。韩愈还因反对皇帝迎佛骨被贬潮州，写「一封朝奏九重天」自嘲，是个敢说话的主。"],

      "白居易": ["和元稹是「元白」组合，两人互相写诗唱和近千首，还约定「你写诗我来品」。白居易写诗有个习惯：写完先念给老奶奶听，听不懂就改——这就是「老妪能解」的典故。他一边写《长恨歌》一边写《卖炭翁》，雅俗通吃，是唐代的「顶流」。"],

      "苏轼": ["全能型选手：写词（豪放派）、画画、书法、美食，样样精通。「东坡肉」就是他发明的，贬到哪吃到哪，被贬黄州做红烧肉、贬惠州吃荔枝「日啖荔枝三百颗」。遭遇「乌台诗案」差点被杀，出来后照样「一蓑烟雨任平生」——天生的乐天派，和弟弟苏辙并称「三苏」父子三人全进唐宋八大家。"],

      "辛弃疾": ["文武双全的狠人：二十一岁就带五十人冲进五万人的敌营，活捉叛徒（真事！）。后来被朝廷闲置二十年，写「醉里挑灯看剑」全是没仗打的憋屈。他是豪放派词人代表，和苏轼并称「苏辛」——但他是真上过战场的那位。"],

      "李清照": ["「千古第一才女」，性格刚得很：丈夫赵明诚弃城逃跑，她写诗讽刺「至今思项羽，不肯过江东」；对苏轼、柳永的词也敢点名批评，说人家「句读不葺之诗」。她和赵明诚一起收藏金石文物，写《金石录》——可惜乱世里大半丢失，她的词也从「争渡争渡」的少女欢快变成「凄凄惨惨戚戚」的晚年悲凉。"],

      "陶渊明": ["「不为五斗米折腰」的本尊：当彭泽县令八十多天，因为不想给上级摆样子，直接辞职回老家种地。他写「采菊东篱下」的田园诗，还幻想出「桃花源」，是中国第一位田园诗人。但他辞官后是真穷，连酒都喝不起，还照样写「止酒」——嘴上说戒，身体很诚实。"],

      "欧阳修": ["「醉翁之意不在酒」本人：自称醉翁、六一居士，其实酒量很差还爱喝。他是文坛伯乐，提拔过苏轼、王安石等一堆后辈——「唐宋八大家」里有五位都是他的门生或受他提携。晚年写《醉翁亭记》，把滁州山水写成「山水之乐，得之心而寓之酒也」。"],

      "范仲淹": ["小时候读书「断齑画粥」：把冷粥划成四块就咸菜吃，苦读成才。当官后「先天下之忧而忧，后天下之乐而乐」，主持庆历新政，还带兵戍边——「人不寐，将军白发征夫泪」就是他守边关写的。是个能文能武的「行动派」。"],

      "文天祥": ["被俘后元朝许他高官厚禄，他写下「人生自古谁无死，留取丹心照汗青」拒降，从容就义。他的《过零丁洋》连「惶恐滩头说惶恐，零丁洋里叹零丁」都是双关——地名+心情，语文考试的常客。记住「舍生取义」，他就是这句话的代言人。"],

      "曹操": ["被小说《三国演义》黑成「奸雄」的枭雄：望梅止渴、煮酒论英雄都是他的名场面（部分真事）。他不仅是政治家军事家，还是建安文学领袖，「老骥伏枥，志在千里」就是他的自我激励。语文考试爱考他的《观沧海》——写大海其实是写自己的雄心。"],

      "司马光": ["「司马光砸缸」的典故让所有人记住他，其实他的主业是主编《资治通鉴》，一部写了十九年的大部头。他和王安石是政敌：王安石搞变法，他反对，两人在朝堂上互怼多年——但私下互相尊重，是「君子和而不同」的典范。"],

      "王安石": ["「唐宋八大家」之一，也是被梁启超夸、被后人骂的「改革派」：王安石变法搞了十几年，激进得罪人。他和苏轼政见不同，但苏轼被贬后他还写信劝慰——「宰相肚里能撑船」。他的《登飞来峰》「不畏浮云遮望眼」就是改革者的宣言。"],

      "陆游": ["南宋「爱国诗人」，一辈子惦记收复中原，临死前还写《示儿》「王师北定中原日，家祭无忘告乃翁」。他和表妹唐婉的爱情故事更虐：被迫离婚后，沈园重逢写下《钗头凤》，此后一生怀念——晚年还写「伤心桥下春波绿」。一个既能打仗做梦、又深情一生的诗人。"],

      "龚自珍": ["清代思想家，一首《己亥杂诗》写了三百多首。「落红不是无情物，化作春泥更护花」是他辞官后写的——表面写花，其实写自己：虽然离开官场，还要为国奉献。他是晚清「开风气」的人物，思想比同龄人超前。"],

      "杜牧": ["「小李杜」之一，写《赤壁》《泊秦淮》这些咏史怀古诗，最爱借古讽今。他年轻时在扬州当官，据说生活很浪，后来写「十年一觉扬州梦」自己吐槽。他的《山行》「停车坐爱枫林晚」又让他成了「秋天代言人」。"],

      "李商隐": ["「无题」专业户：他写的《无题》诗，到底在写爱情还是写政治，后人争了一千多年。一句「春蚕到死丝方尽」让多少人为他流泪。他和杜牧并称「小李杜」，但诗风完全不同——杜牧直白，他朦胧，是晚唐的「神秘感担当」。"],

      "杨万里": ["「诚斋体」创始人，写诗爱从日常小事里找乐子：「小荷才露尖尖角」「接天莲叶无穷碧」都是他的。他观察虫子、看小孩追蝶，写诗像发朋友圈——「儿童急走追黄蝶，飞入菜花无处寻」。南宋「中兴四大家」之一，最接地气的诗人。"],

      "赵师秀": ["「永嘉四灵」之一，一首《约客》出圈：等朋友等到半夜，「闲敲棋子落灯花」——朋友没来，他自己把孤独写出了境界。他的诗爱写「闲」和「清」，适合和「约客不来」的日常情景一起记。"],

      "马致远": ["「元曲四大家」之一，一首《天净沙·秋思》封神：九个意象（枯藤、老树、昏鸦……）全是没有生命的物，最后一句「断肠人在天涯」点题，被称为「秋思之祖」。他早年追求功名，晚年看破红尘去隐居，号「东篱」——没错，就是陶渊明「采菊东篱下」那个东篱。"],

      "白朴": ["「元曲四大家」之一，和关汉卿、马致远、郑光祖并列。他写杂剧也写散曲，《天净沙·秋》「青山绿水，白草红叶黄花」和《秋思》常放一起对比：一个萧瑟，一个明丽。他一生拒绝做官，专心写戏，是元代「躺平」的文艺代表。"],

      "柳永": ["北宋婉约派代表，自称「奉旨填词柳三变」——传说皇帝嫌他太浪，说「且去填词」，他就真去专业写词了，结果「凡有井水处，皆能歌柳词」，词流行到爆。他的《雨霖铃》《蝶恋花》写尽离愁，那句「衣带渐宽终不悔，为伊消得人憔悴」成了千古情话。"],

      "崔颢": ["一首《黄鹤楼》让他「一诗封神」：传说李白游黄鹤楼想题诗，看到崔颢的题诗后说「眼前有景道不得，崔颢题诗在上头」，直接搁笔。他早年写诗浮艳，中年后作品大变，一篇《黄鹤楼》「晴川历历汉阳树」足以青史留名。"],

      "常建": ["唐代诗人里的「一篇流」：一首《题破山寺后禅院》「曲径通幽处，禅房花木深」流传千古。他一生仕途不顺，却把「幽静」写到了极致——考试爱考「曲径通幽」这四个字，记住他，就记住了这句诗。"],

      "司马迁": ["为了完成《史记》，甘愿接受宫刑之辱——在那个把名节看得比命重的时代，他选择「隐忍苟活」写完这部「史家之绝唱」。他写《史记》不只是记史，还借古讽今、为游侠刺客立传，是古代最有「笔杆子」精神的史学家。"],

      "孟子": ["「孟母三迁」讲的就是他妈妈为了给他好环境搬了三次家，所以他成了辩论小能手。他是孔子之后儒家第二号人物，人称「亚圣」，写文章气势磅礴、最爱举例论证——《生于忧患》一口气举了舜、傅说、胶鬲等六个人的例子。他和孔子并称「孔孟」，思想主打「民贵君轻」。"],

      "朱自清": ["《背影》写父亲买橘子，「蹒跚地走到铁道边」的细节让几代人流眼泪。他本人也硬气：1948年宁可饿死也不领美国救济粮，毛泽东还专门夸他「表现了我们民族的英雄气概」。他是散文大家，文风清丽，《春》《荷塘月色》都是名篇。"],

      "老舍": ["满族作家，语言大师，一口京片子味。他写《骆驼祥子》《茶馆》，笔下全是北京底层的小人物——「祥子」的悲剧就是旧社会的写照。他还有个身份是「人民艺术家」，作品接地气到北京话里都留有他的影子。"],

      "茅盾": ["《白杨礼赞》的「白杨树」是他用来赞颂北方军民和民族精神的象征——用托物言志，借树写人。他原名沈德鸿，笔名「茅盾」是因为当时处境矛盾。他是现代文学大家，也当过文化部长，是「茅盾文学奖」的命名人。"],

      "叶圣陶": ["《苏州园林》的「讲究」写尽园林之美——他说苏州园林是「一幅完美的图画」。他本职是教育家、编辑，教过小学语文，编过课本，所以他的说明文特别清楚好懂。和茅盾一样，都是「文以载道」的实干派。"],

      "艾青": ["原名蒋正涵，「艾青」是笔名。他的诗爱写「土地」和「太阳」：土地代表苦难中的祖国，太阳代表希望——这是《艾青诗选》的核心意象，考试常考。成名作《大堰河——我的保姆》是写给养他长大的保姆的，又土又深情。"],

      "施耐庵": ["《水浒传》的作者，把一百零八将写成「官逼民反」的群像。他据说是元末明初人，还传说是张士诚的军师（存疑），所以写起梁山好汉来特别有「军事视角」。记住「官逼民反」四个字，《水浒》的主题就跑不了。"],

      "吴承恩": ["《西游记》的作者，写孙悟空「三打白骨精」「三调芭蕉扇」。他一生科举不顺，晚年才把满肚子牢骚写进「取经路」——那些妖怪神仙，多少都有点人间讽刺。考试爱考「三」字结构的情节设计：一「起」、二「变」、三「结」。"],

      "鲁迅": ["「横眉冷对千夫指，俯首甘为孺子牛」本人。他弃医从文：在日本看幻灯片里中国人被砍头还围观叫好，决定「医治灵魂比医治身体更重要」。他对萧红等青年作家提携有加，写《藤野先生》纪念没有民族偏见的老师。他的文章像手术刀，篇篇见血。"],

      "萧红": ["《回忆鲁迅先生》里写鲁迅「笑声是明朗的」「走路很轻捷」——从生活细节里还原一个鲜活的鲁迅。她是「民国四大才女」之一，鲁迅是她文学上的伯乐，所以她写鲁迅格外有感情。记住她，就记住了鲁迅「平易近人」的一面。"],

      "孙犁": ["「荷花淀派」创始人，写战争题材却充满诗意——《山地回忆》写军民情谊，清新得像山泉水。他的文风「清水出芙蓉」，和一般的战争文学很不一样，考试爱用「清新朴素」来形容他。"],

      "张桂梅": ["「七一勋章」获得者，创办全国第一所免费女子高中，把山里女孩送出大山。课文《青春之光》写的就是她——「春蚕到死丝方尽」的当代版。记她，就记「教育改变命运、无私奉献」两个关键词。"],

      "季羡林": ["北大「国学大师」，会十几门外语，研究梵文、吐火罗文（一种已死去的语言）。他的散文《有为有不为》讲人生取舍——「有所为，有所不为」六个字是他一生的准则。他自称「我只是个教书匠」，低调到尘埃里。"],

      "魏巍": ["《谁是最可爱的人》让「最可爱的人」成了志愿军战士的代称——他亲赴朝鲜战场采访，写了这篇通讯。后来「最可爱的人」还指代所有值得尊敬的人。记他，就记「志愿军、抗美援朝、最可爱的人」。"],

      "陆定一": ["《老山界》写红军长征翻越老山界——「之」字形的火把、半夜冻醒的露宿，都是他的亲身经历。他是老革命家，建国后主管宣传工作。他的文章是「长征精神」的直接见证。"],

      "光未然": ["《黄河颂》选自《黄河大合唱》，由冼星海谱曲，是抗战时期最响亮的「国歌级」作品。他本名张光年，是诗人也是文学活动家——「黄河在咆哮」的歌词就是他写的。记他，就记「黄河、抗战、冼星海谱曲」。"],

      "臧克家": ["《说和做》写闻一多「口的巨人，行的高标」——他说闻一多「说了就做，做了也不说」。他是著名诗人，「有的人活着，他已经死了」就是他的名句。他的诗朴实有力，专写底层人民。"],

      "端木蕻良": ["《土地的誓言》写九一八事变后对沦陷故土的誓言——「我必定为她战斗到底」。他是东北作家群的代表，原名曹京平。他的散文情感浓烈得像火山，「土地、故乡、誓言」是三个记忆关键词。"],

      "茨威格": ["奥地利作家，传记写得像小说一样好看。《列夫·托尔斯泰》写托尔斯泰「像刀尖一样」的目光——他用外貌描写写出大文豪的灵魂。他还是《一个陌生女人的来信》的作者，二战流亡中自杀。记他，就记「人物传记、心理描写、奥地利」。"],

      "列夫·托尔斯泰": ["俄国文豪，写《战争与和平》《安娜·卡列尼娜》，晚年却觉得文学无用，一心要过苦行生活，最后离家出走、死在车站——这是文学史上最著名的「出逃」。他主张「不以暴力抗恶」，影响了甘地。茨威格给他写的特写是语文教材常客。"],

      "普希金": ["俄国文学之父，《假如生活欺骗了你》写「忧郁的日子须要镇静」——他本人却冲动得为妻子跟人决斗，38岁死于决斗（真事）。他的诗既浪漫又热血，俄国人至今把他当「民族诗人」。"],

      "弗罗斯特": ["美国诗人，《未选择的路》写「树林里分出两条路」——选择一条，就再也回不了头。他被称为「新英格兰的农民诗人」，一生爱写乡村和道路。那句「人生选择不可回头」的哲理，就是这首诗的考点。"],

      "陈子昂": ["《登幽州台歌》「前不见古人，后不见来者」只有四句，却写出了宇宙级的孤独。他怀才不遇，登台远望，一肚子委屈全在诗里。他是唐诗革新的先驱，主张「汉魏风骨」——考试爱考「苍凉悲怆、怀才不遇」。"],

      "袁鹰": ["《井冈翠竹》借翠竹赞颂井冈山精神——「竹叶烧了，还有竹枝；竹枝断了，还有竹鞭」写革命火种不灭。他原名田钟洛，是当代散文家。记他，就记「托物言志、井冈山、翠竹」三个词。"],

      "宗璞": ["《紫藤萝瀑布》把花写成「流动的瀑布」——她在弟弟病重时看到一树繁花，悟出「生命的长河是无止境的」。她是冯友兰的女儿，「璞」是未琢之玉，人如其名。她是茅盾文学奖得主，散文「托物言志」的范本。"],

      "土地的誓言": { intro: "端木蕻良写于九一八事变十周年，抒发对故土的热爱与誓言。", exam: ["作者：端木蕻良。", "关键词：土地、故乡、誓言。", "情感：思念、愤怒、热爱、抗争。"] },

      "孙权劝学": { intro: "写孙权劝吕蒙学习，吕蒙学有所成，鲁肃刮目相看。", full: "初，权谓吕蒙曰：“卿今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪！但当涉猎，见往事耳。”蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。", exam: ["重点实词：当涂、辞、涉猎、见往事、及、过。", "重点虚词：以、乃、及、而。", "重点句翻译：孤岂欲卿治经为博士邪！但当涉猎，见往事耳。", "人物描写：通过对话推动情节，表现孙权善劝、吕蒙能学、鲁肃惊叹。", "成语积累：吴下阿蒙、刮目相待。", "主题：学习能改变人的见识和才能。", "人物关系：孙权劝学，吕蒙改变，鲁肃见证。"] },

      "木兰诗": { intro: "北朝乐府民歌，写木兰替父从军、凯旋还乡。", full: "唧唧复唧唧，木兰当户织。\n万里赴戎机，关山度若飞。\n朔气传金柝，寒光照铁衣。\n将军百战死，壮士十年归。\n雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？", exam: ["重点默写：万里赴戎机，关山度若飞。", "重点默写：朔气传金柝，寒光照铁衣。", "重点默写：雄兔脚扑朔，雌兔眼迷离。", "人物形象：孝顺、勇敢、谨慎、不慕名利。", "修辞：互文、排比、对偶、夸张。", "详略安排：详写从军缘由、出征准备、归家场景，略写战场征战。", "文化常识：郭茂倩是《乐府诗集》编者，不是《木兰诗》作者。"] },

      "阿长与《山海经》": { intro: "鲁迅回忆性散文，通过阿长买《山海经》的事件表达怀念与敬意。", exam: ["作者：鲁迅。", "选自：《朝花夕拾》。", "人物形象：粗俗中有善良，迷信中有真诚。", "写法：先抑后扬。"] },

      "山地回忆": { intro: "孙犁作品，写战争年代普通人与军民情谊。", exam: ["作者：孙犁。", "代表作关联：《风云初记》《铁木前传》《白洋淀纪事》。", "风格：清新、朴素、富有人情味。"] },

      "卖油翁": { intro: "通过陈尧咨和卖油翁的对比说明熟能生巧。", full: "陈康肃公善射，当世无双，公亦以此自矜。\n尝射于家圃，有卖油翁释担而立，睨之久而不去。\n见其发矢十中八九，但微颔之。\n康肃问曰：“汝亦知射乎？吾射不亦精乎？”\n翁曰：“无他，但手熟尔。”\n康肃忿然曰：“尔安敢轻吾射！”\n翁曰：“以我酌油知之。”\n乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。\n因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。", exam: ["重点实词：善、自矜、释、睨、颔、忿然、徐、遣。", "重点句翻译：无他，但手熟尔。", "人物形象：陈尧咨自矜急躁，卖油翁沉着自信。", "写法：对比、语言描写、动作描写。", "主题：熟能生巧，也要谦虚看待自己的本领。"] },

      "竹里馆": { intro: "写独坐幽篁、弹琴长啸的清幽心境。", full: "独坐幽篁里，弹琴复长啸。\n深林人不知，明月来相照。", exam: ["意象：幽篁、深林、明月。", "手法：以动衬静，情景交融。"] },

      "春夜洛城闻笛": { intro: "李白闻笛思乡，短短四句从笛声写到故园情。", full: "谁家玉笛暗飞声，散入春风满洛城。\n此夜曲中闻折柳，何人不起故园情。", exam: ["折柳寓离别、思乡。", "情感：游子思乡。"] },

      "晚春": { intro: "写暮春百花争芳，杨花榆荚也不甘寂寞。", full: "草树知春不久归，百般红紫斗芳菲。\n杨花榆荚无才思，惟解漫天作雪飞。", exam: ["修辞：拟人。", "主题：珍惜春光，万物各展其能。"] },

      "逢入京使": { intro: "岑参边塞诗，写远赴边塞途中遇入京使者时的思乡之情。", full: "故园东望路漫漫，双袖龙钟泪不干。\n马上相逢无纸笔，凭君传语报平安。", exam: ["作者：岑参。", "情感：思乡念亲，又有报国从军之志。", "名句：马上相逢无纸笔，凭君传语报平安。"] },

      "青春之光": { intro: "根据张桂梅事迹创作，表现教育理想和奉献精神。", exam: ["人物：张桂梅。", "主题：教育改变命运、奉献精神。"] },

      "有为有不为": { intro: "季羡林作品，讨论人生选择中的有所为和有所不为。", exam: ["作者：季羡林。", "身份：学者、作家、翻译家。", "主题：人生取舍、价值判断。"] },

      "陋室铭": { intro: "托物言志，表现高洁傲岸、安贫乐道。", full: "山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。\n苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。\n可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。\n南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？", exam: ["主旨句：斯是陋室，惟吾德馨。", "手法：托物言志、类比、用典。", "句式：何陋之有，宾语前置。"] },

      "秋词": { intro: "一反悲秋传统，赞美秋日胜过春光，体现乐观豁达。", full: "自古逢秋悲寂寥，我言秋日胜春朝。\n晴空一鹤排云上，便引诗情到碧霄。", exam: ["名句：晴空一鹤排云上，便引诗情到碧霄。", "主旨：一反悲秋，唱出昂扬向上、乐观自信之歌。", "意象：一鹤排云（象征奋发向上的精神）。"] },

      "酬乐天扬州初逢席上见赠": { intro: "与白居易唱和，抒发贬谪归来感慨，又含对未来的豁达。", full: "巴山楚水凄凉地，二十三年弃置身。\n怀旧空吟闻笛赋，到乡翻似烂柯人。\n沉舟侧畔千帆过，病树前头万木春。\n今日听君歌一曲，暂凭杯酒长精神。", exam: ["名句：沉舟侧畔千帆过，病树前头万木春。", "哲理：新事物必将取代旧事物，前景光明。", "手法：用典（闻笛赋、烂柯人）、比喻。"] },

      "竹枝词": { intro: "巴渝民歌风味的情歌，借眼前景写心中情。", full: "杨柳青青江水平，闻郎江上唱歌声。\n东边日出西边雨，道是无晴却有晴。", exam: ["名句：东边日出西边雨，道是无晴却有晴。", "手法：谐音双关（晴—情）、比兴。", "主题：含蓄表达恋人间的捉摸不定。"] },

      "乌衣巷": { intro: "咏史诗，写王谢世族没落，寄兴亡之感。", full: "朱雀桥边野草花，乌衣巷口夕阳斜。\n旧时王谢堂前燕，飞入寻常百姓家。", exam: ["名句：旧时王谢堂前燕，飞入寻常百姓家。", "手法：以小见大、拟人（燕）、对比。", "主题：富贵难长、沧海桑田的兴亡之叹。"] },

      "浪淘沙": { intro: "借黄河壮景抒豪迈进取、不惧风浪的胸怀。", full: "九曲黄河万里沙，浪淘风簸自天涯。\n如今直上银河去，同到牵牛织女家。", exam: ["名句：如今直上银河去，同到牵牛织女家。", "手法：想象瑰丽、借用神话（银河、牛女）。", "主题：不畏艰险、勇往直前。"] },

      "爱莲说": { intro: "托莲写君子人格，是托物言志经典篇。", full: "予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植。\n予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。", exam: ["主旨：莲，花之君子者也。", "手法：托物言志、衬托、对比。", "象征：洁身自好、正直端庄。"] },

      "井冈翠竹": { intro: "袁鹰作品，借井冈翠竹赞美革命精神和坚韧品格。", exam: ["作者：袁鹰。", "原名：田钟洛。", "写法：托物言志。"] },

      "紫藤萝瀑布": { intro: "宗璞散文，借盛开的紫藤萝写生命的流动与复苏。", exam: ["作者：宗璞。", "写法：托物言志、借景抒情。", "主题：生命长河不停流动，个体挫折终会过去。"] },

      "假如生活欺骗了你": { intro: "普希金诗歌，以劝慰口吻表达对未来的信念。", exam: ["作者：普希金。", "国别：俄国。", "世纪：19世纪。", "主题：乐观面对挫折，相信未来。"] },

      "未选择的路": { intro: "弗罗斯特诗歌，写人生选择和回望。", exam: ["作者：弗罗斯特。", "国别：美国。", "世纪：20世纪。", "主题：人生道路的选择具有不可逆性。"] },

      "登幽州台歌": { intro: "陈子昂名篇，写怀才不遇和宇宙人生之感。", full: "前不见古人，后不见来者。\n念天地之悠悠，独怆然而涕下。", exam: ["作者：陈子昂。", "情感：孤独、悲怆、怀才不遇。", "特点：语言苍凉，境界阔大。"] },

      "望岳": { intro: "写泰山雄伟气象和诗人远大抱负。", full: "岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。", exam: ["名句：会当凌绝顶，一览众山小。", "炼字：钟、割。", "情感：积极进取。"] },

      "登飞来峰": { intro: "借登高望远表达不畏困难、锐意进取。", full: "飞来山上千寻塔，闻说鸡鸣见日升。\n不畏浮云遮望眼，自缘身在最高层。", exam: ["名句：不畏浮云遮望眼，自缘身在最高层。", "哲理：站得高，看得远。"] },

      "游山西村": { intro: "写乡村民风与困境中见转机的哲理。", full: "莫笑农家腊酒浑，丰年留客足鸡豚。\n山重水复疑无路，柳暗花明又一村。\n箫鼓追随春社近，衣冠简朴古风存。\n从今若许闲乘月，拄杖无时夜叩门。", exam: ["名句：山重水复疑无路，柳暗花明又一村。", "主题：乡村人情美，困境中出现希望。"] },

      "己亥杂诗": { intro: "以落花自喻，表达继续奉献的心志。", full: "浩荡离愁白日斜，吟鞭东指即天涯。\n落红不是无情物，化作春泥更护花。", exam: ["名句：落红不是无情物，化作春泥更护花。", "手法：借物抒情。"] },

      "钢铁是怎样炼成的": { intro: "奥斯特洛夫斯基代表作，塑造保尔·柯察金的坚强形象。", exam: ["作者：奥斯特洛夫斯基。", "国别：苏联。", "世纪：20世纪。", "人物：保尔·柯察金。", "主题：理想信念、钢铁意志、革命精神。"] },

      "泊秦淮": { intro: "借商女歌声讽刺统治者不知亡国之恨。", full: "烟笼寒水月笼沙，夜泊秦淮近酒家。\n商女不知亡国恨，隔江犹唱后庭花。", exam: ["名句：商女不知亡国恨，隔江犹唱后庭花。", "手法：借古讽今。"] },

      "贾生": { intro: "借贾谊之事讽刺统治者不问民生。", full: "宣室求贤访逐臣，贾生才调更无伦。\n可怜夜半虚前席，不问苍生问鬼神。", exam: ["名句：不问苍生问鬼神。", "手法：咏史讽刺，欲抑先扬。"] },

      "过松源晨炊漆公店": { intro: "把登山体验写成人生哲理。", full: "莫言下岭便无难，赚得行人错喜欢。\n政入万山围子里，一山放出一山拦。", exam: ["哲理：困难常连续出现，不可被一时顺境迷惑。"] },

      "约客": { intro: "梅雨时节等客不至，情味含蓄。", full: "黄梅时节家家雨，青草池塘处处蛙。\n有约不来过夜半，闲敲棋子落灯花。", exam: ["名句：闲敲棋子落灯花。", "情感：闲适中带寂寞。"] },

      "活板": { intro: "介绍毕昇发明活字印刷术的过程。", exam: ["说明对象：活字印刷术。", "顺序：制作、排版、印刷、拆版。"] },

      "带上她的眼睛": { intro: "科幻小说，借“眼睛”连接地心探险者与地面世界。", exam: ["主题：科学探索、牺牲精神、珍惜日常。", "考点：悬念设置和结尾反转。"] },

      "卖炭翁": { "intro": "白居易的叙事诗，写卖炭老翁“满面尘灰烟火色”却遭宫市强夺，揭露中唐“宫市”盘剥之害。", "full": "卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。\n卖炭得钱何所营？身上衣裳口中食。可怜身上衣正单，心忧炭贱愿天寒。\n夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇。\n翩翩两骑来是谁？黄衣使者白衫儿。手把文书口称敕，回车叱牛牵向北。\n一车炭，千余斤，宫使驱将惜不得。半匹红纱一丈绫，系向牛头充炭直。", "exam": ["默写：夜来城外一尺雪，晓驾炭车碾冰辙。", "默写：可怜身上衣正单，心忧炭贱愿天寒。", "主题：揭露“宫市”对百姓的盘剥。", "写法：对比（卖炭翁与宫使）、心理描写（愿天寒）。"] },

      "黄鹤楼": { "intro": "崔颢的七言律诗，写登黄鹤楼所见所感，由神话传说引出时空渺茫与思乡之情，被誉为“唐人七律第一”。", "full": "昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。日暮乡关何处是？烟波江上使人愁。", "exam": ["默写：晴川历历汉阳树，芳草萋萋鹦鹉洲。", "默写：日暮乡关何处是？烟波江上使人愁。", "情感：怀古伤今、思乡愁绪。", "写法：虚实结合、神话传说起笔。"], "notes": [{ "k": "a", "text": "选自《全唐诗》卷一三○（中华书局1960年版）。，故址在今湖北武汉蛇山的黄鹄（hú）矶上。《太平寰宇记》：“昔费祎（yī）登仙，每乘黄鹤于此憩驾，故号为。”此楼屡毁屡建，现在的是1985年建的。崔颢（hào）（？—754），汴州（今河南开封）人，唐代诗人。" }, { "k": "b", "text": "〔昔人〕指传说中骑鹤飞去的仙人。" }, { "k": "c", "text": "〔悠悠〕飘飘荡荡的样子。" }, { "k": "d", "text": "〔晴川〕晴日里的原野。川，平川、原野。" }, { "k": "e", "text": "〔历历〕分明的样子。" }, { "k": "f", "text": "〔汉阳〕地名，今湖北武汉汉阳区，与隔江相望。" }, { "k": "g", "text": "〔萋（qī）萋〕草木茂盛的样子。" }, { "k": "h", "text": "〔鹦鹉洲〕原在湖北武汉西南长江中，后被江水淹没。今天的鹦鹉洲已非唐代故地。" }, { "k": "i", "text": "〔乡关〕故乡。" }, { "k": "t", "text": "〔都护〕官名，汉代始置，唐代边疆设有大都护府，其长官称大都护。这里指前线统帅。" }] },

      "蝶恋花": { "intro": "柳永词，写离别后的思念与执着，“衣带渐宽终不悔，为伊消得人憔悴”为千古名句。", "full": "伫倚危楼风细细，望极春愁，黯黯生天际。草色烟光残照里，无言谁会凭阑意。\n拟把疏狂图一醉，对酒当歌，强乐还无味。衣带渐宽终不悔，为伊消得人憔悴。", "exam": ["默写：衣带渐宽终不悔，为伊消得人憔悴。", "情感：执着专一、离愁别恨。", "写法：以景写情、直抒胸臆。"] },

      "迢迢牵牛星": { "intro": "《古诗十九首》名篇，借牛郎织女传说写相思离别之苦。", "full": "迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。\n终日不成章，泣涕零如雨。河汉清且浅，相去复几许。\n盈盈一水间，脉脉不得语。", "exam": ["默写：盈盈一水间，脉脉不得语。", "写法：叠词（迢迢、皎皎、纤纤等）、借代、虚实结合。", "情感：相思而不得相见的痛苦。"] },

      "醉翁亭记": { "intro": "欧阳修的游记名篇，写滁州琅琊山醉翁亭四时朝暮之景与太守宴游之乐，抒“与民同乐”情怀。", "full": "环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。\n山行六七里，渐闻水声潺潺而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。\n醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。\n四时之景不同，而乐亦无穷也。", "exam": ["默写：醉翁之意不在酒，在乎山水之间也。", "默写：山水之乐，得之心而寓之酒也。", "主题：与民同乐、寄情山水。", "写法：移步换景、写景抒情结合。"] },

      "水调歌头": { "intro": "苏轼中秋咏月词，由对月抒怀到感悟人生，旷达超脱，“但愿人长久”成千古祝福。", "full": "明月几时有？把酒问青天。不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？\n人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。", "exam": ["默写：但愿人长久，千里共婵娟。", "哲理：人有悲欢离合，月有阴晴圆缺，此事古难全。", "情感：旷达乐观、对亲人的祝福。", "写法：想象、虚实结合、借月抒怀。"] },

      "江城子·密州出猎": { "intro": "苏轼豪放词，写密州出猎的雄壮场面，抒发渴望报国的雄心。", "full": "老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。\n为报倾城随太守，亲射虎，看孙郎。\n酒酣胸胆尚开张。鬓微霜，又何妨！持节云中，何日遣冯唐？\n会挽雕弓如满月，西北望，射天狼。", "exam": ["默写：会挽雕弓如满月，西北望，射天狼。", "情感：渴望报国、壮志豪情。", "写法：用典（冯唐、天狼）、豪放风格。"] },

      "念奴娇·赤壁怀古": { "intro": "苏轼怀古词，追怀周瑜赤壁功业，抒自己壮志难酬的感慨。", "full": "大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。", "exam": ["默写：乱石穿空，惊涛拍岸，卷起千堆雪。", "情感：仰慕英雄、自叹年华老去。", "写法：写景壮阔、用典、对比。"] },

      "破阵子·为陈同甫赋壮词以寄之": { "intro": "辛弃疾寄给好友陈亮的壮词，回忆军旅生活，末句梦醒点出壮志难酬的悲愤。", "full": "醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！", "exam": ["默写：醉里挑灯看剑，梦回吹角连营。", "默写：了却君王天下事，赢得生前身后名。可怜白发生。", "情感：报国壮志与壮志难酬的悲慨。", "写法：梦境与现实对比（壮词中的悲意）。"] },

      "西江月·夜行黄沙道中": { "intro": "辛弃疾夜行乡间小词，写夏夜田园风光与丰收之喜，清新自然。", "full": "明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。\n七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。", "exam": ["默写：稻花香里说丰年，听取蛙声一片。", "情感：对丰收的喜悦、对乡村生活的热爱。", "写法：以动衬静、视听结合。"] },

      "丑奴儿·书博山道中壁": { "intro": "辛弃疾词，上片写少年不知愁，下片写而今识尽愁滋味，欲说还休。", "full": "少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。\n而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。", "exam": ["默写：欲说还休，却道天凉好个秋。", "情感：报国无门的深沉愁绪。", "写法：对比（少年与而今）、反复。"] },

      "生查子·元夕": { "intro": "欧阳修（一说朱淑真）元宵词，写去年今夕的相约与今年的物是人非。", "full": "去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。\n今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。", "exam": ["默写：月上柳梢头，人约黄昏后。", "情感：物是人非的怅惘。", "写法：今昔对比。"] },

      "天净沙·秋思": { "intro": "马致远散曲，用九个意象白描秋景，末句点出羁旅天涯的断肠之思，被誉为“秋思之祖”。", "full": "枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。", "exam": ["默写：枯藤老树昏鸦，小桥流水人家。", "默写：夕阳西下，断肠人在天涯。", "情感：羁旅漂泊、思乡之苦。", "写法：白描、列锦（意象叠加）、以乐景衬哀情。"] },

      "天净沙·秋": { "intro": "白朴散曲，写秋日萧瑟中见明丽，与《天净沙·秋思》常对比。", "full": "孤村落日残霞，轻烟老树寒鸦，一点飞鸿影下。青山绿水，白草红叶黄花。", "exam": ["默写：青山绿水，白草红叶黄花。", "写法：白描、色彩对比（冷色与暖色）。"] },

      "如梦令": { "intro": "李清照早期词，回忆溪亭畅游、沉醉忘归的少女时光。", "full": "常记溪亭日暮，沉醉不知归路。兴尽晚回舟，误入藕花深处。争渡，争渡，惊起一滩鸥鹭。", "exam": ["默写：争渡，争渡，惊起一滩鸥鹭。", "情感：对往昔美好生活的留恋。", "写法：动作细节、叠词。"] },

      "归园田居": { "intro": "陶渊明田园诗，写归隐后躬耕田园的辛劳与自适。", "full": "种豆南山下，草盛豆苗稀。晨兴理荒秽，带月荷锄归。\n道狭草木长，夕露沾我衣。衣沾不足惜，但使愿无违。", "exam": ["默写：晨兴理荒秽，带月荷锄归。", "情感：归隐田园的安然自适。", "写法：白描、朴实自然。"] },

      "饮酒": { "intro": "陶渊明组诗，写隐逸生活与心境，“采菊东篱下”是田园诗最高境界。", "full": "结庐在人境，而无车马喧。问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。", "exam": ["默写：采菊东篱下，悠然见南山。", "默写：问君何能尔？心远地自偏。", "情感：远离尘俗、恬淡自适。", "写法：白描、“见”字炼字之妙。"] },

      "桃花源记": { "intro": "陶渊明虚构的世外桃源，寄托对理想社会的向往，是千古名篇。", "full": "土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。\n其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。", "exam": ["默写：阡陌交通，鸡犬相闻。", "默写：黄发垂髫，并怡然自乐。", "主题：对安宁平等理想社会的向往。", "成语：世外桃源、豁然开朗、无人问津。"] },

      "过零丁洋": { "intro": "文天祥被俘后写下的诗，表现舍生取义的民族气节。", "full": "辛苦遭逢起一经，干戈寥落四周星。山河破碎风飘絮，身世浮沉雨打萍。\n惶恐滩头说惶恐，零丁洋里叹零丁。人生自古谁无死？留取丹心照汗青。", "exam": ["默写：人生自古谁无死？留取丹心照汗青。", "情感：舍生取义、视死如归。", "写法：比喻（风飘絮、雨打萍）、双关（惶恐、零丁）。"] },

      "观沧海": { "intro": "曹操北征乌桓途中登碣石山所作，借大海吞吐日月之势抒统一天下的雄心。", "full": "东临碣石，以观沧海。水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。秋风萧瑟，洪波涌起。\n日月之行，若出其中；星汉灿烂，若出其里。幸甚至哉，歌以咏志。", "exam": ["默写：日月之行，若出其中；星汉灿烂，若出其里。", "情感：胸怀天下的壮志豪情。", "写法：虚实结合、借景抒情。"] },

      "观猎": { "intro": "王维五律，写将军射猎的英武场面，章法精妙。", "full": "风劲角弓鸣，将军猎渭城。草枯鹰眼疾，雪尽马蹄轻。\n忽过新丰市，还归细柳营。回看射雕处，千里暮云平。", "exam": ["默写：草枯鹰眼疾，雪尽马蹄轻。", "写法：炼字（疾、轻）、首尾呼应。"] },

      "渡荆门送别": { "intro": "李白青年出蜀之作，写长江壮阔景象与对故乡的眷恋。", "full": "渡远荆门外，来从楚国游。山随平野尽，江入大荒流。\n月下飞天镜，云生结海楼。仍怜故乡水，万里送行舟。", "exam": ["默写：山随平野尽，江入大荒流。", "情感：对故乡的依恋。", "写法：化静为动、拟人（故乡水送行舟）。"], "notes": [{ "k": "a", "text": "选自《李白集校注》卷十五（上海古籍出版社1980年版）。荆门，即荆门山，在今湖北宜都西北长江南岸，与北岸虎牙山对峙，形势险要，战国时是楚国的战略门户。李白早年曾长期居住在蜀地，二十多岁时“仗剑去国，辞亲远游”，《》就写于他第一次乘舟东下、出蜀入楚的途中。" }, { "k": "b", "text": "〔从〕往。" }, { "k": "c", "text": "〔楚国〕楚地。这里指今湖北一带。" }, { "k": "d", "text": "〔大荒〕辽远无际的原野。" }, { "k": "e", "text": "〔月下飞天镜〕月亮倒映在水中，犹如从天上飞来一面明镜。" }, { "k": "f", "text": "〔海楼〕海市蜃楼。这里形容江上云霞多变形成的美丽景象。" }, { "k": "g", "text": "〔怜〕喜爱。" }, { "k": "h", "text": "〔故乡水〕指从四川流来的长江水。李白从小生活在蜀地，故以蜀地为故乡。" }] },

      "送友人": { "intro": "李白送别诗，写青山白水间的依依别情。", "full": "青山横北郭，白水绕东城。此地一为别，孤蓬万里征。\n浮云游子意，落日故人情。挥手自兹去，萧萧班马鸣。", "exam": ["默写：浮云游子意，落日故人情。", "情感：依依惜别之情。", "写法：借景抒情、比喻（孤蓬、浮云）。"] },

      "钱塘湖春行": { "intro": "白居易早春游西湖之作，写初春生机，紧扣“行”字移步换景。", "full": "孤山寺北贾亭西，水面初平云脚低。几处早莺争暖树，谁家新燕啄春泥。\n乱花渐欲迷人眼，浅草才能没马蹄。最爱湖东行不足，绿杨阴里白沙堤。", "exam": ["默写：乱花渐欲迷人眼，浅草才能没马蹄。", "默写：几处早莺争暖树，谁家新燕啄春泥。", "情感：对早春西湖的喜爱。", "写法：移步换景、炼字（争、啄）。"], "notes": [{ "k": "i", "text": "选自《白居易集》卷二十（中华书局1979年版）。钱塘湖，即杭州西湖。白居易（772—846），字乐天，晚年号香山居士，祖籍太原（今属山西），生于新郑（今属河南），唐代诗人。著有《白氏长庆集》。" }, { "k": "j", "text": "〔孤山〕在西湖的里湖与外湖之间，山上有孤山寺。" }, { "k": "k", "text": "〔贾亭〕即贾公亭。唐贞元（785—805）年间，贾全在杭州做官时在西湖边建造此亭。" }, { "k": "l", "text": "〔水面初平〕春天湖水初涨，水面刚刚与湖岸齐平。初，刚刚。" }, { "k": "m", "text": "〔云脚低〕白云重重叠叠，同湖面上的波浪连成一片，看上去浮云很低。" }, { "k": "n", "text": "〔暖树〕向阳的树。" }, { "k": "o", "text": "〔白沙堤〕指西湖的白堤，又称“断桥堤”。此堤在唐代以前即已筑成，为纪念曾任杭州刺史的白居易，后人又将此堤称为“白堤”。渡荆门送别" }] },

      "题破山寺后禅院": { "intro": "常建写破山寺清晨之景，禅意悠远。", "full": "清晨入古寺，初日照高林。曲径通幽处，禅房花木深。\n山光悦鸟性，潭影空人心。万籁此都寂，但余钟磬音。", "exam": ["默写：曲径通幽处，禅房花木深。", "写法：以动衬静（钟磬音）、情景交融。"] },

      "雨晴": { "intro": "王驾雨后寻春之作，惜春之情溢于言表。", "full": "雨前初见花间蕊，雨后全无叶底花。蜂蝶纷纷过墙去，却疑春色在邻家。", "exam": ["默写：蜂蝶纷纷过墙去，却疑春色在邻家。", "情感：惜春、恋春。", "写法：拟人（却疑春色在邻家）。"] },

      "小石潭记": { "intro": "柳宗元贬居永州时所作，写小石潭清幽之景与孤寂之感，为“永州八记”之一。", "full": "潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动；\n俶尔远逝，往来翕忽，似与游者相乐。\n坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。", "exam": ["默写：潭中鱼可百许头，皆若空游无所依。", "情感：贬谪后的孤寂凄凉。", "写法：侧面描写（游鱼写水清）、寓情于景。"] },

      "岳阳楼记": { "intro": "范仲淹应友之托所作，写岳阳楼阴晴之景与迁客骚人之情，抒发“先忧后乐”的政治抱负。", "full": "予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯。\n至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳。\n不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。\n先天下之忧而忧，后天下之乐而乐。", "exam": ["默写：先天下之忧而忧，后天下之乐而乐。", "默写：不以物喜，不以己悲。", "主题：忧国忧民、先忧后乐。", "写法：对比、骈散结合、情景交融。"] },

      "生于忧患，死于安乐": { "intro": "《孟子》名篇，以舜、傅说等为例论证“生于忧患，死于安乐”的道理。", "full": "舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。\n故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。\n人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。\n然后知生于忧患而死于安乐也。", "exam": ["默写：天将降大任于是人也，必先苦其心志。", "默写：生于忧患，死于安乐。", "主题：逆境造就人才、忧患意识。", "写法：举例论证、排比。"], "notes": [{ "k": "a", "text": "〔舜发于畎（quǎn）亩之中〕相传舜在历山耕田，后被尧起用，成为尧的继承人。发，兴起，指被任用。畎亩，田地。畎，田间水沟。亩，地垄。" }, { "k": "b", "text": "〔傅说（yuè）举于版筑之间〕相传商代贤人傅说曾在傅岩为人筑墙（因以傅为姓），后被商王武丁任用为相。举，选拔、任用。版筑，古人筑墙，在两块夹板中间放土，再用杵（chǔ）夯（hāng）实。筑，捣土用的杵。" }, { "k": "c", "text": "〔胶鬲（ɡé）举于鱼盐之中〕相传胶鬲原以贩卖鱼盐为生，西伯（周文王）把他举荐给纣王。后来，他又辅佐周武王。" }, { "k": "d", "text": "〔管夷吾举于士〕管仲（名夷吾）原是齐国公子纠的家臣，纠与公子小白（即后来的齐桓公）争夺君位失败，管仲作为罪人被押回齐国，后经鲍叔牙推荐，被齐桓公任用为相。士，狱官。举于士，从狱官手中释放出来，进而得到任用。" }, { "k": "e", "text": "〔孙叔敖举于海〕楚国人孙叔敖隐居海滨，楚庄王知道他有才能，任用他为相。一说，此处的“海”泛指荒远之地。" }, { "k": "f", "text": "〔百里奚（xī）举于市〕百里奚，春秋时期虞国大夫。虞亡后被俘，由晋入秦，又逃到楚。后来秦穆公用五张公羊皮把他赎出来，用为大夫。市，集市。" }, { "k": "g", "text": "〔饿其体肤〕使他经受饥饿之苦。" }, { "k": "h", "text": "〔空（kòng）乏其身〕使他身处贫困之中。空乏，财资缺乏。" }, { "k": "i", "text": "〔行拂乱其所为〕使他做事不顺。拂，违背。乱，扰乱。" }, { "k": "j", "text": "〔动心忍性〕使他的心灵受到震撼，使他的性格坚忍起来。" }, { "k": "k", "text": "〔曾（zēnɡ）益〕增加。曾，同“增”。" }, { "k": "l", "text": "〔恒过〕常常犯错误。" }, { "k": "m", "text": "〔衡于虑〕思虑堵塞。衡，同“横”，梗塞、不顺。" }, { "k": "n", "text": "〔作〕奋起。这里指有所作为。" }, { "k": "o", "text": "〔征于色，发于声，而后喻〕（一个人的过失）表现在他人的脸色上，显露在他人的言谈中，才能被自己了解。一说，（一个人的过失）表现在脸色上，流露在言谈中，才能被人们了解。征，征验、表现。发，显露、流露。喻，了解、明白。" }, { "k": "p", "text": "〔入〕指在国内。" }, { "k": "q", "text": "〔法家拂（bì）士〕法家，守法度的大臣。拂士，辅佐君王的贤士。拂，同“弼”，辅佐。" }, { "k": "r", "text": "〔出〕指在国外。" }, { "k": "s", "text": "〔敌国〕势力、地位相当的国家。敌，匹敌、相当。" }, { "k": "t", "text": "〔生于忧患而死于安乐〕常处忧愁祸患之中可以使人生存，常处安逸快乐之中可以使人死亡。" }] },

      "捕蛇者说": { "intro": "柳宗元借蒋氏三代捕蛇之痛，揭露赋敛之毒“甚于蛇”，即“苛政猛于虎”。", "exam": ["主题：苛政猛于虎、赋敛之毒有甚是蛇者乎。", "写法：对比（捕蛇与纳赋）、卒章显志。"] },

      "狼": { "intro": "《聊斋志异》名篇，写屠户与两狼搏斗，讽刺贪婪狡诈的恶势力。", "full": "一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。\n狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。", "exam": ["默写：狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？", "主题：恶势力终将灭亡、遇强敌要斗智斗勇。", "写法：层层推进、卒章点题。"] },

      "答谢中书书": { "intro": "陶弘景写给谢中书的书信，描绘江南山水之美，抒发归隐之乐。", "full": "山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。\n青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。\n实是欲界之仙都。自康乐以来，未复有能与其奇者。", "exam": ["默写：山川之美，古来共谈。", "默写：高峰入云，清流见底。", "情感：对山川之美的赞美、归隐之乐。", "写法：动静结合、俯仰结合。"], "notes": [{ "k": "a", "text": "选自《陶弘景集校注（修订本）》（上海古籍出版社2021年版）。谢中书，说法不一，有人认为指谢征（500—536），也有人认为指谢朏（fěi）（441—506）、谢朓（tiǎo）（464—499）或谢览（约477—约513），此四人均为陈郡阳夏（今河南太康）人，均曾担任过中书省的官职。陶弘景（456—536），字通明，自号华阳隐居，丹阳秣陵（今江苏南京）人，南朝齐梁时思想家。有《陶隐居集》。" }, { "k": "b", "text": "〔五色交晖〕这里形容石壁色彩斑斓，交相辉映。晖，辉映。" }, { "k": "c", "text": "〔四时〕四季。" }, { "k": "d", "text": "〔歇〕消散。" }, { "k": "e", "text": "〔夕日欲颓〕夕阳快要落山了。颓，坠落。" }, { "k": "f", "text": "〔沉鳞〕指水中潜游的鱼。" }, { "k": "g", "text": "〔欲界之仙都〕人间仙境。欲界，没有摆脱世俗七情六欲的众生所处的境界，这里指人间。仙都，神仙居住的美好世界。" }, { "k": "h", "text": "〔康乐〕指南朝宋山水诗人谢灵运（385—433），他承袭祖父谢玄（343—388）的爵位，被封为康乐公。谢灵运好游山水，所作山水诗鲜丽清新，开创了中国文学史上的山水诗派。" }, { "k": "i", "text": "〔与（yù）〕参与。这里有“欣赏”“领悟”的意思。" }] },

      "水浒传": { "intro": "施耐庵著，我国第一部歌颂农民起义的长篇章回体小说，写宋江等一百零八好汉聚义梁山、替天行道。", "exam": ["主题：官逼民反。", "人物：鲁智深（拳打镇关西）、武松（景阳冈打虎）、林冲（风雪山神庙）、宋江（及时雨）。", "写法：先分后合、单线串联、动作与语言描写生动。"] },

      "西游记": { "intro": "吴承恩著，写唐僧师徒四人西天取经、历经九九八十一难的故事。", "exam": ["人物：孙悟空（三打白骨精）、猪八戒、沙僧、唐僧。", "情节设计：“三打白骨精”“三调芭蕉扇”中“三”字结构（起—变—结）增强故事曲折性。", "主题：不畏艰险、团结协作、战胜心魔。"] },

      "艾青诗选": { "intro": "艾青诗歌选集，核心意象是“土地”与“太阳”，表现对祖国与人民的深情及对光明的追求。", "exam": ["意象：土地（苦难与希望）、太阳（光明与信念）。", "名篇：《大堰河——我的保姆》《北方》《向太阳》。", "风格：朴素深沉、忧郁中见力量。"] },

      "经典常谈": { "intro": "朱自清的经典普及读物，按《说文解字》《周易》《诗经》等介绍中国古代经典，深入浅出。", "exam": ["《说文解字·第一》：字源与六书，谈“帛”等字形字义。", "特点：选择性阅读、以通俗语言讲经典。", "常与“整本书阅读”任务群结合考查。"] },

      "散步": { "intro": "莫怀戚散文，写一家四口初春田野散步，小事中见尊老爱幼的传统美德。", "exam": ["主题：尊老爱幼、家庭责任、生命传承。", "写法：以小见大、对称句、细节描写。", "结尾：我背母亲、妻子背儿子，“背起了整个世界”。"] },

      "初夏": { "intro": "艾青诗歌，写初夏江畔风物，视听结合、动静相生。", "full": "江水戏逐着阳光，静静地流着……从江边的树荫下，传出了勤劳的耕牛的，困倦的鸣声……", "exam": ["写法：拟人（江水戏逐着阳光）、视听结合、动静结合。", "意象：江水、阳光、耕牛、鸣声——初夏田园气息。"] },

      "花脸": { "intro": "冯骥才散文，写少年在春节戴花脸面具的童趣与对英雄的向往。", "exam": ["主题：童真童趣、成长的印记。", "写法：细节描写（花脸样式、戴脸动作）、心理刻画。"] },

      "童年的弄堂游戏": { "intro": "程乃珊回忆上海弄堂生活的散文，写集体游戏的乐趣与团队合作精神。", "exam": ["主题：弄堂文化、童年记忆、团队合作。", "常作“上海本土文化”综合运用题材料。"] },

      "史记": { "intro": "司马迁著，我国第一部纪传体通史，记载黄帝至汉武帝约三千年史事，被称“史家之绝唱，无韵之离骚”。", "exam": ["体裁：纪传体通史。", "作者：司马迁（西汉）。", "名篇：《陈涉世家》《项羽本纪》等。", "常考名言：人固有一死，或重于泰山，或轻于鸿毛。"] },

  "饮酒（其五）": { "intro": "陶渊明《饮酒》其五，“结庐在人境”写隐逸心境，“采菊东篱下，悠然见南山”为千古名句。", "full": "结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。", "exam": ["默写：采菊东篱下，悠然见南山。", "默写：问君何能尔？心远地自偏。", "情感：远离尘俗、恬淡自适。"], "notes": [{ "k": "a", "text": "选自《陶渊明集校笺（修订本）》卷三（上海古籍出版社2019年版）。《饮酒》是一组五言古诗，共20首，写于作者辞官归隐之后。作者在这组诗的小序中说自己“闲居寡欢……偶有名酒，无夕不饮……既醉之后，辄题数句自娱”。诗作多写饮酒后的所思所感，往往以咏史、咏物、写景的形式来表现。" }, { "k": "b", "text": "〔结庐〕建造房舍。结，建造、构筑。" }, { "k": "c", "text": "〔人境〕尘世。" }, { "k": "d", "text": "〔尔〕如此，这样。" }, { "k": "e", "text": "〔悠然〕闲适淡泊的样子。" }, { "k": "f", "text": "〔山气〕山间的云气。" }, { "k": "g", "text": "〔日夕〕傍晚。" }, { "k": "h", "text": "〔忘言〕心中领会真意，不必用语言表达。《悠然见南山》〔清〕石涛作" }] },

      "我三十万大军胜利南渡长江": { "intro": "毛泽东起草的新闻消息，报道解放战争渡江战役首日战况，语言凝练、气势磅礴。", "full": "新华社长江前线二十二日二时电　英勇的人民解放军二十一日已有大约三十万人渡过长江。渡江战斗于二十日午夜开始，地点在芜湖、安庆之间。国民党反动派经营了三个半月的长江防线，遇着人民解放军好似摧枯拉朽，军无斗志，纷纷溃退。长江风平浪静，我军万船齐放，直取对岸，不到二十四小时，三十万人民解放军即已突破敌阵，占领南岸广大地区，现正向繁昌、铜陵、青阳、荻港、鲁港诸城进击中。人民解放军正以自己的英雄式的战斗，坚决地执行毛主席朱总司令的命令。\n\n人民解放军百万大军横渡长江\n（一九四九年四月二十二日）\n\n新华社长江前线二十二日二十二时电　人民解放军百万大军，从一千余华里的战线上，冲破敌阵，横渡长江。西起九江（不含），东至江阴，均是人民解放军的渡江区域。二十日夜起，长江北岸人民解放军中路军首先突破安庆、芜湖线，渡至繁昌、铜陵、青阳、荻港、鲁港地区，二十四小时内即已渡过三十万人。二十一日下午五时起，我西路军开始渡江，地点在九江、安庆段。至发电时止，该路三十五万人民解放军已渡过三分之二，余部二十三日可渡完。这一路现已占领贵池、殷家汇、东流、至德、彭泽之线的广大南岸阵地，正向南扩展中。和中路军所遇敌情一样，我西路军当面之敌亦纷纷溃退，毫无斗志，我军所遇之抵抗，甚为微弱。此种情况，一方面由于人民解放军英勇善战，锐不可当；另一方面，这和国民党反动派拒绝签订和平协定，有很大关系。国民党的广大官兵一致希望和平，不想再打了，听见南京拒绝和平，都很泄气。战犯汤恩伯二十一日到芜湖督战，不起丝毫作用。汤恩伯认为南京江阴段防线是很巩固的，弱点只存在于南京九江一线。不料正是汤恩伯到芜湖的那一天，东面防线又被我军突破了。我东路三十五万大军与西路同日同时发起渡江作战。所有预定计划，都已实现。至发电时止，我东路各军已大部渡过南岸，余部二十三日可以渡完。此处敌军抵抗较为顽强，然在二十一日下午至二十二日下午的整天激战中，我已歼灭及击溃一切抵抗之敌，占领扬中、镇江、江阴诸县的广大地区，并控制江阴要塞，封锁长江。我军前锋，业已切断镇江无锡段铁路线。", "exam": [], "notes": [{ "k": "a", "text": "选自《毛泽东新闻作品集》（新华出版社2014年版）。两则消息分别刊载于1949年4月22日、24日《人民日报》。" }, { "k": "b", "text": "〔摧枯拉朽〕这里指枯草朽木受到摧折，比喻腐朽势力被迅速摧毁。" }, { "k": "a", "text": "〔东流、至德〕安徽省东流县与至德县于1959年合并为东至县。" }, { "k": "b", "text": "〔业已〕已经。" }] },

      "人民解放军百万大军横渡长江": { "intro": "毛泽东起草的新闻消息，全面报道百万雄师横渡长江、突破敌军防线的战况。", "full": "新华社长江前线二十二日二十二时电 人民解放军百万大军，从一千余华里的战线上，冲破敌阵，横渡长江。西起九江（不含），东至江阴，均是人民解放军的渡江区域。二十日夜起，长江北岸人民解放军中路军首先突破安庆、芜湖线，渡至繁昌、铜陵、青阳、荻港、鲁港地区，二十四小时内即已渡过三十万人。二十一日下午五时起，我西路军开始渡江，地点在九江、安庆段。至发电时止，该路三十五万人民解放军已渡过三分之二，余部二十三日可渡完。这一路现已占领贵池、殷家汇、东流、至德、彭泽之线的广大南岸阵地，正向南扩展中。和中路军所遇敌情一样，我西路军当面之敌亦纷纷溃退，毫无斗志，我军所遇之抵抗，甚为微弱。此种情况，一方面由于人民解放军英勇善战，锐不可当；另一方面，这和国民党反动派拒绝签订和平协定，有很大关系。国民党的广大官兵一致希望和平，不想再打了，听见南京拒绝和平，都很泄气。战犯汤恩伯二十一日到芜湖督战，不起丝毫作用。汤恩伯认为南京、江阴段防线是很巩固的，弱点只存在于南京、九江一线。不料正是汤恩伯到芜湖的那一天，东面防线又被我军突破了。我东路三十五万大军与西路同日同时发起渡江作战。所有预定计划，都已实现。至发电时止，我东路各军已大部渡过南岸，余部二十三日可以渡完。此处敌军抵抗较为顽强，然在二十一日下午至二十二日下午的整天激战中，我已歼灭及击溃一切抵抗之敌，占领扬中、镇江、江阴诸县的广大地区，并控制江阴要塞，封锁长江。我军前锋，业已切断镇江、无锡段铁路线。", "exam": [], "notes": [{ "k": "a", "text": "选自《毛泽东新闻作品集》（新华出版社2014年版）。两则消息分别刊载于1949年4月22日、24日《人民日报》。" }, { "k": "b", "text": "〔摧枯拉朽〕这里指枯草朽木受到摧折，比喻腐朽势力被迅速摧毁。" }, { "k": "a", "text": "〔东流、至德〕安徽省东流县与至德县于1959年合并为东至县。" }, { "k": "b", "text": "〔业已〕已经。" }] },

      "中国人首次进入自己的空间站": { "intro": "新华社通讯，报道神舟十二号航天员首次进入中国空间站的历史时刻。", "full": "《人民日报》酒泉2021年6月17日电 记者从中国载人航天工程办公室获悉：6月17日9时22分，神舟十二号载人飞船在酒泉卫星发射中心发射升空，准确进入预定轨道，顺利将三名航天员送上太空。神舟十二号载人飞船入轨后顺利完成入轨状态设置，于北京时间6月17日15时54分，采用自主快速交会对接模式成功对接于天和核心舱前向端口，与此前已对接的天舟二号货运飞船一起构成三舱（船）组合体，整个交会对接过程历时约6.5小时。这是天和核心舱发射入轨后，首次与载人飞船进行的交会对接。\n\n在神舟十二号载人飞船与天和核心舱成功实现自主快速交会对接后，航天员乘组从返回舱进入轨道舱。按程序完成各项准备后，先后开启节点舱舱门、核心舱舱门。北京时间17日18时48分，航天员聂海胜、刘伯明、汤洪波先后进入天和核心舱，标志着中国人首次进入自己的空间站。", "exam": [], "notes": [{ "k": "a", "text": "选自2021年6月18日《人民日报》。" }, { "k": "b", "text": "〔酒泉卫星发射中心〕我国科学卫星、技术试验卫星、返回型卫星、载人飞船和运载火箭的发射试验基地，位于甘肃酒泉东北。是我国建设最早的航天器发射试验基地。" }, { "k": "a", "text": "〔再生生保〕即“再生式生命保障系统”，人类实现中、长期载人航天飞行的关键技术之一。它能在载人航天器密封舱内为航天员创造一个适于人类生存的基本环境，并提供必需的生活支持保障。逐一介绍航天员进入空间站的各个环节，让读者具体了解标题中的信息。在神舟十二号载人飞船与天和核心舱成功实现自主快速交会对接后，航天员乘组从返回舱进入轨道舱。按程序完成各项准备后，先后开启节点舱舱门、核心舱舱门。北京时间17日18时48分，航天员聂海胜、刘伯明、汤洪波先后进入天和核心舱，标志着中国人首次进入自己的空间站。概述后续工作，文字简洁，信息完备。" }] },

      "首届诺贝尔奖颁发": { "intro": "路透社消息，报道 1901 年首届诺贝尔奖颁发及遗嘱设立基金的原委。", "full": "路透社斯德哥尔摩1901年12月10日电 瑞典国王和挪威诺贝尔基金会今天首次颁发了诺贝尔奖。根据诺贝尔的遗嘱，诺贝尔奖每年发给那些在过去的一年里，在物理学、化学、生理学或医学、文学及和平事业方面为人类作出最大贡献的人。\n\n今年诺贝尔奖的获得者有：德国的伦琴（物理学奖），他发现了X射线；荷兰的范托夫（化学奖），他发现了化学动力学定律和渗透压定律；德国的贝林（生理学或医学奖），他在血清疗法的研究方面卓有成就；法国的普吕多姆（文学奖），他在诗歌创作方面颇有建树。诺贝尔和平奖的获得者有：瑞士的迪南，他于1864年建立了红十字会；经济学家帕西，他建立了促进国际仲裁的各国议会联盟。\n\n从即日起，根据诺贝尔的遗嘱，诺贝尔奖由4个机构（瑞典3个，挪威1个）颁发，从按诺贝尔遗嘱建立的基金中拨款。授奖仪式每年于12月10日诺贝尔逝世周年纪念日在瑞典的斯德哥尔摩和挪威的奥斯陆举行。\n\n1867年，瑞典化学家诺贝尔发明了黄色炸药，以后又发明了多种炸药，这使他获得巨额收入。1896年诺贝尔逝世，这笔巨款用来设立诺贝尔奖金。他留下来的资金每年的利息将支付这5种诺贝尔奖金。诺贝尔基金会是这笔资金的合法拥有者，并管理这笔资金的投资，但与诺贝尔奖的评定无关。诺贝尔奖的评议权属于瑞典和挪威的诺贝尔奖评委会。", "exam": [], "notes": [{ "k": "a", "text": "选自《百年好文章——路透社新闻佳作》（陕西师范大学出版社2002年版）。有改动。诺贝尔（1833—1896），瑞典化学家、工程师。" }, { "k": "b", "text": "〔伦琴（1845—1923）〕德国物理学家。为纪念他在科学上的贡献，他发现的X射线也被称为“伦琴射线”。" }, { "k": "c", "text": "〔范托夫（1852—1911）〕又译作“范特荷甫”，荷兰化学家。他为近代物理化学学科作出了重要贡献。" }, { "k": "d", "text": "〔贝林（1854—1917）〕又译作“倍林”，德国细菌学家、免疫学家。他与别人共同研制了破伤风抗毒素与白喉抗毒素。" }, { "k": "e", "text": "〔普吕多姆（1839—1907）〕法国诗人。代表作有诗集《孤独》《法国》《命运》等。" }, { "k": "f", "text": "〔迪南（1828—1910）〕又译作“杜南”，瑞士人，国际红十字会创始人。" }, { "k": "g", "text": "〔帕西（1822—1912）〕法国经济学家、社会活动家。关注电头和导语交代了哪些内容。一一列举获奖者的国籍、姓名、所获奖项和主要成就，新闻事实表述简洁、准确。明确颁奖机构、颁奖时间和地点。" }] },

      "\"飞天\"凌空": { "intro": "新闻特写，描绘跳水姑娘吕伟夺魁瞬间的优美身姿与高超技艺。", "full": "她站在十米高台的前沿，沉静自若，风度优雅，白云似在她的头顶飘浮，飞鸟掠过她的身旁。这是达卡多拉游泳场的八千名观众一齐翘首而望、屏息敛声的一刹那。\n\n轻舒双臂，向上举起，只见吕伟轻轻一蹬，就向空中飞去。一瞬间，她那修长美妙的身体犹如被空气托住了，衬着蓝天白云，酷似敦煌壁画中凌空翔舞的“飞天”。\n\n紧接着，是向前翻腾一周半，同时伴随着旋风般的空中转体三周，动作疾如流星，又潇洒自如，1.7秒的时间对她似乎特别慷慨，让她从容不迫地展示身体优美的线条，从前伸的手指，一直延续到绷直的足尖。\n\n还没等观众从眼花缭乱中反应过来，她已经展开身体，像轻盈的、笔直的箭，“哧”地插进碧波之中，几串白色的气泡拥抱了这位自天而降的仙女，四面水花则悄然不惊。\n\n“妙！妙极了！”站在我们旁边的一名外国记者跳了起来。这时，整个游泳场都沸腾了，如梦初醒的观众用震耳欲聋的掌声和欢呼声，来向他们喜爱的运动员表达由衷的赞赏。\n\n吕伟精彩的表演，将游泳场的气氛推向了高潮。她的这个动作“5136”，让几位裁判亮出了9.5分的高分。\n\n这位年方十六的中国姑娘，赢得了金牌。\n\n当一个印度观众了解到这个姑娘是中国跳水集训队中最年轻的新秀时，惊讶不已。他说：“了不起，你们中国的人才太多了！”", "exam": [], "notes": [{ "k": "a", "text": "选自1982年11月25日《光明日报》。有删改。1982年11月24日，在印度新德里举行的第九届亚运会中，中国运动员吕伟获得女子十米跳台跳水比赛冠军。" }, { "k": "b", "text": "〔翘（qiáo）首〕抬起头来。" }, { "k": "c", "text": "〔屏（bǐng）息〕暂时抑制住呼吸。" }, { "k": "d", "text": "〔悄（qiǎo）然〕形容寂静无声。描写白云、飞鸟，既表现跳台的高，又衬出“飞天”的沉静。连贯的跳水动作被分解成起跳、腾空、入水三个步骤，逐一描写，犹如慢镜头回放。展现生动的画面，是新闻特写常用的写法。" }, { "k": "a", "text": "〔5136〕跳水动作代码。“5”指第5组动作，“13”指向前翻腾一周半，“6”指转体三周。侧面描写，表达自豪之情。什么是新闻特写新闻特写，是指以形象化的描写作为主要表现手段，截取新闻事件中最具有价值、最生动感人、最富有特征的片段和部分予以放大，从而鲜明再现典型人物、事件、场景的一种新闻体裁。新闻特写兼有新闻和文学的特点，但由于其强调新闻性、时效性和真实性，所以更接近于通讯体裁。简要和迅速地报道新闻事实，是新闻特写与消息的共同点所在。二者差异在于，消息往往要报道新闻事件的全过程，新闻特写则主要描绘新闻事件中的片段。重视运用形象思维，采取多种文学手法，生动形象地报道新闻事实，是新闻特写与通讯的共同点所在。它们的差异在于，在报道同一新闻事实时，通讯一般展示新闻事件的纵剖面，来龙去脉比较完整；新闻特写则是集中笔力，主要展示新闻事件的某一横剖面，着重描写精彩瞬间，并且比通讯更强调时效性和现场感。（摘自吴麟、张玉洪《新闻采访与写作》）" }] },

      "一着惊海天": { "intro": "通讯，记叙我国航母舰载战斗机首次成功着舰的惊心动魄时刻。", "full": "渤海某海域，海风呼啸，海浪澎湃。辽阔的海面上，我国第一艘航空母舰——辽宁舰斩浪向前。舰岛的主桅杆上，艳红的“八一”军旗迎风招展。\n\n2012年11月23日上午8时，顶着凛冽的寒风，身着不同颜色马甲的甲板工作人员在战位就位。阻拦索安全观察员手持专业工具，一丝不苟地对阻拦索做最后一次检查。备受外界关注的我国航母舰载战斗机首次着舰进入最关键的时刻。\n\n这不是一次普通的飞行。航母舰载战斗机上舰，承载着国人的强军梦想。浩瀚的大海可以做证：为了这一梦想成真，古老的中华民族，已经等了近百年；人民海军官兵，已经期盼了半个多世纪。\n\n这更不是一次普通的降落。这是世界公认的最具风险的难题。从高速飞行的舰载战斗机上往下看，航母就像汪洋中的一片树叶，在海上起伏行进，飞机每次着舰都面临着生与死的考验。据统计，航母大国舰载机80%的事故发生在着舰过程中。第二次世界大战结束到现在，某大国海军已经坠毁了1000多架飞机，700多名飞行员丧生，其中绝大部分事故是发生在着舰的时候。\n\n飞行塔台内的广播响了：“歼-15飞机552号已于××××起飞，预计××××临空！”\n\n着舰指挥员从容地走上甲板指挥平台。“刀尖上的舞蹈”就要开始了，现场所有的人都捏着一把汗。\n\n塔台内，时钟指针的每次跳动，都在揪着人心。\n\n“航向××，航速××节……”口令声中，辽宁舰官兵娴熟地操纵着航空母舰，舰艉留下一道宽阔笔直的航迹。\n\n×时××分，远方的天空中传来舰载机的低吼声。循声望去，记者看到，湛蓝的天幕上，一架歼-15舰载机正向辽宁舰飞来。\n\n飞行塔台内，一双双布满血丝的眼睛，紧盯着监视屏幕上不断跳动的参数和曲线，密切跟踪正在空中调整飞行姿态的舰载机。\n\n塔台起降指挥监控台，不时传来着舰指挥员和飞行员的对话声——\n\n飞行员：“请示下降高度！”\n\n着舰指挥员：“可以下降高度至×××！”\n\n着舰指挥员：“航向××，航速××……”\n\n飞行员：“明白！”\n\n……\n\n在两人时断时续、不急不缓的对话声中，舰、机配合堪称完美。\n\n发动机的咆哮声越来越大，舰载机越来越近了。绕舰一转弯，二转弯，放下起落架，放下尾钩，歼-15舰载机像凌波海燕，轻巧灵活地调整好姿态飞至舰艉后上方，对准甲板跑道，以几近完美的轨迹迅速下滑。\n\n声如千骑疾，气卷万山来。惊心动魄的一幕出现了：9时08分，伴随震耳欲聋的喷气式发动机轰鸣声，眨眼之间，舰载机的两个主轮触到航母甲板上，机腹后方的尾钩牢牢地挂住了第二道阻拦索。刹那间，疾如闪电的舰载机在阻拦索系统的作用下，滑行数十米后，稳稳地停了下来。\n\n记者眼前的飞行甲板上，定格了一个象征胜利的巨大“V”字：阻拦索的两端构成“V”上边的两头，尾钩钩住处，则是“V”字的底尖。\n\n“成功了！”欢呼声中，一颗颗揪紧的心，一下子舒展开来。各个战位上热烈的掌声，瞬间点燃了所有人内心的激情，每个人的脸上都绽放出胜利的笑容。许多人落泪了！他们说：“太让人激动了！”\n\n舰载战斗机上舰，中国白手起家，一切从零开始。某大国一名上将曾说：“我们可以把航空母舰送给你们，但是，十年之内，你们不可能让舰载机上舰！”为了这一着，面对技术封锁，多少人殚精竭虑，青丝变白发；多少人顽强攻关，累倒在试验场；多少人无怨无悔，默默奉献……今天，终于有了一个圆满的结果，能不激动吗？\n\n“快点儿！快点儿！”有人向飞行甲板冲去。几分钟前还空空荡荡的飞行甲板上，一下跑来了一大群人。\n\n打开舱门，飞行员冲着围过来的将士们说：“一切正常，感觉好极了！”\n\n歼-15舰载机前沸腾了，鲜花映衬着飞行员的笑脸，人们忘情地与飞行员紧紧拥抱，争相与飞行员合影留念……\n\n“咔嚓！”“咔嚓！”……随着照相机的快门声响起，中国第一位成功着舰的航母舰载战斗机飞行员的风采，定格在人们的镜头里，镌刻在共和国的史册上。\n\n（本报辽宁舰11月25日电）", "exam": [], "notes": [{ "k": "a", "text": "选自2012年11月25日《人民海军》。有改动。着（zhuó），这里指飞机降落。航母，航空母舰的简称。因保密需要，原文以“××”代替一些具体数据。" }, { "k": "b", "text": "〔舰岛〕现代航空母舰常把舰桥、烟囱等集中建造在飞行甲板的一侧，形似小岛，称为舰岛。" }, { "k": "c", "text": "〔战位〕“舰艇战斗部位”的简称。指舰员进行战斗活动的位置。它是舰艇战斗组织系统的最低一级组织，一般都设有专门的标志。" }, { "k": "d", "text": "〔阻拦索〕横向设置在航空母舰飞行甲板降落跑道上的特制钢索，用于吸收着舰飞机的前冲能量，以缩短其滑行距离。一般设置4~6道。" }, { "k": "a", "text": "〔艉（wěi）〕船体的尾部。" }, { "k": "b", "text": "〔声如千骑疾，气卷万山来〕语出清代施闰章《钱塘观潮》，原文为“声驱千骑疾，气卷万山来”。" }, { "k": "a", "text": "〔白手起家〕比喻在原来没有基础或条件很差的情况下成就一番事业。" }, { "k": "b", "text": "〔殚（dān）精竭虑〕用尽精力，费尽心思。" }, { "k": "c", "text": "〔镌（juān）刻〕雕刻。的笑容。许多人落泪了！他们说：“太让人激动了！”舰载战斗机上舰，中国白手起家" }] },

      "国行公祭，为佑世界和平": { "intro": "新闻评论，围绕国家公祭日阐发铭记历史、珍爱和平的主题。", "full": "设立国家公祭日的初衷。1937年12月13日，侵华日军野蛮侵入南京，随后制造了惨绝人寰的南京大屠杀惨案，30多万中国同胞惨遭杀戮。南京的历史，人类的记忆。今天，第四个南京大屠杀死难者国家公祭日，中国再次以隆重的公祭仪式悼念死难同胞。中国人民永远牢记南京大屠杀历史，与全世界爱好和平与正义的人们共同维护和平。\n\n《别让南京消失在人们的记忆中》，这是美国《波士顿环球邮报》近日发表的有关南京大屠杀长篇文章的标题。南京大屠杀发生80年后，全世界的正义之士仍在以不同方式纪念死难者。加拿大安大略省议会于2017年10月通过有关“设立南京大屠杀纪念日”的动议；美国圣迭戈市的图书馆举办活动，为民众讲述南京大屠杀史实；加利福尼亚州街头不久前落成的美国医生罗伯特·威尔逊的纪念碑前摆满鲜花——东京审判时，他是南京大屠杀的第一位证人；在日本，由高中和大学老师组成的研究会建议将“南京大屠杀”等词语列入教科书……历史，不可能被忘却！\n\n但人们也看到，在日本，右翼分子否认历史的态度仍然顽固。在连锁酒店大肆摆放美化侵略战争的书籍，大规模篡改历史教材，阻止有良知的日本国民追寻事实真相；在美国旧金山市议会2017年9月一致通过设立“慰安妇日”的议案后，属于日本右翼的大阪市市长却表示，要解除大阪市与旧金山市的姐妹城市关系……在南京大屠杀幸存者已不足100位的今天，日本右翼还在不断寻找各种借口对当年的军国主义罪行百般抵赖，扭曲历史，美化战争，颠倒黑白，并企图通过修宪复活军国主义。那些人以丑态百出的表演，妄图辱没人类的良知。\n\n历史不会因时代变迁而改变，事实也不会因巧舌抵赖而消失。日本右翼越顽固，越会引起爱好和平的人们高度警惕。2017年11月，日内瓦裁军会议取消了日本和平演讲的资格；联合国人权理事会提出218项建议，狠批日本在历史问题上的态度，要求日本“正视历史，应努力向后代讲述真实的历史”。南京大屠杀，早已是所有正义力量的集体记忆，唯有日本右翼分子仍在梦中呓语。国家公祭日之长鸣警钟振聋发聩，那些装睡梦游的罪恶灵魂无处遁形。\n\n80年，沧海桑田。1937年12月18日，《纽约时报》在一则报道中写道：“大规模抢劫、侵犯妇女、杀害平民……日军将南京变成了一座恐怖之城。”2017年9月，国际和平城市协会宣布，南京成为“国际和平城市”。国际和平城市协会项目执行会长弗雷德·阿门特指出，南京这座城市是第二次世界大战中饱受战火摧残的一个典型，如今成为国际和平城市后，方便全世界的人们更多地了解中华民族热爱、追求和平的悠久历史。\n\n从“恐怖之城”到“和平之城”，南京的命运变迁足证和平是何等珍贵。中国早已成为具有保卫人民和平生活的坚强能力的伟大国家，矢志捍卫世界和平。铭记历史、缅怀先烈、珍爱和平、开创未来，中国一以贯之的和平誓言，彰显坚定的信念、磅礴的力量。", "exam": [], "notes": [{ "k": "a", "text": "选自2017年12月13日《人民日报》。略有改动。" }, { "k": "b", "text": "〔国殇（shāng）〕为国牺牲的人。这里指死难的军民。" }, { "k": "c", "text": "〔惨绝人寰（huán）〕悲惨的程度人间从未有过，形容悲惨到了极点。人寰，人间。" }, { "k": "d", "text": "〔罗伯特·威尔逊（1906—1967）〕美国医生。1936年至1940年在南京鼓楼医院工作。日军入侵南京时，他多方奔走，为保护中国难民做了许多事。" }, { "k": "e", "text": "〔篡（cuàn）改〕别有用心地改动或曲解。" }, { "k": "a", "text": "〔振聋发聩（kuì）〕发出很大的声响，使耳聋的人也能听见，比喻唤醒糊涂麻木的人。聩，聋。" }, { "k": "b", "text": "〔遁（dùn）形〕隐藏形体。关系……在南京大屠杀幸存者已不足100位的今天，日本右翼还在不断寻找各种借口对当年的军国主义罪行百般抵赖，扭曲历史，美化战争，颠倒黑白，并企图通过修宪复活军国主义。那些人以丑态百出的表演，妄图辱没人类的良知。历史不会因时代变迁而改变，事实也不会因巧舌抵赖而消失。日本右翼越顽固，越会引起爱好和平的人们高度警惕。2017年11月，日内瓦裁军会议取消了日本和平演讲的资格；联合国人权理事会提出218项建议，狠批日本在历史问题上的态度，要求日本“正视历史，应努力向后代讲述真实的历史”。南京大屠杀，早已是所有正义力量的集体记忆，唯有日本右翼分子仍在梦中呓语。国家公祭日之长鸣警钟振聋发聩" }] },

      "藤野先生": { "intro": "鲁迅回忆性散文，写留学日本时与藤野先生的交往，赞其正直热忱、没有民族偏见。", "full": "东京也无非是这样。上野的樱花烂熳的时节，望去确也像绯红的轻云，但花下也缺不了成群结队的“清国留学生”的速成班，头顶上盘着大辫子，顶得学生制帽的顶上高高耸起，形成一座富士山。也有解散辫子，盘得平的，除下帽来，油光可鉴，宛如小姑娘的发髻一般，还要将脖子扭几扭。实在标致极了。\n\n中国留学生会馆的门房里有几本书买，有时还值得去一转；倘在上午，里面的几间洋房里倒也还可以坐坐的。但到傍晚，有一间的地板便常不免要咚咚咚地响得震天，兼以满房烟尘斗乱；问问精通时事的人，答道，“那是在学跳舞。”\n\n到别的地方去看看，如何呢？\n\n我就往仙台的医学专门学校去。从东京出发，不久便到一处驿站，写道：日暮里。不知怎地，我到现在还记得这名目。其次却只记得水户了，这是明的遗民朱舜水先生客死的地方。仙台是一个市镇，并不大；冬天冷得利害；还没有中国的学生。\n\n大概是物以希为贵罢。北京的白菜运往浙江，便用红头绳系住菜根，倒挂在水果店头，尊为“胶菜”；福建野生着的芦荟，一到北京就请进温室，且美其名曰“龙舌兰”。我到仙台也颇受了这样的优待，不但学校不收学费，几个职员还为我的食宿操心。我先是住在监狱旁边一个客店里的，初冬已经颇冷，蚊子却还多，后来用被盖了全身，用衣服包了头脸，只留两个鼻孔出气。在这呼吸不息的地方，蚊子竟无从插嘴，居然睡安稳了。饭食也不坏。但一位先生却以为这客店也包办囚人的饭食，我住在那里不相宜，几次三番，几次三番地说。我虽然觉得客店兼办囚人的饭食和我不相干，然而好意难却，也只得别寻相宜的住处了。于是搬到别一家，离监狱也很远，可惜每天总要喝难以下咽的芋梗汤。\n\n从此就看见许多陌生的先生，听到许多新鲜的讲义。解剖学是两个教授分任的。最初是骨学。其时进来的是一个黑瘦的先生，八字须，戴着眼镜，挟着一叠大大小小的书。一将书放在讲台上，便用了缓慢而很有顿挫的声调，向学生介绍自己道：\n\n“我就是叫作藤野严九郎的……”\n\n后面有几个人笑起来了。他接着便讲述解剖学在日本发达的历史，那些大大小小的书，便是从最初到现今关于这一门学问的著作。起初有几本是线装的；还有翻刻中国译本的，他们的翻译和研究新的医学，并不比中国早。\n\n那坐在后面发笑的是上学年不及格的留级学生，在校已经一年，掌故颇为熟悉的了。他们便给新生讲演每个教授的历史。这藤野先生，据说是穿衣服太模胡了，有时竟会忘记带领结；冬天是一件旧外套，寒颤颤的，有一回上火车去，致使管车的疑心他是扒手，叫车里的客人大家小心些。\n\n他们的话大概是真的，我就亲见他有一次上讲堂没有带领结。\n\n过了一星期，大约是星期六，他使助手来叫我了。到得研究室，见他坐在人骨和许多单独的头骨中间，——他其时正在研究着头骨，后来有一篇论文在本校的杂志上发表出来。\n\n“我的讲义，你能抄下来么？”他问。\n\n“可以抄一点。”\n\n“拿来我看！”\n\n我交出所抄的讲义去，他收下了，第二三天便还我，并且说，此后每一星期要送给他看一回。我拿下来打开看时，很吃了一惊，同时也感到一种不安和感激。原来我的讲义已经从头到末，都用红笔添改过了，不但增加了许多脱漏的地方，连文法的错误，也都一一订正。这样一直继续到教完了他所担任的功课：骨学，血管学，神经学。\n\n可惜我那时太不用功，有时也很任性。还记得有一回藤野先生将我叫到他的研究室里去，翻出我那讲义上的一个图来，是下臂的血管，指着，向我和蔼的说道：\n\n“你看，你将这条血管移了一点位置了。——自然，这样一移，的确比较的好看些，然而解剖图不是美术，实物是那么样的，我们没法改换它。现在我给你改好了，以后你要全照着黑板上那样的画。”\n\n但是我还不服气，口头答应着，心里却想道：\n\n“图还是我画的不错；至于实在的情形，我心里自然记得的。”\n\n学年试验完毕之后，我便到东京玩了一夏天，秋初再回学校，成绩早已发表了，同学一百余人之中，我在中间，不过是没有落第。这回藤野先生所担任的功课，是解剖实习和局部解剖学。\n\n解剖实习了大概一星期，他又叫我去了，很高兴地，仍用了极有抑扬的声调对我说道：\n\n“我因为听说中国人是很敬重鬼的，所以很担心，怕你不肯解剖尸体。现在总算放心了，没有这回事。”\n\n但他也偶有使我很为难的时候。他听说中国的女人是裹脚的，但不知道详细，所以要问我怎么裹法，足骨变成怎样的畸形，还叹息道，“总要看一看才知道。究竟是怎么一回事呢？”\n\n有一天，本级的学生会干事到我寓里来了，要借我的讲义看。我检出来交给他们，却只翻检了一通，并没有带走。但他们一走，邮差就送到一封很厚的信，拆开看时，第一句是：\n\n“你改悔罢！”\n\n这是《新约》上的句子罢，但经托尔斯泰新近引用过的。其时正值日俄战争，托老先生便写了一封给俄国和日本的皇帝的信，开首便是这一句。日本报纸上很斥责他的不逊，爱国青年也愤然，然而暗地里却早受了他的影响了。其次的话，大略是说上年解剖学试验的题目，是藤野先生在讲义上做了记号，我预先知道的，所以能有这样的成绩。末尾是匿名。\n\n我这才回忆到前几天的一件事。因为要开同级会，干事便在黑板上写广告，末一句是“请全数到会勿漏为要”，而且在“漏”字旁边加了一个圈。我当时虽然觉到圈得可笑，但是毫不介意，这回才悟出那字也在讥刺我了，犹言我得了教员漏泄出来的题目。\n\n我便将这事告知了藤野先生；有几个和我熟识的同学也很不平，一同去诘责干事托辞检查的无礼，并且要求他们将检查的结果，发表出来。终于这流言消灭了，干事却又竭力运动，要收回那一封匿名信去。结末是我便将这托尔斯泰式的信退还了他们。\n\n中国是弱国，所以中国人当然是低能儿，分数在六十分以上，便不是自己的能力了：也无怪他们疑惑。但我接着便有参观枪毙中国人的命运了。第二年添教霉菌学，细菌的形状是全用电影来显示的，一段落已完而还没有到下课的时候，便影几片时事的片子，自然都是日本战胜俄国的情形。但偏有中国人夹在里边：给俄国人做侦探，被日本军捕获，要枪毙了，围着看的也是一群中国人；在讲堂里的还有一个我。\n\n“万岁！”他们都拍掌欢呼起来。\n\n这种欢呼，是每看一片都有的，但在我，这一声却特别听得刺耳。此后回到中国来，我看见那些闲看枪毙犯人的人们，他们也何尝不酒醉似的喝采，——呜呼，无法可想！但在那时那地，我的意见却变化了。\n\n到第二学年的终结，我便去寻藤野先生，告诉他我将不学医学，并且离开这仙台。他的脸色仿佛有些悲哀，似乎想说话，但竟没有说。\n\n“我想去学生物学，先生教给我的学问，也还有用的。”其实我并没有决意要学生物学，因为看得他有些凄然，便说了一个慰安他的谎话。\n\n“为医学而教的解剖学之类，怕于生物学也没有什么大帮助。”他叹息说。\n\n将走的前几天，他叫我到他家里去，交给我一张照相，后面写着两个字道：“惜别”，还说希望将我的也送他。但我这时适值没有照相了；他便叮嘱我将来照了寄给他，并且时时通信告诉他此后的状况。\n\n我离开仙台之后，就多年没有照过相，又因为状况也无聊，说起来无非使他失望，便连信也怕敢写了。经过的年月一多，话更无从说起，所以虽然有时想写信，却又难以下笔，这样的一直到现在，竟没有寄过一封信和一张照片。从他那一面看起来，是一去之后，杳无消息了。\n\n但不知怎地，我总还时时记起他，在我所认为我师的之中，他是最使我感激，给我鼓励的一个。有时我常常想：他的对于我的热心的希望，不倦的教诲，小而言之，是为中国，就是希望中国有新的医学；大而言之，是为学术，就是希望新的医学传到中国去。他的性格，在我的眼里和心里是伟大的，虽然他的姓名并不为许多人所知道。\n\n他所改正的讲义，我曾经订成三厚本，收藏着的，将作为永久的纪念。不幸七年前迁居的时候，中途毁坏了一口书箱，失去半箱书，恰巧这讲义也遗失在内了。责成运送局去找寻，寂无回信。只有他的照相至今还挂在我北京寓居的东墙上，书桌对面。每当夜间疲倦，正想偷懒时，仰面在灯光中瞥见他黑瘦的面貌，似乎正要说出抑扬顿挫的话来，便使我忽又良心发现，而且增加勇气了，于是点上一枝烟，再继续写些为“正人君子”之流所深恶痛疾的文字。\n\n十月十二日。", "exam": [], "notes": [{ "k": "a", "text": "选自《朝花夕拾》（《鲁迅全集》第二卷，人民文学出版社2005年版）。" }, { "k": "b", "text": "〔上野〕日本东京地名，文中指上野公园，以樱花著名。" }, { "k": "c", "text": "〔烂熳（màn）〕颜色鲜明而美丽。现在写作“烂漫”。" }, { "k": "d", "text": "〔“清国留学生”的速成班〕指清末到日本留学时，先在东京弘文学院速成班学习日语等课程的中国学生。" }, { "k": "e", "text": "〔富士山〕日本第一高峰，著名火山，在本州岛中南部。山体呈圆锥形，山顶终年积雪。" }, { "k": "f", "text": "〔油光可鉴〕这里是说头发上抹油，梳得很光亮，像镜子一样可以照人。鉴，照。" }, { "k": "g", "text": "〔标致〕漂亮。这里是反语，用来讽刺。" }, { "k": "h", "text": "〔会馆〕旧时同乡或同业的人在京城、省会或大商埠（bù）设立的机构，主要供同乡或同业的人聚会和住宿。这里指设立在日本东京供中国留学生活动和居住的场所。" }, { "k": "a", "text": "〔斗乱〕飞腾纷乱。斗，同“抖”。" }, { "k": "b", "text": "〔精通时事〕这是讽刺的说法。所谓“时事”，其实是一些无聊的事。" }, { "k": "c", "text": "〔仙台〕日本城市，在本州岛东北部。1904年至1906年，鲁迅曾在这里学医。现在的市西青叶山麓建有鲁迅纪念碑。" }, { "k": "d", "text": "〔水户〕日本城市，在本州岛东部，位于东京和仙台之间。" }, { "k": "e", "text": "〔明的遗民朱舜水〕即朱之瑜（1600—1682），号舜水，余姚（今属浙江）人，明末清初思想家。明亡后曾进行反清复明活动，失败后长住日本讲学。他忠于明朝，所以说他是“明的遗民”。" }, { "k": "f", "text": "〔客死〕死在异国他乡。" }, { "k": "g", "text": "〔利害〕现在写作“厉害”。" }, { "k": "h", "text": "〔希〕现在写作“稀”。" }, { "k": "i", "text": "〔胶菜〕山东胶州出产的优质大白菜。" }, { "k": "j", "text": "〔讲义〕为讲课而编写的材料。这里指讲课的内容。里面的几间洋房里倒也还可以坐坐的。但到傍晚，有一间的地板便常不免要咚咚咚地响得震天，兼以满房烟尘斗乱" }, { "k": "a", "text": "〔掌故〕关于历史人物、典章制度等的传说或故事。这里指学校里过去发生的一些事情。" }, { "k": "b", "text": "〔模胡〕这里指马虎、不讲究。现在写作“模糊”。" }, { "k": "c", "text": "〔带〕现在写作“戴”。" }, { "k": "a", "text": "〔试验〕考试，测验。" }, { "k": "b", "text": "〔落第〕原指科举时代应试不中。这里指考试不及格。" }, { "k": "c", "text": "〔托尔斯泰〕指列夫·托尔斯泰。" }, { "k": "d", "text": "〔日俄战争〕指1904年2月至1905年9月，日俄两国为争夺在我国东北和朝鲜半岛的权益而进行的战争。战争主要在我国境内进行，而清政府竟屈辱地宣布中立。" }, { "k": "e", "text": "〔托老先生……皇帝的信〕托尔斯泰写给俄国沙皇和日本天皇的信，刊载于1904年6月27日英国《泰晤士报》，两个月后译载于日本《平民新闻》。" }, { "k": "f", "text": "〔不逊〕傲慢无礼。逊，谦虚。" }, { "k": "g", "text": "〔爱国青年〕指当时日本一些受军国主义思想影响而妄自尊大、盲目忠君、思想狭隘的青年。称他们为“爱国青年”，是一种讽刺。" }, { "k": "a", "text": "〔匿名〕不署名或不署真实姓名。匿，隐藏。" }, { "k": "b", "text": "〔犹言〕如同说。" }, { "k": "c", "text": "〔诘责〕责问。" }, { "k": "d", "text": "〔托辞〕找借口。" }, { "k": "e", "text": "〔电影〕这里指幻灯片。" }, { "k": "f", "text": "〔影〕这里是动词，放映。" }, { "k": "g", "text": "〔喝（hè）采〕现在写作“喝彩”。" }, { "k": "h", "text": "〔但在那时那地，我的意见却变化了〕鲁迅原是为寻求救国道路到日本学医的。但他看了影片以后，学医的想法有了改变。他“觉得医学并非一件紧要事，凡是愚弱的国民，即使体格如何健全，如何茁壮，也只能做毫无意义的示众的材料和看客”（《〈呐喊〉自序》）。因此，他想提倡文艺运动，改变国民的精神。" }, { "k": "a", "text": "〔照相〕指照片。" }, { "k": "b", "text": "〔适值〕恰好遇到。" }, { "k": "c", "text": "〔杳（yǎo）无消息〕长时间没有一点消息。杳，远得看不见踪影。" }, { "k": "d", "text": "〔七年前迁居〕指1919年鲁迅与家人迁入北京西直门内八道湾胡同11号寓所。藤野先生的照片和手迹我离开仙台之后，就多年没有照过相，又因为状况也无聊，说起来无非使他失望，便连信也怕敢写了。经过的年月一多，话更无从说起，所以虽然有时想写信，却又难以下笔，这样的一直到现在，竟没有寄过一封信和一张照片。从他那一面看起来，是一去之后，杳无消息" }, { "k": "a", "text": "〔这讲义也遗失在内〕藤野先生“所改正的讲义”其实并未遗失，20世纪50年代从鲁迅留在绍兴的藏书中被找到，现收藏于北京鲁迅博物馆。" }, { "k": "b", "text": "〔北京寓居〕指当时的阜成门内西三条胡同21号，后改建为鲁迅博物馆。" }, { "k": "c", "text": "〔枝〕现在写作“支”。" }, { "k": "d", "text": "〔正人君子〕这里是反语，讽刺那些为军阀政客张目而自命为“正人君子”的文人。" }, { "k": "e", "text": "〔深恶（wù）痛疾〕厌恶、痛恨到了极点。疾，痛恨。" }, { "k": "f", "text": "〔十月十二日〕指1926年10月12日。" }] },

      "回忆鲁迅先生（节选）": { "intro": "萧红回忆录节选，从生活细节展现鲁迅的平易与伟大。", "full": "鲁迅先生的笑声是明朗的，是从心里的欢喜。若有人说了什么可笑的话，鲁迅先生笑得连烟卷都拿不住了，常常是笑得咳嗽起来。\n\n鲁迅先生走路很轻捷，尤其使人记得清楚的，是他刚抓起帽子来往头上一扣，同时左腿就伸出去了，仿佛不顾一切地走去。\n\n在鲁迅先生家里做客人，刚开始是从法租界来到虹口，搭电车也要差不多一个钟头的工夫，所以那时候来的次数比较少。还记得有一次谈到半夜了，一过十二点电车就没有的，但那天不知讲了些什么，讲到一个段落就看看旁边小长桌上的圆钟，十一点半了，十一点四十五分了，电车没有了。\n\n“反正已十二点，电车已没有，那么再坐一会儿。”许先生如此劝着。\n\n鲁迅先生好像听了所讲的什么起了幻想，安顿地举着象牙烟嘴在沉思着。\n\n一点钟以后，送我（还有别的朋友）出来的是许先生，外边下着小雨，弄堂里灯光全然灭掉了，鲁迅先生嘱咐许先生一定让坐小汽车回去，并且一定嘱咐许先生付钱。\n\n以后也住到北四川路来，就每夜饭后必到大陆新村来了，刮风的天，下雨的天，几乎没有间断的时候。\n\n鲁迅先生很喜欢北方饭。还喜欢吃油炸的东西，喜欢吃硬的东西，就是后来生病的时候，也不大吃牛奶。鸡汤端到旁边用调羹舀了一二下就算了事。\n\n有一天约好我去包饺子吃，那还是住在法租界，所以带了外国酸菜和用绞肉机绞成的牛肉，就和许先生站在客厅后边的方桌边包起来。海婴公子围着闹得起劲，一会儿把按成圆饼的面拿去了，他说做了一只船来，送在我们的眼前，我们不看它，转身他又做了一只小鸡。许先生和我都不去看它，对他竭力避免加以赞美，若一赞美起来，怕他更做得起劲。\n\n客厅后没到黄昏就先黑了，背上感到些微的寒凉，知道衣裳不够了，但为着忙，没有加衣裳去。等把饺子包完了看看那数目并不多，这才知道许先生和我们谈话谈得太多，误了工作。许先生怎样离开家的，怎样到天津读书的，在女师大读书时怎样做了家庭教师，她去考家庭教师的那一段描写，非常有趣，只取一名，可是考了好几十名，她之能够当选算是难的了。指望对于学费有点补足，冬天来了，北平又冷，那家离学校又远，每月除了车子钱之外，若伤风感冒还得自己拿出买阿司匹林的钱来，每月薪金十元要从西城跑到东城……\n\n饺子煮好，一上楼梯，就听到楼上鲁迅先生明朗的笑声冲下楼梯来，原来有几个朋友在楼上也正谈得热闹。那一天吃得是很好的。\n\n以后我们又做过韭菜合子，又做过荷叶饼，我一提议，鲁迅先生必然赞成，而我做得又不好，可是鲁迅先生还是在饭桌上举着筷子问许先生：“我再吃几个吗？”\n\n因为鲁迅先生的胃不大好，每饭后必吃“脾自美”胃药丸一二粒。\n\n有一天下午鲁迅先生正在校对着瞿秋白的《海上述林》，我一走进卧室去，他从那圆转椅上转过来了，向着我，还微微站起了一点。\n\n“好久不见，好久不见。”一边说着一边向我点头。\n\n刚刚我不是来过了吗？怎么会好久不见？就是上午我来的那次周先生忘记了，可是我也每天来呀……怎么都忘记了吗？\n\n周先生转身坐在躺椅上才自己笑起来，他是在开着玩笑。\n\n梅雨季，很少有晴天。一天的上午刚一放晴，我高兴极了，就到鲁迅先生家去了，跑上楼还喘着，鲁迅先生说：“来啦！”我说：“来啦！”\n\n我喘着连茶也喝不下。\n\n鲁迅先生就问我：\n\n“有什么事吗？”\n\n我说：“天晴啦，太阳出来啦。”\n\n许先生和鲁迅先生都笑着，一种对于冲破忧郁心境的展然的会心的笑。\n\n青年人写信，写得太草率，鲁迅先生是深恶痛绝之的。\n\n“字不一定要写得好，但必须得使人一看了就认识，青年人现在都太忙了……他自己赶快胡乱写完了事，别人看了三遍五遍看不明白，这费了多少工夫，他不管。反正这费的工夫不是他的。这存心是不太好的。”\n\n但他还是展读着每封由不同角落里投来的青年的信，眼睛不济时，便戴起眼镜来看，常常看到夜里很深的时光。\n\n鲁迅先生的原稿，在拉都路一家炸油条的那里用着包油条，我得到了一张，是译《死魂灵》的原稿，写信告诉了鲁迅先生，鲁迅先生不以为稀奇。许先生倒很生气。\n\n鲁迅先生出书的校样，都用来揩桌子，或做什么的。请客人在家里吃饭，吃到半道，鲁迅先生回身去拿来校样给大家分着，客人接到手里一看，这怎么可以？鲁迅先生说：\n\n“擦一擦，拿着鸡吃，手是腻的。”\n\n到洗澡间去，那边也摆着校样纸。\n\n许先生从早晨忙到晚上，在楼下陪客人，一边还手里打着毛线。不然就是一边谈着话，一边站起来用手摘掉花盆里花上已干枯了的叶子。许先生每送一个客人，都要送到楼下的门口，替客人把门开开，客人走出去而后轻轻地关了门再上楼来。\n\n来了客人还要到街上去买鱼或鸡，买回来还要到厨房里去工作。\n\n鲁迅先生临时要寄一封信，就得许先生换起皮鞋子来到邮局或者大陆新村旁边的信筒那里去。落着雨的天，许先生就打起伞来。\n\n许先生是忙的，许先生的笑是愉快的，但是头发有些是白了的。\n\n夜里去看电影，施高塔路的汽车房只有一辆车，鲁迅先生一定不坐，一定让我们坐。许先生，周建人夫人……海婴，周建人先生的三位女公子，我们上车了。\n\n鲁迅先生和周建人先生，还有别的一二位朋友在后边。\n\n看完了电影出来，又只叫到一部汽车，鲁迅先生又一定不肯坐，让周建人先生的全家坐着先走了。\n\n鲁迅先生旁边走着海婴，过了苏州河的大桥去等电车去了。等了二三十分钟电车还没有来，鲁迅先生依着沿苏州河的铁栏杆坐在桥边的石围上了，并且拿出香烟来，装上烟嘴，悠然地吸着烟。\n\n海婴不安地来回乱跑，鲁迅先生还招呼他和自己并排地坐下。\n\n鲁迅先生坐在那儿，和一个乡下的安静老人一样。\n\n鲁迅先生的休息，不听留声机，不出去散步，也不倒在床上睡觉，鲁迅先生自己说：\n\n“坐在椅子上翻一翻书就是休息了。”\n\n鲁迅先生从下午两三点钟起就陪客人，陪到五点钟，陪到六点钟，客人若在家吃饭，吃过饭又必要在一起喝茶，或者刚刚喝完茶走了，或者还没走就又来了客人，于是又陪下去，陪到八点钟，十点钟，常常陪到十二点钟。从下午两三点钟起，陪到夜里十二点，这么长的时间，鲁迅先生都是坐在藤躺椅上，不断地吸着烟。\n\n客人一走，已经是下半夜了，本来已经是睡觉的时候了，可是鲁迅先生正要开始工作。在工作之前，他稍微阖一阖眼睛，燃起一支烟来，躺在床边上，这一支烟还没有吸完，许先生差不多就在床里边睡着了。（许先生为什么睡得这样快？因为第二天早晨六七点钟就要起来管理家务。）海婴这时也在三楼和保姆一道睡着了。\n\n全楼都寂静下去，窗外也是一点声音没有了，鲁迅先生站起来，坐到书桌边，在那绿色的台灯下开始写文章了。\n\n许先生说，鸡鸣的时候，鲁迅先生还是坐着，街上的汽车嘟嘟地叫起来了，鲁迅先生还是坐着。\n\n有时许先生醒了，看着玻璃窗白萨萨的了，灯光也不显得怎样亮了，鲁迅先生的背影不像夜里那样黑大。\n\n鲁迅先生背影是灰黑色的，仍旧坐在那里。\n\n人家都起来了，鲁迅先生才睡下。\n\n海婴从三楼下来了，背着书包，保姆送他到学校去，经过鲁迅先生的门前，保姆总是吩咐他说：\n\n“轻一点走，轻一点走。”\n\n鲁迅先生刚一睡下，太阳就高起来了。太阳照着隔院子的人家，明亮亮的，照着鲁迅先生花园的夹竹桃，明亮亮的。\n\n鲁迅先生的书桌整整齐齐的，写好的文章压在书下边，毛笔在烧瓷的小龟背上站着。\n\n一双拖鞋停在床下，鲁迅先生在枕头上边睡着了。\n\n从福建菜馆叫的菜，有一碗鱼做的丸子。\n\n海婴一吃就说不新鲜，许先生不信，别的人也都不信。因为那丸子有的新鲜，有的不新鲜，别人吃到嘴里的恰好都是没有改味的。\n\n许先生又给海婴一个，海婴一吃，又是不好的，他又嚷嚷着。别人都不注意，鲁迅先生把海婴碟里的拿来尝尝。果然是不新鲜的。鲁迅先生说：\n\n“他说不新鲜，一定也有他的道理，不加以查看就抹杀是不对的。”\n\n…………\n\n以后我想起这件事来，私下和许先生谈过，许先生说：“周先生的做人，真是我们学不了的。哪怕一点点小事。”\n\n鲁迅先生包一个纸包也要包到整整齐齐，他常常把要寄出的书，从许先生手里拿过来自己包。许先生本来包得多么好，而鲁迅先生还要亲自动手。\n\n鲁迅先生把书包好了，用细绳捆上，那包方方正正的，连一个角也不准歪一点或扁一点，而后拿着剪刀，把捆书的那绳头都剪得整整齐齐。\n\n就是包这书的纸都不是新的，都是从街上买东西回来留下来的。许先生上街回来把买来的东西一打开，随手就把包东西的牛皮纸折起来，随手把小细绳圈了一个圈。若小细绳上有一个疙瘩，也要随手把它解开的。准备着随时用随时方便。\n\n鲁迅先生必得休息的，须藤老医生是这样说的。可是鲁迅先生从此不但没有休息，并且脑子里所想的更多了，要做的事情都像非立刻就做不可，校《海上述林》的校样，印珂勒惠支的画，翻译《死魂灵》下部；刚好了，这些就都一起开始了，还计算着出三十年集（即《鲁迅全集》）。\n\n鲁迅先生感到自己的身体不好，就更没有时间注意身体，所以要多做，赶快做。当时大家不解其中的意思，都以为鲁迅先生不加以休息不以为然，后来读了鲁迅先生《死》的那篇文章才了然了。\n\n鲁迅先生知道自己的健康不成了，工作的时间没有几年了，死了是不要紧的，只要留给人类更多，鲁迅先生就是这样。\n\n不久书桌上德文字典和日文字典都摆起来了，果戈理的《死魂灵》，又开始翻译了。", "exam": [], "notes": [{ "k": "b", "text": "〔许先生〕指许广平（1898—1968），广东番（pān）禺（今广州番禺区）人，鲁迅夫人。" }, { "k": "c", "text": "〔安顿〕安稳。" }, { "k": "a", "text": "〔弄（lòng）堂〕巷子。b〔阿司匹林〕一种解热镇痛药。一点钟以后，送我（还有别的朋友）出来的是许先生，外边下着小雨，弄堂" }, { "k": "a", "text": "〔《海上述林》〕无产阶级革命家、中国共产党早期领导人瞿（qú）秋白（1899—1935）的译文集。在瞿秋白被国民党杀害后，由鲁迅搜集、编辑，分上下两卷出版。" }, { "k": "b", "text": "〔存心〕心里怀有的念头。" }, { "k": "c", "text": "〔《死魂灵》〕俄国作家果戈理（1809—1852）的长篇小说。此处是作者误记，文中提到的手稿是苏联作家班台莱耶夫的中篇童话《表》，由鲁迅翻译。" }, { "k": "a", "text": "〔揩（kāi）〕擦拭。8回忆鲁迅先生（节选）" }, { "k": "a", "text": "〔阖（hé）〕闭合。" }, { "k": "a", "text": "〔珂勒惠支（1867—1945）〕德国版画家、雕塑家。8回忆鲁迅先生（节选）" }] },

      "天上有颗\"南仁东星\"": { "intro": "人物通讯，介绍“中国天眼”之父南仁东的科学家精神。", "full": "1945 年 2 月，南仁东出生在辽河上游的吉林辽源。少年时，他常常到离家不远的龙首山上看星星。在地理课上，他曾这样问老师：“南半球看到的星星，跟我们看到的一样吗？”他总是对不知道的事物发出追问。那时他并不知道自己的未来会与星星产生那么深刻的联系，更想不到将来天上会有一颗星星以他的名字来命名。\n\n从小学到初中，南仁东的成绩不错，但并不拔尖。初三那年，一位老师发现了南仁东身上的潜质，把他叫到自己家里，和他畅谈未来和理想。老师谈到人生需要立志，谈到要为国家作贡献，还谈到那些在历史星空中闪耀光芒的伟大人物。从这天开始，南仁东变了。之后，他以优异的成绩考进了辽源五中，高中三年一路领先。高中毕业的那年夏天，他以优异的成绩考入清华大学无线电电子学系。\n\n那是 1963 年，南仁东 18 岁。\n\n1968 年，南仁东被分配到吉林省通化市无线电厂，在这个总共不到 150 人的小厂做“小金工”。这是技术活儿，他喜欢。可是，他很快就遭遇到了“做个简单的小零件也连连出废品”的尴尬。正是这尴尬，让他对什么叫“一丝不苟”“严丝合缝”有了深刻的认识。\n\n这个普通的小厂，成了南仁东成长的摇篮。这是他从清华大学毕业后上的社会实践大学。十年间，他作为技术骨干参与了三种新产品从研发到生产的全过程。在研制十千瓦电视发射机时，有人说：“搞电视发射机，不是我们想干就能干的。这不可能。”南仁东反驳道：“怎么不可能！半导体收音机，我们不是也干下来了吗？”电视发射机当年就顺利通过了省级验收。“怎么不可能！”也成了南仁东的口头禅。他体会到了，世界上的一切发明创造，都是把不可能变成可能。\n\n1978 年，南仁东被中国科学院研究生院录取为天体物理学研究生。这年他 33 岁。\n\n儿时仰望星空的记忆又回到了南仁东的脑海。\n\n在从事了一系列尖端天文学研究之后，南仁东被一项科研计划推向了“看星星”的国际前台。1993 年 9 月，第二十四届国际无线电科学联盟大会在日本召开，多国天文学家共同提出，要联手建设新一代功能强大的“大射电望远镜”。\n\n“这是个必须抓住的机会。”南仁东立即向中国科学院提出报告。他说：“要争取把这个大望远镜建到中国来。”南仁东的激情、自信，还有志向，仿佛都在燃烧。\n\n早在 1963 年，美国就在波多黎各建造了后来被认为是人类 20 世纪十大工程之首的阿雷西博射电望远镜，口径 305 米。1972 年，联邦德国也建造了埃菲尔斯伯格射电望远镜，口径 100 米。1993 年，中国最大的射电望远镜，口径只有 25 米。如果把这个国际项目的台址争取到中国来，对提高我国天文学乃至整个基础科学的研究水平意义重大。\n\n南仁东的建议得到了中国科学院的支持。1994 年春夏之交，南仁东开始主持大射电望远镜的选址工作。反复筛选出的百余个地点大多位于贵州大山深处，人迹罕至，南仁东坚持每个都要去实地考察。在选址的十余年中，从省长到不少村干部都认识了这个“穿短裤的天文学家”。\n\n贵州的清晨和黄昏，寒冬和酷暑，烈日和细雨，见证了南仁东不肯放弃的脚步。到处都是高差巨大的山体，典型的岩溶地貌，弯弯曲曲的石阶。河谷幽深，湍急的河水在两山之间的绳索桥下咆哮。解放鞋、雨衣、柴刀、拐杖，是永远的装备。万山深处，只能靠走。无路的地方，要用柴刀在丛林中劈出一条路来，没有山民的帮助是进不去的。夜宿山乡，点起篝火，南仁东和同事们坐在火堆边仰望星空。他们都感受到，不论科学多么尖端，理想多么高远，还需脚踏大地。\n\n不过，在深山选址的同时，南仁东越来越感到有一股力量在阻止中国争取这个国际项目。他意识到，不能把希望完全放在争取国际项目上。南仁东想起了当年通化无线电厂车间里贴着的标语“自力更生，奋发图强”，一个计划在他头脑里逐渐成形——中国应该独立建造一台 500 米口径的球面射电望远镜。\n\n有人说：“南仁东疯了！”\n\n“你们连汽车发动机都做不好，怎么能造大射电望远镜？”有外国专家这样质疑。\n\n“正因为落后，才要奋起。”南仁东说。\n\n2006 年，国际大射电望远镜项目确定在南非和澳大利亚建造。南仁东先前的愿望落空了，但他已展开预研究的中国 500 米口径球面射电望远镜项目一刻也没有止步地向前挺进。中国科学院随即向国家申报立项。2007 年 7 月 10 日，国家发展和改革委员会批复正式立项。\n\n这一天，南仁东把团队集合起来，对大家说：“我们只是刚刚出发，但是，我们正在向宇宙的深处进军。”\n\n这一年，南仁东 62 岁了。\n\n2011 年 3 月 25 日，贵州省平塘县大窝凼，我国独立自主建设的 500 米口径球面射电望远镜工程正式开工，南仁东担任首席科学家兼总工程师。来自全国近 200 家大中型企业、大专院校、科研院所的 100 多位科学家，5000 余名建设者参与了这个大科学工程的建设。他们的科研激情与力量，在“自力更生”的旗帜下，瞬间被极大地释放出来。工程的推进速度，令很多心存疑虑者瞠目结舌。\n\n“那些日子，南老师的头发，每一根都是竖着的。”他的学生说。\n\n这期间，南仁东被查出患了肺癌，已是晚期。手术后，南仁东被“强制要求”居家治疗和休养。可是，病情稍有缓解，他就又返回了工地。\n\n“南老，食堂师傅给您做了鱼。”他的学生高兴地把一条鱼端来。可是南仁东不吃。\n\n“南老师怎么不吃鱼呀？”食堂的师傅问。\n\n“他说吃鱼要剔刺，他没时间。”学生苦笑着说。\n\n2015 年 11 月 21 日，馈源舱成功地在大窝凼的上空升起。馈源舱是 500 米口径球面射电望远镜接收和回传信号的最核心部件。有人把它比喻为望远镜的眼珠，也有人说它是望远镜的视网膜。\n\n南仁东目睹了馈源舱升空的全过程。当他举起右手遮在安全帽前，仿佛是在向银光闪闪的馈源舱敬礼。阳光照在他仰起的脸上，他那从青年时就蓄起的胡子已经花白了，而耗费了他无数心血的观天巨眼也终于快要“开眼”了。\n\n这时，南仁东又病倒了，再次被送回北京救治。临走前，他对学生说：“我们没有退路，我们一定要冲出去！”\n\n2016 年 9 月 25 日，是中国天文学史、中国科技史都要郑重记录的日子。这一天，被誉为“中国天眼”的 500 米口径球面射电望远镜正式落成启用。\n\n此前一天的傍晚，南仁东最后一次出现在“中国天眼”基地。同事和学生们在综合楼前迎接他，一见面就请他赶紧休息。可是他执意要先去“看天眼”完全建成的模样。\n\n没有人能阻止他。\n\n“我的安全帽呢？”他的嗓音很小。有人跑去拿来他的安全帽，他戴上了，兴奋而威严，像一个将军。小车把他带了过去，他下车了。大家要陪他去，他阻止了：“让我自己过去看。”学生说：“我们陪您过去。”他平静地摆摆手，大家看到，他已经热泪盈眶了。\n\n这个黄昏，高原的夕阳又大又圆。戴着安全帽的南仁东一步一步向“中国天眼”走去，身后只有一只名叫凼凼的狗紧紧跟着他，夕阳映出他们长长的影子。\n\n沿着高高的平台，南仁东和凼凼踏上了高高的圈梁。这是大射电望远镜的最高处。在这里，这个有 30 个足球场那么大的超级望远镜球冠反射面一览无余。\n\n从这里往下看有多高？“中国天眼”从底部到顶部垂直高度 138 米，是国家体育场“鸟巢”垂直高度的两倍，也超过了埃及胡夫金字塔现在的高度——约 137 米。胡夫金字塔底座边长约 230 米，“中国天眼”的口径 500 米。它不仅是世界上最大的望远镜，也是地球上的伟大建筑！\n\n多么壮观啊，“中国天眼”！火红的夕阳在巨大的球冠反射面上反射出万道金光，绚丽无比。在给青少年讲课时，南仁东回忆过自己学生时代经常朗读的毛泽东主席的一段话：“世界是你们的，也是我们的，但是归根结底是你们的。你们青年人朝气蓬勃，正在兴旺时期，好像早晨八九点钟的太阳。希望寄托在你们身上。”毛主席说这段话时，南仁东 12 岁。如今，胡须花白的南仁东在夕阳下泪流满面。\n\n这一年，南仁东 71 岁。\n\n他的同事和学生看到他双手扶在“天眼”圈梁的栏杆上，俯身朝下……他的串串泪珠滴下来，从高高的圈梁上落向那金光闪闪的望远镜……应该有电影镜头来追踪那下落的泪珠，泪珠飞向世界最大的望远镜，滴下来，滴下来，滴下来……最后雨点般敲打在那伟大的镜面上，溅起细碎的水花，发出金属般的绝响。人们看见了吗？听见了吗？晚霞浸染的群山看见了！高远的天穹看见了！广袤的宇宙听见了！\n\n2017 年 9 月 15 日，南仁东逝世，享年 72 岁。\n\n2018 年 10 月 15 日，经国际天文学联合会小天体命名委员会批准，国际永久编号第 79694 号的小行星被命名为“南仁东星”。\n\n南仁东，那个曾经爱看星星的少年，变成了让无数少年仰望的星星。", "exam": [], "notes": [{ "k": "a", "text": "〔瞠（chēng）目结舌〕瞪着眼睛说不出话来，形容受窘或惊呆的样子。每一根头发“都是竖着的”，这是一种怎样的精神状态！" }] },

      "美丽的颜色": { "intro": "艾芙·居里传记节选，写居里夫人提炼镭的艰辛与科学之美。", "full": "玛丽·斯可罗多夫斯卡的学生生活中最愉快的时期，是在顶楼里度过的；玛丽·居里现在又要在一个残破的小屋里，尝到新的极大的快乐了。这是一种奇异的新的开始，这种艰苦而且微妙的快乐（无疑地在玛丽以前没有一个女人体验过），两次都挑选了最简陋的布景。\n\n娄蒙路的棚屋，可以说是不舒服的典型。在夏天，因为棚顶是玻璃的，棚屋里面燥热得像温室。在冬天，简直不知道是应该希望下霜还是应该希望下雨。若是下雨，雨水就以一种令人厌烦的轻柔声音，一滴一滴地落在地上，落在工作台上，落在这两个物理学家标上记号永远不放仪器的地方；若是下霜，就连人都冻僵了，没有方法补救。那个炉子即使把它烧到炽热的程度，也令人完全失望。走到差不多可以碰着它的地方，才能感受一点儿暖气，可是离开一步，立刻就回到寒带去了。\n\n然而，玛丽和皮埃尔更要习惯忍受室外的严寒。他们炼制沥青铀矿的设备极其简陋，由于没有把有害气体排出去的“通风罩”，炼制的大部分工作就必须在院子的露天地里进行。每逢骤雨猝至，这两位物理学家就匆忙把设备搬进棚屋，大开着门窗让空气流通，以便继续工作，而不至于因烟窒息。\n\n这种极特殊的治疗结核症的方法，玛丽多半没有对佛提埃大夫吹嘘过！\n\n后来她写过这样一段话：“我们没有钱，没有实验室，而且几乎没有人帮助我们把这件既重要而又困难的工作做好。这像是要由无中创出有来。假如我过学生生活的几年是卡西密尔·德卢斯基从前说的‘我的姨妹一生中的英勇岁月’，我可以毫不夸大地说，现在这个时期是我丈夫和我的共同生活中的英勇时期。\n\n“……然而我们生活中最美好而且最快乐的几年，还是在这个简陋的旧棚屋中度过的，我们把精力完全用在工作上。我常常就在那里做我们吃的饭，以便某种特别重要的工序不至于中断。有时候我整天用差不多和我一般高的铁条，搅动一大堆沸腾着的东西。到了晚上，简直是筋疲力尽。”\n\n从1898年到1902年，居里先生和夫人就是在这种条件之下工作的。\n\n第一年里，他们共同从事镭和钋的化学离析工作，并且研究他们所得到的活性产物的放射性。不久，他们认为分工的效率比较高，皮埃尔便试着确定镭的特性，以求熟悉这种新金属。玛丽继续炼制，提取纯镭盐。\n\n在这种分工中，玛丽选了“男子的职务”，做的是壮工的工作。她的丈夫在棚屋里专心做细致的实验。玛丽在院子里穿着满是尘污和酸渍的旧工作服，头发被风吹得飘起来，周围的烟刺激着眼睛和咽喉。\n\n她独自一个人就是一家工厂。\n\n她写道：“我一次炼制20公斤材料，结果是棚屋里放满了装着沉淀物和溶液的大瓶子。搬运容器，移注溶液，连续几小时搅动熔化锅里沸腾着的材料，这真是一种极累人的工作。”\n\n但是镭要保持它的神秘性，丝毫不希望人类认识它。玛丽从前很天真地预料沥青铀矿的残渣里含有百分之一的镭，那个估计现在到哪里去了？这种新物质的放射性极强，极少量的镭散布在矿石中，就是一些触目的现象的来源，很容易观察或测量。最困难的，或者说几乎不可能的，乃是离析这极小含量的物质，使它从与它密切混合着的杂质中分离出来。\n\n工作日变成了工作月，工作月变成了工作年，皮埃尔和玛丽并没有失掉勇气。这种抵抗他们的材料迷住了他们。他们之间的柔情和他们智力上的热情，把他们结合在一起；他们在这个木板屋里过着“反自然”的生活，他们彼此一样，都是为了过这种生活而降生的。\n\n玛丽后来写道：“感谢这种意外的发现，在这个时期里，我们完全被那展开在我们面前的新领域吸引住了。虽然我们的工作条件带给我们许多困难，但是我们仍然觉得很快乐。我们的时光就在实验室里度过。在我们十分可怜的棚屋里笼罩着极大的宁静；有时候我们来回踱着，一面密切注意着某种实验的进行，一面谈着目前和将来的工作。觉得冷的时候，我们在炉旁喝一杯热茶，就又舒服了。我们在一种独特的专心景况中过日子，像是在梦里一样。\n\n“……我们在实验室里只有很少的几个客人。偶尔有几位物理学家或化学家来，或是来看我们的实验，或是来请教皮埃尔·居里某些问题，他在物理学的许多分支领域，是很出名的。他们就在黑板前谈话，这种谈话给人留下了清晰的记忆，因为它们是科学兴趣和工作热情的一种提神剂，并不打断思考的进程，也不扰乱平静专注的空气，这是实验室的真正气氛。”\n\n皮埃尔和玛丽有时候离开仪器，平静地闲谈一会儿，他们谈的总是他们所迷恋的镭，说的话由极高深的到极幼稚的，无一不有。\n\n有一天，玛丽像期盼别人已经答应给的玩具的小孩一样，怀着热切的好奇心说：“我真想知道‘它’会是什么样子，它的相貌如何。皮埃尔，在你的想象中，它是什么形状？”\n\n这个物理学家和颜悦色地回答：“我不知道……你可以想到，我希望它有很美丽的颜色。”\n\n…………\n\n那天他们工作得很辛苦，照道理这两位学者此刻应该休息了。但是皮埃尔和玛丽并不总是照道理行事。他们穿上外衣，告诉居里大夫说他们要出去，就溜走了……他们挽臂步行，话说得很少。沿着这个远离市中心的街区的热闹街道，走过工厂、空地和不讲究的住房。他们到了娄蒙路，穿过院子，皮埃尔把钥匙插入锁孔，那扇门嘎嘎地响着（它已经这样响过几千次了），他们走进他们的领域，走进他们的梦境。\n\n玛丽说：“不要点灯！”接着轻轻地笑了笑，再说：“你记得你对我说‘我希望它有很美丽的颜色’的那一天吗？”\n\n几个月以来使皮埃尔和玛丽入迷的镭的真相，实际上比他们以前天真地希望着的样子还要可爱。镭不只有“美丽的颜色”，它还自动发光！在这个黑暗的棚屋里没有柜子，这些零星的宝贝装在极小的玻璃容器里，放在钉在墙上的板子或桌子上；它们那些略带蓝色荧光的轮廓闪耀着，悬在夜的黑暗中。\n\n“看哪……看哪！”这位年轻妇人低声说着。\n\n她小心翼翼地走上前去找，找到一张有草垫的椅子，坐下了。在黑暗中，在寂静中，两个人的脸都转向这些微光，转向这射线的神秘来源，转向镭，转向他们的镭！玛丽身体前倾，热切地望着，她此时的姿势，就像一小时前在她睡着了的孩子床头看着孩子一样。\n\n她的伴侣用手轻轻地抚摸她的头发。\n\n她永远记得看荧光的这一晚，永远记得这种神妙世界的奇观。", "exam": [], "notes": [{ "k": "a", "text": "节选自《居里夫人传》第二卷第十三章《棚屋中的四年》（商务印书馆1984年版）。左明彻译。有删改。题目为编者所加。居里夫人（1867—1934），法国物理学家、化学家，原籍波兰，先后获1903年诺贝尔物理学奖和1911年诺贝尔化学奖。艾芙·居里（1904—2007），居里夫人的次女。" }, { "k": "b", "text": "〔玛丽·斯可罗多夫斯卡〕居里夫人的原名，婚后随丈夫皮埃尔·居里（1859—1906）的姓，改为玛丽·居里。" }, { "k": "c", "text": "〔娄蒙路〕巴黎工业物理化学学校所在的街道。皮埃尔·居里当时在该校任教。" }, { "k": "d", "text": "〔下霜〕巴黎的气候属温带海洋性气候，冬季多雨，有时也会下霜。" }, { "k": "e", "text": "〔猝（cù）〕突然。" }, { "k": "f", "text": "〔窒（zhì）息〕因缺氧或呼吸系统障碍，导致呼吸困难甚至停止呼吸。" }, { "k": "a", "text": "〔吹嘘（xū）〕夸张地宣扬。" }, { "k": "b", "text": "〔镭（léi）〕金属元素，符号Ra，有放射性。" }, { "k": "c", "text": "〔钋（pō）〕金属元素，符号Po，有放射性。" }, { "k": "d", "text": "〔离析〕这里指一种从矿石中提取金属的方法。" }, { "k": "e", "text": "〔镭盐〕学名氯（lǜ）化镭，是第一种人工获得的镭化合物。" }, { "k": "a", "text": "〔踱（duó）〕慢步行走。b〔景况〕情况。居里夫妇" }, { "k": "a", "text": "〔居里大夫〕即欧仁·居里，皮埃尔·居里的父亲，是一位医生。" }, { "k": "b", "text": "〔略带蓝色荧光的轮廓〕纯净的镭是银白色的，居里夫妇于1902年提取出的是氯化镭。氯化镭是白色固体，其中的镭会产生辐射，使装它的玻璃容器产生蓝色荧光。" }] },

      "三峡": { "intro": "郦道元《水经注》节选，写三峡四季景色与雄奇险峻。", "full": "自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。\n至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。\n春冬之时，则素湍绿潭，回清倒影，绝巘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。\n每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”", "exam": [], "notes": [{ "k": "a", "text": "节选自《水经注·江水》（《水经注校证》卷三十四，中华书局2007年版）。题目为编者所加。三峡，瞿塘峡、巫峡和西陵峡的总称，在长江上游重庆奉节与湖北宜昌之间。郦道元（约470—527），字善长，范阳涿（zhuō）县（今河北涿州）人，北魏地理学家。《水经》是中国第一部记述河道水系的专著，郦道元所撰《水经注》，名为注释《水经》，实则以《水经》为纲，广为补充发展，自成巨著。全书详细记载了一千多条大小河流及有关的历史遗迹、人物掌故、神话传说等，是我国古代地理名著，并具有较高的文学价值。由于当时南北分裂，此书记北方河流，综合运用了文献资料与作者实地考察的成果；涉及南方江河，则博采他人记述，精心选择，细致加工，汇聚成文。" }, { "k": "b", "text": "〔自〕这里是“在”的意思。" }, { "k": "c", "text": "〔两岸连山，略无阙处〕两岸都是相连的山峰，全然没有中断的地方。略无，完全没有。阙，同“缺”，空隙、缺口。" }, { "k": "d", "text": "〔岩〕山峰，山崖。" }, { "k": "e", "text": "〔嶂〕直立似屏障的山峰。" }, { "k": "f", "text": "〔自非〕如果不是。" }, { "k": "g", "text": "〔亭午〕正午。" }, { "k": "h", "text": "〔夜分〕半夜。" }, { "k": "i", "text": "〔曦（xī）月〕日月。曦，日光，这里指太阳。" }, { "k": "j", "text": "〔夏水〕指夏天的江水。" }, { "k": "k", "text": "〔襄（xiāng）陵〕水漫上山陵。襄，冲上、漫上。陵，山陵。" }, { "k": "l", "text": "〔沿溯（sù）阻绝〕意思是下行和上行的航道都被阻断，不能通航。沿，顺流而下。溯，逆流而上。" }, { "k": "m", "text": "〔白帝〕古城名，故址在今重庆奉节东瞿塘峡口。" }, { "k": "n", "text": "〔江陵〕古城名，在今湖北荆州。" }, { "k": "o", "text": "〔虽〕即使。" }, { "k": "p", "text": "〔奔〕这里指飞奔的马。" }, { "k": "q", "text": "〔御风〕乘风飞行。" }, { "k": "r", "text": "〔不以疾〕没有这么快。" }, { "k": "a", "text": "〔素湍〕激起白色浪花的急流。湍，急流。" }, { "k": "b", "text": "〔回清〕回旋的清波。" }, { "k": "c", "text": "〔绝（yǎn）〕极高的山峰。" }, { "k": "d", "text": "〔飞漱（shù）〕飞速地往下冲荡。" }, { "k": "e", "text": "〔清荣峻茂〕水清树茂，山高草盛。荣，茂盛。" }, { "k": "f", "text": "〔良〕甚，很。" }, { "k": "g", "text": "〔晴初〕天刚放晴。" }, { "k": "h", "text": "〔霜旦〕下霜的早晨。" }, { "k": "i", "text": "〔肃〕肃杀，凄寒。" }, { "k": "j", "text": "〔属（zhǔ）引〕接连不断。属，连接。引，延长。" }, { "k": "k", "text": "〔凄异〕凄惨悲凉。" }, { "k": "l", "text": "〔响〕回声。" }, { "k": "m", "text": "〔哀转〕声音悲凉婉转。" }, { "k": "n", "text": "〔巴东〕今重庆东部云阳、奉节、巫山一带。春冬之时，则素湍" }] },

      "与朱元思书": { "intro": "吴均骈文，写富春江山水之美，寄寓避世脱俗之志。", "full": "风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。\n水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。\n夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。", "exam": [], "notes": [{ "k": "a", "text": "选自《吴均集校注》（浙江古籍出版社2005年版）。吴均（469—520），字叔庠（xiáng），吴兴故鄣（zhāng）（今浙江安吉）人，南朝梁文学家。" }, { "k": "b", "text": "〔共色〕同样的颜色。" }, { "k": "c", "text": "〔从流飘荡〕（乘船）随着江流漂荡。从，跟、随。" }, { "k": "d", "text": "〔任意东西〕意思是任凭船随意向东或向西漂流。东西，向东或向西（漂流）。" }, { "k": "e", "text": "〔许〕表示约数。" }, { "k": "f", "text": "〔缥（piǎo）碧〕浅青色。" }, { "k": "g", "text": "〔甚箭〕即“甚于箭”，意思是比箭还快。甚，超过、胜过。" }, { "k": "h", "text": "〔寒树〕浓密的树木，使人看了有寒凉之意。" }, { "k": "i", "text": "〔负势竞上〕（山峦）凭借（高峻的）地势，争着向上。" }, { "k": "j", "text": "〔互相轩邈（miǎo）〕意思是这些山峦仿佛都在争着往高处远处伸展。轩，高。邈，远。这里均作动词用。" }, { "k": "k", "text": "〔直指〕笔直地指向云天。" }, { "k": "l", "text": "〔千百成峰〕形成千百座山峰。" }, { "k": "m", "text": "〔激〕冲击，撞击。" }, { "k": "n", "text": "〔泠（líng）泠〕拟声词，形容水声清越。" }, { "k": "o", "text": "〔嘤（yīng）嘤成韵〕鸣声嘤嘤，和谐动听。嘤嘤，鸟鸣声。" }, { "k": "p", "text": "〔千转（zhuàn）〕长久不断地叫。千，表示多。转，同“啭”，鸟鸣，这里指蝉鸣。" }, { "k": "a", "text": "〔鸢（yuān）飞戾（lì）天〕语出《诗经·大雅·旱麓》。意为鸢鸟飞到天上，这里比喻极力追求名利。鸢，俗称老鹰，凶猛而善高飞。戾，至、到达。" }, { "k": "b", "text": "〔息心〕指平息名利之心。" }, { "k": "c", "text": "〔经纶（lún）世务〕筹划人世间的俗务。经纶，筹划、治理。" }, { "k": "d", "text": "〔反〕同“返”，返回。" }, { "k": "e", "text": "〔横柯（kē）〕横斜的树枝。柯，树木的枝干。" }, { "k": "f", "text": "〔交映〕互相掩映。《富春山居图》（局部）〔元〕黄公望作思考·探究·积累一朗读并背诵课文。说一说，文中所写的山水“独绝”在哪里？二面对富春江的“奇山异水”，作者有什么样的感想？你如何理解这种感想？三解释下列加点的词，并指出其用法。1.任意东西" }] },
