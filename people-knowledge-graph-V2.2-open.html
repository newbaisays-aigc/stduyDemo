      // ===== 顶层 AI 矫正函数（供段头按钮与编辑态共用） =====

      function aiFixSegHtml(html) {

        let text = String(html)

          .replace(/<br\s*\/?\s*>/gi, "\n")

          .replace(/<div[^>]*>/gi, "\n").replace(/<\/div>/gi, "")

          .replace(/<p[^>]*>/gi, "").replace(/<\/p>/gi, "\n")

          .replace(/<b[^>]*>/gi, "**").replace(/<\/b>/gi, "**")

          .replace(/<[^>]+>/g, "")

          .replace(/&nbsp;/g, " ");

        // 合并多余空格、去汉字间空格

        text = text.replace(/[ \t\u00a0\u3000]+/g, " ").replace(/([\u4e00-\u9fff]) ([\u4e00-\u9fff])/g, "$1$2");

        // 标点前的多余空格清理（如「，」前留空格、句号前空格）

        text = text.replace(/\s+([，。！？；：、.．,])/g, "$1");

        // 半角标点转全角（仅当紧跟在汉字后，避免影响数字、英文、** 加粗标记）

        text = text.replace(/([\u4e00-\u9fff\u3000])[,.]/g, (m, c) =>

          m.endsWith(",") ? c + "，" : c + "。"

        );

        text = text.replace(/([\u4e00-\u9fff\u3000])\?/g, "$1？")

          .replace(/([\u4e00-\u9fff\u3000])!/g, "$1！")

          .replace(/([\u4e00-\u9fff\u3000]);/g, "$1；")

          .replace(/([\u4e00-\u9fff\u3000]):/g, "$1：");

        // ==== 按条形序号重排换行（识别 数字. / 数字、 （数字） 等并列条目）====

        text = (function reorder(t) {

          // 识别条目标记（阿拉伯序号 / 中文数字序号 / 圈码 / 字母序号）

          // 中文数字如：一、二、三…… 十、（一）（二）……

          const cnNum = "一二三四五六七八九十百零两";   // 纯字符，拼接时再包方括号

          const itemStart = new RegExp(

            "(?:\\d{1,3}\\s*[.、．)]|" +          // 1. 1、 1)

            "[（(]\\d{1,3}[）)]|" +                 // （1） (2)

            "[" + cnNum + "]+[、．]|" +            // 二、 三．

            "[（(][" + cnNum + "]+[）)]|" +         // （一） (二)

            "[①②③④⑤⑥⑦⑧⑨⑩]|" +                // 圈码

            "[A-Z]\\s*[.、)]" +                    // A. A、

            ")"

          );

          // hasItem：出现"条目标记 + 文字"即认为包含序号条目

          const hasItem = itemStart.test(t.replace(/……/g, "")) ||

            /[。！？；.!?)\n][ ]*\d{1,3}\s*[.、．)]/.test(t);

          if (hasItem) {

            // 步骤1：一行内部，"句子结束标点"紧跟下一个阿拉伯条目标记时补换行

            //        例：……千百成峰。5.《……》 -> ……千百成峰。\n5.《……》

            t = t.replace(/([。！？！；;…　,])[ ]*(\d{1,3})\s*[.、)．](?=\s*[a-zA-Z0-9\u4e00-\u9fff《（【{])/g, (m, p, d) => p + "\n" + d + ".");

            // 连续数字条目标记分行：形如「……（…）2. 虽：…3. 奔：…」挤在同一行的条目，

            //   当某条结束（右括号/分号/逗号/冒号/顿点/句末标点）后紧跟下一个「数字.」且该条目前无换行时补换行，

            //   使每条独占一行（数字后必须是中文/书名号/字母，排除小数 3.14、日期 5. 等）

            t = t.replace(/([）);；，、。…：：:．.])\s*(\d{1,3})\.(?=\s*[\u4e00-\u9fff（《A-Za-z])/g, (m, p, d) => p + "\n" + d + ".");

          }

          // 小节分隔「›」分行：形如「…（属于）› 词类活用：」中，› 直接紧贴前一个非空白字符时补换行；

          //   若 › 前已紧跟换行/空行（小节之间已分段，如 \n\n›）则保留原空行，不压缩

          t = t.replace(/([^\s\n])›/g, (m, pre) => pre + "\n›");

          // 预处理：独立数字行(^\d{1,3}$)标签 + 下一行词条 → 合并为「1. 词条」，

          //   避免后面的"错断行合并"把 标题/数字/词条 错并成一行

          const rawT = t.split("\n");

          const merged = [];

          for (let i = 0; i < rawT.length; i++) {

            const line = rawT[i];

            const nx = rawT[i + 1];

            if (/^\s*\d{1,3}\s*$/.test(line) && nx !== undefined && nx.trim()) {

              const nxs = nx.trim();

              // 下一行是"短标题候选"（无冒号、无中缀标点、较短，如「多音字注音并组词」）→ 合并为一级标题 ## N. 标题

              if (!nxs.includes("：") && !nxs.includes(":") && !/[，。；、！？]/.test(nxs) && nxs.length <= 24) {

                merged.push("## " + line.trim() + ". " + nxs);

              } else {

                merged.push(line.trim() + ". " + nxs);   // 数字条目

              }

              i++;

            } else {

              merged.push(line);

            }

          }

          t = merged.join("\n");

          // 步骤2：合并句子中间的错误断行——若某行不以句子结束标点收尾、且下一行不是新条目标记/大写英文开头，

          //        且该行不是"独立的条目标记短标题/标签行"，则视为同一句被硬断行，拼回上一行（去掉换行）

          const lines = t.split("\n");

          const out = [];

          for (let i = 0; i < lines.length; i++) {

            const ln = lines[i];

            const nxt = lines[i + 1];

            const endsPunct = /[。！？！；;.!?…」』】）…]$/.test(ln);

            // 下一行是否为新的条目标记（含中文数字序号/圈码/字母）

        const hasLocalAnswer = /(^|\n)\s*答案\s*[:：]/.test(qText);
        btn.textContent = `🤖 分析中…（第 ${i + 1}/${total} 题）${hasLocalAnswer ? "（补解析）" : ""}`;

          results.push(hasLocalAnswer ? mergeExplain(qText, aiOut) : mergeQuestion(stripLocalAnswers(qText), aiOut));

      }

                  + '</div>'
                  + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">'
                  + '<label style="font-size:11px;color:var(--muted)">领域<input data-qb-f="domain" value="' + escQ((q.meta && q.meta.domain) || q.domain || "") + '" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>'
                  + '<label style="font-size:11px;color:var(--muted)">知识点<input data-qb-f="knowledgePoints" value="' + escQ(((q.meta && q.meta.knowledgePoints) || q.knowledgePoints || q.tags || []).join("、")) + '" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>'
                  + '<label style="font-size:11px;color:var(--muted)">能力点<input data-qb-f="skills" value="' + escQ(((q.meta && q.meta.skills) || q.skills || []).join("、")) + '" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>'
                  + '</div>'
                  + '</div>'
                : '<div style="font-size:12px;color:var(--muted)">题干</div><textarea data-qb-f="' + idp + 'stem" style="width:100%;box-sizing:border-box;min-height:52px;font:inherit">' + escQ(q.stem) + '</textarea>'
                  + '<div style="font-size:12px;color:var(--muted)">选项(A．× B．× …，每题一行)</div><textarea data-qb-f="' + idp + 'options" style="width:100%;box-sizing:border-box;min-height:40px;font:inherit">' + escQ((q.options || []).map(questionOptionText).join("\n")) + '</textarea>'
                  + '<div style="font-size:12px;color:var(--muted)">答案</div><textarea data-qb-f="' + idp + 'answer" style="width:100%;box-sizing:border-box;min-height:36px;font:inherit">' + escQ(questionAnswerText(q.answer)) + '</textarea>'
                  + '<div style="font-size:12px;color:var(--muted)">解析</div><textarea data-qb-f="' + idp + 'analysis" style="width:100%;box-sizing:border-box;min-height:36px;font:inherit">' + escQ(q.analysis) + '</textarea>'
                  + '<div style="font-size:12px;color:var(--muted)">标签(顿号分隔)</div><input data-qb-f="' + idp + 'tags" value="' + escQ((q.tags || []).join("、")) + '" style="width:100%;box-sizing:border-box;font:inherit">'
                  + '<div style="font-size:12px;color:var(--muted)">难度</div><select data-qb-f="' + idp + 'diff">' + [1,2,3,4,5].map(function (n) { return '<option value="' + n + '"' + ((q.difficulty || 3) === n ? " selected" : "") + '>' + n + '</option>'; }).join("") + '</select>')
              + '</fieldset>';
          }).join("");
          bodyEl.innerHTML = '<div class="qb-struct-wrap" style="border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff">'
            + '<div class="qb-struct-title"><div style="font-size:12px;color:var(--muted)">字段分层编辑：结构化单题，保存写回题库结构</div></div>'
            + '<div class="qb-struct-main">' + form + '</div>'
            + '<div class="qb-struct-actions">'
            + '<button class="save-btn" data-qb-struct-save="' + si + '" type="button">保存</button>'

            + '<span style="font-size:11px;color:var(--muted)">解析出 ' + qs.length + ' 题</span>'
            + '</div></div>';
          var saveBtn = bodyEl.querySelector('[data-qb-struct-save="' + si + '"]');
          if (saveBtn) saveBtn.onclick = function () {
            if (saveBtn.dataset.saving === "1") return;
            saveBtn.dataset.saving = "1";
            var oldSaveText = saveBtn.textContent;
            saveBtn.disabled = true;
            saveBtn.textContent = "保存中…";
            try {
              var built = qs.map(function (q, qi) {
                var gid = function (n) { var el = bodyEl.querySelector('[data-qb-f="qb-st-' + si + '-' + qi + '-' + n + '"]'); return el ? el.value : ""; };
                var pickedType = String(gid("type") || q.type || "short_answer").trim();
                return {
                  id: q.id,
                  displayId: gid("id").trim() || q.displayId || q.id,
                  type: pickedType,
                  questionType: pickedType === "essay" ? "作文" : q.questionType,
                  questionTitle: gid("questionTitle").trim(),
                  articleTitle: gid("articleTitle").trim(),
                  stem: gid("stem"),
                  options: gid("options").split("\n").map(function (s) { return s.trim(); }).filter(Boolean),
                  answer: gid("answer"),
                  analysis: gid("analysis").trim(),
                  tags: gid("tags").split(/[、,，\s]+/).map(function (s) { return s.trim(); }).filter(Boolean),
                  difficulty: Number(gid("diff")) || 3
                };
              });
              segCustomMap[si] = questionsToMarkdown(built);
              localStorage.setItem(QB_SEG_KEY, JSON.stringify(segCustomMap));
              var stored = localStorage.getItem(QB_SEG_KEY);
              if (!stored) throw new Error("本地数据写入后无法读取");
              saveExamStructureBackend();
              qbShowToast("✅ 已保存结构化修改（包含难度设置）。", false);
              renderQBView();
            } catch (e) {
              saveBtn.disabled = false;
              saveBtn.dataset.saving = "";
              saveBtn.textContent = oldSaveText;
              qbShowToast("⚠️ 保存失败：" + (e && e.message || e), true);
            }
          };
          var cancelBtn = bodyEl.querySelector('[data-qb-struct-cancel="' + si + '"]');
          if (cancelBtn) cancelBtn.onclick = function () { renderQBView(); };
        };
      });

      // 结构化按钮旁的快捷入口：添加只创建空白条目，结构化按钮只编辑原条目。
      body.querySelectorAll("[data-qb-struct-add-entry]").forEach(addBtn => {
        addBtn.onclick = function (e) {
          e.stopPropagation();
          if (addBtn.dataset.busy === "1") return;
          addBtn.dataset.busy = "1";
          const info = renderSegAt(addBtn.dataset.qbStructAddEntry);
          const si = info ? info.realSi : -1;
          const viewSi = info ? info.viewSi : -1;
          const seg = info ? info.seg : null;
          const wrap = body.querySelector('[data-qb-seg="' + viewSi + '"]');
          const bodyEl = wrap ? wrap.querySelector(".qb-seg-body") : null;
          if (!seg || !bodyEl) {
            qbShowToast("⚠️ 当前位置暂时不能添加题目，请换到题目或材料段后重试。", true);
            addBtn.dataset.busy = "";
            return;
          }
          const existingAddEditor = wrap.querySelector("[data-qb-add-editor]");
          if (existingAddEditor) {
            qbShowToast("当前已经在结构化编辑中，请先保存或取消后再添加新题。", true);
            setTimeout(function () { addBtn.dataset.busy = ""; }, 300);
            return;
          }
          const storageSi = si >= 0 ? si : viewSi;
          const cur = effectiveTextForSegment(seg, si);
           const existing = dedupeQuestionItems(parseQuestions(dedupeQuestionBlocks(cur)).filter(function (q) {
             return q.answer || (q.options && q.options.length >= 2) || /＿+|_{3,}|____/.test(q.stem) || q.questionTitle || q.articleTitle || isQuestionPlaceholder(q);
           }));
          const shouldAddRawEntry = qbSource === "bk8";
          if (shouldAddRawEntry) {
            const editorEl = document.createElement("div");
            editorEl.setAttribute("data-qb-add-editor", String(storageSi));
            editorEl.style.marginBottom = "12px";
            bodyEl.parentNode.insertBefore(editorEl, bodyEl);
            editorEl.innerHTML = '<div class="qb-struct-wrap">'
              + '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px">'
              + '<div style="font-size:12px;color:var(--muted)">新增内容：保存后会插入到当前条目上方，原内容自动下移。</div>'
              + '<span style="font-size:11px;color:var(--muted)">适用于知识点、正文、阅读资料补充</span>'
              + '</div>'
              + '<input data-qb-raw-add-title="' + storageSi + '" placeholder="可选：标题/小节名" style="width:100%;box-sizing:border-box;font:inherit;margin-bottom:8px">'
              + '<textarea data-qb-raw-add-body="' + storageSi + '" placeholder="输入新增内容" style="width:100%;box-sizing:border-box;min-height:38vh;font:inherit;line-height:1.8;white-space:pre-wrap"></textarea>'
              + '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">'
              + '<button class="save-btn" data-qb-raw-add-save="' + storageSi + '" type="button">保存新增内容</button>'
              + '<button type="button" data-qb-raw-add-cancel="' + storageSi + '">取消</button>'
              + '</div></div>';
            const saveRawBtn = editorEl.querySelector('[data-qb-raw-add-save="' + storageSi + '"]');
            if (saveRawBtn) saveRawBtn.onclick = function () {
              if (saveRawBtn.dataset.saving === "1") return;
              saveRawBtn.dataset.saving = "1";
              saveRawBtn.disabled = true;
              saveRawBtn.textContent = "保存中…";
              try {
                const titleInput = editorEl.querySelector('[data-qb-raw-add-title="' + storageSi + '"]');
                const bodyInput = editorEl.querySelector('[data-qb-raw-add-body="' + storageSi + '"]');
                const titleText = String(titleInput ? titleInput.value : "").replace(/\r\n/g, "\n").trim();
                const bodyText = String(bodyInput ? bodyInput.value : "").replace(/\r\n/g, "\n").trim();
                const nextEntry = [titleText, bodyText].filter(Boolean).join("\n").trim();
                if (!nextEntry) throw new Error("新增内容不能为空");
                segCustomMap[si] = [nextEntry, cur].filter(Boolean).join("\n\n");
                localStorage.setItem(QB_SEG_KEY, JSON.stringify(segCustomMap));
                if (localStorage.getItem(QB_SEG_KEY) == null) throw new Error("本地数据写入后无法读取");
                saveExamStructureBackend();
                qbShowToast("✅ 已新增内容并保存。", false);
                if (editorEl.parentNode) editorEl.parentNode.removeChild(editorEl);
                renderQBView();
              } catch (err) {
                saveRawBtn.disabled = false;
                saveRawBtn.dataset.saving = "";

              }

            };
            setTimeout(function () { addBtn.dataset.busy = ""; }, 300);
            return;

          const blank = createBlankQuestion(existing);
          const newQuestionNumber = questionOffsetBefore(viewSi) + questionCountForSegment(seg, viewSi) + 1;

          const editorEl = document.createElement("div");
          editorEl.setAttribute("data-qb-add-editor", String(storageSi));
          editorEl.style.marginBottom = "12px";
          bodyEl.parentNode.insertBefore(editorEl, bodyEl);
          renderQuestionStructOrganizer(editorEl, [blank], storageSi, segCustomMap, QB_SEG_KEY, function () {
            if (editorEl.parentNode) editorEl.parentNode.removeChild(editorEl);
            renderQBView();
          }, Object.assign({}, organizerOptionsFor(viewSi, seg), {
            addOnly: true,
            displayOffset: Math.max(0, newQuestionNumber - 1),
            existingItems: existing,
            onSaveQuestionItems: function (items) {
              const nextItems = (items || []).map(function (q) {
                return normalizeQuestionStructure(q || {}, { rawFormat: "markdown" });
              });
              const text = questionsToMarkdown(nextItems, { compact: true, startNumber: newQuestionNumber });
              const firstItem = nextItems[0] || {};

              const record = {
                id: recordId,
                displayId: "Q" + String(newQuestionNumber).padStart(3, "0"),
                title: String(newQuestionNumber) + "．",
                text: text,
                before: seg && Number.isFinite(Number(seg.start)) ? Number(seg.start) : 1e9
              };
              questionInserts.push(record);
              localStorage.setItem(QB_QUESTION_INSERTS_KEY, JSON.stringify(questionInserts));
              if (localStorage.getItem(QB_QUESTION_INSERTS_KEY) == null) throw new Error("本地新增题目数据写入后无法读取");
              placeSegmentOrderAfter("question:" + record.id, viewSi);
              markExamStructureSync();
              saveExamStructureBackend();
            },
          }));
          setTimeout(function () { addBtn.dataset.busy = ""; }, 300);
        };

      body.querySelectorAll("[data-qb-struct-add-material]").forEach(addBtn => {
        addBtn.onclick = function (e) {
          e.stopPropagation();
          if (addBtn.dataset.busy === "1") return;
          addBtn.dataset.busy = "1";
          try {
            const info = renderSegAt(addBtn.dataset.qbStructAddMaterial);
            const viewSi = info ? info.viewSi : -1;
            const seg = info ? info.seg : null;
            const wrap = body.querySelector('[data-qb-seg="' + viewSi + '"]');
            const bodyEl = wrap ? wrap.querySelector(".qb-seg-body") : null;
            if (!seg || !bodyEl) {
              qbShowToast("⚠️ 当前位置暂时不能添加材料，请换到题目或材料段后重试。", true);
              return;
            }
            if (wrap.querySelector("[data-qb-add-editor]")) {
              qbShowToast("当前已经在结构化编辑中，请先保存或取消后再添加材料。", true);
              return;
            }
            const model = {
              kind: "reading_context",
              title: "阅读材料",
              guide: "阅读下面材料，完成后面题目。",
              body: "阅读材料正文待补充",

              editorKey,

              QB_CONTEXT_JSON_PREFIX + JSON.stringify(model),
              segCustomMap,
              QB_SEG_KEY,
              function () {
                if (editorEl.parentNode) editorEl.parentNode.removeChild(editorEl);
                renderQBView();
              },
              Object.assign({}, organizerOptionsFor(viewSi, seg), {
                onSaveContextModel: function (nextModel) {
                  const item = {
                    id: "context-" + Date.now() + "-" + Math.floor(Math.random() * 10000),
                    before: seg && Number.isFinite(Number(seg.start)) ? Number(seg.start) : 1e9,
                    title: nextModel.title || "阅读材料",
                    model: nextModel,
                    text: realExamContextStructureText(nextModel)
                  };
                  contextInserts.push(item);
                  localStorage.setItem(QB_CONTEXT_INSERTS_KEY, JSON.stringify(contextInserts));
                  if (localStorage.getItem(QB_CONTEXT_INSERTS_KEY) == null) throw new Error("本地新增材料数据写入后无法读取");
                  placeSegmentOrderAfter("context:" + item.id, viewSi);
                  markExamStructureSync();
                  saveExamStructureBackend();
                }
              })
            );
          } catch (err) {
            qbShowToast("⚠️ 新增材料失败：" + (err && err.message || err), true);
          } finally {
            setTimeout(function () { addBtn.dataset.busy = ""; }, 300);
          }
        };
      });

      // 删除当前题目段：用本地删除标记保存，不改动原始数据文件；刷新后仍保持删除。
      body.querySelectorAll("[data-qb-struct-delete-entry]").forEach(delBtn => {
        delBtn.onclick = function (e) {
          e.stopPropagation();
          const info = renderSegAt(delBtn.dataset.qbStructDeleteEntry);
          const si = info ? info.realSi : -1;
          const seg = info ? info.seg : null;
          if ((!Number.isFinite(si) || si < 0) && !(seg && (seg.__questionExtra || seg.__contextExtra))) return;
          const isKnowledgeDelete = qbSource === "bk8";
          const isContextDelete = !!(seg && (seg.__contextExtra || (qbSource === "realexam" && seg.head && seg.head.realExamContext)));
          const deleteMessage = isKnowledgeDelete
            ? "确定删除当前知识/正文条目吗？删除后可通过清除本地题库缓存恢复。"
            : isContextDelete
            ? "确定删除当前阅读材料吗？删除后可通过清除本地题库缓存恢复。"
            : "确定删除当前这条题目吗？删除后可通过清除本地题库缓存恢复。";
          if (!window.confirm(deleteMessage)) return;
          if (seg && seg.__contextExtra) {
            const idx = seg.__contextExtraIndex;
            if (idx >= 0 && contextInserts[idx]) {
              contextInserts.splice(idx, 1);
              try { localStorage.setItem(QB_CONTEXT_INSERTS_KEY, JSON.stringify(contextInserts)); } catch (err) {}
              qbShowToast("✅ 已删除阅读材料。", false);
            } else {
              qbShowToast("⚠️ 未找到当前阅读材料记录，删除未完成。", true);
            }
          } else if (seg && seg.__questionExtra) {
            const idx = questionInsertIndexForSegment(seg);
            if (idx >= 0 && questionInserts[idx]) {
              questionInserts.splice(idx, 1);
              try { localStorage.setItem(QB_QUESTION_INSERTS_KEY, JSON.stringify(questionInserts)); } catch (err) {}
              markQuestionDeleted(seg, si, true);
              qbShowToast("✅ 已删除当前题目。", false);
            } else {
              markQuestionDeleted(seg, si, false);
              qbShowToast("⚠️ 当前新增题目记录未找到，已先隐藏当前显示内容。", true);
            }
          } else {
            markQuestionDeleted(seg, si, false);
            segCustomMap[si] = "__QB_DELETED__";
            try { localStorage.setItem(QB_SEG_KEY, JSON.stringify(segCustomMap)); } catch (err) {}
            qbShowToast(isContextDelete ? "✅ 已删除阅读材料。" : "✅ 已删除当前题目。", false);
          }
          saveExamStructureBackend();
          renderQBView();
        };
      });
      try {
        if (qbSource === "realexam" && !qbYearLocked && localStorage.getItem(QB_STRUCTURE_SYNC_KEY) === "1") {
          localStorage.removeItem(QB_STRUCTURE_SYNC_KEY);
          saveExamStructureBackend();
        }
      } catch (e) {}

      // 📝 整讲 AI 分析：遍历本讲次所有段，逐段做「AI 分析」(逐题补答案/解析)；

    const qbParseCache = {};

    function splitQBSubs(text) {

      const re = /[（(]\s*(\d+)\s*[）)]/g;

      const starts = [];

      let m;

      while ((m = re.exec(text))) starts.push({ idx: m.index, num: m[1] });

      if (starts.length < 2) return { title: text, subs: [] };

      const title = text.slice(0, starts[0].idx).trim();

      const subs = starts.map((st, k) => {

        const end = k + 1 < starts.length ? starts[k + 1].idx : text.length;

        return { num: st.num, text: text.slice(st.idx, end).trim() };

      });

      return { title, subs };

    }

    // 把整组答案按序号拆成映射：支持（1）（2）、①.②.③.、1. 2. 3. 三种格式

    function numberedAnswerMap(rawAns) {

      const map = {};

      const s = String(rawAns || "");

      const paren = splitQBSubs(s);

      if (paren.subs.length) {

        paren.subs.forEach(sb => { if (!map[sb.num]) map[sb.num] = sb.text; });

        return map;

      }

      const cn = { "①": 1, "②": 2, "③": 3, "④": 4, "⑤": 5, "⑥": 6, "⑦": 7, "⑧": 8, "⑨": 9, "⑩": 10 };

      [...s.matchAll(/([①-⑩])\s*[.．、]?\s*([^①-⑩]+)/g)].forEach(m => {

        const n = cn[m[1]];

        if (n && !map[n]) map[n] = m[2].trim();

      });

      if (Object.keys(map).length) return map;

      [...s.matchAll(/(^|\s)(\d+)\s*[.．、]\s*([^\n]+)/g)].forEach(m => {

        const n = Number(m[2]);

        if (n && !map[n]) map[n] = m[3].trim();

      });

      return map;

    }

    function parseQBLecture(lecture, srcId, lectureIdx) {

      const ck = srcId + "::" + lectureIdx;

      if (qbParseCache[ck]) return qbParseCache[ck];

      const blocks = [];

      let cur = null;

      const qLines = lecture.q || [];

      let aoIdx = -1;

      qLines.forEach((l, li) => { if (/【翱翔拓展】/.test(l)) aoIdx = li; });

      // 提取【甲】【乙】对比阅读原文（嵌在试卷中的文言文阅读材料）

      let compareContext = "";

      const jiaIdx = qLines.findIndex(l => /^【甲】/.test(l.trim()));

      if (jiaIdx >= 0 && aoIdx >= 0 && jiaIdx > aoIdx) {

        const parts = [];

        let curTag = null;

        for (let i = jiaIdx; i < qLines.length; i++) {

          const l = qLines[i];

          const tag = l.trim().match(/^【(甲|乙)】/);

          if (tag) { curTag = { tag: l.trim(), lines: [] }; parts.push(curTag); continue; }

          if (/^\d+\s*[．.、]/.test(l) && curTag && curTag.lines.length) break;

          if (curTag) curTag.lines.push(l);

        }

        compareContext = parts.map(p => p.tag + "\n" + p.lines.join("\n")).join("\n\n");

      }

      qLines.forEach((l, li) => {

        const m = l.match(/^(\d+)\s*[．.、]/);

        if (m) { cur = { num: m[1], lines: [l.slice(m[0].length).trim()], idx: li }; blocks.push(cur); }

        else if (cur) cur.lines.push(l);

      });

      const aBlocks = [];

      let acur = null;

      (lecture.a || []).forEach(l => {

        const m = l.match(/^(\d+)\s*[．.、]/);

        if (m) { acur = { num: m[1], lines: [l.slice(m[0].length).trim()] }; aBlocks.push(acur); }

        else if (acur) acur.lines.push(l);

      });

      const qs = blocks.flatMap((block, bi) => {

        const lines = block.lines;

        const text = lines.join(" ");

        // 答案块与题干块匹配：块数一致时按下标对齐最可靠；块数不一致时按「题号数字」匹配

        const ansObj = aBlocks.length === blocks.length ? aBlocks[bi] : (aBlocks.find(b => b.num === block.num) || aBlocks[bi] || null);

        const ans = ansObj ? ansObj.lines.join(" ") : "";

        const fullText = lines.join("");

        const optMatches = [...fullText.matchAll(/([A-D])\s*[．.、]/g)];

        const id = srcId + "::" + lectureIdx + "::" + bi;

        const rawTitle = lecture.title || "";

        const section = /文言文|古诗词/.test(rawTitle) ? "古诗文阅读" : (/记叙文|说明文|议论文|非连续性/.test(rawTitle) ? "现代文阅读" : "补充题库");

        if (optMatches.length >= 2) {

          const stem = fullText.slice(0, optMatches[0].index).trim();

          const options = optMatches.map((m, k) => {

            const end = k + 1 < optMatches.length ? optMatches[k + 1].index : fullText.length;

            const optText = fullText.slice(m.index + m[0].length, end).replace(/\[\[img:[^\]]*\]\]/g, "").split(/【/)[0].trim();

            return { key: m[1], text: optText };

          });

          let answer = "";

          // 提取答案字母：兼容「4．A（5分）」「3．C」「（4分）A」「A」「(A)」「B 【翱翔拓展」（去除后缀）等形式

          const cleanedAns = ans.replace(/^\s*(第\d+题)?\s*\d+\s*[．.、]?\s*/, "").replace(/\s*【[^】]*】\s*$/, "").trim();

          // 候选：分数括号后、或无括号时的独立 A-D（后跟 分隔符/空格/行尾，前不接中文内容）

          const candidates = [];

          const c1 = cleanedAns.match(/[（(]\s*(?:\d+分?)?\s*[）)]?\s*([A-D])(?=[（(]|\s*分|、|，|；|。| |$)/);

          const c2 = cleanedAns.match(/\b([A-D])(?=[（(]|分|\s|、|，|；|。|$)/);

          if (c1) candidates.push(c1[1]);

          if (c2) candidates.push(c2[1]);

          // 若答案只是简短字母（长度≤6 或纯字母），直接取唯一大写字母

          const short = String(cleanedAns).replace(/[^A-D]/g, "");

          if (short.length === 1) candidates.unshift(short);

          let aLetter = "";

          for (const cand of candidates) {

            if (options.some(o => o.key === cand)) { aLetter = cand; break; }

          }

          if (aLetter) answer = aLetter;

          else {

            const am = cleanedAns.match(/[（(]\s*([A-D])\s*[）)]/);

            if (am && options.some(o => o.key === am[1])) answer = am[1];

            else {

              const hit = options.find(o => o.text && cleanedAns.includes(o.text));

              if (hit) answer = hit.key;

            }

          }

          return [{ id, year: "qb", number: String(lectureIdx), section, text: stem, options, answerMode: "choice", answer, explanation: ans, qb: true, isExt: block.idx > aoIdx }];

        }

        const parts = splitQBSubs(text);

        if (parts.subs.length >= 2) {

          const ansMap = numberedAnswerMap(ans);

          // 无序号且答案被「；、」分成多段 → 按每个子题的空数顺序切分分配

          let seq = null;

          if (!Object.keys(ansMap).length) {

            const items = String(ans || "")

              .replace(/^\s*(?:(?:一|二|三|四|五|六|七|八|九|十)|\d+)?\s*[^；;,。]{0,20}?[（(]\s*\d+\s*分\s*[）)]\s*/, "")

              .split(/[；;。]/).map(s => s.trim().replace(/^[^；;]{0,6}[：:]\s*/, ""))

              .filter(s => !/^\d+[．.、]?$/.test(s) && s.length > 0);

            if (items.length >= parts.subs.length) {

              const ptr = [0];

              parts.subs.forEach(sb => {

                const blanks = (sb.text.match(/[＿]{2,}|_{2,}|[　 ]{2,}/g) || []).length;

                seq = seq || [];

                let end = Math.min(ptr[0] + Math.max(1, blanks || 1), items.length);

                if (seq.length === parts.subs.length - 1) end = items.length;

                seq.push(items.slice(ptr[0], end).join("；"));

                ptr[0] = end;

              });

            }

          }

          return parts.subs.map((sb, si) => ({

            id: id + "::" + sb.num,

            year: "qb",

            number: String(lectureIdx),

            section,

            groupTitle: parts.title,

            text: sb.text,

            answerMode: /[＿]{2,}|_{2,}|[　 ]{2,}|[（(]\s*[）)]/.test(sb.text) ? "blank" : "text",

            answer: seq ? seq[si] : (ansMap[sb.num] !== undefined ? ansMap[sb.num] : ans),

            explanation: "",

            qb: true,

            isExt: block.idx > aoIdx

          }));

        }

        return [{ id, year: "qb", number: String(lectureIdx), section, text, answerMode: /[＿]{2,}|_{2,}|[　 ]{2,}|[（(]\s*[）)]/.test(text) ? "blank" : "text", answer: ans, explanation: "", qb: true, isExt: block.idx > aoIdx }];

      });

      // 为古诗文讲次补阅读原文作为题干上下文：主体题用课文全文（如《三峡》），翱翔拓展对比阅读题用【甲】【乙】材料

      const titleMatch = (lecture.title || "").match(/《([^》]+)》/);

      const mainFull = titleMatch && works[titleMatch[1]] && works[titleMatch[1]].full ? works[titleMatch[1]].full : "";

      qs.forEach(q => {

        if (q.section !== "古诗文阅读" || q.context) return;

        const ctx = q.isExt && compareContext ? compareContext : (mainFull || compareContext);

        if (ctx) q.context = ctx;

      });

      qbParseCache[ck] = qs;

      return qs;

    }

    function qbAllQuestions() {

      const out = [];

      const bank = window.supplementalBank;

      if (!bank) return out;

      bank.sources.forEach(src => {

        if (src.kind !== "exam" || !src.groups) return;

        src.groups.forEach((g, gi) => {

          parseQBLecture(g, src.id, gi).forEach(q => out.push(q));

        });

      });

      return out;

    }

    const qbChoiceCache = {};

    function cleanQBAnswer(raw) {

      let t = String(raw || "").trim();

      t = t.replace(/[（(]\s*\d+\s*分\s*[）)]/g, " ");

      t = t.replace(/[（(][^）)]*写出[^）)]*[）)]/g, " ");

      t = t.replace(/[（(](?:或|即)[^）)]*[）)]/g, " ");

      t = t.replace(/[（(]\s*\d+\s*[）)]/g, " ");

      t = t.replace(/^(文学常识|解释下列加点词|解释下列句中加点词|用现代汉语翻译下列句子|翻译下面句子|默写|根据课文内容填空|阅读下面|阅读下文|赏析|综合运用|名著阅读)\s*/g, " ");

      t = t.replace(/\s+/g, "");

      const numbered = t.split(/[①②③④]/).filter(s => s.trim().length >= 2);

      if (numbered.length) t = numbered[0];

      const m = t.match(/^[^；;。、①②③④]+/);

      if (m && m[0]) t = m[0];

      return t;

    }

    function qbChoicePool() {

      const pool = [];

      const seen = new Set();

      const add = a => {

        const t = cleanQBAnswer(a);

        if (t && t.length >= 2 && t.length <= 25 && !seen.has(t)) { seen.add(t); pool.push(t); }

      };

      drillAllQuestions().forEach(q => add(q.answer));

      return pool;

    }

    function authorDistractors(q, correct) {

      const names = peopleData.map(p => p.name).filter(n => n && n.length >= 2 && n.length <= 6);

      const picked = [];

      const h = drillSeedHash(String(q.id));

      for (let i = 0; i < names.length * 4 && picked.length < 3; i++) {

        const n = names[(h + i * 11) % names.length];

        if (n !== correct && !picked.includes(n)) picked.push(n);

      }

      return picked;

    }

    function answerCategory(q) {

      const t = (q.groupTitle || "") + " " + (q.text || "");

      if (/文学常识|作者|作家|诗人|朝代|别称/.test(t)) return "author";

      if (/解释|加点词|含义|意思|词义/.test(t)) return "meaning";

      if (/翻译|译文/.test(t)) return "translate";

      if (/默写|诗句|名句/.test(t)) return "poem";

      return "other";

    }

    const qbCategoryPoolCache = (function () {

      const byCat = {};

      drillAllQuestions().forEach(q => {

        if (q.answerMode === "choice") return;

        const t = cleanQBAnswer(q.answer || "");

        if (t && t.length >= 2 && t.length <= 25) {

          const c = answerCategory(q);

          (byCat[c] = byCat[c] || []).push(t);

        }

      });

      Object.keys(byCat).forEach(c => { byCat[c] = [...new Set(byCat[c])]; });

      return byCat;

    })();

    function qbLectureDistractors(q, correct) {

      const bank = window.supplementalBank;

      if (!bank) return [];

      const src = bank.sources.find(s => s.id === "angli");

      if (!src || !src.groups[Number(q.number)]) return [];

      const qs = parseQBLecture(src.groups[Number(q.number)], "angli", Number(q.number));

      const out = [];

      const seen = new Set();

      qs.forEach(qq => {

        if (qq.id === q.id) return;

        const t = cleanQBAnswer(qq.answer);

        if (t && t !== correct && t.length >= 2 && t.length <= 25 && !seen.has(t)) { seen.add(t); out.push(t); }

      });

      return out;

    }

    const qbChoicePoolCache = qbChoicePool();

    function countRealBlanks(text) {

      const re = /[＿]{2,}|_{2,}|[　 ]{2,}/g;

      let count = 0;

      let m;

      while ((m = re.exec(text))) {

        const after = String(text).slice(re.lastIndex).trim();

        if (after) count++;

      }

      return count;

    }

    function expandQBForDrill(qs) {

      const out = [];

      const groupPtr = {};

      const pushQuestion = q => {

        if (q.answerMode === "blank" || q.answerMode === "text") {

          const blanks = (q.text.match(/[＿]{2,}|_{2,}|[　 ]{2,}/g) || []);

          if (countRealBlanks(q.text) > 1) {

            const gkey = q.groupTitle || "__nogroup__";

            if (!groupPtr[gkey]) {

              groupPtr[gkey] = { items: String(q.answer || "").split(/[；;]/).map(s => cleanQBAnswer(s)).filter(Boolean), idx: 0 };

            }

            const ctx = groupPtr[gkey];

            const corrects = [];

            for (let k = 0; k < blanks.length; k++) {

              const a = ctx.items[ctx.idx + k];

              if (a) corrects.push(a);

            }

            ctx.idx += blanks.length;

            if (corrects.length >= 2) {

              out.push({ ...q, correctAnswers: corrects });

              return;

            }

          }

        }

        out.push(q);

      };

      qs.forEach(q => {

        if (q.answerMode === "blank" || q.answerMode === "text") {

          const parts = splitQBSubs(q.text);

          if (parts.subs.length >= 2) {

            const ansMap = numberedAnswerMap(q.answer);

            // 若答案是无序号的「分隔列表」（如“甲；乙”），按子题顺序对齐分配

            let seqFallback = null;

            if (!Object.keys(ansMap).length) {

              const items = String(q.answer || "").split(/[；;、]/).map(s => s.trim()).filter(s => !/^\d+[．.、]?$/.test(s) && s.length > 0);

              if (items.length >= parts.subs.length) seqFallback = items;

            }

            parts.subs.forEach((sb, si) => {

              const subAns = seqFallback ? (seqFallback[si] || "") : (ansMap[sb.num] !== undefined ? ansMap[sb.num] : q.answer);

              pushQuestion({

                ...q,

                id: q.id + "::" + sb.num,

                text: sb.text,

                answer: subAns,

                groupTitle: parts.title || q.groupTitle

              });

            });

            return;

          }

        }

        pushQuestion(q);

      });

      return out;

    }



    function makeComboQuestion(q, corrects) {

      if (!corrects || corrects.length < 2) return null;

      const cat = answerCategory(q);

      const h = drillSeedHash(String(q.id));

      const pool = cat === "author" ? null : (qbCategoryPoolCache[cat] || []);

      const usedDs = [];

      const authorNames = cat === "author" ? peopleData.map(p => p.name).filter(n => n && n.length >= 2 && n.length <= 6) : [];

      const perDs = corrects.map((c, i) => {

        const picked = [];

        const srcPool = cat === "author" ? authorNames : pool;

        for (let j = 0; j < srcPool.length * 5 && picked.length < 3; j++) {

          const d = srcPool[(h + i * 13 + j * 7) % srcPool.length];

          if (d !== c && !corrects.includes(d) && !usedDs.includes(d) && !picked.includes(d)) picked.push(d);

        }

        picked.forEach(d => usedDs.push(d));

        return picked;

      });

      if (perDs.some(ds => !ds.length)) return null;

      const comboNorm = vals => vals.map(v => normalizeAnswerText(v)).filter(Boolean).sort().join("|");

      const combos = [];

      const addCombo = vals => {

        const norm = vals.map(v => normalizeAnswerText(v)).filter(Boolean);

        if (new Set(norm).size !== norm.length) return;

        const sig = comboNorm(vals);

        if (!combos.some(c => c.sig === sig)) combos.push({ sig, values: vals.slice() });

      };

      addCombo(corrects);

      corrects.forEach((c, i) => {

        const vals = corrects.map((cc, k) => (k === i ? perDs[i][0] : cc));

        addCombo(vals);

      });

      addCombo(perDs.map((ds, i) => ds[i % ds.length]));

      if (combos.length < 4) return null;

      const options = combos.slice(0, 4).map((cm, i) => ({ key: "ABCD"[i], text: cm.values.join("、"), values: cm.values }));

      const correctKey = options.find(o => comboNorm(o.values) === comboNorm(corrects)).key;

      return { ...q, answerMode: "choice", combo: true, comboCorrect: corrects.slice(), options, answer: correctKey, explanation: corrects.join("、") };

    }

    function fillToChoice(q) {

      if (!q || (q.answerMode !== "blank" && q.answerMode !== "text")) return q;

      if (qbChoiceCache[q.id]) return qbChoiceCache[q.id];

      if (q.correctAnswers && q.correctAnswers.length > 1) {

        if (/流程|步骤|填写完整|有哪|哪些|列举|用自己的话|概括|作用有何|异同|分别|简析|谈谈|理解|含义|原因|方法|顺序/.test(q.text)) return q;

        // 题干本身含多个空格（如诗句默写「＿，＿」）→ 是逐空填空，保留 blank 模式用多个输入框作答

        if (countRealBlanks(q.text) >= 2) return q;

        const cq = makeComboQuestion(q, q.correctAnswers.filter(a => a && a.length >= 2 && a.length <= 20));

        if (cq) { qbChoiceCache[q.id] = cq; return cq; }

        return q;

      }

      // 单空题但答案含多个要点(如"湍是动态，潭是静态;以素修饰…")→ 组合选项(每个选项含多个答案)

      const multiParts = String(q.answer || "").split(/[；;]/).map(s => cleanQBAnswer(s)).filter(s => s && s.length >= 2 && s.length <= 20);

      if (multiParts.length >= 2) {

        const cq = makeComboQuestion(q, multiParts);

        if (cq) { qbChoiceCache[q.id] = cq; return cq; }

      }

      const correct = cleanQBAnswer(q.answer || "");

      if (!correct || correct.length > 20) return q;

      const picked = [];

      const cat = answerCategory(q);

      const push = d => { if (d && d !== correct && !picked.includes(d) && picked.length < 3) picked.push(d); };

      if (cat === "author") {

        // 作者/文学常识类:干扰项用人物库人名(自然合理)

        authorDistractors(q, correct).forEach(d => push(d));

      } else {

        const sameCat = qbCategoryPoolCache[cat] || [];

        const pool = sameCat.filter(d => d !== correct);

        const h = drillSeedHash(String(q.id));

        for (let i = 0; i < pool.length * 4 && picked.length < 3; i++) push(pool[(h + i * 7) % pool.length]);

        if (picked.length < 3) qbLectureDistractors(q, correct).forEach(d => push(d));

        if (picked.length < 3) {

          const pool2 = qbChoicePoolCache.filter(d => d !== correct && !picked.includes(d));

          for (let i = 0; i < pool2.length && picked.length < 3; i++) push(pool2[(h + i * 11) % pool2.length]);

        }

      }

      if (picked.length < 3) return q;

      const options = [...picked, correct].map(t => ({ key: "", text: t }));

      options.sort((a, b) => (drillSeedHash(a.text) % 97) - (drillSeedHash(b.text) % 97));

      options.forEach((o, i) => { o.key = "ABCD"[i]; });

      const correctKey = options.find(o => o.text === correct).key;

      const choiceQ = { ...q, answerMode: "choice", options, answer: correctKey, explanation: correct };

      qbChoiceCache[q.id] = choiceQ;

      return choiceQ;

    }

    function qbMistakeQuestions() {

      const recs = [];

      qbAllQuestions().forEach(q => {

        const rec = state.examAnswers[answerKeyFor(q)];

        if (rec && rec.submitted && rec.correct === false) recs.push(q);

      });

      return recs;

    }

    // ===== 题库：清洗矫正 / 真题题库 子视图 =====

    // 本地规则清洗（复用格式矫正逻辑），后端 AI 预留 hook

    function qbLocalClean(t) {

      let s = String(t || "");

      // 空格合并、汉字间空格去除

      s = s.replace(/[ \t\u00a0\u3000]+/g, " ").replace(/([\u4e00-\u9fff]) ([\u4e00-\u9fff])/g, "$1$2");

      // 标点前空格

      s = s.replace(/\s+([，。！？；：、.．,])/g, "$1");

      // 汉字后半角标点转全角

      s = s.replace(/([\u4e00-\u9fff\u3000])[,.]/g, (m, c) => m.endsWith(",") ? c + "，" : c + "。");

      s = s.replace(/([\u4e00-\u9fff\u3000])\?/g, "$1？").replace(/([\u4e00-\u9fff\u3000])!/g, "$1！")

        .replace(/([\u4e00-\u9fff\u3000]);/g, "$1；").replace(/([\u4e00-\u9fff\u3000]):/g, "$1：");

      // 压缩连续空行、去行尾空格

      s = s.replace(/\n{3,}/g, "\n\n").split("\n").map(l => l.replace(/[ \t]+$/, "")).join("\n");

      return s;

    }

    // 后端 AI 清洗接口（预留）：后端就绪后返回 Promise<矫正结果>；当前未配置则返回 null

    function qbCleanViaBackend(text) {

      return (qbCleanBackendUrl && typeof qbCleanBackendUrl === "string" && qbCleanBackendUrl.trim())

        ? fetch(qbCleanBackendUrl.trim(), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })

            .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })

            .then(d => d.result || d.text || null)

            .catch(() => null)

        : Promise.resolve(null);

    }

      if (input) input.addEventListener("input", function () { autoImportMarkdown(input.value); });

    // 复用现有 .qtxt-* 样式渲染（标题/题号/选项/答案/解析），供清洗矫正与清洗知识库共用
    function renderQtCss(raw) {
      const out = [];
      const keepSpaces = function (h) { return String(h).replace(/  +/g, function (m) { return m.replace(/ /g, "&nbsp;"); }); };
      let prevAns = false;
      String(raw || "").split("\n").forEach(function (line) {
        const t = line.trim();
        if (!t) { out.push('<div class="qtxt-blank">&nbsp;</div>'); return; }
        let cls = "qtxt-line", content = line;
        if (/^# /.test(line)) { cls = "qtxt-chapter"; content = line.slice(2); }
        else if (/^## /.test(line)) { cls = "qtxt-h1"; content = line.slice(3); }
        else if (/^### /.test(line)) { cls = "qtxt-h2"; content = line.slice(4); }
        else if (/^#### /.test(line)) { cls = "qtxt-h3"; content = line.slice(5); }
        else if (/^\s*(答案|解析)\s*[:：]/.test(line)) { cls = "qtxt-ans"; content = line; }
        else if (prevAns) { cls = "qtxt-ans"; content = line; }
        else if (/^\s*[A-H][．.、) ]/.test(line)) { cls = "qtxt-opt"; }
        else if (/^\s*\d{1,3}\s*[．、.)]/.test(line)) { cls = "qtxt-item"; }
        else if (/^\s*[（(]\s*\d/.test(line) || /^[①-⑩]/.test(line)) { cls = "qtxt-circ"; }
        prevAns = /^\s*(答案|解析)\s*[:：]/.test(line) ? true
          : (/^\s*[A-H][．.、) ]/.test(line) ? false
            : (/^\s*\d{1,3}\s*[．、.)]/.test(line) ? false : prevAns));
        out.push('<div class="' + cls + '">' + keepSpaces(renderQuestionMarkup(content)) + '</div>');
      });
      return out.join("");
    }

    // 上传条目全文页（上传识别入库的题库，单条展开），由题库首页上传条目卡片进入

      const lines = raw.split("\n");
      const sections = [];
      let cur = { title: "", body: [] };

      const secHtml = sections.map(function (s, i) {

    // 题库导航首页：公开版只保留一个古文与古诗词总入口，避免显示过多知识库
    function renderQBCleanKB(view) {

    // 清洗知识库条目页：展示清洗入库的条目(图标卡片+点击展开)，由题库首页"清洗知识库"双击进入
    function renderQBMineKB(view) {
      const bodyEl = $("qbViewBody") || view;
      const ckb = window.cleanKnowledgeBank || {};
      const sources = (Array.isArray(ckb.sources) ? ckb.sources : []).filter(s => s && s.content);
      const cards = sources.map(s => `
        <div class="qbk-card" data-qbk="${esc(s.id || "")}" data-qbk-css style="border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:border-color .2s">
          <div style="display:flex;align-items:center;gap:8px;min-width:0">
            <span style="font-size:20px">📄</span>
            <div style="min-width:0;flex:1">
              <div style="font-size:13px;font-weight:700;color:var(--person);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.title || "未命名")}</div>
              <div style="font-size:11px;color:var(--muted)">${esc(s.createdAt || "")} · ${String(s.content).length} 字</div>
            </div>
          </div>
          <div style="margin-top:6px;font-size:12px;color:var(--muted);line-height:1.6;max-height:2.4em;overflow:hidden">${qbGlobalBold(esc(String(s.content).replace(/\s*\n+\s*/g, " ").slice(0, 60)))}…</div>
        </div>`).join("");
      bodyEl.innerHTML = `
        <div class="qb-seg-head" style="position:static;background:transparent;box-shadow:none;border:none"><span class="qb-seg-title" style="font-size:13px">清洗知识库 · ${sources.length} 项</span>
          <span style="font-size:11px;color:var(--muted)"><span data-kb-back style="cursor:pointer;color:#1565c0">← 返回题库</span></span>
        </div>
        ${sources.length
          ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:4px 2px 8px">${cards}</div>
             <div data-qbk-detail style="padding:2px 2px 16px;margin-top:4px"></div>`
          : `<p style="margin:24px 0;font-size:13px;color:var(--muted)">暂无内容。请在「上传题库」中上传 PDF / Word，识别并校验通过后存入知识库。</p>`}
      `;
      const back = bodyEl.querySelector("[data-kb-back]");
      if (back) back.onclick = () => { qbSource = "cleankb"; try { localStorage.setItem("peopleGraphQbSource", "cleankb"); } catch (e) {} qbLecture = null; qbCursor = 0; renderQBView(); renderSide(); };
      const detail = bodyEl.querySelector("[data-qbk-detail]");
      if (sources.length) {
        bodyEl.querySelectorAll("[data-qbk-css]").forEach(card => {
          card.onclick = () => {
            const s = sources.find(x => x.id === card.dataset.qbk);
            const normalized = normalizeReadingKnowledgeContent(s && s.content, s && s.title);
            bodyEl.querySelectorAll(".qbk-card").forEach(c => c.style.borderColor = "var(--line)");
            card.style.borderColor = "var(--person)";
            detail.innerHTML = (s ? `
              <div style="font-size:14px;font-weight:700;color:var(--ink)">${esc(s.title || "")}</div>
              <div style="font-size:11px;color:var(--muted);margin:2px 0 8px">清洗时间：${esc(s.createdAt || "")}</div>
              ${(function () { var sHtml = renderStructured(normalized); return sHtml ? '<div style="padding:2px">' + sHtml + '</div>' : '<div class="qtxt-view qb-note-line" style="border:1px solid var(--line);border-radius:10px;padding:10px">' + renderQtCss(normalized) + '</div>'; })()}` : "");
            detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
          };
        });
      }
    }

    // 题目管理子视图：题目卡片式录入/编辑，JSON 存后端 question-bank.js，支持 Markdown 导入导出
    async function loadQBank() {
      try {
        const r = await fetch(apiUrl("/api/questions"), { headers: { "Accept": "application/json" } });
        const d = await r.json().catch(() => ({}));
        window.__qbank = Array.isArray(d.questions) ? d.questions : [];
      } catch (e) {
        window.__qbank = [];
      }
      return window.__qbank;
    }

    function renderQBMgmt(view) {
      const bodyEl = $("qbViewBody") || view;
      bodyEl.innerHTML = `
        <div class="qb-seg-head" style="position:static;background:transparent;box-shadow:none;border:none">
          <span class="qb-seg-title" style="font-size:14px">题目管理</span>

      if (back) back.onclick = () => { qbSource = "cleankb"; try { localStorage.setItem("peopleGraphQbSource", "cleankb"); } catch (e) {} qbLecture = null; qbCursor = 0; renderQBView(); renderSide(); };

    function renderQMList() {
      const listEl = document.querySelector("[data-qm-list]");
      if (!listEl) return;
      const qs = window.__qbank || [];
      const countEl = document.querySelector("[data-qm-count]");
      if (countEl) countEl.textContent = "共 " + qs.length + " 题";
      listEl.innerHTML = qs.length
        ? qs.map(raw => { const q = normalizeQuestionStructure(raw); return `<div data-qm-item="${esc(q.id || "")}" style="cursor:pointer;padding:6px 8px;border-radius:6px;margin-bottom:3px;font-size:12px;line-height:1.5;${qbMgmtId === q.id ? "background:#eaf3ff;border:1px solid #bcd9ff" : "background:#fff"}" title="${esc((q.stem || "").slice(0, 40))}">
            <div style="font-weight:700;color:var(--person)">${esc(q.id || "")} · ${esc((q.meta && q.meta.questionType) || q.type || "")}</div>
            <div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((q.meta && q.meta.domain) || "")}</div>
            <div style="color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((q.stem || "").slice(0, 26))}</div>
          </div>`; }).join("")
        : '<p style="font-size:12px;color:var(--muted);padding:8px">暂无题目，点「＋ 新建题目」或「导入 Markdown」。</p>';
      [].slice.call(listEl.querySelectorAll("[data-qm-item]")).forEach(el => {
        el.onclick = () => { qbMgmtId = el.dataset.qmItem; renderQMList(); renderQBMgmtEdit(); };
      });
    }

    function renderQBMgmtEdit() {
      const editEl = document.querySelector("[data-qm-edit]");
      if (!editEl) return;
      const qs = window.__qbank || [];
      const rawQ = qs.find(x => x.id === qbMgmtId)
        || (qbMgmtId ? { id: qbMgmtId, type: "single_choice", stem: "", options: [], answer: "", analysis: "", tags: [], difficulty: 3, source: "" } : null);
      if (!rawQ) { editEl.innerHTML = '<p style="font-size:13px;color:var(--muted)">请选择左侧题目，或点「＋ 新建题目」。</p>'; return; }
      const q = normalizeQuestionStructure(rawQ);
      const o4 = ["A", "B", "C", "D"].map(k => {
        const opt = (q.options || []).find(o => (typeof o === "string" ? String(o).startsWith(k) : o.key === k));
        const tx = typeof opt === "string" ? String(opt).replace(/^\s*[A-D]\s*[．.、)）]\s*/, "") : (opt && opt.text) || "";
        return { k, tx };
      });
      const typeNames = { single_choice: "单选", multiple_choice: "多选", fill_blank: "填空", short_answer: "简答", comprehensive: "综合", essay: "作文" };
      editEl.innerHTML = `
        <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px">编辑题目 <span style="color:var(--person)">${esc(q.id || "")}</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px">
          <label style="font-size:11px;color:var(--muted)">ID<input data-qm-f="id" value="${esc(q.id || "")}" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>
          <label style="font-size:11px;color:var(--muted)">类型<select data-qm-f="type" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px">${Object.keys(typeNames).map(t => `<option value="${t}"${q.type === t ? " selected" : ""}>${typeNames[t]}</option>`).join("")}</select></label>
          <label style="font-size:11px;color:var(--muted)">难度<select data-qm-f="difficulty" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px">${[1,2,3,4,5].map(n => `<option value="${n}"${(q.difficulty || 3) === n ? " selected" : ""}>${n}</option>`).join("")}</select></label>
          <label style="font-size:11px;color:var(--muted)">来源<input data-qm-f="source" value="${esc(q.source || "")}" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>
        </div>
        <label style="font-size:12px;color:var(--muted)">题干</label>
        <textarea data-qm-f="stem" style="width:100%;box-sizing:border-box;min-height:64px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px">${esc(q.stem || "")}</textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0">
          ${o4.map(o => `<label style="font-size:11px;color:var(--muted)">选项 ${o.k}<input data-qm-f="opt${o.k}" value="${esc(o.tx)}" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>`).join("")}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          <div><label style="font-size:12px;color:var(--muted)">答案</label><textarea data-qm-f="answer" style="width:100%;box-sizing:border-box;min-height:40px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px">${esc(q.answer ? (Array.isArray(q.answer) ? q.answer.join(",") : q.answer) : "")}</textarea></div>
          <div><label style="font-size:12px;color:var(--muted)">解析</label><textarea data-qm-f="analysis" style="width:100%;box-sizing:border-box;min-height:40px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px">${esc(q.analysis || "")}</textarea></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
          <label style="font-size:11px;color:var(--muted)">领域<input data-qm-f="domain" value="${esc((q.meta && q.meta.domain) || q.domain || "")}" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>
          <label style="font-size:11px;color:var(--muted)">知识点<input data-qm-f="knowledgePoints" value="${esc(((q.meta && q.meta.knowledgePoints) || q.knowledgePoints || q.tags || []).join("、"))}" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>
          <label style="font-size:11px;color:var(--muted)">能力点<input data-qm-f="skills" value="${esc(((q.meta && q.meta.skills) || q.skills || []).join("、"))}" style="width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px"></label>
        </div>
        ${renderQuestionStructureChips(q)}
        <div style="display:flex;gap:8px;align-items:center">
          <button data-qm-save style="border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 14px;cursor:pointer;color:#1c5a4c">保存</button>
          <button data-qm-delete style="border:1px solid #f0dada;border-radius:8px;background:#fff;padding:6px 14px;cursor:pointer;color:#c0392b">🗑 删除</button>
          <span data-qm-savestate style="font-size:11px;color:var(--muted)"></span>
        </div>`;
      const gid = (n) => { const el = editEl.querySelector('[data-qm-f="' + n + '"]'); return el ? el.value : ""; };
      const saveBtn = editEl.querySelector("[data-qm-save]");
      if (saveBtn) saveBtn.onclick = () => {
        const options = ["A", "B", "C", "D"].map(k => ({ key: k, text: gid("opt" + k).trim() })).filter(o => o.text);
        const obj = normalizeQuestionStructure({
          id: gid("id").trim() || q.id,
          type: gid("type") || "short_answer",
          stem: gid("stem").trim(),
          options: options,
          answer: gid("answer").trim(),
          analysis: gid("analysis").trim(),
          domain: gid("domain").trim(),
          knowledgePoints: gid("knowledgePoints").split(/[、,，\s]+/).map(s => s.trim()).filter(Boolean),
          skills: gid("skills").split(/[、,，\s]+/).map(s => s.trim()).filter(Boolean),
          tags: gid("knowledgePoints").split(/[、,，\s]+/).map(s => s.trim()).filter(Boolean),
          difficulty: Number(gid("difficulty")) || 3,
          source: gid("source").trim() || "题目管理"
        }, { rawFormat: "json" });
        fetch(apiUrl("/api/questions"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "save", question: obj }) })
          .then(r => r.json())
          .then(d => {
            qbMgmtId = obj.id;
            const st = editEl.querySelector("[data-qm-savestate]");
            if (st) st.textContent = "✅ 已保存";
            return loadQBank().then(() => { renderQMList(); renderQBMgmtEdit(); });
          })
          .catch(err => { const st = editEl.querySelector("[data-qm-savestate]"); if (st) st.textContent = "⚠️ 保存失败"; });
      };
      const delBtn = editEl.querySelector("[data-qm-delete]");
      if (delBtn) delBtn.onclick = () => {
        if (!confirm("确定删除题目 " + q.id + " ？")) return;
        fetch(apiUrl("/api/questions"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "delete", id: q.id }) })
          .then(r => r.json())
          .then(() => { qbMgmtId = null; return loadQBank().then(() => { renderQMList(); renderQBMgmtEdit(); }); });
      };
    }

    function renderQMImport() {
      const editEl = document.querySelector("[data-qm-edit]");
      if (!editEl) return;
      editEl.innerHTML = `
        <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px">📥 导入 Markdown（解析为结构化题目）</div>
        <textarea data-qm-import-text style="width:100%;box-sizing:border-box;min-height:180px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px" placeholder="粘贴 markdown 题库，例如：
1．下面哪个选项是正确的？
A．选项一 B．选项二 C．选项三 D．选项四
答案：B
解析：……"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <button data-qm-import-do style="border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 14px;cursor:pointer">⚡ 解析并导入</button>
          <span data-qm-import-state style="font-size:11px;color:var(--muted)"></span>
        </div>`;
      const doBtn = editEl.querySelector("[data-qm-import-do]");
      if (doBtn) doBtn.onclick = () => {
        const ta = editEl.querySelector("[data-qm-import-text]");
        const text = (ta && ta.value) || "";
        const parsed = parseQuestions(text);
        const st = editEl.querySelector("[data-qm-import-state]");
        if (!parsed.length) { if (st) st.textContent = "⚠️ 未识别到题目(需含题号 1．/1.)"; return; }
        const now = Date.now();
        const newQs = parsed.map((q, i) => ({ ...q, id: q.id || ("Q" + String(now).slice(-5) + i) }));
        fetch(apiUrl("/api/questions"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "save", questions: newQs }) })
          .then(r => r.json())
          .then(d => { if (st) st.textContent = "✅ 已导入 " + newQs.length + " 题"; return loadQBank().then(() => { renderQMList(); renderQBMgmtEdit(); }); })
          .catch(() => { if (st) st.textContent = "⚠️ 导入失败"; });
      };
    }

    function renderQMExport() {
      const editEl = document.querySelector("[data-qm-edit]");
      if (!editEl) return;
      const md = questionsToMarkdown(window.__qbank || []);
      editEl.innerHTML = `
        <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px">📤 导出 Markdown（复制到剪贴板或保存备份）</div>
        <textarea data-qm-export-text readonly style="width:100%;box-sizing:border-box;min-height:260px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fafafa">${esc(md)}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <button data-qm-export-copy style="border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 14px;cursor:pointer">📋 复制</button>
          <span data-qm-export-state style="font-size:11px;color:var(--muted)"></span>
        </div>`;
      const copyBtn = editEl.querySelector("[data-qm-export-copy]");
      if (copyBtn) copyBtn.onclick = () => {
        const ta = editEl.querySelector("[data-qm-export-text]");
        navigator.clipboard && navigator.clipboard.writeText(md);
        ta && ta.select();
        const st = editEl.querySelector("[data-qm-export-state]");
        if (st) st.textContent = "✅ 已复制（共 " + (window.__qbank || []).length + " 题）";
      };
    }

    // 真题题库子视图：汇总真题试卷题目，供校验/清洗（只展示与检查，非作答）

    function renderQBRealExam(view) {

      const bodyEl = $("qbViewBody") || view;

      const papers = (typeof examPapers !== "undefined" ? examPapers : window.examPapers) || [];

      const bank = (typeof examQuestionBank !== "undefined" ? examQuestionBank : window.examQuestionBank) || [];

            const firstLocked = lockedIds.has(first.id);

            const ux = dx / distance;

        },

        onNodesChange: changes => {

          setRfNodes(currentNodes => {

            const changed = applyNodeChangesSafe(changes, currentNodes);

            const lockedIds = new Set();

            changed.filter(item => item.selected && item.id.startsWith("p:")).forEach(item => lockedIds.add(item.id));

            changes.forEach(change => {

              if (change.type === "position" && change.id?.startsWith("p:")) lockedIds.add(change.id);

            });

            const hasDraggingPosition = changes.some(change => change.type === "position" && change.dragging);

            const resolved = lockedIds.size && hasDraggingPosition ? resolveReactFlowCollisions(changed, lockedIds) : changed;

            syncReactFlowPositions(resolved, false);

            return resolved;

          });

        },

        onSelectionChange: payload => {

          selectedFromReactFlow(payload.nodes || []);

          renderCanvasStatus(graphNodes);

        },

        onPaneClick: () => {

          clearPersonFocus();

          setRfNodes(currentNodes => currentNodes.map(node => ({ ...node, selected: false })));

        },

        onMoveEnd: (event, viewport) => {

          state.x = viewport.x;

          state.y = viewport.y;

          state.scale = viewport.zoom;

          renderCanvasStatus(graphNodes);

        }

      },

        React.createElement(Background, { gap: 28, size: 1, color: "rgba(31,42,48,.12)" }),

        React.createElement(MiniMap, { pannable: true, zoomable: true, nodeStrokeWidth: 2, style: { width: 150, height: 104 } }),

        React.createElement(Controls, { showInteractive: false })

      );

    }

    function renderReactFlowGraph(nodes, links) {

      if (!canUseReactFlow()) return false;

      reactFlowReady = true;

      document.querySelector(".graph")?.classList.add("react-flow-enabled");

      const converted = toReactFlowData(nodes, links);

      const nodeTypes = { personCard: reactFlowNodeComponent };

      const element = React.createElement(ReactFlowGraphApp, {

        initialNodes: converted.rfNodes,

        initialEdges: converted.rfEdges,

        nodeTypes,

        graphNodes: nodes,

        graphLayoutKeyValue: graphLayoutKey,

        selectedName: state.selected,

        multiSelectedKey: Array.from(state.multiSelected).join("|")

      });

      if (!reactFlowRoot) reactFlowRoot = ReactDOM.createRoot(reactFlowCanvas);

      reactFlowRoot.render(element);

      return true;

    }



    function renderGraph() {

      const { nodes, links } = graphData();

      nodes.filter(node => node.type === "person").forEach(node => queuePersonPhoto(node.person));

      if (renderReactFlowGraph(nodes, links)) {

        renderCanvasStatus(nodes);

        return;

      }

      svg.innerHTML = "";

      const root = svgEl("g", { transform: `translate(${state.x} ${state.y}) scale(${state.scale})` });

      svg.appendChild(root);

      links.forEach(l => {

        const s = nodes.find(n => n.id === l.source), t = nodes.find(n => n.id === l.target);

        if (!s || !t) return;

        root.appendChild(svgEl("line", { class: `link ${l.type === "work" ? "work" : ""} ${l.type === "person-relation" ? "person-relation" : ""}`, x1: s.x, y1: s.y, x2: t.x, y2: t.y }));

        if (l.type === "work") {

          const label = svgEl("text", { class: "link-label", x: (s.x + t.x) / 2, y: (s.y + t.y) / 2 - 6, "text-anchor": "middle" });

          label.textContent = l.label;

          root.appendChild(label);

        }

        if (l.type === "person-relation") {

          const label = svgEl("text", { class: "relation-label", x: (s.x + t.x) / 2, y: (s.y + t.y) / 2 - 8, "text-anchor": "middle" });

          label.textContent = l.label;

          root.appendChild(label);

        }

      });

      if (state.boxSelect) {

        const rect = normalizedRect(state.boxSelect.start, state.boxSelect.current);

        root.appendChild(svgEl("rect", { class: "selection-rect", x: rect.x, y: rect.y, width: rect.width, height: rect.height, rx: 10 }));

      }

      nodes.forEach(n => {

        const selectedClass = n.type === "person" && state.multiSelected.has(n.person) ? "multi-selected" : "";

        const g = svgEl("g", { class: `node ${n.type} ${n.person === state.selected ? "active" : ""} ${selectedClass}`, transform: `translate(${n.x} ${n.y})`, role: "button", tabindex: "0" });

        g.appendChild(svgEl("circle", { r: n.type === "person" ? 22 : n.type === "work" ? 15 : 13 }));

        const text = svgEl("text", { y: (n.type === "person" ? 22 : 15) + 17, "text-anchor": "middle" });

        text.textContent = n.label.length > 10 ? `${n.label.slice(0, 10)}…` : n.label;

        g.appendChild(text);

        let start = null;

        g.addEventListener("pointerdown", e => {

          e.stopPropagation();

          state.draggingNode = true;

          start = { x: e.clientX, y: e.clientY };

          if (n.type === "person") {

            const point = graphPointFromEvent(e);

            if (state.multiSelected.size > 1 && state.multiSelected.has(n.person)) {

              const { nodes: currentNodes } = graphData();

              state.groupDrag = {

                start: point,

                moved: false,

                positions: selectedPersonPositions(currentNodes)

              };

            } else {

              if (!e.shiftKey && !state.multiSelected.has(n.person)) state.multiSelected.clear();

              if (e.shiftKey) {

                state.multiSelected.has(n.person) ? state.multiSelected.delete(n.person) : state.multiSelected.add(n.person);

                renderGraph();

                return;

              }

              state.nodeDrag = { name: n.person, dx: n.x - point.x, dy: n.y - point.y, moved: false };

            }

            g.setPointerCapture(e.pointerId);

          }

        });

        g.addEventListener("pointermove", e => {

          if (state.groupDrag && n.type === "person") {

            e.stopPropagation();

            const point = graphPointFromEvent(e);

            const dx = point.x - state.groupDrag.start.x;

            const dy = point.y - state.groupDrag.start.y;

            state.multiSelected.forEach(name => {

              const base = state.groupDrag.positions[name];

              if (base) state.savedPositions[name] = { x: base.x + dx, y: base.y + dy };

            });

            state.groupDrag.moved = true;

            renderGraph();

            return;

          }

          if (!state.nodeDrag || state.nodeDrag.name !== n.person) return;

          e.stopPropagation();

          const point = graphPointFromEvent(e);

          const next = { x: point.x + state.nodeDrag.dx, y: point.y + state.nodeDrag.dy };

          state.savedPositions[n.person] = next;

          state.nodeDrag.moved = true;

          renderGraph();

        });

        g.addEventListener("pointerup", e => {

          e.stopPropagation();

          const movedDistance = start ? Math.hypot(e.clientX - start.x, e.clientY - start.y) : 0;

          const dragged = state.nodeDrag?.moved || state.groupDrag?.moved;

          if (state.groupDrag) {

            if (state.groupDrag.moved) savePositions();

            state.groupDrag = null;

          }

          if (state.nodeDrag?.name === n.person) {

            savePositions();

            state.nodeDrag = null;

          }

          state.draggingNode = false;

          if (!dragged && movedDistance < 6) activateNode(n);

        });

        g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activateNode(n); } });

        root.appendChild(g);

      });

      renderCanvasStatus(nodes);

    }

    function render() {

      renderPanelState();

      saveViewState();

      renderSide();

      if (state.view === "graph") {

        renderEraFilter();

        renderDetail();

        renderGraph();

      }

    }

    function refreshGraphFilterSelection() {

      clearMultiSelection();

      resetVisiblePositions();

      reactFlowFitPending = true;

      const list = filtered();

      if (!list.some(p => p.name === state.selected) && list[0]) {

        state.selected = list[0].name;

        state.expanded = list[0].name;

        state.openWork = null;

      }

      render();

    }

    $("search").oninput = e => { state.query = e.target.value.trim(); resetVisiblePositions(); const list = filtered(); if (!list.some(p => p.name === state.selected) && list[0]) { state.selected = list[0].name; state.expanded = list[0].name; state.openWork = null; } render(); };

    $("toggleLeftPanel").onclick = () => togglePanel("left");

    $("graphTab").onclick = () => switchTopView("graph");

    $("catalogTab").onclick = () => switchTopView("catalog");

    $("examTab").onclick = () => switchTopView("exam");

    $("qbTab").onclick = () => switchTopView("qb");

    $("drillTab").onclick = () => switchTopView("drill");

    $("mistakeTab").onclick = () => switchTopView("mistake");

    $("dynastyFilter").onchange = e => { state.dynasty = e.target.value || "\u5168\u90e8"; refreshGraphFilterSelection(); };

    $("countryFilter").onchange = e => { state.country = e.target.value || "\u5168\u90e8"; state.dynasty = "\u5168\u90e8"; refreshGraphFilterSelection(); };

    $("dynastyFilter").addEventListener("change", e => { state.dynasty = e.target.value || "\u5168\u90e8"; refreshGraphFilterSelection(); });

    $("countryFilter").addEventListener("change", e => { state.country = e.target.value || "\u5168\u90e8"; state.dynasty = "\u5168\u90e8"; refreshGraphFilterSelection(); });

    $("expand").onclick = () => { state.expanded = selectedPerson().name; render(); };

    $("collapse").onclick = () => { state.expanded = null; state.openWork = null; render(); };

    $("fitCanvas").onclick = () => { fitGraphView(); renderGraph(); };

    $("reset").onclick = () => { clearMultiSelection(); state.scale = 1; state.x = 0; state.y = 0; state.dynasty = "\u5168\u90e8"; state.country = "\u5168\u90e8"; reactFlowFitPending = true; render(); };

    document.addEventListener("click", e => {

      const btn = e.target && e.target.closest ? e.target.closest("[data-qb-img]") : null;

      if (!btn) return;

      openImagePreview(btn.getAttribute("data-qb-img"), btn.getAttribute("data-caption") || "");

    });

    $("closeReader").onclick = closeReader;

    $("popHighlight").onclick = highlightSelection;

    $("readerBody").addEventListener("mouseup", () => setTimeout(captureSelection, 0));

    $("readerBody").addEventListener("keyup", () => setTimeout(captureSelection, 0));

    $("reader").addEventListener("pointerdown", e => { if (e.target === $("reader")) closeReader(); });

    $("imagePreviewClose").onclick = closeImagePreview;

    $("imagePreview").addEventListener("pointerdown", e => { if (e.target === $("imagePreview")) closeImagePreview(); });

    document.addEventListener("pointerdown", e => {

      if (!$("selectionPop").contains(e.target) && !$("readerBody").contains(e.target)) hideSelectionPop();

    });

    window.addEventListener("keydown", e => { if (e.key === "Escape") { clearMultiSelection(); closeReader(); closeImagePreview(); renderGraph(); } });

    let drag = null;

    svg.addEventListener("pointerdown", e => {

      if (state.draggingNode) return;

      const point = graphPointFromEvent(e);

      drag = { x: e.clientX, y: e.clientY, ox: state.x, oy: state.y, startPoint: point, selecting: e.shiftKey, maybeSelect: !e.shiftKey };

      svg.style.cursor = e.shiftKey ? "crosshair" : "grabbing";

      if (e.shiftKey) {

        state.boxSelect = { start: point, current: point };

        renderGraph();

      }

      svg.setPointerCapture(e.pointerId);

    });

    svg.addEventListener("pointermove", e => {

      if (state.groupDrag) return;

      if (state.nodeDrag) {

        const point = graphPointFromEvent(e);

        state.savedPositions[state.nodeDrag.name] = { x: point.x + state.nodeDrag.dx, y: point.y + state.nodeDrag.dy };

        state.nodeDrag.moved = true;

        renderGraph();

        return;

      }

      if (!drag) return;

      const moved = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);

      if (drag.selecting || (drag.maybeSelect && moved > 18)) {

        drag.selecting = true;

        svg.style.cursor = "crosshair";

        const point = graphPointFromEvent(e);

        state.boxSelect = { start: drag.startPoint, current: point };

        renderGraph();

        return;

      }

      state.x = drag.ox + e.clientX - drag.x;

      state.y = drag.oy + e.clientY - drag.y;

      renderGraph();

    });

    svg.addEventListener("pointerup", e => {

      const wasDrag = drag;

      const movedDistance = wasDrag ? Math.hypot(e.clientX - wasDrag.x, e.clientY - wasDrag.y) : 0;

      const wasSelecting = Boolean(state.boxSelect);

      if (state.boxSelect) {

        const { nodes } = graphData();

        const rect = normalizedRect(state.boxSelect.start, state.boxSelect.current);

        state.multiSelected = new Set(nodes

          .filter(node => node.type === "person")

          .filter(node => node.x >= rect.x && node.x <= rect.x + rect.width && node.y >= rect.y && node.y <= rect.y + rect.height)

          .map(node => node.person));

        state.boxSelect = null;

        renderGraph();

      }

      if (!wasSelecting && wasDrag && movedDistance < 6) {

        clearPersonFocus();

      }

      if (state.groupDrag?.moved || state.nodeDrag?.moved) savePositions();

      state.groupDrag = null;

      state.nodeDrag = null;

      drag = null;

      state.draggingNode = false;

      svg.style.cursor = "grab";

    });

    svg.addEventListener("wheel", e => { e.preventDefault(); state.scale = Math.min(1.8, Math.max(.58, state.scale + (e.deltaY > 0 ? -.08 : .08))); renderGraph(); }, { passive: false });

    window.addEventListener("resize", renderGraph);

    if (!["graph", "catalog", "exam", "qb", "drill", "mistake", "review"].includes(state.view)) state.view = "graph";

    switchTopView(state.view === "review" ? "graph" : state.view);

  </script>

</body>

</html>
