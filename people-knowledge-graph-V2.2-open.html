            saveExamAnswers();

            panel.querySelectorAll("[data-choice]").forEach(item => item.classList.toggle("active", nextValues.includes(item.dataset.choice)));

            panel.querySelector(".answer-result").hidden = true;

          };

        });

      });

      rootEl.querySelectorAll(".blank-answer").forEach(input => {

        input.oninput = () => {

          const panel = input.closest("[data-answer-key]");

          const scope = panel.closest(".drill-question, .exam-question") || panel;

          const values = [...scope.querySelectorAll(".blank-answer")].map(item => item.value);

          const current = state.examAnswers[panel.dataset.answerKey] || {};

          state.examAnswers[panel.dataset.answerKey] = { ...current, value: values, submitted: false };

          saveExamAnswers();

          panel.querySelector(".answer-result").hidden = true;

        };

      });

      rootEl.querySelectorAll(".submit-answer").forEach(btn => {

        btn.onclick = () => {

          const panel = btn.closest("[data-answer-key]");

          const question = questionById[panel.dataset.questionId];

          let value = (state.examAnswers[panel.dataset.answerKey] || {}).value || "";

          if (panel.dataset.answerMode !== "choice") {

            const scope = panel.closest(".drill-question, .exam-question, .qb-game-card, .qb-question, .drill-game-card, .qb-game-card") || panel;

            value = [...scope.querySelectorAll(".blank-answer")].map(item => item.value);

          }

          if (panel.dataset.answerMode === "choice" && !Array.isArray(value)) value = value ? [value] : [];

          const correct = evaluateAnswer(question, value);

          const prev = state.examAnswers[panel.dataset.answerKey] || {};

          const attempts = (prev.attempts || 0) + 1;

          const correctCount = (prev.correctCount || 0) + (correct ? 1 : 0);

          const streak = correct ? (prev.streak || 0) + 1 : 0;

          state.examAnswers[panel.dataset.answerKey] = { value, submitted: true, correct, attempts, correctCount, streak };

          saveExamAnswers();

          const result = panel.querySelector(".answer-result");

          result.hidden = false;

          result.classList.toggle("correct", correct === true);

          result.classList.toggle("wrong", correct === false);

          result.innerHTML = renderAnswerResult(question, state.examAnswers[panel.dataset.answerKey]);

          if (rootEl.id === "drillView") {

            drillRevealed.add(question.id);

            if (correct) { state.drillStreak = (state.drillStreak || 0) + 1; state.drillScore = (state.drillScore || 0) + 10; }

            else state.drillStreak = 0;

          }

          if (rootEl.id === "mistakeView") { mistakeRevealed.add(question.id); renderMistakeView(); }

          if (rootEl.id === "qbView") {

            qbRevealed.add(question.id);

          }

        };

      });

    }

    function bindExamAnswerControls() {

      bindAnswerControls($("examView"));

    }

    /* ===== 专项训练 ===== */

    function isDrillQuestion(q) {

      if (isExamInstruction(q)) return false;

      if (isEssayQuestion(q)) return false;

      const mode = inferAnswerMode(q);

      const t = cleanDisplayText(q.text || '');

      if (mode === 'blank') {

        return !/(概括|归纳|分析|赏析|作用|理由|启示|根据文章|说明原因)/.test(t);

      }

      if (mode === 'choice') return true;

      return /(翻译|默写|解释|词牌名|作者|出处|常识)/.test(t);

    }

    function drillRecordFor(q) {

      const rec = state.examAnswers[answerKeyFor(q)];

      if (!rec || !rec.submitted) return null;

      const attempts = rec.attempts || 1;

      const correct = rec.correctCount != null ? rec.correctCount : (rec.correct ? 1 : 0);

      return { attempts, correct, accuracy: correct / attempts, lastWrong: rec.correct === false, streak: rec.streak || 0 };

    }

    function isDrillWrong(q) {

      const rec = drillRecordFor(q);

      if (!rec) return false;

      return rec.lastWrong || rec.accuracy < 0.6;

    }

    /* ===== 专项训练（一周练习计划） ===== */

    // 本视图会话内已揭示答案的题；重新进入专项训练时全部隐蔽

    const drillRevealed = new Set();

    let drillScreen = "map";

    // 训练计时：进入专项训练开始计时，切走时结算并记录历史

    let drillSessionStart = null;

    let drillTimer = null;

    function drillSessions() {

      try { return JSON.parse(localStorage.getItem("peopleGraphDrillSessions") || "[]"); } catch (e) { return []; }

    }

    function saveDrillSessions(list) {

      localStorage.setItem("peopleGraphDrillSessions", JSON.stringify(list));

    }

    function formatDrillDuration(seconds) {

      const m = Math.floor(seconds / 60);

      const s = seconds % 60;

      return m + ":" + String(s).padStart(2, "0");

    }

    function startDrillClock() {

      if (drillTimer) clearInterval(drillTimer);

      const tick = () => {

        const el = document.getElementById("drillElapsed");

        if (el && drillSessionStart != null) {

          el.textContent = formatDrillDuration(Math.floor((Date.now() - drillSessionStart) / 1000));

        }

      };

      tick();

      drillTimer = setInterval(tick, 1000);

    }

    function drillStartSession() {

      if (drillSessionStart == null) drillSessionStart = Date.now();

      startDrillClock();

    }

    function drillEndSession() {

      if (drillSessionStart == null) return;

      const seconds = Math.round((Date.now() - drillSessionStart) / 1000);

      if (seconds >= 1) {

        const list = drillSessions();

        list.push({ date: new Date().toISOString(), seconds });

        if (list.length > 30) list.shift();

        saveDrillSessions(list);

      }

      drillSessionStart = null;

      if (drillTimer) { clearInterval(drillTimer); drillTimer = null; }

    }

    function drillAllQuestions() {

      const exam = examQuestionBank.filter(isDrillQuestion).flatMap(q => expandExamQuestion(q));

      const qb = qbAllQuestions();

      return [...exam, ...qb];

    }

    function drillSeedHash(str) {

      let h = 0;

      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;

      return h;

    }

    function drillSeededSort(items, seed) {

      return items

        .map(item => ({ item, k: drillSeedHash(String(seed) + "::" + String(item.id)) }))

        .sort((a, b) => a.k - b.k || (String(a.item.id) < String(b.item.id) ? -1 : 1))

        .map(x => x.item);

    }

    function isObjectiveQBQuestion(q) {

      if (!q) return false;

      if (q.answerMode === "choice") return true;

      if (q.answerMode === "blank" || q.answerMode === "text") {

        const c = cleanQBAnswer(q.answer || "");

        return c.length >= 2 && c.length <= 25;

      }

      return false;

    }

    // 专项训练关卡名称与分类（古诗文/现代文/综合等）

    const DRILL_LEVELS = [

      { name: "古诗文·默写基础", cat: "古诗文" },

      { name: "古诗文·文学常识", cat: "古诗文" },

      { name: "古诗文·字词注音", cat: "古诗文" },

      { name: "古诗文·名句积累", cat: "古诗文" },

      { name: "文言文·字词释义", cat: "古诗文" },

      { name: "文言文·一词多义", cat: "古诗文" },

      { name: "文言文·翻译理解", cat: "古诗文" },

      { name: "古诗词·作者作品", cat: "古诗文" },

      { name: "古诗·情感主旨", cat: "古诗文" },

      { name: "古诗·手法赏析", cat: "古诗文" },

      { name: "古诗·理解性默写", cat: "古诗文" },

      { name: "古诗文·综合小节", cat: "古诗文" },

      { name: "现代文·记叙文阅读", cat: "现代文" },

      { name: "现代文·说明文阅读", cat: "现代文" },

      { name: "现代文·议论文阅读", cat: "现代文" },

      { name: "现代文·非连续性阅读", cat: "现代文" },

      { name: "现代文·语言赏析", cat: "现代文" },

      { name: "现代文·主旨与综合", cat: "现代文" },

      { name: "综合·字词与常识", cat: "综合" },

      { name: "综合·默写与运用", cat: "综合" },

      { name: "综合·古诗文综合", cat: "综合" },

      { name: "综合·现代文综合", cat: "综合" },

      { name: "综合·阅读大招", cat: "综合" },

      { name: "综合·语言运用", cat: "综合" },

      { name: "综合·限时冲刺", cat: "综合" },

    ];

    // 给题目打类别标签（古诗文/现代文/综合）

    function drillCategory(q) {

      const sec = (q.section || "");

      const t = ((q.groupTitle || "") + " " + sec + " " + (q.text || ""));

      if (/(古诗文|文言文|古诗词|唐诗|宋词|《.+》|诗|词|醉翁|岳阳楼|桃花源|小石潭|陋室|三峡|答谢|酬乐天|秋词|陋室)/.test(t)) return "古诗文";

      if (/(现代文|记叙文|说明文|议论文|散文|小说|非连续性|综合运用|材料|阅读面)/.test(t) || (sec && /现代文|综合/.test(sec))) return "现代文";

      return "综合";

    }

    function drillDayPlan() {

      const all = expandQBForDrill(drillAllQuestions()).filter(isObjectiveQBQuestion);

      const byCat = { 古诗文: [], 现代文: [], 综合: [] };

      all.forEach(q => byCat[drillCategory(q)].push(q));

      const days = [];

      const used = new Set();

      const pickFrom = (pool, seed, want) => {

        const out = [];

        const sorted = drillSeededSort(pool, seed);

        for (const q of sorted) {

          if (out.length >= want) break;

          if (used.has(answerKeyFor(q))) continue;

          used.add(answerKeyFor(q));

          out.push(q);

        }

        return out;

      };

      for (let d = 0; d < 30; d++) {

        const lvl = DRILL_LEVELS[d];

        const cat = lvl.cat;

        let qs = [];

        if (cat === "古诗文") {

          qs = pickFrom(byCat.古诗文, d, 15);

          if (qs.length < 15) qs = qs.concat(pickFrom(all.filter(q => !used.has(answerKeyFor(q))), d + 100, 15 - qs.length));

        } else if (cat === "现代文") {

          // 现代文 + 综合运用（阅读/语用）一并作为现代文阅读池

          const xdwPool = byCat.现代文.concat(byCat.综合);

          qs = pickFrom(xdwPool, d + 200, 15);

          if (qs.length < 15) qs = qs.concat(pickFrom(all.filter(q => !used.has(answerKeyFor(q))), d + 300, 15 - qs.length));

        } else {

          // 综合：优先混合取题

          qs = pickFrom(all, d + 400, 15);

        }

        days.push(qs.length ? qs : drillSeededSort(all, d).slice(0, 15).map(q => q));

      }

      return days;

    }

    function drillDayState(days) {

      const completed = days.map(qs => qs.length > 0 && expandQBForDrill(qs).every(q => {

        const rec = state.examAnswers[answerKeyFor(q)];

        return rec && rec.submitted;

      }));

      const unlocked = completed.map((_, i) => i === 0 || completed[i - 1]);

      return { completed, unlocked };

    }

    function renderDrillSide() {

      const days = drillDayPlan();

      const { completed, unlocked } = drillDayState(days);

      const dayIndex = Math.min(Math.max(0, state.drillDay || 0), 29);

      $("chips").innerHTML = `<div class="drill-day-grid">${days.map((d, i) =>

        `<button class="chip ${i === dayIndex ? "active" : ""} ${unlocked[i] ? "" : "locked"}" data-drill-side-day="${i}" ${unlocked[i] ? "" : "disabled"} title="第 ${i + 1} 天 · ${d.length} 题${completed[i] ? " · 已完成" : ""}">${completed[i] ? "✓" : (unlocked[i] ? i + 1 : "🔒")}</button>`

      ).join("")}</div>`;

      $("chips").querySelectorAll("[data-drill-side-day]").forEach(btn => {

        btn.onclick = () => { state.drillDay = Number(btn.dataset.drillSideDay); state.drillCursor = 0; state.drillStreak = 0; state.drillScore = 0; drillScreen = "play"; renderDrillView(true); };

      });

      const qs = expandQBForDrill(days[dayIndex] || []);

      const recs = qs.map(q => ({ q, rec: drillRecordFor(q) })).filter(x => x.rec);

      const wrong = qs.filter(isDrillWrong).length;

      const attempts = recs.reduce((s, x) => s + x.rec.attempts, 0);

      const correct = recs.reduce((s, x) => s + x.rec.correct, 0);

      const done = qs.filter(q => { const r = state.examAnswers[answerKeyFor(q)]; return r && r.submitted; }).length;

      const completedDays = completed.filter(Boolean).length;

      const sessions = drillSessions();

      const recent = sessions.slice(-5).reverse();

    function drillWeakLabel(q) {

      const t = (q.groupTitle || "") + " " + (q.text || "");

      if (/文学常识|作者|作家|诗人|朝代|别称/.test(t)) return "文学常识";

      if (/翻译|译文/.test(t)) return "句子翻译";

      if (/默写|诗句|名句|填空/.test(t)) return "古诗词默写";

      if (/赏析|作用|分析|理解|主旨|手法|启示/.test(t)) return "理解赏析";

      return q.section || "综合";

    }

    function recordDrillHistory(dayIndex, qs) {

      const recs = qs.map(q => ({ q, rec: state.examAnswers[answerKeyFor(q)] }));

      const correct = recs.filter(x => x.rec && x.rec.submitted && x.rec.correct).length;

      const rate = qs.length ? Math.round(correct / qs.length * 100) : 0;

      const stars = rate >= 90 ? 3 : rate >= 70 ? 2 : rate >= 50 ? 1 : 0;

      const score = state.drillScore || 0;

      // 防重复记录：同关卡、同分数、同答对数视为同一次完成（重做得分不同会新增一条）

      const exists = (state.drillHistory || []).some(h => h.day === dayIndex && h.score === score && h.correct === correct && h.total === qs.length);

      if (exists) return;

      const weak = {};

      recs.forEach(({ q, rec }) => {

        if (rec && rec.submitted && rec.correct) return;

        const label = drillWeakLabel(q);

        weak[label] = (weak[label] || 0) + 1;

      });

      const weakList = Object.keys(weak).map(label => ({ label, count: weak[label] })).sort((a, b) => b.count - a.count);

      const now = new Date();

      const pad = n => String(n).padStart(2, "0");

      state.drillHistory.push({

        day: dayIndex,

        date: (now.getMonth() + 1) + "/" + now.getDate() + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()),

        score, correct, total: qs.length, rate, stars, weak: weakList

      });

      saveDrillHistory();

      const pad2 = n => String(n).padStart(2, "0");

      // 0 星（正确率 < 50%）：掉落反向减分卡，回收一张已解锁的奖励

      if (stars === 0) {

        const claimedCards = (state.rewardCards || []).filter(c => c.state === "claimed");

        let lost = "";

        if (claimedCards.length) {

          const victim = claimedCards[Math.floor(Math.random() * claimedCards.length)];

          victim.state = "locked";

          lost = victim.name;

        }

        state.penaltyCards.push({ day: dayIndex, date: (now.getMonth() + 1) + "/" + now.getDate() + " " + pad2(now.getHours()) + ":" + pad2(now.getMinutes()), lost, rate });

        saveRewardCards();

        savePenaltyCards();

        return;

      }

      // 通关激活奖励卡片：普通通关激活 1 张，3 星通关额外再激活 1 张

      activateRewardCards(stars === 3 ? 2 : 1);

    function drillRelatedItems(q) {

      const text = plainQuestionText(q);

      const items = { people: [], works: [] };

      const seenPeople = new Set();

      const seenWorks = new Set();

      const addPerson = n => {

        if (n && peopleData.some(p => p.name === n) && !seenPeople.has(n)) { seenPeople.add(n); items.people.push(n); }

      };

      const addWork = (rawTitle, person) => {

        const title = String(rawTitle || "").replace(/[《》〈〉\s\n·•<>]/g, "");

        if (!title || seenWorks.has(title)) return;

        seenWorks.add(title);

        items.works.push({ title, person: person || "" });

        if (person) addPerson(person);

      };

      // 1. 文本中「作者《作品》」模式（作者名 2-6 字、前有边界）

      const rePair = /(?<![\u4e00-\u9fa5])([\u4e00-\u9fa5·]{2,6})《([^《》]{1,24})》/g;

      let mPair;

      while ((mPair = rePair.exec(text))) addWork(mPair[2], mPair[1]);

      // 2. 单独《作品》：先 peopleData.works 反查，再查内置补充表

      const re = /《([^《》]+)》/g;

      let m;

      while ((m = re.exec(text))) {

        const title = m[1].replace(/[《》〈〉\s\n·•<>]/g, "");

        if (!title || seenWorks.has(title)) continue;

        const byPeople = peopleData.find(p => (p.works || []).some(w => String(w).replace(/[《》〈〉\s\n·•<>]/g, "") === title));

        const author = byPeople ? byPeople.name : (drillWorkAuthors[title] || "");

        addWork(title, author);

      }

      // 3. 文本中出现的人物名（含别名）

      peopleData.forEach(p => {

        const names = [p.name, ...(p.aliases || [])];

        if (names.some(n => n && text.includes(n)) && !seenPeople.has(p.name)) {

          seenPeople.add(p.name);

          items.people.push(p.name);

        }

      });

      return items;

    }

    function examStatsForPerson(person) {

      const hits = examQuestionBank.filter(question => {

        const content = [question.text, question.context, question.answer, question.explanation, question.source, question.section, question.questionType].filter(Boolean).join("\n");

        return keywords.some(keyword => content.includes(keyword));

      });

        map[question.year] = (map[question.year] || 0) + 1;

        return map;

      }, {});

        const content = [question.text, question.context, question.answer, question.explanation, question.source, question.section, question.questionType].filter(Boolean).join("\n");

        return content.includes(keyword);

      })]));

      return { hits, keywords, byYear, byKeyword };

    const QUESTION_SCHEMA_VERSION = "junior-chinese-qbank-v1";

    function isQuestionEssayType(q) {
      q = q || {};
      const rawBody = stripMarkdownSource(String(q.stem || q.text || q.question || ""));
      const text = [q.type, q.answerMode, q.questionType, q.section, q.questionTitle, q.articleTitle, rawBody, q.answer].filter(Boolean).join("\n");
      return String(q.type || q.answerMode || "").trim() === "essay"
        || /作文|写作/.test(String(q.questionType || q.section || ""))
        || /题目\s*[:：].{1,80}(?:\n|$)[\s\S]*要求\s*[:：]/.test(text)
        || /^\s*\d{1,3}\s*[．.、)]\s*(?:作文|题目\s*[:：])/.test(rawBody)
        || /请以[\s\S]{1,80}为题[\s\S]{0,80}写一篇|写一篇\s*\d{2,4}\s*字|不得透露个人相关信息|不得抄袭/.test(text)
        || (!!String(q.questionTitle || "").trim() && /600\s*字|不得透露|不得抄袭|写一篇|作文/.test(text));
    }
    function extractEssayTitleFromText(value) {
      const text = stripMarkdownSource(String(value || "")).replace(/\r\n/g, "\n");
      const m = /请以[“"《]?([^”"》\n]{1,40})[”"》]?为题/.exec(text)
        || /题目\s*[:：]\s*[“"《]?([^”"》\n]{1,40})[”"》]?/.exec(text);
      if (m) return String(m[1] || "").trim();
      const firstLine = text.split(/\n+/).map(function (line) { return line.trim(); }).find(Boolean) || "";
      if (firstLine && firstLine.length <= 40 && !/[。！？；：]/.test(firstLine)) return firstLine.replace(/^\s*\d{1,3}\s*[．.、)）]\s*/, "").trim();
      return "";
    }
    function escapeRegExpSource(value) {
      return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }
    function essayDisplayParts(q) {
      q = q || {};
      const rawStem = stripMarkdownSource(String(q.stem || ""));
      const title = String(q.questionTitle || "").trim()
        || extractEssayTitleFromText(rawStem)
        || extractEssayTitleFromText(q.articleTitle)
        || extractEssayTitleFromText(q.answer);
      const articleTitle = String(q.articleTitle || "").trim();
      let material = articleTitle && articleTitle !== rawStem ? articleTitle : "";
      let body = rawStem;
      if (title) {
        body = body
          .replace(new RegExp("^\\s*(?:\\d{1,3}\\s*[．.、)）]\\s*)?题目\\s*[:：]\\s*[“\"《]?" + escapeRegExpSource(title) + "[”\"》]?\\s*(?:\\n|$)"), "")
          .replace(new RegExp("^\\s*请以\\s*[“\"《]?" + escapeRegExpSource(title) + "[”\"》]?\\s*为题[，,。]?\\s*"), "");
      }
      if (!material) {
        const materialMatch = /^(?:材料|作文材料|引用材料)\s*[:：]\s*([\s\S]*?)(?=\n\s*(?:题目|要求)\s*[:：]|\n\s*请以|$)/.exec(rawStem);
        if (materialMatch) material = materialMatch[1].trim();
      }
      if (material) {
        body = body.replace(material, "").replace(/^\s*(?:材料|作文材料|引用材料)\s*[:：]\s*/g, "").trim();
      }
      body = body
        .replace(/^\s*(?:题目|作文题目)\s*[:：]\s*/gm, "")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
      return { title, material, body };
    }

    function stripMarkdownSource(value) {
      return String(value || "")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/^\s*[-*+]\s+/gm, "")

    // 结构化单题数组 → 统一题目 markdown（## 题目 / 题干 / - A./ **答案：**/ **解析：**/ 元信息），供编辑存回、真题与题目管理导出
    function questionsToMarkdown(qs, opts) {

          if (q.__clearArticleTitle) out.push("文章名：");

          else { const mm = /^\s*([A-H])\s*[．.、)）]\s*(.*)$/.exec(String(o)); if (mm) { key = mm[1]; txt = mm[2]; } else key = String.fromCharCode(65 + i); }

        if (compact) {
          if (q.answer) out.push("", "答案：" + questionAnswerText(q.answer).trim());

          if (q.difficulty) out.push("难度：" + String(q.difficulty));

        }
        if (q.answer) out.push("", "**答案：**" + questionAnswerText(q.answer).trim());
        if (q.analysis) out.push("**解析：**" + String(q.analysis).trim());
        if (q.meta && q.meta.domain) out.push("领域：" + String(q.meta.domain));
        if (q.meta && q.meta.knowledgePoints && q.meta.knowledgePoints.length) out.push("知识点：" + String(q.meta.knowledgePoints.join("、")));
        if (q.meta && q.meta.skills && q.meta.skills.length) out.push("能力点：" + String(q.meta.skills.join("、")));
        if (q.difficulty) out.push("难度：" + String(q.difficulty));
        if (q.source) out.push("来源：" + String(q.source));
        return out.join("\n");
      }).join("\n\n");
    }

    function nextQuestionId(items) {

    function questionItemsForSegment(text, context) {

                + '</div>'
              )
            + (essayMode ? '' : renderQuestionTableEditorHtml(q, idp))
            + (essayMode ? '' : '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px">'
            + '<div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:12px;color:var(--muted)">标签(顿号分隔)</div><input data-qb-f="' + idp + 'tags" value="' + escQ((q.tags || []).join("、")) + '" style="width:100%;box-sizing:border-box;font:inherit"></div>'
            + '<div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:12px;color:var(--muted)">难度</div><select data-qb-f="' + idp + 'diff" style="width:100%;box-sizing:border-box;font:inherit">' + [1,2,3,4,5].map(function (n) { return '<option value="' + n + '"' + ((q.difficulty || 3) === n ? " selected" : "") + '>' + n + '</option>'; }).join("") + '</select></div>'
            + '</div>')

        }).join("");
        bodyEl.innerHTML = '<div class="qb-struct-wrap" style="border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff">'
          + (sectionModel
            ? renderInlineHeadingPicker({ level: 1, esc: escQ, currentText: level1StructureText(sectionModel), choices: options.level1Choices, placeholder: "填入后会在本题前新增独立一级标题" })
            : '')
          + (sectionModel
            ? renderInlineHeadingPicker({ level: 2, esc: escQ, currentText: subsectionModel ? level1StructureText(subsectionModel) : "未设置", choices: options.level2Choices, placeholder: "如：（二）阅读下文，完成第18—22题（20分）" })
            : '')
          + '<div class="qb-struct-title">'
          + '<div style="font-size:12px;color:var(--muted)">' + (addOnly ? '新增独立题目：填写完成后保存，只会生成新题记录，不会改写当前题目。' : '字段整理：仅编辑题干、选项、答案、解析；题目与文章名沿用原值，支持新增、删除重复题、复制题目和调整顺序。') + '</div>'

          + form
          + '</div>'
          + '<div class="qb-struct-actions">'

          + '<button type="button" data-qb-struct-cancel="' + si + '">取消</button>'
          + '<span style="font-size:11px;color:var(--muted)">' + (addOnly ? '本次新增 1 题' : '当前 ' + state.items.length + ' 题') + '</span>'

        bindInlineHeadingPicker(bodyEl, options);
        bodyEl.querySelectorAll('[data-qb-struct-act]').forEach(function (btn) {
          btn.onclick = function () {
            readItemsFromDom();
            const idx = Number(btn.dataset.qbStructIdx);

            if (Number.isNaN(idx) || !state.items[idx]) return;
            if (act === "del") state.items.splice(idx, 1);
            else if (act === "dup") state.items.splice(idx + 1, 0, JSON.parse(JSON.stringify(state.items[idx])));
            else if (act === "up" && idx > 0) { const tmp = state.items[idx - 1]; state.items[idx - 1] = state.items[idx]; state.items[idx] = tmp; }
            else if (act === "down" && idx < state.items.length - 1) { const tmp = state.items[idx + 1]; state.items[idx + 1] = state.items[idx]; state.items[idx] = tmp; }
            state.items = addOnly ? state.items : renumberQuestionItems(state.items);

        bodyEl.querySelectorAll('[data-qb-stem-act]').forEach(function (btn) {

            const qi = Number(btn.dataset.qbStemIdx);

              segCustomMap[si] = questionsToMarkdown(savedItems, { compact: true, startNumber: displayOffset + 1 });

              const stored = localStorage.getItem(QB_SEG_KEY);
              if (!stored) throw new Error("本地数据写入后无法读取");
            }
            if (typeof options.onPersistStructure === "function") options.onPersistStructure();
            qbShowToast("✅ 已保存结构化修改（包含难度设置）。", false);
            onDone();
          } catch (e) {
            saveBtn.disabled = false;
            saveBtn.dataset.saving = "";
            saveBtn.textContent = oldSaveText;
            qbShowToast("保存失败：" + (e && e.message || e), true);
          }
        };
        const cancelBtn = bodyEl.querySelector('[data-qb-struct-cancel="' + si + '"]');
        if (cancelBtn) cancelBtn.onclick = function () { onDone(); };
        bodyEl.__qbStructRender = render;
        bodyEl.__qbStructRead = readItemsFromDom;
      };
      render();
    }

    // 结构化预览：parseQuestions 把 markdown 解析为题目，渲染成结构化卡片(题干/选项/答案解析)，隐藏 markdown 原文标记；无题目结构则返回 null(由调用方回退原文渲染)
    // 清理同一段内重复题目：OCR/拼接时常出现同一题的短版和完整版相邻重复。
    // 只合并相邻同题号块，避免误合并不同大题中的同号子题。
    function dedupeQuestionBlocks(text) {
      const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
      const startRe = /^\s*(\d{1,3})\s*[．.、)]\s*\S/;
      const blocks = [];
      let cur = null;
      lines.forEach(function (line) {
        const m = startRe.exec(line);
        if (m) {
          if (cur) blocks.push(cur);
          cur = { no: m[1], lines: [line] };
        } else if (cur) {
          cur.lines.push(line);
        } else {
          blocks.push({ no: "", lines: [line] });
        }
      });
      if (cur) blocks.push(cur);
      const normalize = function (s) {
        return String(s || "")
          .replace(/^\s*\d{1,3}\s*[．.、)]\s*/, "")
          .replace(/[\s＿_]+/g, "")
          .replace(/[“”"'‘’（）()，。；：:、！？!?]/g, "")
          .trim();
      };
      const blockText = function (b) { return b.lines.join("\n").trim(); };
      const hasField = function (b, re) { return b.lines.some(function (line) { return re.test(line); }); };
      const merge = function (a, b) {
        const score = function (x) {
          return blockText(x).length
            + (hasField(x, /^\s*(答案|解析)\s*[:：]/) ? 120 : 0)
            + (hasField(x, /^\s*[A-H]\s*[．.、)]/) ? 80 : 0)
            + (hasField(x, /!\[[^\]]*\]\([^)]+\)|\[\[img:/) ? 80 : 0);
        };
        const primary = score(a) >= score(b) ? a : b;
        const other = primary === a ? b : a;
        const out = primary.lines.slice();
        const existing = out.map(function (line) { return normalize(line); }).filter(Boolean);
        other.lines.forEach(function (line, idx) {
          const n = normalize(line);
          if (!n) return;
          if (idx === 0 && /^\s*\d{1,3}\s*[．.、)]/.test(line)) return;
          if (existing.indexOf(n) >= 0) return;
          out.push(line);
          existing.push(n);
        });
        return { no: primary.no, lines: out };
      };
      const merged = [];
      blocks.forEach(function (b) {
        const prev = merged[merged.length - 1];
        if (prev && b.no && prev.no === b.no) {
          const p = normalize(prev.lines[0]), n = normalize(b.lines[0]);
          if (p === n || p.indexOf(n) === 0 || n.indexOf(p) === 0) {
            merged[merged.length - 1] = merge(prev, b);
            return;
          }
        }
        merged.push(b);
      });
      return merged.map(blockText).filter(Boolean).join("\n");
    }

    function renderStructured(text, displayOffset) {
      displayOffset = Number(displayOffset) || 0;
      const qs = parseQuestions(dedupeQuestionBlocks(String(text || "")));
      if (!qs.length) return null;
      // 仅当识别出真实答题特征(答案/选项/填空下划线)才用结构化卡片，避免把知识点标题、作者简介(含"？"生卒年)误当题目
      const realCount = qs.filter(function (q) { return q.answer || (q.options && q.options.length >= 2) || /＿+|_{3,}|____/.test(q.stem) || q.questionTitle || q.articleTitle || isQuestionPlaceholder(q); }).length;
      if (realCount === 0) return null;
      const typeName = QUESTION_TYPE_NAMES;
      return qs.map(function (q, idx) {
        q = normalizeQuestionStructure(q, { rawFormat: "markdown" });
        const isChoiceQuestion = q.type === "single_choice" || q.type === "multiple_choice";
        const isEssayQuestion = isQuestionEssayType(q);
        const onlineTypeLabel = isEssayQuestion ? "作文" : ((q.meta && q.meta.questionType) || QUESTION_TYPE_NAMES[q.type] || (isChoiceQuestion ? (q.type === "multiple_choice" ? "多选" : "单选") : "简答"));
        const essayParts = isEssayQuestion ? essayDisplayParts(q) : null;
        const stemText = String(isEssayQuestion ? (essayParts.body || q.stem || "") : q.stem || "");
        const stemHasChoiceLines = /(^|\n)\s*[A-H]\s*[．.、)）]/.test(stemText);
        const showOptions = !!(q.options && q.options.length && !stemHasChoiceLines);
        const dispId = "Q" + String(idx + 1 + displayOffset).padStart(3, "0");
        const titleLine = !isEssayQuestion && q.questionTitle
          ? '<div style="font-size:12px;font-weight:800;color:var(--muted);margin:2px 0 4px;line-height:1.5;text-align:left;white-space:normal">' + renderQuestionMarkup(q.questionTitle) + '</div>'
          : "";
        const articleLine = !isEssayQuestion && q.articleTitle && q.articleTitle !== q.stem
          ? '<div style="font-size:12px;color:var(--muted);margin:0 0 4px;line-height:1.5;text-align:left;white-space:normal">' + renderQuestionMarkup(q.articleTitle) + '</div>'
          : "";
        const opt = (q.options && q.options.length)
          ? '<div style="margin:6px 0 2px">' + q.options.map(function (o) {
            return '<label class="qb-option-choice"><input type="' + (q.type === "multiple_choice" ? "checkbox" : "radio") + '" name="' + esc(q.id || "q") + '"><span>' + renderQuestionMarkup(o.key + "．" + o.text) + '</span></label>';
          }).join("") + '</div>'
          : "";
        const essayAnswerLine = isEssayQuestion ? renderEssaySampleHtml(q.answer, q.questionTitle) : "";
        const essayHead = isEssayQuestion ? renderEssayHeadHtml(q) : "";
        return '<div class="qb-st-preview qb-question-card" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:#fff">'
          + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="font-size:12px;font-weight:800;color:var(--person);background:#eef7f8;border:1px solid #d5eaec;border-radius:999px;padding:1px 8px">' + esc(dispId) + '</span><span class="tag-pill" style="font-size:10px">' + esc(onlineTypeLabel) + '</span>' + (q.difficulty ? '<span style="font-size:10px;color:var(--muted)">难度 ' + esc(q.difficulty) + '</span>' : '') + '</div>'
          + essayHead
          + titleLine
          + articleLine
          + (isEssayQuestion ? "" : renderQuestionStructureChips(q))
          + '<div class="qb-question-stem" style="font-size:14px;line-height:1.7;margin:4px 0 6px;white-space:pre-wrap">' + (hasInlineSubquestionBlanks(cleanQuestionStemPlaceholders(stemText, q)) ? renderQuestionStemWithSubinputs(cleanQuestionStemPlaceholders(stemText, q), q) : renderQuestionStemWithInputs(cleanQuestionStemPlaceholders(stemText, q), q)).replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (m, alt, url) { return '<img src="' + url + '" alt="' + alt + '" style="max-width:100%;max-height:240px;display:block;margin:6px 0;border-radius:6px">'; }) + '</div>'
          + (showOptions ? opt : "")
          + renderQuestionAnswerInputs(q)
          + (isEssayQuestion ? essayAnswerLine : (q.answer ? '<div style="font-size:13px;color:#1c5a4c;margin-top:4px">🔑 答案：' + renderQuestionMarkup(q.answer) + '</div>' : ''))
          + (q.analysis ? '<div style="font-size:13px;color:#8a6d1d;margin-top:3px">💡 解析：' + renderQuestionMarkup(q.analysis) + '</div>' : '')
          + (isEssayQuestion ? "" : ((q.tags && q.tags.length) ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">🏷 ' + esc(q.tags.join("、")) + '</div>' : ''))
          + '</div>';
      }).join("");
    }

    function renderQBView() {

      const view = $("qbView");

      if (!view) return;

      const bank = window.supplementalBank;
      // 合并"清洗知识库"(clean-knowledge-bank.js)来源，幂等(marked by source id)
      try {
        if (bank && window.cleanKnowledgeBank && Array.isArray(window.cleanKnowledgeBank.sources)) {
          const exist = new Set((bank.sources || []).map(s => s && s.id));
          window.cleanKnowledgeBank.sources.forEach(function (s) {
            if (s && s.id && !exist.has(s.id)) { bank.sources = bank.sources || []; bank.sources.push(s); exist.add(s.id); }
          });
        }
      } catch (e) {}

      const srcRaw = bank ? (bank.sources.find(s => s.id === qbSource) || bank.sources[0]) : null;
      const src0 = (srcRaw && qbSource === "bk8") ? buildBk8LessonSource(srcRaw) : srcRaw;

      // ==== 26年暑假(原昂立 angli)：由 exam 逐题改为"完整题目列表"展示（样式同八上清单）====

      // 把每个讲次(groups)转成 {h:讲次标题} + {c:题目与解析全文} 的块，供段落级渲染/AI矫正/编辑

      let src = src0;

      if (src0 && qbSource === "angli" && src0.kind === "exam") {

        const blocks = [];

        // 把原文档答案(g.a)按题号挂到对应题目块末尾(答案：…)：优先用原文档标准答案，避免 AI 猜测不准
        function attachAnswers(jb, aArr) {
          // 1) 解析 aArr 为按顺序的题答案序列
          const ansSeq = [];
          let cur = null;
          let inBig = false;   // 是否处于大节(【…】或"一、二、"中文大题)答案内，其后的数字子题答案归入该大节
          // 预扫描：标记"题号行"(N．…)后是否还紧跟答案内容行。若题号行后没有独立答案行，则其同行剩余就是答案本身
          // (如 "6．赞美、自得、怡然等。（4分）"、"5．月色入户。（3分）")；若后跟答案行则为题干(如 "1．根据课文内容填空。（4分）"+下一行答案)
          const aLines = (aArr || []).map(String);
          const follow = {};
          for (let i = 0; i < aLines.length; i++) {
            if (!/^\s*\d{1,3}\s*[．、.]/.test(aLines[i])) continue;
            let has = false;
            for (let j = i + 1; j < aLines.length; j++) {
              const nt = aLines[j].trim();
              if (!nt) continue;
              if (/^\s*\d{1,3}\s*[．、.]/.test(nt) || /^[一二三四五六七八九十]{1,3}、/.test(nt) || /^【/.test(nt) || /^\s*(答案|解析)\s*[:：]/.test(nt)) { has = false; break; }
              has = true; break;
            }
            follow[i] = has;
          }
          (aArr || []).forEach(function (s, si) {
            const t = String(s);
            const bigm = /^【([^】]{1,16})】/.exec(t);
            if (bigm) {
              if (cur) ansSeq.push(cur);
              cur = { num: bigm[1], isBig: true, cn: false, text: [] };
              inBig = true;
              return;
            }
            // 中文序号大节（"一、二、…"），同【大节】：其后的①②/数字子题答案归入该大节
            const cnm = /^([一二三四五六七八九十]{1,3})、/.exec(t);
            if (cnm) {
              if (cur) ansSeq.push(cur);
              cur = { num: cnm[1] + "、", isBig: true, cn: true, text: [] };
              const rest = t.slice(cnm[0].length).trim();
              if (rest) cur.text.push(rest);
              inBig = true;
              return;
            }
            const qm = /^\s*(\d{1,3})\s*[．、.]/.exec(t);
            if (qm) {
              if (inBig) {
                // 大节内的子题答案行（如"1．（4分）好像 所以"）：并入当前大节答案
                if (!cur) { cur = { num: null, isBig: true, text: [] }; }
                cur.text.push(t);
                return;
              }
              if (cur) ansSeq.push(cur);
              cur = { num: qm[1], isBig: false, text: [] };
              const rest = t.slice(qm[0].length).trim();
              // 同行剩余仅在"该题没有单独答案行"时才是答案本身；且以"（x分）"开头者(如 （3分）D…)也算答案
              if (rest && (follow[si] === false || /^（\s*\d+\s*分\s*）/.test(rest))) cur.text.push(rest);
              return;
            }
            if (cur) { cur.text.push(t); }
            else { cur = { num: null, isBig: false, text: [t] }; ansSeq.push(cur); cur = null; }
          });
          if (cur) ansSeq.push(cur);

          // 2) 遍历块，按题号匹配并合并答案
          const used = new Set();
          const leftover = [];
          // 把大节（【翱翔拓展】等含多个子题）的答案按题号内联到各小题作答区末尾，
          // 使每题答案紧跟在对应题目之后（而不是整段答案堆在末尾）
          function inlineBigAnswers(blk, ansTxt) {
            const src = String(blk.c || "");
            // 解析答案里的子题 {题号: [行...]}
            const map = {};
            let curNum = null;
            ansTxt.split("\n").forEach(function (l) {
              const m = /^\s*(\d{1,3})\s*[．、.]\s*/.exec(l);
              if (m) { curNum = m[1]; map[curNum] = [l]; }
              else if (curNum && map[curNum]) map[curNum].push(l);
            });
            if (!Object.keys(map).length) {
              const c = src;
              blk.c = c ? c + "\n答案：" + ansTxt : "答案：" + ansTxt;
              return;
            }
            // 按行扫描 blk：遇到题号行即在它之前插入上一题的答案，使答案紧跟上一题作答区之后；
            // 最后一题的答案插在文本末尾。
            const lines = src.split("\n");
            const res = [];
            const usedKey = {};
            let anchorKey = null;
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              const mq = /^\s*(\d{1,3})\s*[．、.]\s*/.exec(line);
              if (mq && map[mq[1]] !== undefined) {
                if (anchorKey && map[anchorKey] && !usedKey[anchorKey]) {
                  res.push("答案：" + map[anchorKey].join("\n"));
                  usedKey[anchorKey] = true;
                }
                anchorKey = mq[1];
              }
              res.push(line);
            }
            if (anchorKey && map[anchorKey] && !usedKey[anchorKey]) {
              res.push("答案：" + map[anchorKey].join("\n"));
              usedKey[anchorKey] = true;
            }
            // 没匹配到题号的答案拼到末尾
            const missing = Object.keys(map).filter(k => !usedKey[k]);
            if (missing.length) {
              res.push("答案：" + missing.map(k => map[k].join("\n")).join("\n"));
            }
            blk.c = res.join("\n");
          }
          (jb || []).forEach(function (blk) {
            const h = blk.h ? String(blk.h).trim() : null;
            if (h) {
              const bigm = /^【([^】]{1,16})】/.exec(h);
              const cnm = /^([一二三四五六七八九十]{1,3})、/.exec(h);
              const qm = /^\s*(\d{1,3})\s*[．、.]/.exec(h);
              let pick = -1;
              if (bigm) {
                const want = "【" + bigm[1] + "】";
                for (let i = 0; i < ansSeq.length; i++) {
                  if (ansSeq[i].isBig && ("【" + ansSeq[i].num + "】") === want && !used.has(i)) { pick = i; break; }
                }
              } else if (cnm) {
                const want = cnm[1] + "、";
                for (let i = 0; i < ansSeq.length; i++) {
                  if (ansSeq[i].isBig && ansSeq[i].num === want && !used.has(i)) { pick = i; break; }
                }
              } else if (qm) {
                for (let i = 0; i < ansSeq.length; i++) {
                  if (!ansSeq[i].isBig && ansSeq[i].num === qm[1] && !used.has(i)) { pick = i; break; }
                }
              }
              if (pick >= 0) {
                used.add(pick);
                const ansTxt = (ansSeq[pick].text || []).filter(Boolean).join("\n");
                if (ansTxt) {
                  if (bigm || cnm) {
                    // 【翱翔拓展】/一、二、等多子题大节：按题号把答案内联到各小题作答区后；
                    // 若答案本身没有数字子题，则整体挂到该大题段末尾。
                    inlineBigAnswers(blk, ansTxt);
                  } else {
                    const c = blk.c ? String(blk.c) : "";
                    blk.c = c ? c + "\n答案：" + ansTxt : "答案：" + ansTxt;
                  }
                }
              }
            }
          });
          // 3) 未匹配到的其余答案(逻辑上属主卷未编号简答题等)：
          //    锚定到一个"内容块"末尾统一展示，避免污染【翱翔拓展】或选择题块的正确答案。
          //    优先【翱翔拓展】前最近的非选择题块，其次中文大题块，最后独立「参考答案」块。
          ansSeq.forEach(function (a, i) {
            if (used.has(i)) return;
            const txt = (a.text || []).filter(Boolean).join("\n").trim();
            if (txt) leftover.push(txt);
          });
          if (leftover.length) {
            // 选择题块标题特征：不应把其后的参考答案塞进来(避免混淆该题的正确选项)
            const isChoiceHead = (h) => /(不正确|有误|表述错误|理解错误|分析\s*…?不|说法错误|错误的一项)/.test(String(h || "")) &&
              !/(填空|默写|翻译|解释|注音|加点|赏析|概括|写法|写作)/.test(String(h || ""));
            const extIdx = (jb || []).findIndex(b => /^【[^】]*翱翔/.test(String(b.h || "")));
            const bigBlocks = (jb || []).filter(b => /^[一二三四五六七八九十]{1,3}、/.test(String(b.h || "")));
            const refText = "参考答案：\n" + leftover.join("\n\n");
            let anchor = null;
            if (extIdx > 0) {
              // 从【翱翔拓展】前一个块往前找，跳过选择题块，落到主卷的翻译/填空/解释等内容块
              for (let k = extIdx - 1; k >= 1; k--) {
                const b = jb[k];
                if (isChoiceHead(String(b.h || ""))) continue;
                anchor = b; break;
              }
              if (!anchor) anchor = jb[extIdx - 1];
            } else if (bigBlocks.length) {
              anchor = bigBlocks[0];
            }
            if (anchor) {
              const c = anchor.c ? String(anchor.c) : "";
              anchor.c = c + (c ? "\n" : "") + refText;
            } else {
              jb.push({ c: "参考答案：" + "\n" + leftover.join("\n\n") });
            }
          }
        }

        (src0.groups || []).forEach((g, gi) => {
          const jb = [];
          jb.push({ h: g.title });
          const qs = g.q || [];
          let itemH = null; let itemC = [];
          let inBigGroup = false;   // 是否在大节(【翱翔拓展】/“一、二、”小题)内，其内部内容合并为一段
          (qs).forEach((qq) => {
            const str = String(qq);
            // 大节开头：非选段的【…】标题、以及中文序号大题(一、二、…) → 开启一个大节段
            const isBigStart = /^【(?!甲|乙|丙|丁|戊|注释|注)[^】]{1,16}】/.test(str) || /^[一二三四五六七八九十]{1,3}、/.test(str);
            const isQStart = /^\s*\d+[．、.]/.test(str) || /^[①-⑩]/.test(str);
            if (isBigStart) {
              if (itemH !== null) { jb.push({ h: itemH, c: itemC.join("\n") }); }
              else if (itemC.length) { jb.push({ c: itemC.join("\n") }); }   // 保留块首前言，避免丢失
              itemH = str.trim(); itemC = [];
              inBigGroup = true;
            } else if (inBigGroup) {
              // 大节内：阅读引导 / 【甲】【乙】材料 / 数字题号 全部并入本大节段，不再拆成孤立子段
              itemC.push(str);
            } else if (isQStart) {
              if (itemH !== null) { jb.push({ h: itemH, c: itemC.join("\n") }); }
              else if (itemC.length) { jb.push({ c: itemC.join("\n") }); }
              itemH = str.trim(); itemC = [];
            } else {
              itemC.push(str);
            }
          });
          if (itemH !== null) jb.push({ h: itemH, c: itemC.join("\n") });
          else if (itemC.length) jb.push({ c: itemC.join("\n") });
          // 把原文档答案合并进该讲的各题块(标题块之前已含)
          attachAnswers(jb, g.a);
          jb.forEach(function (b) { blocks.push(b); });
        });
        src = { ...src0, kind: "notes", blocks };

      }

      // 上传条目(clean-xxx)：从 clean-knowledge-bank 读取，按 markdown 标题切块为 notes 源，
      // 使段落式渲染的「格式矫正 / AI 分析 / 编辑本段」能力适用
      if (/^clean-/.test(qbSource)) {

      // 真题题库：选中年份构建 notes 段源(每道题一段)，与 angli/bk8 统一走段式渲染；默认进入第一个试卷
      if (qbSource === "realexam") {

        const rebuilt = (typeof window.examRebuilt !== "undefined" && window.examRebuilt && window.examRebuilt[yy]) ? window.examRebuilt[yy] : null;

            (g.questions || []).forEach(function (q) {
              if (isQuestionInstructionLine(q && q.stem || "")) return;

              const noKey = realExamNo(q && q.no);

              if (noKey) renderedQuestionNos.add(noKey);
               const sourceQs = realExamBankQuestions(bankE, yy, q.no);

               const sourceContextKey = sourceContextText && sourceContextText.length > 80 ? realExamContextKey(sourceContextText) : "";

              const sourceContextTitleKey = realExamContextTitleKey(sourceContextTitle);
              if (sourceContextKey && !renderedContextKeys.has(sourceContextKey) && (!sourceContextTitleKey || !renderedContextTitleKeys.has(sourceContextTitleKey))) {

                if (sourceContextTitleKey) renderedContextTitleKeys.add(sourceContextTitleKey);
                 blocksE.push({ h: sourceContextTitle, c: sourceContextText, realExamContext: true });
              }
               const sourceStemText = sourceQs.map(function (x) { return cleanRealExamText(x && x.text); }).filter(Boolean).join("\n");
               const rebuiltStemText = cleanRealExamText(q.stem);
               const rebuiltStemHasMarkup = /\[\[(?:table|img|title|u|dot|wave):/i.test(String(q && q.stem || ""));

               const answerText = Object.prototype.hasOwnProperty.call(q || {}, "answer")

              const analysisText = [cleanRealExamAnalysis(q.analysis), analysisByNo[realExamNo(q.no)]].filter(Boolean).join("\n");
              const linesB = [];
              if (stemText) linesB.push((q.no ? q.no + "．" : "") + stemText.replace(/^\s*\d{1,3}\s*[．.、)]\s*/, ""));

               const rawImageSignal = [
                 sourceStemText,

              const needsImagePlaceholder = /\[pic\]/i.test(String(rawImageSignal || ""))

                   || /\[pic\]/i.test(String(sourceContextText || ""))

               const briefB = String(stemText || q.stem || "").replace(/\s+/g, " ").replace(/^\s*\d{1,3}\s*[．.、)]\s*/, "").slice(0, 18);
               blocksE.push({ h: (q.no || "·") + "．" + (briefB || "真题"), c: txtB, questionSchema: q });

        } else {
          const renderedContextKeys = new Set();

            const parts = [];
             const sourceContext = q && q.context ? decorateRealExamContext(yy, q.context) : "";
            const sourceContextKey = sourceContext && sourceContext.length > 80 ? realExamContextKey(sourceContext) : "";
            const sourceContextTitle = sourceContextKey ? realExamContextTitle(sourceContext) : "";
            const sourceContextTitleKey = realExamContextTitleKey(sourceContextTitle);
            if (sourceContextKey && !renderedContextKeys.has(sourceContextKey) && (!sourceContextTitleKey || !renderedContextTitleKeys.has(sourceContextTitleKey))) {
              renderedContextKeys.add(sourceContextKey);
              if (sourceContextTitleKey) renderedContextTitleKeys.add(sourceContextTitleKey);

            }
            if (sq.stem) parts.push(sq.stem);
            if (sq.options && sq.options.length) parts.push(sq.options.map(o => o.key + "．" + o.text).join("\n"));
            parts.push(...realExamAttachmentMarkdown(yy, q.number));
            if (sq.answer) parts.push("答案：" + sq.answer);
            if (sq.analysis) parts.push("解析：" + sq.analysis);
            const tq = parts.join("\n").trim();
            const brief = sq.stem.replace(/\s+/g, " ").replace(/^\s*\d{1,3}\s*[．.、)）]\s*/, "").slice(0, 18);
            blocksE.push({ h: (i + 1) + "．" + (brief || "真题") });
            if (tq) blocksE.push({ c: tq });

        }
        src = { id: "realexam-" + yy, title: yy + "年上海中考语文真题", kind: "notes", year: yy, blocks: blocksE, audit: auditRealExamYear(yy, qsE, rebuilt) };
      }





      // 题库统一 4-tab 顶栏：清洗矫正 / 26年暑假补充学习知识库(原昂立) / 八上清单 / 真题题库

      view.innerHTML = `

        ${qbSource !== "cleankb" ? '<div style="margin:0 0 8px;font-size:12px;color:var(--muted)"><span data-qb-back-home style="cursor:pointer;color:#1565c0">← 返回题库</span></div>' : ""}

      // 各库页面的「← 返回题库」统一入口
      const qbBackHome = view.querySelector("[data-qb-back-home]");
      if (qbBackHome) qbBackHome.onclick = () => { qbSource = "cleankb"; try { localStorage.setItem("peopleGraphQbSource", "cleankb"); } catch (e) {} qbLecture = null; qbCursor = 0; renderQBView(); renderSide(); };

      // 清洗知识库 / 清洗矫正 / 真题题库走独立子视图

      if (qbSource === "qbank") return renderQBMgmt(view);

      if (qbSource === "cleankb") return renderQBCleanKB(view);

      if (qbSource === "mykb") return renderQBMineKB(view);

      if (qbSource === "clean") return renderQBClean(view, src);

      if (qbSource === "realexam" && qbExamYear === null) {

        const papersD2 = (typeof examPapers !== "undefined" ? examPapers : window.examPapers) || [];

      // 真题单年：逐题用 renderQtCss 完整渲染(无多余序号/标题不重复/内容完整)；每题一个锚点供左侧题号导航定位

      // 26年暑假(原昂立 exam 源)与 bk8 走原有渲染

      if (src && src.kind === "exam") {

        if (qbLecture === null) return renderQBLectureList(view, src, true);

        return renderQBLectureMode(view, src, qbLecture);

      }

      if (!src) return;

      const body = $("qbViewBody");

      // 用户自定义块内容（localStorage，按 bk8 块索引覆盖默认内容）

      function qbCustom() {

        try { return JSON.parse(localStorage.getItem("qbBlockCustomV1") || "{}"); } catch (e) { return {}; }

      }

      function qbBold(html) {

        // 支持所见即所得保存的 <b>、以及 Markdown 风格 **加粗** 统一渲染为粗体

        return String(html).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");

      }

      function qbRenderText(t) { return esc(t); }

      function inlineFromMarkup(s) {
        // 把 [[c:色值]]/[[f:字体]]/[[s:尺寸]] 内联标记转成内联 <span>。
        // 用栈式解析器支持"同时加粗/颜色/字号"的叠加与嵌套（如 [[s:16px]][[c:red]]字[[/c]][[/s]]），
        // 非标记内容（含 ** 、<b> 等）原样保留。
        const re = /\[\[(\/)?(c|f|s):?([^\]]*)\]\]/gi;
        const styles = [];                       // 当前累积样式 {type,val}
        let out = "", last = 0, pending = "", m;
        const spanProps = () => styles.map(o => o.type === "c" ? "color:" + o.val.trim()
          : o.type === "f" ? "font-family:" + o.val.trim()
          : "font-size:" + o.val.trim());
        const emit = () => {
          if (!pending) return;
          out += styles.length ? '<span style="' + spanProps().join(";") + '">' + pending + '</span>' : pending;
          pending = "";
        };
        while ((m = re.exec(String(s)))) {
          pending += String(s).slice(last, m.index);   // 累积文本（含 **、<b> 等普通内容）
          emit();                                      // 样式变化前结算当前文本
          const close = !!m[1], type = String(m[2] || "").toLowerCase(), val = m[3];
          if (close) {
            const i = styles.map(x => x.type).lastIndexOf(type);
            if (i >= 0) styles.splice(i, 1);
          } else {
            styles.push({ type, val: String(val) });
          }
          last = m.index + m[0].length;
        }
        pending += String(s).slice(last);
        emit();
        return out;
      }
      function qbRenderBoldText(t) {

        // 先转义，再把 \n 换行、**加粗**、[[c:]]/[[f:]] 内联样式渲染

        return inlineFromMarkup(qbBold(esc(String(t || "")))).replace(/\n/g, "<br>");

      }

      function inlineTagsToMarkup(html) {
        const doc = new DOMParser().parseFromString(String(html), "text/html");
        let out = "";
        (function walk(node) {
          node.childNodes.forEach(function (n) {
            if (n.nodeType === 3) { out += n.nodeValue; return; }
            const t = n.nodeName.toUpperCase();
            if (t === "BR") { out += "\n"; return; }
            if (t === "DIV" || t === "P") { out += "\n"; walk(n); out += "\n"; return; }
            const st = (n.getAttribute && (n.getAttribute("style") || "")) || "";
            let pre = "", post = "";
            if (t === "B" || t === "STRONG") { pre = post = "**"; }
            else if (t === "FONT") {
              const c = n.getAttribute("color"), fa = n.getAttribute("face"), sz = n.getAttribute("size");
              if (c) { pre += "[[c:" + c.trim() + "]]"; post = "[[/c]]" + post; }
              if (fa) { pre += "[[f:" + fa.trim() + "]]"; post = "[[/f]]" + post; }
              if (sz) { pre += "[[s:" + sz.trim() + "]]"; post = "[[/s]]" + post; }
            } else if (t === "SPAN") {
              const mc = /\bcolor:\s*([^;"']+)/i.exec(st); if (mc) { pre += "[[c:" + mc[1].trim() + "]]"; post = "[[/c]]" + post; }
              const mf = /\bfont-family:\s*([^;"']+)/i.exec(st); if (mf) { pre += "[[f:" + mf[1].trim() + "]]"; post = "[[/f]]" + post; }
              const ms = /\bfont-size:\s*([^;"']+)/i.exec(st); if (ms) { pre += "[[s:" + ms[1].trim() + "]]"; post = "[[/s]]" + post; }
            }
            out += pre;
            walk(n);
            out += post;
          });
        })(doc.body);
        return out;
      }

      const qbCustomMap = qbCustom();

      // ===== 段落级渲染：按 h 标题分组，每大段一个编辑按钮 =====

      // 真题编辑缓存必须按年份隔离；旧版共用一个 key，会把不同年份相同段索引的内容互相覆盖。
      const QB_CLEAN_SEG_KEY = "qbSegCustomCleanV1_" + String(qbSource || "clean").replace(/[^\w-]/g, "_");

        // 只清理 (1) 非字符串、(2) 段索引越界、(3) 纯标题段却塞入了超长内容的异常项
        if (typeof raw === "object" && raw) {
          const cleaned = {};
          let changed = false;
          const segArr = segments;   // 已在其后构建完成（qbSegCustom 在 segments 之后被调用）
          Object.keys(raw).forEach(si => {
            const custom = raw[si];

            const s = segArr[Number(si)];
            if (!s) { changed = true; return; }
            const isLevel1Custom = custom.indexOf(QB_LEVEL1_JSON_PREFIX) === 0;
            // 纯标题段(无任何内容块 c)却保存了超长文本 → 判为历史污染丢弃
            const hasContent = s.blocks.some(b => (b.c || "").trim());
            if (!isLevel1Custom && !hasContent && String(custom).replace(/\s+/g, "").length > 60) { changed = true; return; }
            if (isLevel1Custom) {
              cleaned[si] = custom;
              return;
            }
            // 段默认已挂源文件「答案：」，但本地自定义却没有任何「答案：/解析：」→ 视为旧的"无答案"缓存，
            // 清除它，让本段回到默认文本（含源文件答案），保证答案始终展示
            const hasAnsInDefault = (s.blocks || []).some(b => /(答案|解析)\s*[:：]/.test(String(b.c || "")));
            const hasAnsInCustom = /(答案|解析)\s*[:：]/.test(String(custom || ""));
            if (hasAnsInDefault && !hasAnsInCustom) { changed = true; return; }
            // 兼容 V1.7 之前保存的复杂结构：读取时自动压平为当前简洁题面，
            // 避免旧 localStorage 缓存继续覆盖新增/去重后的展示。
            let migrated = custom;
            if (/^#{1,6}\s*题目\b|^\s*(领域|知识点|能力点|难度|来源)\s*[:：]/m.test(String(custom || ""))) {
              try {
                const parsed = parseQuestions(dedupeQuestionBlocks(custom)).filter(function (q) {
                  return q.answer || (q.options && q.options.length >= 2) || /＿+|_{3,}|____/.test(q.stem) || q.questionTitle || q.articleTitle || isQuestionPlaceholder(q);
                });
                if (parsed.length) migrated = questionsToMarkdown(parsed, { compact: true });
              } catch (e) {}
            }
            cleaned[si] = migrated;
            if (migrated !== custom) changed = true;
          });
          if (changed) { try { localStorage.setItem(QB_SEG_KEY, JSON.stringify(cleaned)); } catch (e) {} }
          return cleaned;
        }
        return raw;
      }

      // 把 src.blocks 按 h 标题切成大段；每段一个编辑单元

      let segments = [];

      let seg = null;

      src.blocks.forEach((blk, i) => {

        if (blk.h) { if (seg) segments.push(seg); seg = { start: i, head: blk, blocks: [blk] }; }

        else if (seg) seg.blocks.push(blk);

        else segments.push(seg = { start: i, head: null, blocks: [blk] });

      });

      if (seg) segments.push(seg);

      const expandRealExamQuestionSegments = function (list) {
        if (!(qbSource === "realexam" && String(qbExamYear || "") !== "2015")) return list;
        const out = [];
        (Array.isArray(list) ? list : []).forEach(function (s) {
          if (!s || s.__level1Extra || s.__level2Extra) { out.push(s); return; }
          const schemaItems = s.head && s.head.questionSchema
            ? expandQuestionItemsBySubs([s.head.questionSchema])
            : [];
          if (schemaItems.length > 1) {
            schemaItems.forEach(function (q, qi) {
              const nq = normalizeQuestionStructure(q, { rawFormat: "json" });
              const brief = String(nq.questionTitle || nq.articleTitle || nq.stem || "")
                .replace(/\s+/g, " ")
                .replace(/^\s*(?:\d{1,3})\s*[．.、)）]\s*/, "")
                .slice(0, 18);
              const title = String(nq.id || nq.qid || nq.number || nq.no || ("Q" + String(out.length + 1).padStart(3, "0"))) + (brief ? "．" + brief : "");
              const singleText = questionsToMarkdown([nq], { compact: true });
              out.push({
                start: s.start,
                head: Object.assign({}, s.head, { h: title, c: "", questionSchema: nq }),
                blocks: [{ h: title, c: singleText }],
                __splitFrom: s.start,
                __splitIndex: qi,
                __splitCount: schemaItems.length
              });
            });
            return;
          }
          const raw = String((s.blocks || []).map(function (blk, idx) {
            if (idx === 0 && s.head) return blk.c || "";
            return [blk.h, blk.c].filter(Boolean).join("\n");
          }).filter(Boolean).join("\n"));
          const qs = questionItemsForSegment(raw, { source: qbSource, label: s.head && s.head.h || "", index: out.length, id: "Q" + String(out.length + 1).padStart(3, "0") });
          if (!qs.length || qs.length === 1) { out.push(s); return; }
          qs.forEach(function (q, qi) {
            const nq = normalizeQuestionStructure(q, { rawFormat: "markdown" });
            const brief = String(nq.questionTitle || nq.articleTitle || nq.stem || "")
              .replace(/\s+/g, " ")
              .replace(/^\s*(?:\d{1,3})\s*[．.、)）]\s*/, "")
              .slice(0, 18);
            const title = String(nq.id || nq.qid || nq.number || nq.no || ("Q" + String(out.length + 1).padStart(3, "0"))) + (brief ? "．" + brief : "");
            const singleText = questionsToMarkdown([nq], { compact: true });
            out.push({
              start: s.start,
              head: { h: title, c: "" },
              blocks: [{ h: title, c: singleText }],
              __splitFrom: s.start,
              __splitIndex: qi,
              __splitCount: qs.length
            });
          });
        });
        return out;
      };

      segments = expandRealExamQuestionSegments(segments);

      // 章节树结构适用于真题、8上暑期、八上课内；标题记录与题目/知识段分离，避免改动原始题号。
      const QB_STRUCTURE_SCOPE = [qbSource || "unknown", qbSource === "realexam" ? (qbExamYear || "unknown") : "default"].join("_");
      const QB_LEVEL1_INSERTS_KEY = "qbLevel1Inserts_" + QB_STRUCTURE_SCOPE;
      const QB_LEVEL2_INSERTS_KEY = "qbLevel2Inserts_" + QB_STRUCTURE_SCOPE;
      const QB_QUESTION_INSERTS_KEY = "qbQuestionInserts_" + QB_STRUCTURE_SCOPE;

            { re: /^\s*([A-H])[、.．)]\s*/, cls: "qtxt-opt" },      // A. 选项

            { re: /^\s*([①-⑩])/, cls: "qtxt-circ" },                // ① 圈码

            { re: /^\s*(\d{1,3})\s*[.．、)]/, cls: "qtxt-item" }     // 1. 1． 数字条目

          ];

          function toBadge(line){

            for (const p of badgePat) {

              const m = line.match(p.re);

              if (m) return { cls: p.cls, key: m[1], rest: line.slice(m[0].length) };

            }

            return null;

          }

          let prevAns = false;

          // 层级缩进推断：0=正文/无, 1=一级(大类), 2=二级(题目/阅读引导), 3=三级(子问/圈码), 4=四级(选项)
          function indentOf(line) {
            const t = line.trim();
            if (!t) return 0;
            if (/^#/.test(t) || /^##/.test(t)) return 1;                 // markdown # / ## → 一级
            if (/^(第?[一二三四五六七八九十]{1,3}[、．,.]|（[一二三四五六七八九十]{1,3}）)/.test(t)) return 1;   // 中文序号大题 / （一）（二）
            if (/^(阅读下面|阅读下文|阅读选文|阅读文言文|阅读古诗|阅读短文)/.test(t)) return 2;   // 阅读引导 → 二级
            if (/^###/.test(t)) return 2;                                  // markdown ### → 二级
            if (/^\s*\d{1,3}\s*[.．、)]/.test(t)) return 2;                 // 数字题号 1． → 二级或三级
            if (/^（[\d一二三四五六七八九十]{1,3}）/.test(t) || /^[①-⑩]/.test(t)) return 3;  // 子问（1）/ 圈码 → 三级
            if (/^####/.test(t)) return 3;                                 // markdown #### → 三级
            if (/^[A-H][．.、)]/.test(t)) return 4;                         // 选项 A． → 四级
            return 0;
          }

          for (let i = 0; i < lines.length; i++) {

            const line = lines[i];

            let cls = "qtxt-line", content = line;

            if (/^作者[:：]/.test(line)) { cls = "qtxt-meta"; content = line; }
            else if (/^#### /.test(line)) { cls = "qtxt-h3"; content = line.slice(5); }
            else if (/^### /.test(line)) { cls = "qtxt-h2"; content = line.slice(4); }
            else if (/^## /.test(line)) { cls = "qtxt-h1"; content = line.slice(3); }
            else if (/^# /.test(line)) { cls = "qtxt-chapter"; content = line.slice(2); }
            else if (/^>\s*/.test(line)) { cls = "qtxt-quote"; content = line.replace(/^>\s*/, ""); }
            else if (/^›\s*(语句赏析|语言赏析|理解性默写|艺术特色|写作背景|诗词原文|作者简介|诗词大意|情感主旨)/.test(line)) { cls = "qtxt-kb-subhead"; content = line.replace(/^›\s*/, ""); }
            else if (/^(?:\s*\d{1,3}\s+)?[^/／]{2,40}\s*[\/／]\s*[^/／]{1,60}$/.test(line)) { cls = "qtxt-article-title"; content = line.trim(); }
            else if (/^(第?[一二三四五六七八九十]{1,3}[、．,.]|（[一二三四五六七八九十]{1,3}）)/.test(line) || /(文言文阅读|现代文阅读|古诗文阅读|说明文阅读|记叙文阅读|议论文阅读|非连续性文本阅读)/.test(line)) { cls = "qtxt-l1"; content = line; }
            else if (/^(阅读下面|阅读下文|阅读选文|阅读文言文|阅读古诗|阅读诗歌|阅读短文)/.test(line) && (line.indexOf("完成") >= 0 || line.indexOf("分）") >= 0 || line.indexOf("小题") >= 0)) { cls = "qtxt-reading"; content = line; }
            else if (!line.trim()) { cls = "qtxt-blank"; content = "\u00a0"; }

            else if (/^\s*答案[:：]/.test(line) || /^\s*解析[:：]/.test(line)) { cls = "qtxt-ans"; content = line; }

            else if (prevAns
              && !/^\s*[（(]\s*[\d一二三四五六七八九十]+分\s*[）)]\s*$/.test(line.trim())
              && !/^\s*答案\s*[:：]/.test(line)
              && !/^\s*\d{1,3}\s*[.．、)]\s*(?:问题|诗中|《|表达|描写|点明|写出|体现|词中|句中|如何|什么|有何|请结合)/.test(line)
              && !/^\s*（[\d一二三四五六七八九十]+）\s*(?:问题|诗中|《|表达|描写|点明|写出|体现|词中|句中|如何|什么|有何|请结合)/.test(line)) {

              // 「答案：/解析：」之后的多行延续（含答案里的数字子题 2．3． 与（1）（2）），继续用蓝字小字，避免子题被徽章化割断

              cls = "qtxt-ans"; content = line;

            }

            else {

              const b = toBadge(line);

              if (b) { cls = b.cls; content = `<span class="qtxt-key">${b.key}</span><span>${b.rest || ""}</span>`; }

            }

            // 段落自动间距：行是 数字条目 / ›小节 / 标题 / 选项，且上一行不是空行 → 插入间距

            const isBlockHead = /^#/.test(line) || /^›/.test(line) || cls === "qtxt-item" || cls === "qtxt-opt" || cls === "qtxt-article-title";

            if (i > 0 && !prevBlank && isBlockHead) out.push('<div class="qtxt-spacer"></div>');

            // 渲染原文的加点/波浪/下划线标记：[[dot:X]]→加点、[[wave:X]]→波浪线、[[u:X]]→下划线

            content = String(content || "").replace(/\s*\[\[(dot|wave|u):([\s\S]*?)\]\]\s*/g, (m, tp, txt) =>

              '<span class="' + (tp === "dot" ? "marked-dot" : tp === "wave" ? "marked-wave" : "marked-underline") + '">' + txt + '</span>');

            const lv = indentOf(line);
            const disp = keepSpaces(inlineFromMarkup(content || "\u00a0"));
            const sectionKey = (cls === "qtxt-h1" || cls === "qtxt-h2" || cls === "qtxt-kb-subhead")
              ? String(content || line).trim()
              : "";
            out.push(`<div class="${cls}${lv >= 2 ? " qb-lv" + lv : ""}"${sectionKey ? ' data-kb-section="' + esc(sectionKey) + '"' : ""}>${disp}</div>`);

            prevBlank = !line.trim();

            prevAns = cls === "qtxt-ans";

          }

          return out.join("");

        }

      };

      // 渲染单个块视图（标题/内容）

      const blkView = (blk) => {
        // 一体块(题目行 h + 内容 c)完整渲染；纯 h 或纯 c 块按原本方式
        const parts = [];
        if (blk.h) parts.push(`<div class="qtxt-view qb-note-head">${qbCtx.qbRenderBoldText(blk.h)}</div>`);
        if (blk.c) parts.push(`<div class="qtxt-view qb-note-line">${qbCtx.qbRenderBoldText(blk.c)}</div>`);
        if (parts.length) return parts.join("");
        const txt = blk.h || blk.c || "";
        return `<div class="qtxt-view qb-note-line">${qbCtx.qbRenderBoldText(txt)}</div>`;

      };

      // 渲染一整段：若该段有自定义则显示为一段整文，否则显示原各块（跳过开头的段标题，避免重复）

      const questionCountForSegment = (s, si) => {
        if (isEffectiveLevel1Segment(s, qbSource)) return 0;
        if (isEffectiveLevel2Segment(s, qbSource)) return 0;
        const realSi = Number.isFinite(Number(s && s.__realSi)) ? Number(s.__realSi) : si;
        const sourceText = segCustomMap[realSi] !== undefined
          ? segCustomMap[realSi]
          : (s.blocks || []).map(function (blk, idx) {
            if (idx === 0 && s.head) return blk.c || "";
            return [blk.h, blk.c].filter(Boolean).join("\n");
          }).filter(Boolean).join("\n");
        return parseQuestions(dedupeQuestionBlocks(sourceText)).filter(function (q) {
          return q.answer || (q.options && q.options.length >= 2) || /＿+|_{3,}|____/.test(q.stem) || q.questionTitle || q.articleTitle || isQuestionPlaceholder(q);
        }).length;
      };
      const questionOffsetBefore = (si) => renderSegments.slice(0, si).reduce(function (sum, item, idx) {
        return sum + questionCountForSegment(item, idx);
      }, 0);
      const questionInsertIndexForSegment = function (seg) {
        if (!(seg && seg.__questionExtra)) return -1;
        if (Number.isFinite(Number(seg.__questionExtraIndex)) && questionInserts[seg.__questionExtraIndex]) {
          return Number(seg.__questionExtraIndex);
        }
        const byId = String(seg.__questionExtraId || "").trim();
        if (byId) {
          const found = questionInserts.findIndex(function (m) {
            return String(m && m.id || "") === byId;
          });
          if (found >= 0) return found;
        }
        const curText = String((seg && seg.blocks && seg.blocks[0] && seg.blocks[0].c) || "").trim();
        const curTitle = String(seg && seg.head && seg.head.h || "").trim();
        const foundByText = questionInserts.findIndex(function (m) {
          const mt = String(m && m.text || "").trim();
          const md = String(m && m.displayId || "").trim();
          const tt = String(m && m.title || "").trim();
          return (md && md === curTitle) || (tt && tt === curTitle) || (mt && mt === curText);
        });
        if (foundByText >= 0) return foundByText;
        return -1;
      };
      const normalizeDeleteSig = function (text) {
        return String(text || "").replace(/\s+/g, "").replace(/[【】\[\]（）()]/g, "").trim();
      };
      const questionDeleteKeyForSegment = function (seg, realSi, useCurrentText) {
        if (!seg) return "";
        const title = String(seg.head && seg.head.h || "").trim();
        const body = useCurrentText ? effectiveTextForSegment(seg, realSi) : defaultTextForSegment(seg);
        return [
          qbSource || "",
          qbExamYear || qbLecture || "",
          Number.isFinite(Number(realSi)) ? String(realSi) : "",
          title,
          normalizeDeleteSig(body)
        ].join("||");
      };
      const markQuestionDeleted = function (seg, realSi, useCurrentText) {
        const key = questionDeleteKeyForSegment(seg, realSi, !!useCurrentText);
        if (!key) return;
        if (questionDeleteSigs.indexOf(key) < 0) questionDeleteSigs.push(key);
        try { localStorage.setItem(QB_QUESTION_DELETE_SIGS_KEY, JSON.stringify(questionDeleteSigs)); } catch (e) {}
      };
      const isQuestionDeleted = function (seg, realSi) {
        if (!seg) return false;
        const keys = [
          questionDeleteKeyForSegment(seg, realSi, true),
          questionDeleteKeyForSegment(seg, realSi, false)
        ].filter(Boolean);
        return keys.some(function (k) { return questionDeleteSigs.indexOf(k) >= 0; });
      };
      const updateQuestionExtraText = function (seg, text, viewSi) {
        if (!(seg && seg.__questionExtra)) return false;
        const idx = questionInsertIndexForSegment(seg);
        if (idx < 0 || !questionInserts[idx]) return false;
        const displayNo = questionOffsetBefore(Number.isFinite(Number(viewSi)) ? Number(viewSi) : 0) + 1;
        questionInserts[idx] = Object.assign({}, questionInserts[idx], {
          title: String(displayNo) + "．",
          text: String(text || "").trim()
        });
        localStorage.setItem(QB_QUESTION_INSERTS_KEY, JSON.stringify(questionInserts));
        return true;
      };
      const sectionBefore = (si) => {
        for (let i = si - 1; i >= 0; i--) {
          if (isPlaceholderExamWholePaperSegment(renderSegments[i], qbSource)) continue;
          if (isEffectiveLevel1Segment(renderSegments[i], qbSource)) return i;
        }
        return -1;
      };
      const buildExamStructureSnapshot = function () {
        const paperId = [qbSource || "unknown", qbExamYear || qbLecture || "unknown"].join(":");
        const root = [];
        let curL1 = null;
        let curL2 = null;
        const addNode = function (node) {
          if (node.type === "level1") {
            root.push(node);
            curL1 = node;
            curL2 = null;
            return;
          }
          if (node.type === "level2") {
            if (!curL1) {
              curL1 = { id: "implicit-level1", type: "level1", title: "未分组", score: "", note: "", children: [] };
              root.push(curL1);
            }
            curL1.children.push(node);
            curL2 = node;
            return;
          }
          if (curL2) curL2.children.push(node);
          else if (curL1) curL1.children.push(node);
          else root.push(node);
        };
        renderSegments.forEach(function (s, viewSi) {
          if (isPlaceholderExamWholePaperSegment(s, qbSource)) return;
          const realSi = Number.isFinite(Number(s && s.__realSi)) ? Number(s.__realSi) : viewSi;
          const defaultSeg = defaultTextForSegment(s);
          const raw = realSi >= 0 && segCustomMap[realSi] !== undefined ? segCustomMap[realSi] : defaultSeg;
          if (raw === "__QB_DELETED__") return;
          if (isEffectiveLevel1Segment(s, qbSource)) {
            const m = s.__level2Extra
              ? readLevel1Structure(level2Inserts[s.__level2ExtraIndex], s.head && s.head.h || "一级标题")
              : level1ModelForSegment(s, realSi, s.head && s.head.h || "一级标题");
            const nodeId = s.__level1Extra
              ? level1Inserts[s.__level1ExtraIndex].id
              : s.__level2Extra
              ? level2Inserts[s.__level2ExtraIndex].id
              : "seg-" + realSi;
            addNode({ id: nodeId, type: "level1", title: m.title, score: m.score, note: m.note, children: [], sourceIndex: realSi, viewIndex: viewSi });
            return;
          }
          if (isEffectiveLevel2Segment(s, qbSource)) {
            const m = level2ModelForSegment(s, s.head && s.head.h || "二级标题");
            addNode({ id: level2Inserts[s.__level2ExtraIndex].id, type: "level2", title: m.title, score: m.score, note: m.note, children: [], sourceIndex: realSi, viewIndex: viewSi });
            return;
          }
          const isContext = !!(qbSource === "realexam" && s.head && s.head.realExamContext);
          const qs = isContext ? [] : realExamQuestionItemsForSegment(s, raw, { source: qbSource, label: s.head && s.head.h || "", index: viewSi, id: "Q" + String(viewSi + 1).padStart(3, "0") });
          const contentType = qbSource === "bk8"
            ? "knowledge"
            : isContext
            ? "reading_context"
            : qs.length
            ? (qs.some(function (q) { return q.type === "essay" || String(q.questionType || "").includes("作文"); }) ? "essay_group" : "question_group")
            : "body";
          addNode({
            id: "seg-" + realSi,
            type: contentType,
            title: s.head && s.head.h || "",
            sourceIndex: realSi,
            viewIndex: viewSi,
            start: s.start,
            raw: raw,
            questions: qs.map(function (q) { return normalizeQuestionStructure(q, { rawFormat: "markdown" }); })
          });
        });
        return {
          id: paperId,
          source: qbSource || "",
          year: qbExamYear || "",
          lecture: qbLecture || "",
          updatedAt: new Date().toISOString(),
          level1Inserts: level1Inserts,
          level2Inserts: level2Inserts,
          contextInserts: contextInserts,
          questionInserts: questionInserts,
          segmentOrder: renderSegments.map(function (s) { return s.__orderId; }).filter(Boolean),
          segmentOverrides: segCustomMap,
          tree: root
        };
      };
      const saveExamStructureBackend = function () {
        if (qbYearLocked) return;
        try {
          const paper = buildExamStructureSnapshot();
          fetch(apiUrl("/api/exam-structure"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "save", paperId: paper.id, paper: paper })
          }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (res) {
              if (!res.ok) qbShowToast("⚠️ 后端结构保存失败：" + ((res.d && res.d.error) || "HTTP 错误"), true);
            })
            .catch(function (err) {
              qbShowToast("⚠️ 后端结构保存失败：" + (err && err.message || err), true);
            });
        } catch (e) {
          qbShowToast("⚠️ 结构快照生成失败：" + (e && e.message || e), true);
        }
      };
      const markExamStructureSync = function () {
        try { localStorage.setItem(QB_STRUCTURE_SYNC_KEY, "1"); } catch (e) {}
      };
      const moveSegmentByViewIndex = function (viewSi, delta) {
        const from = Number(viewSi);
        const step = Number(delta);
        if (!Number.isFinite(from) || !Number.isFinite(step) || !renderSegments[from]) return;
        const to = adjacentVisibleSegmentIndex(from, step);
        if (to < 0 || to >= renderSegments.length || !renderSegments[to]) return;
        const nextOrder = renderSegments.map(function (s) { return s.__orderId; }).filter(Boolean);
        const tmp = nextOrder[from];
        nextOrder[from] = nextOrder[to];
        nextOrder[to] = tmp;
        try {
          localStorage.setItem(QB_SEG_ORDER_KEY, JSON.stringify(nextOrder));
          segmentOrder = nextOrder;
          markExamStructureSync();
          qbShowToast("已保存段落顺序。", false);
          saveExamStructureBackend();
          renderQBView();
        } catch (e) {
          qbShowToast("⚠️ 顺序保存失败：" + (e && e.message || e), true);
        }
      };
      const placeHeadingOrderBefore = function (headingOrderId, anchorViewSi) {
        if (!headingOrderId) return;
        const anchor = renderSegments[Number(anchorViewSi)];
        const anchorId = anchor && anchor.__orderId;
        const nextOrder = renderSegments.map(function (s) { return s.__orderId; }).filter(Boolean).filter(function (id) {
          return id !== headingOrderId;
        });
        const at = anchorId ? nextOrder.indexOf(anchorId) : -1;
        if (at >= 0) nextOrder.splice(at, 0, headingOrderId);
        else nextOrder.push(headingOrderId);
        localStorage.setItem(QB_SEG_ORDER_KEY, JSON.stringify(nextOrder));
        segmentOrder = nextOrder;
      };
      const placeSegmentOrderAfter = function (orderId, anchorViewSi) {
        if (!orderId) return;
        const anchor = renderSegments[Number(anchorViewSi)];
        const anchorId = anchor && anchor.__orderId;
        const nextOrder = renderSegments.map(function (s) { return s.__orderId; }).filter(Boolean).filter(function (id) {
          return id !== orderId;
        });
        const at = anchorId ? nextOrder.indexOf(anchorId) : -1;
        if (at >= 0) nextOrder.splice(at + 1, 0, orderId);
        else nextOrder.push(orderId);
        localStorage.setItem(QB_SEG_ORDER_KEY, JSON.stringify(nextOrder));
        segmentOrder = nextOrder;
      };
      const renderSeg = (s, si) => {
        const realSi = Number.isFinite(Number(s && s.__realSi)) ? Number(s.__realSi) : si;
        const storageSi = realSi >= 0 ? realSi : si;
        if (realSi >= 0 && segCustomMap[realSi] === "__QB_DELETED__") return "";
        // 讲次标题段：纯 h 标题块(无 c)，且标题匹配当前源的讲次名 → 是该讲次的开头。
        const isGroup = !!(qbSource === "angli" && src0 && src0.groups && s.head && !s.head.c && src0.groups.some(g => g.title === s.head.h));
        // 一级标题段：真题、8上暑期、八上课内统一走章节树；章节树负责归类，题目/知识结构负责字段编辑。
        const isBk8LessonHead = !!(qbSource === "bk8" && s.head && s.head.h && isBk8LessonTitle(s.head.h));
        const isBk8TopicHead = !!(qbSource === "bk8" && s.head && s.head.h && /^[一二三四五六七八九十]{1,3}、/.test(String(s.head.h).trim()));
        const isLevel1Head = !!isGroup || !!isBk8LessonHead || !!isBk8TopicHead;
        const customStoredRaw = realSi >= 0 ? segCustomMap[realSi] : undefined;
        const customStored = customTextForSegment(s, realSi);
        const isRealExamLevel1Seg = isEffectiveLevel1Segment(s, qbSource);
        const isRealExamLevel2Seg = isEffectiveLevel2Segment(s, qbSource);
        const level1Model = isRealExamLevel1Seg
          ? (s.__level2Extra
            ? readLevel1Structure(level2Inserts[s.__level2ExtraIndex], s.head && s.head.h || "一级标题")
            : level1ModelForSegment(s, realSi, s.head && s.head.h || "一级标题"))
          : null;
        const level2Model = isRealExamLevel2Seg
          ? level2ModelForSegment(s, s.head && s.head.h || "二级标题")
          : null;
        // 默认段：段头标题已由段头 label 显示，故段首块只取内容 c（避免标题重复）；其余块取 h+c 拼整段，再用完整格式渲染
        const defaultText = s.blocks.map((blk, idx) => {
          if (idx === 0 && s.head) return blk.c || "";
          return [blk.h, blk.c].filter(Boolean).join("\n");
        }).filter(Boolean).join("\n");
        const rawLabel = s.head ? s.head.h : ("段落 " + (si + 1));
        const realExamNum = qbSource === "realexam" ? /^\s*(\d{1,3})\s*[．.、)]/.exec(String(rawLabel || "")) : null;
        const isRealExamQuestionSeg = (!!realExamNum || !!s.__questionExtra) && !isRealExamLevel1Seg && !isRealExamLevel2Seg;
        const isRealExamContextSeg = !!(qbSource === "realexam" && s.head && s.head.realExamContext);
        const contextModel = isRealExamContextSeg && (customStoredRaw !== undefined || s.__contextExtra)
          ? readRealExamContextStructure(customStored !== undefined ? customStored : customStoredRaw, s.head.h || "阅读材料")
          : null;
        const custom = contextModel ? realExamContextStructureText(contextModel) : customStored;
        const label = isRealExamLevel1Seg
          ? level1StructureText(level1Model)
          : isRealExamLevel2Seg
          ? level1StructureText(level2Model)
          : realExamNum
          ? realExamNum[1] + "．"
          : (qbSource === "bk8" && isBk8LessonTitle(rawLabel) ? normalizeBk8LessonTitle(rawLabel) : rawLabel);
        // 防重复标题：段体首行若与段头 label 相同，则移除该行（AI 分析/矫正写回时可能把题目标题行也写进来了）
        const dedupeFirst = (txt) => {
          const lt = String(txt || "");
          const keys = qbSource === "realexam" ? [rawLabel] : [label, rawLabel];
          if (qbSource === "bk8") keys.push(normalizeBk8LessonTitle(rawLabel));
          const keySet = keys.map(x => String(x || "").replace(/\s+/g, "").trim()).filter(Boolean);
          if (!keySet.length) return lt;
          const lines = lt.split("\n");
          while (lines.length && !String(lines[0] || "").trim()) lines.shift();
          const firstLine = lines[0] || "";
          const first = firstLine.replace(/\s+/g, "").trim();
