      "背影": { "intro": "朱自清散文名篇，通过父亲买橘的背影写深沉的父爱。", "full": "我与父亲不相见已二年余了，我最不能忘记的是他的背影。\n\n那年冬天，祖母死了，父亲的差使也交卸了，正是祸不单行的日子。我从北京到徐州，打算跟着父亲奔丧回家。到徐州见着父亲，看见满院狼藉的东西，又想起祖母，不禁簌簌地流下眼泪。父亲说：“事已如此，不必难过，好在天无绝人之路！”\n\n回家变卖典质，父亲还了亏空；又借钱办了丧事。这些日子，家中光景很是惨淡，一半为了丧事，一半为了父亲赋闲。丧事完毕，父亲要到南京谋事，我也要回北京念书，我们便同行。\n\n到南京时，有朋友约去游逛，勾留了一日；第二日上午便须渡江到浦口，下午上车北去。父亲因为事忙，本已说定不送我，叫旅馆里一个熟识的茶房陪我同去。他再三嘱咐茶房，甚是仔细。但他终于不放心，怕茶房不妥帖；颇踌躇了一会。其实我那年已二十岁，北京已来往过两三次，是没有什么要紧的了。他踌躇了一会，终于决定还是自己送我去。我再三劝他不必去；他只说：“不要紧，他们去不好！”\n\n我们过了江，进了车站。我买票，他忙着照看行李。行李太多了，得向脚夫行些小费才可过去。他便又忙着和他们讲价钱。我那时真是聪明过分，总觉他说话不大漂亮，非自己插嘴不可，但他终于讲定了价钱；就送我上车。他给我拣定了靠车门的一张椅子；我将他给我做的紫毛大衣铺好座位。他嘱我路上小心，夜里要警醒些，不要受凉。又嘱托茶房好好照应我。我心里暗笑他的迂；他们只认得钱，托他们只是白托！而且我这样大年纪的人，难道还不能料理自己么？唉，我现在想想，那时真是太聪明了！\n\n我说道：“爸爸，你走吧。”他往车外看了看说：“我买几个橘子去。你就在此地，不要走动。”我看那边月台的栅栏外有几个卖东西的等着顾客。走到那边月台，须穿过铁道，须跳下去又爬上去。父亲是一个胖子，走过去自然要费事些。我本来要去的，他不肯，只好让他去。我看见他戴着黑布小帽，穿着黑布大马褂，深青布棉袍，蹒跚地走到铁道边，慢慢探身下去，尚不大难。可是他穿过铁道，要爬上那边月台，就不容易了。他用两手攀着上面，两脚再向上缩；他肥胖的身子向左微倾，显出努力的样子，这时我看见他的背影，我的泪很快地流下来了。我赶紧拭干了泪。怕他看见，也怕别人看见。我再向外看时，他已抱了朱红的橘子往回走了。过铁道时，他先将橘子散放在地上，自己慢慢爬下，再抱起橘子走。到这边时，我赶紧去搀他。他和我走到车上，将橘子一股脑儿放在我的皮大衣上。于是扑扑衣上的泥土，心里很轻松似的。过一会说：“我走了，到那边来信！”我望着他走出去。他走了几步，回过头看见我，说：“进去吧，里边没人。”等他的背影混入来来往往的人里，再找不着了，我便进来坐下，我的眼泪又来了。\n\n近几年来，父亲和我都是东奔西走，家中光景是一日不如一日。他少年出外谋生，独立支持，做了许多大事。哪知老境却如此颓唐！他触目伤怀，自然情不能自已。情郁于中，自然要发之于外；家庭琐屑便往往触他之怒。他待我渐渐不同往日。但最近两年的不见，他终于忘却我的不好，只是惦记着我，惦记着我的儿子。我北来后，他写了一信给我，信中说道：“我身体平安，唯膀子疼痛厉害，举箸提笔，诸多不便，大约大去之期不远矣。”我读到此处，在晶莹的泪光中，又看见那肥胖的、青布棉袍黑布马褂的背影。唉！我不知何时再能与他相见！", "exam": [], "notes": [{ "k": "a", "text": "选自《朱自清全集》第一卷（江苏教育出版社1996年版）。" }, { "k": "b", "text": "〔差（chāi）使〕旧时指官场中临时委任的职务，后来也泛指职务或官职。" }, { "k": "c", "text": "〔狼藉（jí）〕乱七八糟的样子。" }, { "k": "d", "text": "〔簌（sù）簌〕纷纷落下的样子。" }, { "k": "e", "text": "〔典质〕把财物等典当、抵押出去。典，典当。质，抵押。" }, { "k": "f", "text": "〔赋闲〕这里指失业在家。西晋潘岳辞官家居，作《闲居赋》，后因称罢官闲居、失业无事为赋闲。" }, { "k": "a", "text": "〔勾留〕短时间停留。" }, { "k": "b", "text": "〔浦口〕地名，即今南京市浦口区，在该市西北部的长江北岸，是早年津浦铁路的终点。" }, { "k": "c", "text": "〔茶房〕旧时称在旅馆、车船等处从事供应茶水等杂务的人。" }, { "k": "d", "text": "〔踌躇（chóuchú）〕犹豫。" }, { "k": "e", "text": "〔脚夫〕旧时对搬运工人的称呼。" }, { "k": "f", "text": "〔警醒〕睡眠时容易醒来。这里是“不要睡得太沉”的意思。" }, { "k": "g", "text": "〔迂（yū）〕言行守旧，不合时宜。" }, { "k": "h", "text": "〔月台〕火车站的站台。" }, { "k": "i", "text": "〔拭（shì）〕擦。到南京时，有朋友约去游逛，勾留" }, { "k": "a", "text": "〔颓唐〕衰颓败落。" }, { "k": "b", "text": "〔自已〕抑制住自己的感情。" }, { "k": "c", "text": "〔郁〕（忧愁、气愤等）积聚。" }, { "k": "d", "text": "〔琐屑〕细小而琐碎的事。" }, { "k": "e", "text": "〔膀子〕胳膊。" }, { "k": "f", "text": "〔箸（zhù）〕筷子。" }, { "k": "g", "text": "〔大去〕委婉语，指死亡。" }] },

      "白杨礼赞": { "intro": "茅盾散文，借白杨树赞颂北方农民和民族精神。", "full": "白杨树实在是不平凡的，我赞美白杨树！\n\n当汽车在望不到边际的高原上奔驰，扑入你的视野的，是黄绿错综的一条大毯子。黄的是土，未开垦的荒地，几百万年前由伟大的自然力堆积成功的黄土高原的外壳；绿的呢，是人类劳力战胜自然的成果，是麦田，和风吹送，翻起了一轮一轮的绿波——这时你会真心佩服昔人所造的两个字“麦浪”，若不是妙手偶得，便确是经过锤炼的语言的精华。黄与绿主宰着，无边无垠，坦荡如砥，这时如果不是宛若并肩的远山的连峰提醒了你（这些山峰凭你的肉眼来判断，就知道是在你脚底下的），你会忘记了汽车是在高原上行驶。这时你涌起来的感想也许是“雄壮”，也许是“伟大”，诸如此类的形容词；然而同时你的眼睛也许觉得有点倦怠，你对当前的“雄壮”或“伟大”闭了眼，而另一种的味儿在你心头潜滋暗长了——“单调”！可不是，单调，有一点儿吧？\n\n然而刹那间，要是你猛抬眼看见了前面远远有一排——不，或者只是三五株，一株，傲然地耸立，像哨兵似的树木的话，那你的恹恹欲睡的情绪又将如何？我那时是惊奇地叫了一声的！\n\n那就是白杨树，西北极普通的一种树，然而实在是不平凡的一种树！\n\n那是力争上游的一种树，笔直的干，笔直的枝。它的干通常是丈把高，像加过人工似的，一丈以内绝无旁枝。它所有的丫枝一律向上，而且紧紧靠拢，也像加过人工似的，成为一束，绝不旁逸斜出；它的宽大的叶子也是片片向上，几乎没有斜生的，更不用说倒垂了；它的皮光滑而有银色的晕圈，微微泛出淡青色。这是虽在北方风雪的压迫下却保持着倔强挺立的一种树！哪怕只有碗那样粗细，它却努力向上发展，高到丈许，两丈，参天耸立，不折不挠，对抗着西北风。\n\n这就是白杨树，西北极普通的一种树，然而决不是平凡的树！\n\n它没有婆娑的姿态，没有屈曲盘旋的虬枝。也许你要说它不美。如果美是专指“婆娑”或“旁逸斜出”之类而言，那么，白杨树算不得树中的好女子。但是它伟岸，正直，朴质，严肃，也不缺乏温和，更不用提它的坚强不屈与挺拔，它是树中的伟丈夫！当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就觉得它只是树？难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民？难道你竟一点也不联想到，在敌后的广大土地上，到处有坚强不屈，就像这白杨树一样傲然挺立的守卫他们家乡的哨兵？难道你又不更远一点想到，这样枝枝叶叶靠紧团结，力求上进的白杨树，宛然象征了今天在华北平原纵横决荡，用血写出新中国历史的那种精神和意志？\n\n白杨不是平凡的树。它在西北极普遍，不被人重视，就跟北方的农民相似；它有极强的生命力，磨折不了，压迫不倒，也跟北方的农民相似。我赞美白杨树，就因为它不但象征了北方的农民，尤其象征了今天我们民族解放斗争中所不可缺的朴质、坚强、力求上进的精神。\n\n让那些看不起民众、贱视民众、顽固的倒退的人们去赞美那贵族化的楠木（那也是直挺秀颀的），去鄙视这极常见、极易生长的白杨树吧，我要高声赞美白杨树！", "exam": [], "notes": [{ "k": "a", "text": "选自《茅盾全集》第十二卷（人民文学出版社1986年版）。有改动。茅盾（1896—1981），原名沈德鸿，字雁冰，浙江桐乡人，作家、社会活动家，茅盾是他的笔名。代表作有小说《蚀》三部曲、《子夜》、《林家铺子》、《春蚕》等。" }, { "k": "b", "text": "〔妙手偶得〕语出陆游《文章》：“文章本天成，妙手偶得之。”指文学素养深的人出于灵感，即可偶然间得到妙语佳句。茅盾" }, { "k": "a", "text": "〔坦荡如砥（dǐ）〕宽广平坦得像磨刀石。" }, { "k": "b", "text": "〔潜滋暗长〕暗暗地生长。滋，生长。" }, { "k": "c", "text": "〔恹（yān）恹〕形容精神不振的样子。" }, { "k": "d", "text": "〔旁逸斜出〕指树枝从树干上斜着伸出来。" }, { "k": "e", "text": "〔婆娑（suō）〕形容枝叶茂盛，高下疏密有致。" }, { "k": "a", "text": "〔纵横决荡〕纵横驰骋，冲杀突击。" }, { "k": "b", "text": "〔楠（nán）木〕常绿乔木。木质坚密，是名贵的木材。" }, { "k": "c", "text": "〔秀颀（qí）〕美而高。颀，修长。" }] },

      "永久的生命": { "intro": "严文井哲理散文，阐发生命的永久与不朽。", "full": "过去了的时间永不再回来。一个人到了三十岁的边头就会发现自己丢失了一些什么：一颗臼齿，一段盲肠，一些头发，一点点和人开玩笑的兴味，这意味着他已经失去了那大半个青春。有限的岁月只能一度为你所有，它们既然离开，就永远不会再返回。智者对此也无能为力！个人生命不像一件衬衣，当你发现它脏了、破了的时候，就可以脱下它来洗涤，把它再补好。那存在过的忧愁，也许你能忘却，但却不能取消它遗留下的印迹。我们都非常可怜！\n\n人们却不应该为此感到悲观。我们没有时间悲观。我们应该看到生命自身的神奇，生命流动着，永远不朽。地面上的小草，它们是那样卑微，那样柔弱，每个严寒的冬天过去后，它们依然一根根从土壤里钻出来，欢乐地迎着春天的风，好像那刚刚过去的寒冷从未存在。一万年前是这样，一万年以后也是这样！在春天，我们以同样感动的眼光看着山坡上那些小牛犊，它们跳跳蹦蹦，炫耀它们遍身金黄的茸毛。永远的小牛犊，永远的金黄色茸毛！\n\n感谢生命的奇迹，它分开来是暂时，合起来却是永久。它是一个不懂疲倦的旅客，总是只暂时在哪一个个体内住一会儿，便又离开前去。那些个体消逝了，它却永远存在。它充满了希望，永不休止地繁殖着，蔓延着，随处宣示它的快乐和威势。\n\n我的伙伴们，我们的心应该感到舒畅。那些暴君们能够杀害许多许多人，但是他们消灭不了生命。让我们赞美生命，赞美那毁灭不掉的生命吧！我们将要以不声不响的爱情来赞美它。生命在那些终于要凋谢的花朵里永存，不断给世界以色彩，不断给世界以芬芳。\n\n凋谢和不朽混为一体，这就是奇迹。", "exam": [], "notes": [{ "k": "a", "text": "选自《严文井选集》下册（人民文学出版社2011年版）。略有改动。严文井（1915—2005），原名严文锦，湖北武昌（今武汉武昌区）人，作家。从时光一去不返、个人生命有限写起。怎样理解“生命自身”的不朽？" }, { "k": "a", "text": "选自《罗素自传》第一卷（商务印书馆2015年版）。胡作玄、赵慧琪译。有改动。罗素（1872—1970），英国哲学家、数学家、作家。获1950年诺贝尔文学奖。" }, { "k": "b", "text": "〔濒（bīn）临〕紧接，临近。" }, { "k": "a", "text": "〔毕达哥拉斯（约前580—约前500）〕古希腊数学家、哲学家。他开创了毕达哥拉斯学派，主张万物皆数，将数看作先于事物并独立于事物的世界本原。“深渊”“仙境”分别喻指什么？既然活得这么苦，为什么说是“值得”的？" }] },

      "我为什么而活着": { "intro": "罗素哲理散文，阐明活着为求知、爱与同情。", "full": "对爱情的渴望，对知识的追求，对人类苦难不可遏制的同情，这三种纯洁而无比强烈的感情支配着我的一生。这三种感情就像飓风一样，在深深的苦海上，肆意地把我吹来吹去，吹到濒临绝望的边缘。\n\n我寻求爱情，首先是因为爱情给我带来狂喜，它如此强烈以至我经常愿意牺牲生命中所有剩余的时间，来换取几小时的这种欣喜。我寻求爱情，其次是因为爱情解除孤寂——那是一颗震颤的心，在世界的边缘，俯瞰那冰冷死寂、深不可测的深渊。我寻求爱情，最后是因为在爱情的结合中，我看到圣贤和诗人们所想象的仙境的神秘缩影。这就是我所寻求的，虽然它对人生似乎过于美好，然而最终我还是得到了它。\n\n我以同样的热情寻求知识，我希望了解人的心灵。我希望知道星辰为什么闪闪发光，我试图理解毕达哥拉斯的思想威力，即数字支配着万物流转。这方面我获得一些成就，然而并不多。\n\n爱情和知识，尽其可能地把我引向云霄，但是同情心总把我带回尘世。痛苦的呼号的回声在我心中回荡。饥饿的儿童，被压迫者折磨的受害者，被儿女视为负担的无助的老人，以及充满孤寂、贫穷和痛苦的整个世界，都是对人类应有生活的嘲讽。我渴望减轻这些不幸，但是我无能为力，而且我自己也深受其害。\n\n这就是我的一生，我觉得我活着值得。如果有机会的话，我还乐意再活一次。", "exam": [], "notes": [{ "k": "a", "text": "选自《严文井选集》下册（人民文学出版社2011年版）。略有改动。严文井（1915—2005），原名严文锦，湖北武昌（今武汉武昌区）人，作家。从时光一去不返、个人生命有限写起。怎样理解“生命自身”的不朽？" }, { "k": "a", "text": "选自《罗素自传》第一卷（商务印书馆2015年版）。胡作玄、赵慧琪译。有改动。罗素（1872—1970），英国哲学家、数学家、作家。获1950年诺贝尔文学奖。" }, { "k": "b", "text": "〔濒（bīn）临〕紧接，临近。" }, { "k": "a", "text": "〔毕达哥拉斯（约前580—约前500）〕古希腊数学家、哲学家。他开创了毕达哥拉斯学派，主张万物皆数，将数看作先于事物并独立于事物的世界本原。“深渊”“仙境”分别喻指什么？既然活得这么苦，为什么说是“值得”的？" }] },

      "昆明的雨": { "intro": "汪曾祺散文，写昆明雨季的风物人情与闲适意趣。", "full": "要我给他画一张画，要有昆明的特点。\n\n我想了一些时候，画了一幅：右上角画了一片倒挂着的浓绿的仙人掌，末端开出一朵金黄色的花；左下画了几朵青头菌和牛肝菌。题了这样几行字：\n\n昆明人家常于门头挂仙人掌一片以辟邪，仙人掌悬空倒挂，尚能存活开花。于此可见仙人掌生命之顽强，亦可见昆明雨季空气之湿润。雨季则有青头菌、牛肝菌，味极鲜腴。\n\n我想念昆明的雨。\n\n我以前不知道有所谓雨季。“雨季”，是到昆明以后才有了具体感受的。\n\n我不记得昆明的雨季有多长，从几月到几月，好像是相当长的。但是并不使人厌烦。因为是下下停停，停停下下，不是连绵不断，下起来没完，而且并不使人气闷。我觉得昆明雨季气压不低，人很舒服。\n\n昆明的雨季是明亮的、丰满的，使人动情的。城春草木深，孟夏草木长。昆明的雨季，是浓绿的。草木的枝叶里的水分都到了饱和状态，显示出过分的、近于夸张的旺盛。\n\n我的那张画是写实的。我确实亲眼看见过倒挂着还能开花的仙人掌。旧日昆明人家门头上用以辟邪的多是这样一些东西：一面小镜子，周围画着八卦，下面便是一片仙人掌——在仙人掌上扎一个洞，用麻线穿了，挂在钉子上。昆明仙人掌多，且极肥大。有些人家在菜园的周围种了一圈仙人掌以代替篱笆。——种了仙人掌，猪羊便不敢进园吃菜了。仙人掌有刺，猪和羊怕扎。\n\n昆明菌子极多。雨季逛菜市场，随时可以看到各种菌子。最多，也最便宜的是牛肝菌。牛肝菌下来的时候，家家饭馆卖炒牛肝菌，连西南联大食堂的桌子上都可以有一碗。牛肝菌色如牛肝，滑，嫩，鲜，香，很好吃。炒牛肝菌须多放蒜，否则容易使人晕倒。青头菌比牛肝菌略贵。这种菌子炒熟了也还是浅绿色的，格调比牛肝菌高。菌中之王是鸡，味道鲜浓，无可方比。鸡是名贵的山珍，但并不真的贵得惊人。一盘红烧鸡的价钱和一碗黄焖鸡不相上下，因为这东西在云南并不难得。有一个笑话：有人从昆明坐火车到呈贡，在车上看到地上有一棵鸡，他跳下去把鸡捡了，紧赶两步，还能爬上火车。这笑话用意在说明昆明到呈贡的火车之慢，但也说明鸡随处可见。有一种菌子，中吃不中看，叫作干巴菌。乍一看那样子，真叫人怀疑：这种东西也能吃？！颜色深褐带绿，有点像一堆半干的牛粪或一个被踩破了的马蜂窝。里头还有许多草茎、松毛，乱七八糟！可是下点功夫，把草茎松毛择净，撕成蟹腿肉粗细的丝，和青辣椒同炒，入口便会使你张目结舌：这东西这么好吃？！还有一种菌子，中看不中吃，叫鸡油菌。都是一般大小，有一块银圆那样大，滴溜儿圆，颜色浅黄，恰似鸡油一样。这种菌子只能做菜时配色用，没甚味道。\n\n雨季的果子，是杨梅。卖杨梅的都是苗族女孩子，戴一顶小花帽子，穿着扳尖的绣了满帮花的鞋，坐在人家阶石的一角，不时吆喝一声：“卖杨梅——”声音娇娇的。她们的声音使得昆明雨季的空气更加柔和了。昆明的杨梅很大，有一个乒乓球那样大，颜色黑红黑红的，叫作“火炭梅”。这个名字起得真好，真是像一球烧得炽红的火炭！一点都不酸！我吃过苏州洞庭山的杨梅、井冈山的杨梅，好像都比不上昆明的火炭梅。\n\n雨季的花是缅桂花。缅桂花即白兰花，北京叫作“把儿兰”（这个名字真不好听）。云南把这种花叫作缅桂花，可能最初这种花是从缅甸传入的，而花的香味又有点像桂花，其实这跟桂花实在没有什么关系。——不过话又说回来，别处叫它白兰、把儿兰，它和兰花也挨不上呀，也不过是因为它很香，香得像兰花。我在家乡看到的白兰多是一人高，昆明的缅桂是大树！我在若园巷二号住过，院里有一棵大缅桂，密密的叶子，把四周房间都映绿了。缅桂盛开的时候，房东（是一个五十多岁的寡妇）就和她的一个养女，搭了梯子上去摘，每天要摘下来好些，拿到花市上去卖。她大概是怕房客们乱摘她的花，时常给各家送去一些。有时送来一个七寸盘子，里面摆得满满的缅桂花！带着雨珠的缅桂花使我的心软软的，不是怀人，不是思乡。\n\n雨，有时是会引起人一点淡淡的乡愁的。李商隐的《夜雨寄北》是为许多久客的游子而写的。我有一天在积雨少住的早晨和德熙从联大新校舍到莲花池去。看了池里的满池清水，看了着比丘尼装的陈圆圆的石像（传说陈圆圆随吴三桂到云南后出家，暮年投莲花池而死），雨又下起来了。莲花池边有一条小街，有一个小酒店，我们走进去，要了一碟猪头肉，半斤市酒（装在上了绿釉的土瓷杯里），坐了下来。雨下大了。酒店有几只鸡，都把脑袋反插在翅膀下面，一只脚着地，一动也不动地在檐下站着。酒店院子里有一架大木香花。昆明木香花很多。有的小河沿岸都是木香。但是这样大的木香却不多见。一棵木香，爬在架上，把院子遮得严严的。密匝匝的细碎的绿叶，数不清的半开的白花和饱涨的花骨朵，都被雨水淋得湿透了。我们走不了，就这样一直坐到午后。四十年后，我还忘不了那天的情味，写了一首诗：\n\n莲花池外少行人，野店苔痕一寸深。\n浊酒一杯天过午，木香花湿雨沉沉。\n\n我想念昆明的雨。\n\n1984年5月19日", "exam": [], "notes": [{ "k": "a", "text": "选自《汪曾祺全集》第4册（人民文学出版社2019年版）。略有改动。汪曾祺（1920—1997），江苏高邮人，作家。代表作有小说《受戒》《大淖记事》等。" }, { "k": "b", "text": "〔宁坤〕即巫宁坤（1920—2019），江苏扬州人，翻译家。他是作者在西南联大时的同学。" }, { "k": "c", "text": "〔青头菌和牛肝菌〕都是有名的食用菌。" }, { "k": "d", "text": "〔鲜腴（yú）〕新鲜肥美。" }, { "k": "e", "text": "〔城春草木深，孟夏草木长〕前句出自杜甫《春望》，后句出自陶渊明《读〈山海经〉》（其一）。孟夏，夏季的第一个月。汪曾祺" }, { "k": "a", "text": "〔鸡（zōnɡ）〕食用菌的一种，菌盖呈圆锥形，成熟时呈微黄色。" }, { "k": "b", "text": "〔方比〕比较，比得上。" }, { "k": "c", "text": "〔呈贡〕地名，即今昆明呈贡区。" }, { "k": "d", "text": "〔扳尖〕一种鞋子式样，呈船形，鞋头尖小而上翘。" }, { "k": "a", "text": "〔德熙〕即朱德熙（1920—1992），江苏苏州人，语言学家。当时与作者同在西南联大中文系学习。《昆明杨梅》汪曾祺作" }, { "k": "a", "text": "〔市酒〕一种在市肆上卖的比较普通的白酒。" }, { "k": "b", "text": "〔釉（yòu）〕以石英、硼砂等为原料制成的物质，涂在瓷器、陶器半成品的表面，经烧制能使成品带有玻璃光泽，并能增加其强度和绝缘性能。" }, { "k": "c", "text": "〔密匝（zā）匝〕非常浓密的样子。吴三桂到云南后出家，暮年投莲花池而死），雨又下起来了。莲花池边有一条小街，有一个小酒店，我们走进去，要了一碟猪头肉，半斤市酒" }] },

      "中国石拱桥": { "intro": "茅以昇说明文，介绍中国石拱桥的历史、结构与特点。", "full": "石拱桥的桥洞成弧形，就像虹。古代神话里说，雨后彩虹是“人间天上的桥”，通过彩虹就能上天。我国的诗人爱把拱桥比作虹，说拱桥是“卧虹”“飞虹”，把水上拱桥形容为“长虹卧波”。\n\n石拱桥在世界桥梁史上出现得比较早。这种桥不但形式优美，而且结构坚固，能几十年几百年甚至上千年雄跨在江河之上，在交通方面发挥作用。\n\n我国的石拱桥有悠久的历史。《水经注》里提到的“旅人桥”，大约建成于公元282年，可能是有记载的最早的石拱桥了。我国的石拱桥几乎到处都有。这些桥大小不一，形式多样，有许多是惊人的杰作。其中最著名的当推河北省赵县的赵州桥，还有北京丰台区的卢沟桥。\n\n赵州桥横跨在洨河上，是世界著名的古代石拱桥，也是造成后一直使用到现在的最古的石桥。这座桥修建于公元605年左右，到现在已经1300多年了，还保持着原来的雄姿。到解放的时候，桥身有些残损了，在人民政府的领导下，经过彻底整修，这座古桥又恢复了青春。\n\n赵州桥非常雄伟，全长50.82米，两端宽9.6米，中部略窄，宽约9米。桥的设计完全合乎科学原理，施工技术更是巧妙绝伦。唐朝的张嘉贞说它“制造奇特，人不知其所以为”。这座桥的特点是：（一）全桥只有一个大拱，长达37.02米，在当时可算是世界上最长的石拱。桥洞不是普通半圆形，而是像一张弓，因而大拱上面的道路没有陡坡，便于车马上下。（二）大拱的两肩上，各有两个小拱。这个创造性的设计，不但节约了石料，减轻了桥身的重量，而且在河水暴涨的时候，还可以增加桥洞的过水量，减轻洪水对桥身的冲击。同时，拱上加拱，桥身也更美观。（三）大拱由28道拱圈拼成，就像这么多同样形状的弓合拢在一起，做成一个弧形的桥洞。每道拱圈都能独立支撑上面的重量，一道坏了，其他各道不致受到影响。（四）全桥结构匀称，和四周景色配合得十分和谐；桥上的石栏石板也雕刻得古朴美观。唐朝的张说，远望这座桥就像“初月出云，长虹饮涧”。赵州桥高度的技术水平和不朽的艺术价值，充分显示了我国劳动人民的智慧和力量。桥的主要设计者李春就是一位杰出的工匠，在桥头的碑文里刻着他的名字。\n\n永定河上的卢沟桥，修建于公元1189到1192年间。桥长265米，由11个半圆形的石拱组成，每个石拱长度不一，自16米到21.6米。桥宽约8米，桥面平坦，几乎与河面平行。每两个石拱之间有石砌桥墩，把11个石拱联成一个整体。由于各拱相连，所以这种桥叫作联拱石桥。永定河发水时，来势很猛，以前两岸河堤常被冲毁，但是这座桥极少出事，足见它的坚固。桥面用石板铺砌，两旁有石栏石柱。每个柱头上都雕刻着不同姿态的狮子。这些石刻狮子，有的母子相抱，有的交头接耳，有的像倾听水声，有的像注视行人，千态万状，惟妙惟肖。\n\n早在13世纪，卢沟桥就闻名世界。那时候有个意大利人马可·波罗来过中国，他的游记里，十分推崇这座桥，说它“是世界上独一无二的”，并且特别欣赏桥栏柱上刻的狮子，说它们“共同构成美丽的奇观”。在国内，这座桥也是历来为人们所称赞的。它地处入都要道，而且建筑优美，“卢沟晓月”很早就成为北京的胜景之一。\n\n卢沟桥在我国人民反抗帝国主义侵略战争的历史上，也是值得纪念的。1937年7月7日中国军队在此抗击日本帝国主义的侵略，揭开了中国人民全面抗战的序幕。\n\n为什么我国的石拱桥会有这样光辉的成就呢？首先，在于我国劳动人民的勤劳和智慧。他们制作石料的工艺极其精巧，能把石料切成整块大石碑，又能把石块雕刻成各种形象。在建筑技术上有很多创造，在起重吊装方面更有意想不到的办法。如福建漳州的江东桥，修建于700多年前，有的石梁一块就有200来吨重，究竟是怎样安装上去的，至今还不完全知道。其次，我国石拱桥的设计施工有优良传统，建成的桥，用料省，结构巧，强度高。再其次，我国富有建筑用的各种石料，便于就地取材，这也为修造石桥提供了有利条件。\n\n两千年来，我国修建了无数的石拱桥。解放后，全国大规模兴建起各种形式的公路桥与铁路桥，其中就有不少石拱桥。1961年，云南省建成了一座世界最长的独拱石桥，名叫“长虹大桥”，石拱长达112.5米。在传统的石拱桥的基础上，我们还造了大量的钢筋混凝土拱桥，其中“双曲拱桥”是我国劳动人民的新创造，是世界上所仅有的。近几年来，全国造了总长20余万米的这种拱桥，其中最大的一孔，长达150米。我国桥梁事业的飞跃发展，表明了我国社会主义制度的无比优越。", "exam": [], "notes": [{ "k": "a", "text": "选自《桥梁史话》（北京出版社2012年版）。有删改。茅以昇（1896—1989），字唐臣，江苏镇江人，桥梁专家、教育家。" }, { "k": "b", "text": "〔旅人桥〕据记载，这座桥在河南洛阳附近，约建成于西晋时期，后来塌毁了。" }, { "k": "c", "text": "〔洨（xiáo）河〕在河北南部，流经赵县（古称赵州）。" }, { "k": "a", "text": "〔1300多年〕本文原载于1962年3月4日《人民日报》，距赵州桥兴建之时1300多年。" }, { "k": "b", "text": "〔张嘉贞（666—729）〕唐代大臣，开元年间曾任中书令。他在开元十三年（725）为整修赵州桥（当时名“石桥”）所写的《石桥铭序》中说：“制造奇特，人不知其所以为。”意思是，桥的构造很奇特，人们不知道它是怎样建成的。" }, { "k": "c", "text": "〔古朴〕朴素而有古代的风格。" }, { "k": "d", "text": "〔张（zhuó）（约658—约730）〕唐代文学家。他在《朝野佥（qiān）载》中说，赵州桥“望之如初月（一作‘日’）出云，长虹饮涧”。意思是，（赵州桥）看起来好像是穿出云层的新月，又像是入涧饮水的长虹。" }, { "k": "e", "text": "〔永定河〕海河支流。发源于山西，流经河北、北京，到天津入海河。到现在的最古的石桥。这座桥修建于公元605年左右，到现在已经1300多年" }, { "k": "a", "text": "〔惟妙惟肖（xiào）〕这里形容雕刻得十分精妙逼真。肖，相似。" }, { "k": "b", "text": "〔马可·波罗（约1254—1324）〕意大利旅行家。他于1275年到达元朝的上都（在今内蒙古正蓝旗境内），在元朝任职17年，并在多地游历。著有《马可·波罗行纪》，介绍他在东方的见闻。卢沟桥上的石狮子" }] },

      "苏州园林": { "intro": "叶圣陶说明文，说明苏州园林图画美的总体特征。", "full": "苏州园林据说有一百多处，我到过的不过十多处。其他地方的园林我也到过一些。倘若要我说说总的印象，我觉得苏州园林是我国各地园林的标本，各地园林或多或少都受到苏州园林的影响。因此，谁如果要鉴赏我国的园林，苏州园林就不该错过。\n\n设计者和匠师们因地制宜，自出心裁，修建成功的园林当然各个不同。可是苏州各个园林在不同之中有个共同点，似乎设计者和匠师们一致追求的是：务必使游览者无论站在哪个点上，眼前总是一幅完美的图画。为了达到这个目的，他们讲究亭台轩榭的布局，讲究假山池沼的配合，讲究花草树木的映衬，讲究近景远景的层次。总之，一切都要为构成完美的图画而存在，决不容许有欠美伤美的败笔。他们唯愿游览者得到“如在画图中”的美感，而他们的成绩实现了他们的愿望，游览者来到园里，没有一个不心里想着口头说着“如在画图中”的。\n\n我国的建筑，从古代的宫殿到近代的一般住房，绝大部分是对称的，左边怎么样，右边也怎么样。苏州园林可绝不讲究对称，好像故意避免似的。东边有了一个亭子或者一道回廊，西边决不会来一个同样的亭子或者一道同样的回廊。这是为什么？我想，用图画来比方，对称的建筑是图案画，不是美术画，而园林是美术画，美术画要求自然之趣，是不讲究对称的。\n\n苏州园林里都有假山和池沼。假山的堆叠，可以说是一项艺术而不仅是技术。或者是重峦叠嶂，或者是几座小山配合着竹子花木，全在乎设计者和匠师们生平多阅历，胸中有丘壑，才能使游览者攀登的时候忘却苏州城市，只觉得身在山间。至于池沼，大多引用活水。有些园林池沼宽敞，就把池沼作为全园的中心，其他景物配合着布置。水面假如成河道模样，往往安排桥梁。假如安排两座以上的桥梁，那就一座一个样，决不雷同。池沼或河道的边沿很少砌齐整的石岸，总是高低屈曲任其自然。还在那儿布置几块玲珑的石头，或者种些花草：这也是为了取得从各个角度看都成一幅画的效果。池沼里养着金鱼或各色鲤鱼，夏秋季节荷花或睡莲开放，游览者看“鱼戏莲叶间”，又是入画的一景。\n\n苏州园林栽种和修剪树木也着眼在画意。高树与低树俯仰生姿。落叶树与常绿树相间，花时不同的多种花树相间，这就一年四季不感到寂寞。没有修剪得像宝塔那样的松柏，没有阅兵式似的道旁树：因为依据中国画的审美观点看，这是不足取的。有几个园里有古老的藤萝，盘曲嶙峋的枝干就是一幅好画。开花的时候满眼的珠光宝气，使游览者感到无限的繁华和欢悦，可是没法说出来。\n\n游览苏州园林必然会注意到花墙和廊子。有墙壁隔着，有廊子界着，层次多了，景致就见得深了。可是墙壁上有砖砌的各式镂空图案，廊子大多是两边无所依傍的，实际是隔而不隔，界而未界，因而更增加了景致的深度。有几个园林还在适当的位置装上一面大镜子，层次就更多了，几乎可以说把整个园林翻了一番。\n\n游览者必然也不会忽略另外一点，就是苏州园林在每一个角落都注意图画美。阶砌旁边栽几丛书带草。墙上蔓延着爬山虎或者蔷薇木香。如果开窗正对着白色墙壁，太单调了，给补上几竿竹子或几棵芭蕉。诸如此类，无非要游览者即使就极小范围的局部看，也能得到美的享受。\n\n苏州园林里的门和窗，图案设计和雕镂琢磨功夫都是工艺美术的上品。大致说来，那些门和窗尽量工细而决不庸俗，即使简朴而别具匠心。四扇，八扇，十二扇，综合起来看，谁都要赞叹这是高度的图案美。摄影家挺喜欢这些门和窗，他们斟酌着光和影，摄成称心满意的照片。\n\n苏州园林与北京的园林不同，极少使用彩绘。梁和柱子以及门窗栏杆大多漆广漆，那是不刺眼的颜色。墙壁白色。有些室内墙壁下半截铺水磨方砖，淡灰色和白色对衬。屋瓦和檐漏一律淡灰色。这些颜色与草木的绿色配合，引起人们安静闲适的感觉。花开时节，更显得各种花明艳照眼。\n\n可以说的当然不止以上这些，这里不再多写了。", "exam": [], "notes": [{ "k": "a", "text": "选自《百科知识》1979年第4期。略有删节。原题为《“拙政诸园寄深眷”——谈苏州园林》。拙政园，苏州古典园林之一，始建于明正德年间（1506—1521）。叶圣陶（1894—1988），原名叶绍钧，江苏苏州人，作家、教育家、出版家。代表作有长篇小说《倪焕之》、童话集《稻草人》等。" }, { "k": "b", "text": "〔轩〕有窗户的廊子或小屋。" }, { "k": "c", "text": "〔榭（xiè）〕建筑在台上的房屋。" }, { "k": "a", "text": "〔胸中有丘壑（hè）〕意思是设计者和匠师们有关于山水风景的高明构思。丘壑，山陵与溪谷，喻指深远的意境。成绩实现了他们的愿望，游览者来到园里，没有一个不心里想着口头说着“如在画图中”的。我国的建筑，从古代的宫殿到近代的一般住房，绝大部分是对称的，左边怎么样，右边也怎么样。苏州园林可绝不讲究对称，好像故意避免似的。东边有了一个亭子或者一道回廊，西边决不会来一个同样的亭子或者一道同样的回廊。这是为什么？我想，用图画来比方，对称的建筑是图案画，不是美术画，而园林是美术画，美术画要求自然之趣，是不讲究对称的。苏州园林里都有假山和池沼。假山的堆叠，可以说是一项艺术而不仅是技术。或者是重峦叠嶂，或者是几座小山配合着竹子花木，全在乎设计者和匠师们生平多阅历，胸中有丘壑" }, { "k": "a", "text": "〔嶙峋（línxún）〕枯瘦的样子。" }, { "k": "b", "text": "〔阶砌〕台阶。" }, { "k": "c", "text": "〔广漆〕天然漆的一种。由熟漆或生漆加入熟桐油调制而成，棕黑色。" }, { "k": "d", "text": "〔檐漏〕屋檐下面承接雨水的横槽。" }] },

      "人民英雄永垂不朽": { "intro": "周定舫参观记，介绍人民英雄纪念碑及碑文浮雕。", "full": "人民英雄纪念碑落成了。我怀着万分崇敬的心情，瞻仰了这座巍峨、雄伟、庄严的纪念碑。\n\n我从东长安街向天安门广场走去，未进入广场就望见纪念碑。它像顶天立地的巨人一样矗立在广场南部，和天安门遥遥相对，在远处就可以看到毛主席亲笔题的“人民英雄永垂不朽”八个金色大字。我越过广场，踏着橘黄色花岗石石道，徐徐走到纪念碑台阶前，从近处仔细瞻仰纪念碑。\n\n这座纪念碑是根据1949年9月30日中国人民政治协商会议第一届全体会议的决议兴建的。当天傍晚，毛主席率领全体与会代表为纪念碑举行了庄严隆重的奠基礼，毛主席亲自执锨铲土，为纪念碑奠定基石。从1952年8月1日动工兴建以来，得到了全国人民的热情支援和关怀。这是中国自古以来最大的一座纪念碑，从地面到碑顶高达37.94米，有10层楼那么高，比纪念碑对面的天安门还高4.24米。纪念碑是用17000余块坚硬的花岗石和洁白的汉白玉砌成的。它象征着先烈们的丰功伟绩，标志着全国人民对先烈的怀念。\n\n我踏上花岗石铺成的台阶，到了第二层平台。纪念碑四周围绕着汉白玉栏杆，栏杆的形状和天安门前金水桥的汉白玉栏杆一样，美观朴素，洁白耀眼，使挺拔的碑身显得更加庄严、雄伟。碑的正面朝北，在一块60吨重、14.7米高的碑心石上，有毛主席题的“人民英雄永垂不朽”八个镏金大字，闪闪发光。这八个字是碑的主题。在碑身背面，一行行镏金字整齐地排列着，这是毛主席亲自起草、周总理亲笔书写的碑文。碑文是：\n\n三年以来，在人民解放战争和人民革命中牺牲的人民英雄们永垂不朽！\n\n三十年以来，在人民解放战争和人民革命中牺牲的人民英雄们永垂不朽！\n\n由此上溯到一千八百四十年，从那时起，为了反对内外敌人，争取民族独立和人民自由幸福，在历次斗争中牺牲的人民英雄们永垂不朽！\n\n碑身东西两侧上部，刻着红星、松柏和旗帜组成的装饰花纹，象征着先烈们的革命精神万年长存。小碑座的四周，雕刻着牡丹花、荷花、菊花等组成的八个大花圈，这些花朵象征着英雄们品质高尚、纯洁，表示全国人民对他们的永远怀念和敬仰。碑顶是民族传统的建筑形式，是上有卷云下有重幔的小庑殿顶。整个纪念碑的造型使人们感到既有民族风格，又有鲜明的新时代精神。\n\n10块汉白玉的大浮雕，镶嵌在大碑座的四周。这些大浮雕高2米，合在一起共长40.68米。据地质学家化验证明，这些浮雕至少能耐800~1000年之久。大部分浮雕里有20个左右英雄人物，每个人物都和真人一样大小，他们的面貌、表情和姿态都不相同。\n\n从碑身东面起，按着历史顺序瞻仰。第一幅浮雕是“销毁鸦片烟”，描述了鸦片战争前夕，1839年6月3日，群众在虎门销毁鸦片的事迹。浮雕上，愤怒的群众正在把一箱箱毒害中国人民的鸦片运到海边，倾倒在放有石灰的窖坑里销毁，一股股浓烟从石灰池上升起。人群后面，有炮台和千百只待发的战船，准备随时还击英帝国主义的挑衅。画面上人物的形象，表现出中国人民反抗帝国主义的坚定决心。东面的第二幅浮雕，描写1851年太平天国的“金田起义”。太平天国提出政治、经济、民族、男女四大平等的口号，严重地动摇了清朝封建统治的基础。在这幅浮雕上，一群拿着大刀、梭镖、锄头，扛着土炮起义的汉族、壮族儿女，正从山坡冲下来，革命的旌旗在迎风飘扬。\n\n往南转到碑身的后面，看到的是1911年辛亥革命“武昌起义”的庄严画面。深夜，起义的新军和市民，摧毁了湖广总督府门前的大炮，正向总督府里冲去。总督府内熊熊的火焰冒向天空；总督府的牌子，被打断在阶前；撕碎了的清朝的龙旗，被践踏在地下。辛亥革命，结束了两千多年来的封建帝制。接下来的一幅是“五四爱国运动”。这是中国民主革命由旧民主主义革命转变为新民主主义革命的转折点。浮雕的画面显示出学生们齐集于天安门前举行爱国示威游行的情景。一群男女青年学生，举着“废除卖国密约”的旗帜，慷慨激昂地来到天安门前。梳着髻子、系着长裙的女学生，在向市民们散发传单。人群高处，一个男学生正在向围着他的群众演说。愤激的青年演说者，怒形于色的人群，使整个浮雕充满了痛恨卖国贼、激动人心的气氛。南面的第三幅是“五卅运动”。1925年5月30日，上海群众一万多人在南京路上举行反帝国主义大示威，英国巡捕向徒手群众开枪射击，死伤多人。“五卅惨案”引起了全上海以至全国人民的极大愤慨，促使全国范围的大革命风暴的爆发。这幅浮雕表现出由工人阶级领导的各界人民坚强不屈地向帝国主义斗争的情景。画面上成千上万的工人、学生、市民举着“打倒帝国主义”的小旗，冲破英国巡捕的沙袋、铁丝网英勇地前进；商店关门罢市，戴着礼帽的商人也加入了斗争的行列；被打伤的工人，在战友们搀扶下，继续勇往直前。人群后面，隐约看到外滩的海关和银行大楼。\n\n碑身的西面，第一幅是“八一南昌起义”的浮雕。画面从一个连队的角度来表现这一伟大起义的情景。1927年8月1日凌晨，一个指挥员挥着左手向战士们宣布起义，士兵们举着起义的信号——马灯，光辉的红旗举起来了，战马在呼啸，劳动人民在帮助搬运子弹，战士们激昂地高呼着。南昌起义，向国民党反动派打响了第一枪，展开了以革命武装反对反革命武装的斗争。紧接着的一幅是“抗日敌后游击战”，浮雕上显现出抗日战争时期太行山区敌后游击战的场面。远远望去，在一座雄伟峻峭的山里，游击队员们正穿过高大的树林和茂密的青纱帐，去和敌人战斗。画面上，青年男女农民拿着铁铲，背着土制地雷；白发的母亲送枪给儿子，去打击日本侵略者；年轻小伙子站在指挥员身旁，等候命令，准备随时投入消灭敌人的战斗。\n\n最后来到碑身的正面，看到解放战争时期人民解放军百万雄师“胜利渡长江，解放全中国”的浮雕，这是十幅浮雕中最大的一幅。国民党认为不能逾越的天堑长江，被英勇无敌的人民解放军胜利地渡过了。浮雕上，号兵吹起冲锋号；指挥员右手高举，连连向高空发射信号弹；已登上敌岸的战士，踏着反动派的旗子，向国民党反动统治的老巢——南京城冲去；后面数不清的战船正在波涛中前进。在这幅浮雕的两旁，是两块装饰性的浮雕。右边，是渡江前夕，工人抬担架、农民运军粮、妇女送军鞋等热烈支援前线的场面。左边的一块，表现全国各阶层人民举着红旗和鲜花，捧着水果，欢迎解放军、慰劳解放军的情景。\n\n看完了所有的浮雕，我又一次瞻仰了“人民英雄永垂不朽”几个大字和碑文。我想，人们从这里可以了解到中国革命所经过的艰苦道路，先烈们的光辉业绩，中国人民为了取得自由、解放而付出的巨大代价。当我走下台阶、离开纪念碑的时候，我再一次向在历次斗争中牺牲的人民英雄们默默致敬。", "exam": [], "notes": [{ "k": "a", "text": "选自1958年4月23日《人民日报》。有改动。周定舫（1931—1993），浙江定海人，记者。人民英雄纪念碑落成了。我怀着万分崇敬的心情，瞻仰了这座巍峨、雄伟、庄严的纪念碑。我从东长安街向天安门广场走去，未进入广场就望见纪念碑。它像顶天立地的巨人一样矗立在广联系“巍峨”“雄伟”“庄严”“顶天立地”等词语，体会人民英雄纪念碑的整体特点。人民英雄纪念碑" }, { "k": "a", "text": "〔花岗石〕指用花岗岩等加工而成的石材。花岗岩质地坚硬，色泽美丽，是很好的建筑材料。" }, { "k": "b", "text": "〔中国人民政治协商会议〕中国共产党领导的多党合作和政治协商的重要机构，是以工农联盟为基础，有各民主党派、无党派人士、人民团体、少数民族人士和各界爱国人士参加的最广泛的爱国统一战线组织。" }, { "k": "c", "text": "〔汉白玉〕一种白色的大理石，质地致密，是上等的建筑和雕刻材料。" }, { "k": "d", "text": "〔镏（liú）金〕将金子溶解在水银中，涂饰于器物表面，可以经久不褪色。" }, { "k": "a", "text": "〔上溯〕从现在往以前推。" }, { "k": "b", "text": "〔重幔（màn）〕重叠的帷幕。这里指重幔形状的浮雕图案。" }, { "k": "c", "text": "〔庑（wǔ）殿顶〕中国传统建筑屋顶形式之一。由四个倾斜的屋面、一条正脊和四条斜脊构成，屋角和屋檐向上翘起，屋面略微弯曲。既按空间顺序全面介绍，又突出重点，不平均用力。逐一介绍十幅大浮雕，缓缓展开人民英雄奋勇抗争、前赴后继的革命历史全景图。" }, { "k": "a", "text": "〔巡捕〕帝国主义在旧中国租界设置的警察。《五四运动》滑田友塑适当展开想象，变画面为场景，移过往到眼前，凸显浮雕的传神之处。" }, { "k": "a", "text": "〔外滩〕上海市外白渡桥至金陵东路沿黄浦江西岸地区。因处于上海旧城之外，故名外滩。19世纪中叶起，外国殖民主义者以此地为重要据点，陆续建设了银行、海关、洋行、领事馆、饭店等建筑。" }, { "k": "b", "text": "〔青纱帐〕指大片高粱、玉米等长得又高又密，好像青纱制成的帐幕。抗日战争时期，中国共产党领导敌后游击战争，常以青纱帐作为掩护。继续勇往直前。人群后面，隐约看到外滩" }, { "k": "a", "text": "〔天堑（qiàn）〕天然形成的隔断交通的大沟，多指长江，形容它的险要。的浮雕，这是十幅浮雕中最大的一幅。国民党认为不能逾越的天堑" }] },

      "梦回繁华": { "intro": "毛宁说明文，介绍《清明上河图》的画作内容与艺术价值。", "full": "舟车、市街、桥梁、城郭。除《清明上河图》外，还有《西湖争标图》相传为他所画。据后代文人考订，《清明上河图》可能作于政和至宣和年间（1111—1125）。那正是北宋统治者在覆灭之前大造盛世假象，以此掩盖内忧外患的时期。建炎之后，南渡的北宋遗民怀念故土，在他们眼中，这幅图卷必有其特殊的意义，正是他们回首故土、梦回繁华的写照。透过此一观念来审视这幅千古名作，我们会发觉那隐藏于繁华背后的心情。\n\n张择端画的《清明上河图》，绢本，设色，纵24.8厘米，横528.7厘米。作品描绘了都城汴京从城郊、汴河到城内街市的繁华景象。整个长卷犹如一部乐章，由慢板、柔板，逐渐进入快板、紧板，转而进入尾声，留下无尽的回味。\n\n画面开卷处描绘的是汴京近郊的风光。疏林薄雾，农舍田畴，春寒料峭，赶集的乡人驱赶着往城内送炭的毛驴驮队。在进入大道的岔道上，是众多仆从簇拥的轿乘队伍，从插满柳枝的轿顶可知是踏青扫墓归来的权贵。近处小路上骑驴而行的则是长途跋涉的行旅。树木新发的枝芽，调节了画面的色彩和疏密，表现出北国早春的气息。画面中段是汴河两岸的繁华情景。汴河是当时南北交通的孔道，也是北宋王朝国家漕运的枢纽。巨大的漕船，舳舻相接，忙碌的船工从停泊在河边的粮船上卸下沉重的粮包，纤夫们拖着船逆水行驶，一片繁忙景象。汴河上有一座规模宏敞的拱桥，其桥无柱，以巨木虚架而成，结构精美，宛如飞虹。桥的两端紧连着街市，车水马龙，热闹非凡。一艘准备驶过拱桥的巨大漕船的细节描绘，一直为人们所称道：船正在放倒桅杆准备过桥，船夫们呼唤叫喊，握篙盘索。桥上呼应相接，岸边挥臂助阵，过往行人聚集在桥头围观。而那些赶脚、推车、挑担的人们，却无暇一顾。这紧张的一幕，成为全画的一个高潮。后段描写汴京市区的街道。在高大雄伟的城楼两侧，街道纵横，房屋林立，茶坊、酒肆、脚店、肉铺、寺观、茅厕等一应俱全。各类店铺经营着罗锦布匹、沉檀香料、香烛纸马。另有医药门诊、大车修理、看相算命、修面整容，应有尽有。街上行人摩肩接踵，络绎不绝，士农工商，男女老少，各行各业，无所不备。\n\n《清明上河图》采用了中国传统绘画特有的手卷形式，以移动的视点摄取对象。全图内容庞大，却繁而不乱，长而不冗，段落清晰，结构严谨。画中人物有五百多个，形态各异。采用兼工带写的手法，线条遒劲，笔法灵动，有别于一般的界画。《清明上河图》是一幅写实性很强的作品，画中所绘景物，与文献中有关汴京的记载基本一致。《东京梦华录》中所记述的街巷、酒楼、饮食果子，以及“天晓诸人入市”“诸色杂卖”等，都能在这画面中找到生动的图释。画中的“孙羊店”“脚店”等，与《东京梦华录》中所记的“曹婆婆肉饼”“正店七十二户……其余皆谓之脚店”等，无有不符。画面细节的刻画也十分真实，如桥梁的结构，车马的样式，人物的衣冠服饰，各行各业人员的活动，皆细致入微。它不是一般热闹场面的记录，而是通过对各阶层人物活动的生动描绘，深刻地揭示出这一特定历史时期的社会生活状况。画中丰富的内容，有着文字无法取代的历史价值，在艺术表现的同时，也是为12世纪中国城市生活状况留下的重要形象资料。", "exam": [], "notes": [{ "k": "a", "text": "选自《中外绘画名作八十讲》（广西师范大学出版社2004年版）。有改动。" }, { "k": "b", "text": "〔坊〕城市中居民聚居的地方。" }, { "k": "c", "text": "〔市〕城市中划定的贸易场所或商业区。" }, { "k": "d", "text": "〔汴（biàn）京〕北宋定都于东京开封府（今河南开封），因唐时为汴州，故称“汴京”。" }, { "k": "e", "text": "〔东武〕地名，今山东诸城。" }, { "k": "f", "text": "〔徽宗〕即宋徽宗赵佶（jí）。下文中的“政和”“宣和”均是他的年号。" }, { "k": "g", "text": "〔界画〕中国画的一种。作画时使用界笔、直尺，主要题材是宫室、楼台、屋宇等。" }, { "k": "h", "text": "〔工〕善于（画）。" }, { "k": "i", "text": "〔建炎〕宋高宗赵构的年号（1127—1130）。" }, { "k": "j", "text": "〔绢本〕写在绢上或画在绢上的字画。" }, { "k": "k", "text": "〔设色〕（绘画）涂色，着色。!2〔汴河〕古运河名。隋炀帝大业元年（605）开通济渠，分东、西两段，东段被称为汴河。" }, { "k": "a", "text": "〔慢板〕与下文的柔板、快板、紧板等都是音乐术语，表示音乐的节拍。" }, { "k": "b", "text": "〔跋涉〕爬山过水，形容旅途艰苦。" }, { "k": "c", "text": "〔孔道〕必经之道。" }, { "k": "d", "text": "〔漕运〕旧时指国家利用水道调运粮食。" }, { "k": "e", "text": "〔舳舻（zhúlú）相接〕船只首尾衔接。舳，船尾。舻，船头。" }, { "k": "f", "text": "〔脚店〕供人临时歇脚的小客店。《清明上河图》（局部）〔宋〕张择端作" }, { "k": "a", "text": "〔沉檀（tán）〕沉香木和檀香。二者均为香木。" }, { "k": "b", "text": "〔摩肩接踵（zhǒng）〕肩挨肩，脚碰脚。形容人很多，很拥挤。踵，脚后跟。" }, { "k": "c", "text": "〔络绎（yì）不绝〕（人、车等）往来不断，前后相接。" }, { "k": "d", "text": "〔手卷〕裱成横幅的书画长卷，供案头观赏，能卷舒，不能悬挂。" }, { "k": "e", "text": "〔兼工带写的手法〕工笔与写意相结合的绘画手法。工笔与写意都是国画的画法，工笔用笔工整，注意细部的描绘；写意用笔不求工细，注重表现神态和抒发作者的情趣。" }, { "k": "f", "text": "〔遒劲（qiújìng）〕雄健有力。" }, { "k": "g", "text": "〔《东京梦华录》〕笔记著作，南宋孟元老撰。追述北宋都城汴京的城市面貌、岁时物产、风土习俗等。茅厕等一应俱全。各类店铺经营着罗锦布匹、沉檀" }] },

      "愚公移山": { "intro": "《列子》寓言，写愚公不畏艰险移山，歌颂恒心与毅力。", "full": "太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。\n北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”杂曰：“投诸渤海之尾，隐土之北。”遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。\n河曲智叟笑而止之曰：“甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？”北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”河曲智叟亡以应。\n操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。", "exam": [], "notes": [{ "k": "a", "text": "选自《列子·汤问》（《列子集释》，中华书局2013年版）。题目为编者所加。" }, { "k": "b", "text": "〔太行、王屋〕山名。太行山起自北京，绵延于山西、河北之间，南抵黄河沿岸。王屋山在山西阳城、垣（yuán）曲与河南济源之间。" }, { "k": "c", "text": "〔方〕古代计量面积用语。后面加上表示长度的数字或数量词，表示纵横若干长度。" }, { "k": "d", "text": "〔冀（jì）州〕古地名，包括今河北、山西、河南黄河以北、辽宁辽河以西地区。" }, { "k": "e", "text": "〔河阳〕古地名，今河南孟州西。" }, { "k": "f", "text": "〔且〕将近。" }, { "k": "g", "text": "〔惩〕苦于。" }, { "k": "h", "text": "〔塞（sè）〕阻塞。" }, { "k": "i", "text": "〔迂（yū）〕曲折，绕远。" }, { "k": "j", "text": "〔聚室而谋〕集合全家来商量。室，家人。" }, { "k": "k", "text": "〔汝〕代词，你们。" }, { "k": "l", "text": "〔毕力平险〕尽全力铲除险峻的大山。毕，尽、全。" }, { "k": "m", "text": "〔指通豫南〕一直通向豫州南部。指，指向，这里是“一直”的意思。豫，豫州，古地名，今河南黄河以南一带。" }, { "k": "n", "text": "〔汉阴〕汉水南岸。阴，指山的北面、水的南岸，与“阳”相对。!5〔杂然相许〕纷纷表示赞同。杂然，纷纷地。许，赞同。!6〔献疑〕提出疑问。!7〔曾（zēng）不能损魁父之丘〕连魁父这样的小山丘都不能削减。曾，用在“不”前，加强否定语气，可译为“连……都……”。魁父，小山名。" }, { "k": "a", "text": "〔如太行、王屋何〕能把太行山、王屋山怎么样？如……何，把……怎么样。" }, { "k": "b", "text": "〔且焉置土石〕况且往哪里放置土石呢？且，况且。焉，往哪里、在哪里。置，放置、安放。" }, { "k": "c", "text": "〔投诸渤海之尾，隐土之北〕把它扔到渤海边上，隐土北面去。诸，相当于“之于”。隐土，古地名。" }, { "k": "d", "text": "〔荷（hè）担者三夫〕三个能挑担的人。荷，肩负、扛。" }, { "k": "e", "text": "〔叩石垦壤〕凿石头，挖泥土。" }, { "k": "f", "text": "〔箕畚（jīběn）〕用竹篾、柳条等编织的器具。这里是“用箕畚”的意思。" }, { "k": "g", "text": "〔京城〕复姓。" }, { "k": "h", "text": "〔孀（shuānɡ）妻〕丧夫的妇人。" }, { "k": "i", "text": "〔遗男〕指死了父亲的男孩。" }, { "k": "j", "text": "〔始龀（chèn）〕刚刚换牙，指七八岁。始，才、刚。龀，换牙。" }, { "k": "k", "text": "〔寒暑易节，始一反焉〕冬夏换季，才往返一次。易，更替。节，季节。反，同“返”，往返。焉，语气词。" }, { "k": "l", "text": "〔河曲〕河流迂曲的地方。" }, { "k": "m", "text": "〔叟〕老年男子。" }, { "k": "n", "text": "〔甚矣，汝之不惠〕意思是，你也太不聪明了！甚，严重。惠，同“慧”，聪明。" }, { "k": "o", "text": "〔残年余力〕老迈的年纪和残余的气力。" }, { "k": "p", "text": "〔毛〕指草木。" }, { "k": "q", "text": "〔其〕加强反问语气。" }, { "k": "r", "text": "〔长息〕长叹。" }, { "k": "s", "text": "〔汝心之固，固不可彻〕你思想顽固，顽固到不可通达的地步。彻，通达。" }, { "k": "t", "text": "〔不若〕不如，比不上。" }, { "k": "u", "text": "〔弱子〕幼儿，小孩。" }, { "k": "v", "text": "〔虽〕即使。" }, { "k": "w", "text": "〔穷匮（kuì）〕穷尽。" }, { "k": "x", "text": "〔苦〕愁苦。这里指担心。" }, { "k": "y", "text": "〔亡（wú）以应〕没有话来回答。" }, { "k": "z", "text": "〔操蛇之神〕神话中的山神，手里抓着蛇，所以叫操蛇之神。@7〔惧其不已〕害怕他不停地挖下去。已，停止。@8〔帝〕指神话中的天帝。@9〔感其诚〕被他的诚心所感动。#0〔夸蛾氏〕神话中的大力神。#1〔一厝（cuò）朔东〕一座放在朔方东部。厝，放置、安放。朔，朔方，地名，大体在黄河中游今宁夏、陕西、山西一带。#2〔雍〕雍州，今陕西、甘肃一带。#3〔陇断〕山冈阻隔。陇，同“垄”，高地。断，隔绝。何" }] },

      "周亚夫军细柳": { "intro": "司马迁《史记》节选，写周亚夫治军严明、刚正不阿。", "full": "文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：以备胡。\n上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰：“天子且至！”军门都尉曰：“将军令曰‘军中闻将军令，不闻天子之诏’。”居无何，上至，又不得入。于是上乃使使持节诏将军：“吾欲入劳军。”亚夫乃传言开壁门。壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。至营，将军亚夫持兵揖曰：“介胄之士不拜，请以军礼见。”天子为动，改容式车。使人称谢：“皇帝敬劳将军。”成礼而去。\n既出军门，群臣皆惊。文帝曰：“嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！”称善者久之。", "exam": [], "notes": [{ "k": "a", "text": "节选自《史记·绛侯周勃世家》（中华书局2014年版）。题目为编者所加。周亚夫（？—前143），西汉名将，绛侯周勃之子，封条侯。军，驻军、驻扎。细柳，地名，在今陕西咸阳西南，渭河北岸。司马迁所撰《史记》，以“究天人之际，通古今之变，成一家之言”（《报任安书》）为宗旨，记述了从传说中的黄帝到汉武帝时的史事，全书一百三十篇，包括十二本纪、十表、八书、三十世家、七十列传。" }, { "k": "b", "text": "〔文帝之后六年〕指汉文帝后元六年（前158）。文帝，汉高祖刘邦之子刘恒（前202—前157），公元前180年至公元前157年在位。" }, { "k": "c", "text": "〔入边〕侵入边境。" }, { "k": "d", "text": "〔宗正〕掌管皇族事务的官员。" }, { "k": "e", "text": "〔霸上〕地名，一作“灞上”，因地处灞水西岸高原而得名，在今陕西西安东。" }, { "k": "f", "text": "〔祝兹侯〕封号。" }, { "k": "g", "text": "〔棘门〕地名，原为秦宫门，在今陕西咸阳东北。" }, { "k": "h", "text": "〔河内守〕河内郡的郡守。河内，郡名，今河南北部地区。守，郡守，是汉代郡一级的行政长官。" }, { "k": "a", "text": "〔上自劳军〕皇帝亲自去慰劳军队。劳，慰劳。" }, { "k": "b", "text": "〔军〕军营。" }, { "k": "c", "text": "〔已而〕不久。" }, { "k": "d", "text": "〔之〕到，往。" }, { "k": "e", "text": "〔被（pī）〕同“披”，穿着。" }, { "k": "f", "text": "〔锐兵刃〕这里指刀出鞘。" }, { "k": "g", "text": "〔彀（ɡòu）弓弩（nǔ）〕张开弓弩。彀，张开。弩，用机械发箭的弓。" }, { "k": "h", "text": "〔持满〕把弓拉满。" }, { "k": "i", "text": "〔先驱〕先行引导的人员。" }, { "k": "j", "text": "〔且〕将要。" }, { "k": "k", "text": "〔军门都尉〕守卫军营的将官，职位低于将军。" }, { "k": "l", "text": "〔诏（zhào）〕皇帝发布的命令。下文的“诏”是“下令”的意思。" }, { "k": "m", "text": "〔居无何〕过了不久。居，经过。无何，不久。" }, { "k": "n", "text": "〔持节〕手持符节。节，符节，皇帝派遣使者或调动军队的凭证。" }, { "k": "o", "text": "〔壁〕营垒。" }, { "k": "p", "text": "〔按辔〕控制住车马。" }, { "k": "q", "text": "〔持兵揖（yī）〕手执兵器行礼。揖，拱手行礼。" }, { "k": "r", "text": "〔介胄之士不拜〕披甲戴盔的将士不行跪拜礼。介胄，铠甲和头盔，这里用作动词，指披甲戴盔。" }, { "k": "s", "text": "〔为动〕被感动。" }, { "k": "t", "text": "〔改容式车〕表情严肃起来，扶着车前横木俯下身子，表示敬意。式，同“轼”，车前横木，这里用作动词，指扶轼。" }, { "k": "u", "text": "〔称谢〕向人致意，表示问候。" }, { "k": "v", "text": "〔曩（nǎnɡ）〕先前。" }, { "k": "w", "text": "〔固〕必，一定。" }] },

      "记承天寺夜游": { "intro": "八年级上册课文。", "full": "元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。\n庭下如积水空明，水中藻、荇交横，盖竹柏影也。\n何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "exam": [], "notes": [{ "k": "a", "text": "选自《苏轼文集》卷七十一（中华书局1986年版）。题目原作《记承天夜游》，“寺”字是后人加的。此文写于苏轼贬官黄州（今湖北黄冈）期间。当时苏轼名义上是团练副使，实际却“不得签书公事”。承天寺，在今黄冈南。" }, { "k": "b", "text": "〔元丰六年〕公元1083年。元丰，宋神宗赵顼（xū）年号（1078—1085）。" }, { "k": "c", "text": "〔念〕考虑，想到。" }, { "k": "d", "text": "〔张怀民〕作者的朋友，当时也贬官在黄州。" }, { "k": "e", "text": "〔相与〕共同，一起。" }, { "k": "f", "text": "〔中庭〕院子里。" }, { "k": "g", "text": "〔空明〕形容水的澄澈。" }, { "k": "h", "text": "〔藻、荇（xìng）〕均为水生植物。" }, { "k": "i", "text": "〔盖〕大概是。《承天夜游图》〔清〕任伯年作" }] },

      "野望": { "intro": "王绩五言律诗，写秋日山野之景与孤独彷徨的隐逸情怀。", "full": "东皋薄暮望，徙倚欲何依。\n树树皆秋色，山山唯落晖。\n牧人驱犊返，猎马带禽归。\n相顾无相识，长歌怀采薇。", "exam": [], "notes": [{ "k": "a", "text": "选自《王绩集会校》（上海古籍出版社2023年版）。王绩（约589—644），字无功，号东皋子，绛州龙门（今山西河津）人，唐代诗人。" }, { "k": "b", "text": "〔东皋〕地名，今属山西万荣。作者弃官后隐居于此。皋，水边地。" }, { "k": "c", "text": "〔薄暮〕傍晚。薄，接近。" }, { "k": "d", "text": "〔徙倚〕徘徊。" }, { "k": "e", "text": "〔犊（dú）〕小牛。这里指牛群。" }, { "k": "f", "text": "〔禽〕泛指猎获的鸟兽。" }, { "k": "g", "text": "〔采薇〕采食野菜。据《史记·伯夷列传》，商末孤竹君之子伯夷、叔齐在商亡之后，“不食周粟，隐于首阳山，采薇而食之”。后遂以“采薇”比喻隐居不仕。" }] },

      "使至塞上": { "intro": "王维边塞诗，“大漠孤烟直，长河落日圆”写塞外壮阔景象。", "full": "单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。", "exam": [], "notes": [{ "k": "j", "text": "选自《王维集校注》卷二（中华书局1997年版）。此诗是开元二十五年（737）王维以监察御史身份出使凉州时所作。塞上，边境地区，也泛指北方长城内外。" }, { "k": "k", "text": "〔单车〕一辆车，表明此次出使随从不多。" }, { "k": "l", "text": "〔问边〕慰问边关守军。" }, { "k": "m", "text": "〔属国〕典属国的简称。汉代称负责少数民族事务的官员为典属国，诗人在这里借指自己出使边塞的使者身份。一说，附属国。" }, { "k": "n", "text": "〔居延〕地名，在今内蒙古额济纳旗。这里泛指辽远的边塞地区。" }, { "k": "o", "text": "〔征蓬〕飘飞的蓬草，古诗中常用来比喻远行之人。" }, { "k": "p", "text": "〔孤烟〕唐代边关以点燃一道烽烟的方式报告边境平安，故称孤烟。烟，指烽烟。" }, { "k": "q", "text": "〔长河〕指黄河。" }, { "k": "r", "text": "〔萧关〕古关名，故址在今宁夏固原东南。" }, { "k": "s", "text": "〔候骑〕负责侦察、巡逻的骑兵。" }] },

      "庭中有奇树": { "intro": "《古诗十九首》名篇，写折花寄远、思念之情。", "full": "庭中有奇树，绿叶发华滋。\n攀条折其荣，将以遗所思。\n馨香盈怀袖，路远莫致之。\n此物何足贵？但感别经时。", "exam": [], "notes": [{ "k": "a", "text": "选自《文选》卷二十九（上海古籍出版社1986年版）。奇树，佳美、珍贵的树。这首诗是《古诗十九首》的第九首。《古诗十九首》最早见于南朝梁萧统（501—531）主持编选的《文选》，是一组五言古诗，作者不详，也不是一时一人之作，一般认为产生于东汉末年。这组古诗多写夫妇朋友间的离愁别绪和士人的彷徨失意，语言朴素自然，描写生动真切，在五言诗的发展史上有重要地位。" }, { "k": "b", "text": "〔华〕花。下文的“荣”也是“花”的意思。" }, { "k": "c", "text": "〔滋〕繁盛。" }, { "k": "d", "text": "〔攀条〕攀引枝条。" }, { "k": "e", "text": "〔遗（wèi）〕给予，馈赠。" }, { "k": "f", "text": "〔盈〕充满。" }, { "k": "g", "text": "〔致〕送达。" }, { "k": "h", "text": "〔经时〕历时很久。" }] },

      "龟虽寿": { "intro": "曹操四言诗，“老骥伏枥，志在千里”写老当益壮、自强不息。", "full": "神龟虽寿，犹有竟时。腾蛇乘雾，终为土灰。\n老骥伏枥，志在千里。烈士暮年，壮心不已。\n盈缩之期，不但在天；养怡之福，可得永年。\n幸甚至哉，歌以咏志。", "exam": [], "notes": [{ "k": "i", "text": "选自《曹操集·诗集》（中华书局2018年版）。这首诗是《步出夏门行》四章中的最后一章。" }, { "k": "j", "text": "〔竟〕终结。这里指死去。" }, { "k": "k", "text": "〔腾蛇〕传说中一种能腾云驾雾的神蛇。" }, { "k": "l", "text": "〔骥〕骏马，好马。" }, { "k": "m", "text": "〔枥（lì）〕马槽。" }, { "k": "n", "text": "〔烈士〕有气节有壮志的人。" }, { "k": "o", "text": "〔盈缩〕这里指人寿命的长短。" }, { "k": "p", "text": "〔养怡〕指调养身心，保持心情愉快。怡，愉快。" }, { "k": "q", "text": "〔永年〕长寿。" }, { "k": "f", "text": "选自《曹植集校注》卷三（中华书局2016年版）。梁甫行，乐府古题。曹植（192—232），字子建，三国魏诗人，曹操之子。" }] },

      "赠从弟（其二）": { "intro": "刘桢咏物诗，以松柏喻堂弟坚贞自守的品格。", "full": "亭亭山上松，瑟瑟谷中风。\n风声一何盛，松枝一何劲！\n冰霜正惨凄，终岁常端正。\n岂不罹凝寒？松柏有本性。", "exam": [], "notes": [{ "k": "a", "text": "选自《文选》卷二十三（上海古籍出版社1986年版）。从弟，堂弟。刘桢（？—217），字公干，东汉末诗人，“建安七子”之一。" }, { "k": "b", "text": "〔亭亭〕挺拔的样子。" }, { "k": "c", "text": "〔瑟瑟〕拟声词，形容风声。" }, { "k": "d", "text": "〔一何〕何其，多么。" }, { "k": "e", "text": "〔罹（lí）凝寒〕遭受严寒。罹，遭受。凝寒，严寒。梁甫行" }] },

      "梁甫行": { "intro": "曹植诗，写边海人民贫苦流离的悲惨生活。", "full": "八方各异性，千里殊风雨。\n剧哉边海民，寄身于草野。\n妻子象禽兽，行止依林阻。\n柴门何萧条，狐兔翔我宇。", "exam": [], "notes": [{ "k": "f", "text": "选自《曹植集校注》卷三（中华书局2016年版）。，乐府古题。曹植（192—232），字子建，三国魏诗人，曹操之子。" }, { "k": "g", "text": "〔异气〕气候不同。" }, { "k": "h", "text": "〔殊〕不同。" }, { "k": "i", "text": "〔剧〕艰难。" }, { "k": "j", "text": "〔妻子〕妻子儿女。" }, { "k": "k", "text": "〔林阻〕山林险阻之地。" }, { "k": "l", "text": "〔翔〕自在地行走。" }, { "k": "m", "text": "〔宇〕房屋。﻿第四单元散文“表现着，批评着，解释着人生的各面”（朱自清）。本单元所选的散文，或记事写人，或托物言志，或畅谈哲理，或写景抒情，展现了丰富多彩的自然景物和社会生活，表达了独特的情感体验和深刻的人生感悟。阅读这些文章，可以培养审美情趣，丰富精神世界。学习本单元，要了解不同类型散文的主要特点，用心体会作品借助语言和形象构建的艺术世界。阅读时，要理解、领会作者对生活的感受和思考，品味、欣赏各具特色的语言。注意分享自己的审美体验，提升审美能力。" }] },

      "得道多助，失道寡助": { "intro": "《孟子》名篇，论证“得道者多助，失道者寡助”的道理。", "full": "天时不如地利，地利不如人和。\n三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。\n城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。\n故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。", "exam": [], "notes": [{ "k": "a", "text": "选自《孟子译注》（中华书局2008年版）。本课所选的三章分别出自《公孙丑下》《滕文公下》和《告子下》。题目为编者所加。" }, { "k": "b", "text": "〔三里之城〕方圆三里的内城。城，城墙，与“郭”对举时多指内城。" }, { "k": "c", "text": "〔环〕四面包围。" }, { "k": "d", "text": "〔池〕护城河。" }, { "k": "e", "text": "〔兵革〕泛指武器装备。兵，兵器。革，皮革制成的甲胄之类。" }, { "k": "f", "text": "〔委而去之〕意思是弃城而逃。委，放弃。" }, { "k": "g", "text": "〔域民不以封疆之界〕意思是，使百姓定居（而不迁到别的地方去），不能靠疆域的边界。" }, { "k": "h", "text": "〔固国不以山溪之险〕巩固国防不能靠山河的险要。23《孟子》三章" }, { "k": "a", "text": "〔威天下不以兵革之利〕威慑天下不能靠武器的锐利。" }, { "k": "b", "text": "〔得道〕指能够施行治国的正道，即行仁政。" }, { "k": "c", "text": "〔至〕极点。" }, { "k": "d", "text": "〔亲戚〕内外亲属，包括父系亲属和母系亲属。" }, { "k": "e", "text": "〔畔〕同“叛”，背叛。" }, { "k": "f", "text": "〔故君子有不战，战必胜矣〕所以能行仁政的君主不战则已，战就一定能胜利。君子，这里指能行仁政的君主，即上文所说的“得道者”。" }] },

      "富贵不能淫": { "intro": "《孟子》名篇，提出“大丈夫”的标准：富贵不能淫，贫贱不能移，威武不能屈。", "full": "景春曰：“公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。”\n孟子曰：“是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：‘往之女家，必敬必戒，无违夫子！’以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈。此之谓大丈夫。”", "exam": [], "notes": [{ "k": "g", "text": "〔景春〕与孟子同时代的人，纵横家。" }, { "k": "h", "text": "〔公孙衍（yǎn）〕战国时期魏国人，纵横家，曾在秦国为相，又曾佩五国相印。" }, { "k": "i", "text": "〔张仪〕战国时期魏国人，纵横家，秦惠王时为相，游说六国连横以服从秦国。" }, { "k": "j", "text": "〔诚〕确实。" }, { "k": "k", "text": "〔大丈夫〕指有大志、有作为、有气节的男子。" }, { "k": "l", "text": "〔天下熄〕指战争停息，天下太平。" }, { "k": "m", "text": "〔焉〕怎么，哪里。" }, { "k": "n", "text": "〔丈夫之冠（ɡuàn）〕古时男子二十岁行冠礼，表示成年。之，助词，用在主谓之间，取消句子的独立性。冠，行冠礼。" }, { "k": "o", "text": "〔命〕教导，训诲。" }, { "k": "p", "text": "〔戒〕告诫。下文的“戒”是“谨慎”的意思。" }, { "k": "q", "text": "〔女家〕这里指夫家。女，同“汝”，你。" }, { "k": "r", "text": "〔夫子〕这里指丈夫。" }, { "k": "s", "text": "〔以顺为正者，妾妇之道也〕以顺从为准则，是妇女遵循的正道。妾妇，泛指妇女。旧时婚姻中，男女双方的地位不平等，女子须服从夫家，这是错误的封建伦理。孟子借此类比纵横家不立足于仁、礼、义等准则，只知道曲意顺从的行事作风。" }, { "k": "t", "text": "〔居天下之广居，立天下之正位，行天下之大道〕（大丈夫应该）住进天下最宽广的住宅——仁，站在天下最正确的位置——礼，走着天下最正确的道路——义。这里的“广居”“正位”“大道”分别喻指“仁”“礼”“义”。" }, { "k": "u", "text": "〔与民由之〕与百姓同遵正道而行。由，遵从。" }, { "k": "v", "text": "〔独行其道〕独自走自己的道路。这里指坚持自己的原则。《孟子·尽心上》：“穷则独善其身，达则兼善天下。”" }, { "k": "w", "text": "〔淫〕惑乱，迷惑。这里是使动用法。" }, { "k": "x", "text": "〔移〕改变，动摇。这里是使动用法。" }, { "k": "y", "text": "〔屈〕屈服。这里是使动用法。兵革之利" }] },

      "春望": { "intro": "八年级上册课文。", "full": "国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。", "exam": [], "notes": [{ "k": "a", "text": "选自《杜诗详注》卷四（中华书局1979年版）。此诗为杜甫安史之乱时期在长安所作。唐肃宗至德元载（756）八月，杜甫将家小安置在鄜（fū）州（今陕西富县），只身前往灵武（今属宁夏）投奔肃宗，途中为叛军所俘，遂困居长安。该诗作于次年三月。" }, { "k": "b", "text": "〔城〕指长安城，当时被叛军占领。" }, { "k": "c", "text": "〔感时花溅泪，恨别鸟惊心〕感叹时事，见花开却流泪，怅恨离别，闻鸟啼而心惊。" }, { "k": "d", "text": "〔烽火〕古时边防报警的烟火。这里借指战事。" }, { "k": "e", "text": "〔三月〕指时间很长。" }, { "k": "f", "text": "〔浑〕简直。" }, { "k": "g", "text": "〔不胜簪（zān）〕插不住簪子。胜，能够承受、禁得起。簪，一种别住发髻的长条状首饰。" }] },

      "雁门太守行": { "intro": "李贺边塞诗，写将士报国、视死如归的豪情。", "full": "黑云压城城欲摧，甲光向日金鳞开。\n角声满天秋色里，塞上燕脂凝夜紫。\n半卷红旗临易水，霜重鼓寒声不起。\n报君黄金台上意，提携玉龙为君死。", "exam": [], "notes": [{ "k": "h", "text": "选自《李贺诗歌集注》卷一（上海人民出版社1977年版）。雁门太守行，乐府古题。" }, { "k": "i", "text": "〔城欲摧〕城墙仿佛将要坍塌。" }, { "k": "j", "text": "〔甲光向日金鳞开〕铠甲迎着（云缝中射下来的）太阳光，如金色鳞片般闪闪发光。" }, { "k": "k", "text": "〔角〕军中号角。" }, { "k": "l", "text": "〔塞上燕（yān）脂凝夜紫〕边塞上将士的血迹在寒夜中凝为紫色。燕脂，胭脂，色深红。此句中“燕脂”“夜紫”皆形容战场血迹。" }, { "k": "m", "text": "〔易水〕河名，发源于河北易县。战国时荆轲《易水歌》：“风萧萧兮易水寒，壮士一去兮不复还。”" }, { "k": "n", "text": "〔黄金台〕相传战国时燕昭王在易水东南筑台，上面放着千金，用来招揽天下贤士。" }, { "k": "o", "text": "〔玉龙〕指宝剑。" }] },

      "赤壁": { "intro": "八年级上册课文。", "full": "折戟沉沙铁未销，自将磨洗认前朝。\n东风不与周郎便，铜雀春深锁二乔。", "exam": [], "notes": [{ "k": "a", "text": "选自《樊川诗集注》卷四（上海古籍出版社1978年版）。赤壁，今湖北武汉赤矶山，一说即今湖北赤壁市西北赤壁山。汉献帝建安十三年（208），孙权与刘备联合在此击败曹操大军。诗中所写的赤壁，实为今湖北黄冈的赤鼻矶，作者是借相同的地名抒发感慨。" }, { "k": "b", "text": "〔戟（jǐ）〕古代兵器。" }, { "k": "c", "text": "〔销〕销蚀。" }, { "k": "d", "text": "〔将〕拿，取。" }, { "k": "e", "text": "〔认前朝〕辨认出是前朝遗物。前朝，这里指赤壁之战的时代。" }, { "k": "f", "text": "〔周郎〕即周瑜（175—210），字公瑾，庐江舒县（今安徽庐江西南）人，东汉末孙策、孙权手下的重要将领。他曾利用东风之势火烧赤壁，大败曹军。" }, { "k": "g", "text": "〔铜雀〕即铜雀台。曹操建于邺城（今河北临漳西），因楼顶铸有大铜雀而得名。" }, { "k": "h", "text": "〔二乔〕即江东乔公的两个女儿，东吴美女，被称为大乔、小乔。大乔嫁孙策，小乔嫁周瑜。" }] },

      const width = graphViewportSize().width;

      const height = graphViewportSize().height;

      state.scale = 1;

      state.x = 0;

      state.y = 0;

      const { nodes } = graphData();

      const peopleNodes = nodes.filter(node => node.type === "person");

      if (!peopleNodes.length) return;

      const minX = Math.min(...peopleNodes.map(node => node.x));

      const maxX = Math.max(...peopleNodes.map(node => node.x));

      const minY = Math.min(...peopleNodes.map(node => node.y));

      const maxY = Math.max(...peopleNodes.map(node => node.y));

      const graphW = Math.max(1, maxX - minX + 180);

      const graphH = Math.max(1, maxY - minY + 180);

      state.scale = Math.min(1.25, Math.max(.58, Math.min(width / graphW, height / graphH)));

      state.x = width / 2 - ((minX + maxX) / 2) * state.scale;

      state.y = height / 2 - ((minY + maxY) / 2) * state.scale;

    }

    function graphViewportSize() {

      const box = reactFlowCanvas?.getBoundingClientRect?.();

      return {

        width: Math.max(box?.width || svg.clientWidth || 0, 760),

        height: Math.max(box?.height || svg.clientHeight || 0, 620)

      };

    }

    function resetVisiblePositions() {

      filtered().forEach(person => delete state.savedPositions[person.name]);

      savePositions();

      invalidateGraphLayout();

      centerGraphView();

    }

    function relationGroups(list) {

      const visible = new Set(list.map(person => person.name));

      const graph = Object.fromEntries(list.map(person => [person.name, new Set()]));

      relationList().forEach(relation => {

        if (!visible.has(relation.from) || !visible.has(relation.to)) return;

        graph[relation.from].add(relation.to);

        graph[relation.to].add(relation.from);

      });

      const seen = new Set();

      const groups = [];

      list.forEach(person => {

        if (seen.has(person.name)) return;

        const queue = [person.name];

        const names = [];

        seen.add(person.name);

        while (queue.length) {

          const name = queue.shift();

          names.push(name);

          graph[name].forEach(next => {

            if (seen.has(next)) return;

            seen.add(next);

            queue.push(next);

          });

        }

        groups.push(names.map(name => list.find(item => item.name === name)));

      });

      return groups.sort((a, b) => b.length - a.length);

    }

    function separateOverlappingPositions(positions) {

      const minDistance = 230;

      const { width, height } = graphViewportSize();

      for (let pass = 0; pass < 52; pass++) {

        for (let i = 0; i < positions.length; i++) {

          for (let j = i + 1; j < positions.length; j++) {

            const first = positions[i];

            const second = positions[j];

            const dx = second.x - first.x;

            const dy = second.y - first.y;

            const distance = Math.max(1, Math.hypot(dx, dy));

            if (distance >= minDistance) continue;

            const push = (minDistance - distance) / 2;

            const ux = dx / distance;

            const uy = dy / distance;

            const firstSaved = Boolean(state.savedPositions[first.person.name]);

            const secondSaved = Boolean(state.savedPositions[second.person.name]);

            const firstPush = firstSaved ? 0 : secondSaved ? push * 2 : push;

            const secondPush = secondSaved ? 0 : firstSaved ? push * 2 : push;

            if (firstSaved && secondSaved) {

              first.x = Math.max(120, Math.min(width - 120, first.x - ux * push));

              first.y = Math.max(170, Math.min(height - 110, first.y - uy * push));

              second.x = Math.max(120, Math.min(width - 120, second.x + ux * push));

              second.y = Math.max(170, Math.min(height - 110, second.y + uy * push));

              continue;

            }

            first.x = Math.max(120, Math.min(width - 120, first.x - ux * firstPush));

            first.y = Math.max(170, Math.min(height - 110, first.y - uy * firstPush));

            second.x = Math.max(120, Math.min(width - 120, second.x + ux * secondPush));

            second.y = Math.max(170, Math.min(height - 110, second.y + uy * secondPush));

          }

        }

      }

      const occupied = new Set();

      positions.forEach(position => {

        const key = `${Math.round(position.x / 4)}:${Math.round(position.y / 4)}`;

        if (!occupied.has(key)) {

          occupied.add(key);

          return;

        }

        position.x = Math.min(width - 120, position.x + 36 + occupied.size * 4);

        position.y = Math.min(height - 110, position.y + 36 + occupied.size * 4);

      });

      return positions;

    }

    const eraOrder = ["先秦", "西汉", "东汉", "魏晋", "唐代", "北宋", "南宋", "元代", "明代", "清代", "近代", "现代", "当代", "19世纪", "20世纪"];

    function eraRank(era) {

      const index = eraOrder.indexOf(era);

      return index === -1 ? eraOrder.length : index;

    }

    function relationAwareOrder(group) {

      const degree = Object.fromEntries(group.map(person => [person.name, 0]));

      const neighbors = Object.fromEntries(group.map(person => [person.name, new Set()]));

      relationList().forEach(relation => {

        if (degree[relation.from] != null) degree[relation.from] += 1;

        if (degree[relation.to] != null) degree[relation.to] += 1;

        if (neighbors[relation.from] && neighbors[relation.to]) {

          neighbors[relation.from].add(relation.to);

          neighbors[relation.to].add(relation.from);

        }

      });

      const pool = [...group].sort((a, b) =>

        eraRank(a.era) - eraRank(b.era)

        || countryOf(a).localeCompare(countryOf(b), "zh-Hans-CN")

        || (degree[b.name] || 0) - (degree[a.name] || 0)

        || a.name.localeCompare(b.name, "zh-Hans-CN")

      );

      if (pool.length <= 2) return pool;

      const ordered = [];

      let current = [...pool].sort((a, b) => (degree[b.name] || 0) - (degree[a.name] || 0) || eraRank(a.era) - eraRank(b.era))[0];

      while (current) {

        ordered.push(current);

        const remaining = pool.filter(person => !ordered.includes(person));

        const previous = current;

        current = remaining.sort((a, b) => {

          const aLinked = neighbors[previous.name]?.has(a.name) ? 0 : 1;

          const bLinked = neighbors[previous.name]?.has(b.name) ? 0 : 1;

          return aLinked - bLinked

            || Math.abs(eraRank(a.era) - eraRank(previous.era)) - Math.abs(eraRank(b.era) - eraRank(previous.era))

            || countryOf(a).localeCompare(countryOf(b), "zh-Hans-CN")

            || (degree[b.name] || 0) - (degree[a.name] || 0)

            || a.name.localeCompare(b.name, "zh-Hans-CN");

        })[0];

      }

      return ordered;

    }

    function partitionKey(person) {

      return countryOf(person) === "中国" ? `中国｜${person.era}` : `${countryOf(person)}｜${person.era}`;

    }

    function partitionLabelSort(a, b) {

      const [countryA, eraA] = a.split("｜");

      const [countryB, eraB] = b.split("｜");

      if (countryA !== countryB) {

        if (countryA === "中国") return -1;

        if (countryB === "中国") return 1;

        return countryA.localeCompare(countryB, "zh-Hans-CN");

      }

      return eraRank(eraA) - eraRank(eraB) || eraA.localeCompare(eraB, "zh-Hans-CN");

    }

    function autoPositionAllPeople(list, width, height) {

      const topReserved = state.expanded ? 210 : 120;

      const usableHeight = Math.max(360, height - topReserved);

      const partitions = Object.entries(list.reduce((groups, person) => {

        (groups[partitionKey(person)] ||= []).push(person);

        return groups;

      }, {})).sort(([a], [b]) => partitionLabelSort(a, b));

      const positions = [];

      const columns = Math.min(4, Math.max(2, Math.ceil(Math.sqrt(partitions.length))));

      const rows = Math.ceil(partitions.length / columns);

      const cellW = width / columns;

      const cellH = usableHeight / rows;

      partitions.forEach(([label, people], index) => {

        const col = index % columns;

        const row = Math.floor(index / columns);

        const centerX = cellW * (col + .5);

        const centerY = topReserved + cellH * (row + .5);

        const groups = relationGroups(people);

        const groupCount = Math.max(groups.length, 1);

        const groupRing = groupCount === 1 ? 0 : Math.min(cellW, cellH) * .23;

        groups.forEach((rawGroup, groupIndex) => {

          const group = relationAwareOrder(rawGroup);

          const groupAngle = Math.PI * 2 * groupIndex / groupCount - Math.PI / 2;

          const groupCx = centerX + Math.cos(groupAngle) * groupRing;

          const groupCy = centerY + Math.sin(groupAngle) * groupRing;

          const innerRadius = group.length <= 1 ? 0 : Math.min(Math.min(cellW, cellH) * .38, Math.max(130, 62 * group.length));

          group.forEach((person, personIndex) => {

            const saved = state.savedPositions[person.name];

            if (saved) {

              positions.push({ person, x: saved.x, y: saved.y });

              return;

            }

            const angle = Math.PI * 2 * personIndex / Math.max(group.length, 1) - Math.PI / 2;

            positions.push({

              person,

              x: groupCx + Math.cos(angle) * innerRadius,

              y: groupCy + Math.sin(angle) * innerRadius

            });

          });

        });

      });

      return separateOverlappingPositions(positions);

    }

    function autoPositionPeople(list) {

      const { width, height } = graphViewportSize();

      const cx = width / 2;

      const cy = height / 2 + (state.expanded ? 70 : 24);

      if (state.unit === "全部" && state.country === "全部" && state.dynasty === "全部" && !state.query) {

        return autoPositionAllPeople(list, width, height);

      }

      const groups = relationGroups(list);

      const groupCount = Math.max(groups.length, 1);

      const groupRadius = groupCount === 1 ? 0 : Math.min(Math.min(width, height) * .38, Math.max(210, 128 * groupCount));

      const positions = [];

      groups.forEach((group, groupIndex) => {

        const groupAngle = Math.PI * 2 * groupIndex / groupCount - Math.PI / 2;

        const groupCx = cx + Math.cos(groupAngle) * groupRadius;

        const groupCy = cy + Math.sin(groupAngle) * groupRadius;

        const innerRadius = group.length <= 1 ? 0 : Math.min(320, Math.max(160, 78 * group.length));

        group.forEach((person, index) => {

          const saved = state.savedPositions[person.name];

          if (saved) {

            positions.push({ person, x: saved.x, y: saved.y });

            return;

          }

          const angle = Math.PI * 2 * index / Math.max(group.length, 1) - Math.PI / 2;

          positions.push({

            person,

            x: groupCx + Math.cos(angle) * innerRadius,

            y: groupCy + Math.sin(angle) * innerRadius

          });

        });

      });

      return separateOverlappingPositions(positions);

    }

    function stablePositionedPeople(list) {

      const key = [

        "layout-v3-no-overlap",

        state.unit,

        state.country,

        state.dynasty,

        state.query,

        list.map(person => person.name).join("|"),

        Object.keys(state.savedPositions).sort().map(name => `${name}:${Math.round(state.savedPositions[name].x)},${Math.round(state.savedPositions[name].y)}`).join("|")

      ].join("::");

      if (key !== graphLayoutKey) {

        graphLayoutKey = key;

        graphPositionCache = Object.fromEntries(autoPositionPeople(list).map(item => [item.person.name, item]));

      }

      return list.map(person => graphPositionCache[person.name]).filter(Boolean);

    }

    function bk8LessonNumber(title) {
      const s = String(title || "").replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
      const m = /^第\s*(\d{1,2})\s*课/.exec(s);
      if (m) return Number(m[1]);
      const nm = /^\s*(\d{1,2})\s*(?:[.．、]|\s+|(?=《|[\u4e00-\u9fff]))/.exec(s);
      if (nm) return Number(nm[1]);
      const cn = /^第\s*([一二三四五六七八九十]{1,3})\s*课/.exec(s);
      if (!cn) return 999;
      const map = { 一:1, 二:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9, 十:10 };
      const t = cn[1];
      if (t === "十") return 10;
      if (t.indexOf("十") >= 0) return (map[t[0]] || 1) * 10 + (map[t[2]] || 0);
      return map[t] || 999;
    }
    function normalizeBk8LessonTitle(title) {
      const raw = String(title || "").trim();
      const s = raw.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
      const m = /^(?:第\s*)?(\d{1,2})\s*(?:课)?\s*[.．、]?\s*([\s\S]*)$/.exec(s);
      if (!m) return raw;
      const no = Number(m[1]);
      let rest = (m[2] || "").trim()
        .replace(/^\s*课\s*/, "")
        .replace(/\s*\d{1,3}\s*[.．、)]\s*[\s\S]*$/, "")
        .replace(/\s*[\/／]\s*[\s\S]*$/, "")
        .trim();
      const known = [
        "消息二则", "首届诺贝尔奖颁发", "\"飞天\"凌空", "“飞天”凌空", "一着惊海天",
        "国行公祭，为佑世界和平", "藤野先生", "回忆我的母亲", "列夫·托尔斯泰", "美丽的颜色",
        "三峡", "短文二篇", "与朱元思书", "唐诗五首", "背影", "白杨礼赞", "散文二篇", "昆明的雨",
        "中国石拱桥", "苏州园林", "人民英雄永垂不朽", "蝉", "梦回繁华",
        "《孟子》三章", "愚公移山", "周亚夫军细柳", "诗词五首"
      ].sort((a, b) => b.length - a.length);
      const hit = known.find(k => rest.indexOf(k) === 0);
      if (hit) rest = hit;
      return "第 " + no + " 课" + (rest ? " " + rest : "");
    }
    function isBk8LessonTitle(title) {
      const s = String(title || "").trim();
      return /^第\s*[\d０-９一二三四五六七八九十]{1,3}\s*课/.test(s)
        || /^\s*[\d０-９]{1,2}\s*(?:[.．、]|\s+|(?=《|[\u4e00-\u9fff]))/.test(s);
    }
    function isBk8StandaloneRootText(text) {
      const t = String(text || "").trim();
      if (!t) return false;
      if (/[。！？；：]/.test(t)) return false;
      if (t.length > 40) return false;
      return /《.*》|整本书阅读|专题|文言文|文化常识|名著阅读|阅读/.test(t);
    }
    function isBk8TopTypeTitle(title) {
      return /^[一二三四五六七八九十]{1,3}、/.test(String(title || "").trim());
    }
    function normalizeBk8TypeTitle(title) {
      return String(title || "").trim().replace(/^[一二三四五六七八九十]{1,3}、\s*/, "");
    }
    function isBk8CourseTypeTitle(title) {
      return /^(课内字词|文化文学常识)$/.test(normalizeBk8TypeTitle(title));
    }
    function buildBk8LessonIndex(bk8) {
      const map = {};
      const standalone = [];
      let currentType = "课内知识";
      let current = null;
      function ensureLesson(title) {
        const cleanTitle = normalizeBk8LessonTitle(title);
        const no = bk8LessonNumber(cleanTitle);
        const key = "L" + no + ":" + cleanTitle.replace(/[（(].*$/, "").replace(/\s+/g, "");
        if (!map[key]) map[key] = { no, title: cleanTitle, types: [], typeMap: {} };
        current = map[key];
        return current;
      }
      function ensureType(lesson, type) {
        const t = normalizeBk8TypeTitle(type || currentType || "课内知识");
        if (!lesson.typeMap[t]) { lesson.typeMap[t] = { title: t, lines: [] }; lesson.types.push(lesson.typeMap[t]); }
        return lesson.typeMap[t];
      }
      (bk8 && bk8.blocks || []).forEach(function (blk) {
        const h = blk && blk.h ? String(blk.h).trim() : "";
        const c = blk && blk.c ? String(blk.c).trim() : "";
        if (h && isBk8TopTypeTitle(h)) {
          currentType = h;
          current = null;
          if (!isBk8CourseTypeTitle(h)) standalone.push({ h, c: "" });
          return;
        }
        if (h && isBk8LessonTitle(h)) {
          const lesson = ensureLesson(h);
          if (c) ensureType(lesson, currentType).lines.push(c);
          return;
        }
        if (current) {
          const type = ensureType(current, currentType);
          if (h) type.lines.push(h);
          if (c) type.lines.push(c);
          return;
        }
        if (h || c) standalone.push({ h, c });
      });
      return { lessons: Object.values(map).sort((a, b) => a.no - b.no || a.title.localeCompare(b.title, "zh-Hans-CN")), standalone };
    }
    function buildBk8LessonSource(bk8) {
      if (!bk8 || !Array.isArray(bk8.blocks)) return bk8;
      const idx = buildBk8LessonIndex(bk8);
      const blocks = [];
      idx.lessons.forEach(function (lesson) {
        const body = lesson.types.map(function (tp) {
          return "## " + tp.title + "\n" + tp.lines.filter(Boolean).join("\n");
        }).join("\n\n");
        blocks.push({ h: lesson.title, c: body });
      });
      let topic = null;
      function pushTopic() {
        if (!topic) return;
        if (!topic.lines.length) { topic = null; return; }
        blocks.push({ h: topic.h, c: topic.lines.filter(Boolean).join("\n") });
        topic = null;
      }
      idx.standalone.forEach(function (blk) {
        const h = String(blk.h || "").trim();
        const c = String(blk.c || "").trim();
        if (h && isBk8TopTypeTitle(h)) {
          pushTopic();
          if (!isBk8CourseTypeTitle(h)) topic = { h, lines: c ? [c] : [] };
          return;
        }
        if (h) {
          if (topic) {
            topic.lines.push("## " + h);
            if (c) topic.lines.push(c);
          } else {
            pushTopic();
            topic = { h, lines: c ? [c] : [] };
          }
          return;
        }
        if (c) {
          if (isBk8StandaloneRootText(c)) {
            pushTopic();
            topic = { h: c, lines: [] };
            return;
          }
          if (!topic) topic = { h: "专题资料", lines: [] };
          topic.lines.push(c);
        }
      });
      pushTopic();
      return Object.assign({}, bk8, { blocks, lessonIndex: idx.lessons });
    }
    function buildBk8StandaloneNav(bk8) {
      const compact = buildBk8LessonSource(bk8);
      const items = [];
      const seen = new Set();
      let currentRoot = "";
      (compact && compact.blocks || []).forEach(function (blk, blockIndex) {
        const h = String(blk.h || "").trim() || (isBk8StandaloneRootText(blk.c) ? String(blk.c || "").trim() : "");
        if (!h) return;
        if (isBk8LessonTitle(h)) return;
        let level = 2;
        if (/^\d{1,3}\s*[.．、)]/.test(h)) level = 3;
        else if (/^（[一二三四五六七八九十]+）/.test(h)) level = 2;
        else if (/^[一二三四五六七八九十]{1,3}、/.test(h)) {
          if (/整本书阅读|文言文|专题|常识|名著|阅读/.test(h)) { level = 1; currentRoot = h; }
          else level = currentRoot ? 2 : 1;
        } else if (/^◆/.test(h)) {
          level = 2;
        }
        if (!currentRoot && level === 1) currentRoot = h;
        const rootKey = currentRoot || "";
        const itemKey = rootKey + "|" + h;
        if (!seen.has(itemKey)) {
          items.push({ level, title: h, blockIndex });
          seen.add(itemKey);
        }
        String(blk.c || "").split(/\r?\n/).forEach(function (line) {
          const m = /^##\s+(.+)$/.exec(line.trim());
          if (!m) return;
          const section = m[1].trim();
          const sectionKey = h + "|" + section;
          if (seen.has(sectionKey)) return;
          seen.add(sectionKey);
          items.push({ level: 2, title: section, root: h, blockIndex });
        });
      });
      if (!items.length) return "";
      return '<div class="qb-side-bar"><div class="qb-side-head">专题结构</div><div class="qb-side-list">' + items.map(function (it) {
        const pad = Math.min((it.level - 1) * 14, 34);
        return '<button class="chip qb-side-item" data-qb-jump="' + esc(it.root || it.title) + '"' + (it.root ? ' data-qb-jump-section="' + esc(it.title) + '"' : '') + ' data-qb-jump-start="' + esc(it.blockIndex) + '" data-qb-jumptext="1" style="padding-left:' + (8 + pad) + 'px">' + esc(it.title) + '</button>';
      }).join("") + '</div></div>';
    }

    // 题库侧栏：当前 QB tab 源的一级标题(章节)索引；点击定位到对应讲次或标题段
    function buildQBSideIndex(angli, bk8) {
      const cur = (() => { try { return localStorage.getItem("peopleGraphQbSource") || "angli"; } catch (e) { return "angli"; } })();

      return `

        </article>
        <article class="card">
          <strong>26年暑假补充学习知识库</strong>
          <p>${angli ? angli.groups.length + " 个讲次" : "—"} · 文言文 / 记叙文 / 古诗词 / 说明文等试卷与知识内容（含解析）</p>
        </article>
        <article class="card">
          <strong>八上知识清单</strong>
          <p>${bk8 ? bk8.blocks.length + " 条知识点" : "—"} · 八年级上册字词注音 / 文学常识 / 翻译 / 主旨</p>
        </article>
      `;
    }

    // 其余库(上传题库/真题/上传条目)的左侧导航文本区
    function buildQBMineSideNav() {
      const names = { clean: "上传题库", realexam: "真题题库" };
      // 上传条目(clean-xxx)：按 markdown 标题层级(#一级/##二级…)建立左侧索引导航，分级缩进、不加数字序号
      if (/^clean-/.test(qbSource)) {
        const src = (window.cleanKnowledgeBank && (window.cleanKnowledgeBank.sources || [])).find(s => s.id === qbSource);
        const title = (src && src.title) || qbSource;
        const heads = [];
        String(src && src.content || "").split("\n").forEach(function (l) {
          const ls = l.trim();
          let m = /^(#{1,6})\s+/.exec(ls);
          if (m) { heads.push({ level: m[1].length, title: ls.replace(/^#{1,6}\s+/, "").trim() }); return; }
          m = /^（([一二三四五六七八九十]+)）(.+)$/.exec(ls);
          if (m) { heads.push({ level: 1, title: "（" + m[1] + "）" + m[2].trim() }); return; }
          m = /^【(.+?)】$/.exec(ls);
          if (m) { heads.push({ level: 1, title: m[1].trim() }); }
        });
        const flat = heads.filter(function (h) { return h.title; });
        if (flat.length) {

    function renderCatalogFlow() {

        const rel = articleRelations(catalogSelectedTitle);

        nodes = catalogAllNodes.map(n => {

          const kinds = rel ? rel.get(n.id) : null;

          return {

            ...n,

            data: {

              ...n.data,

              active: n.data.title === catalogSelectedTitle,

              related: Boolean(kinds && kinds.length),

              dimmed: !kinds && n.data.title !== catalogSelectedTitle,

              relKinds: kinds ? kinds.join("、") : ""

            }

          };

        });

        const selNode = nodes.find(n => n.data.active);

        const relEdges = relEdgesForSelected(selNode, rel);

        edges = [

          ...relEdges,

          ...catalogAllEdges.map(e => ({ ...e, className: "dimmed" }))

        ];

      } else if (catalogFilterUnit) {

        nodes = catalogAllNodes.map(n => ({

          ...n,

          data: {

            ...n.data,

            active: n.data.unit === catalogFilterUnit,

            related: false,

            dimmed: n.data.unit !== catalogFilterUnit,

            relKinds: ""

          }

        }));

        const unitIds = new Set(catalogAllNodes.filter(n => n.data.unit === catalogFilterUnit).map(n => n.id));

        edges = catalogAllEdges.map(e => ({

          ...e,

          className: (!unitIds.has(e.source) || !unitIds.has(e.target)) ? "dimmed" : ""

        }));

      } else {

        nodes = catalogAllNodes.map(n => ({

          ...n,

          data: { ...n.data, active: false, related: false, dimmed: false, relKinds: "" }

        }));

        edges = catalogAllEdges.map(e => ({ ...e, className: "" }));

    function renderCatalogGraph(current, isGraph) {

      const units = current.catalog || [];

      const articles = [];

      units.forEach(u => (u.articles || []).forEach(([title, author]) => articles.push({ title, author, unit: u.unit })));

      if (!articles.length) return `<article class="card"><p>该年级暂无课文，暂无法生成图谱。</p></article>`;

      // 同作者边

      const byAuthor = {};

      articles.forEach((a, i) => { if (a.author) (byAuthor[a.author] = byAuthor[a.author] || []).push(i); });

      const authorEdges = [];

      Object.keys(byAuthor).forEach(author => {

        const idxs = byAuthor[author];

        for (let i = 0; i < idxs.length; i++) {

          for (let j = i + 1; j < idxs.length; j++) {

            authorEdges.push([idxs[i], idxs[j], author]);

          }

        }

      });

      // 单元内相邻边（环状，表达同单元主题关联）

      const unitEdges = [];

      units.forEach(u => {

        const members = articles.map((a, i) => a.unit === u.unit ? i : -1).filter(i => i >= 0);

        members.forEach((idx, k) => {

          const next = members[(k + 1) % Math.max(1, members.length)];

          if (next !== idx) unitEdges.push([idx, next]);

        });

      });

      // 布局：按单元分簇（同心圆），组内均匀分布

      const W = 1200, H = 800, cx = W / 2, cy = H / 2;

      const palette = ["#1f7a8c", "#6c5ce7", "#288a64", "#bb6b23", "#c0538a", "#4a7dc9", "#8a8a3a"];

      const pos = new Array(articles.length);

      units.forEach((u, gi) => {

        const members = articles.map((a, i) => a.unit === u.unit ? i : -1).filter(i => i >= 0);

        const radius = 150 + gi * 110;

        members.forEach((idx, mi) => {

          const angle = -Math.PI / 2 + (mi / Math.max(1, members.length)) * Math.PI * 2;

          pos[idx] = { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };

        });

      });

      const rfNodes = articles.map((a, i) => {

        const gi = Math.max(0, units.findIndex(u => u.unit === a.unit));

        return {

          id: "a" + i,

          type: "article",

          position: { x: pos[i].x - 70, y: pos[i].y - 26 },

          data: { title: a.title, author: a.author, unit: a.unit, color: palette[gi % palette.length] }

        };

      });

      // 应用已保存的卡片位置(按 年级::标题),保持用户上次拖拽布局

      const savedCatalogPos = loadCatalogPositions();

      const positionedNodes = rfNodes.map(n => {

        const p = savedCatalogPos[state.grade + "::" + n.data.title];

        return p ? { ...n, position: { x: p.x, y: p.y } } : n;

      });

      const rfEdges = [

        ...unitEdges.map(([i, j]) => ({

          id: "u" + i + "-" + j, source: "a" + i, target: "a" + j, type: "smoothstep",

          style: { stroke: "rgba(120,140,150,.32)", strokeWidth: 1.2 }

        })),

        ...authorEdges.map(([i, j, author]) => ({

          id: "x" + i + "-" + j, source: "a" + i, target: "a" + j, type: "smoothstep",

          label: author,

          labelStyle: { fill: "#1f7a8c", fontWeight: 600, fontSize: 10 },

          labelBgStyle: { fill: "rgba(255,255,255,.92)" },

          style: { stroke: "rgba(31,122,140,.55)", strokeWidth: 1.6, strokeDasharray: "5 4" }

        }))

      ];

      catalogAllNodes = positionedNodes;

      catalogAllEdges = rfEdges;

      setTimeout(() => {

        const el = document.getElementById("catalogReactFlow");

        if (!el || !window.React || !window.ReactDOM || !window.ReactFlow) return;

        if (catalogFlowRoot) { catalogFlowRoot.unmount(); catalogFlowRoot = null; }

        catalogFlowRoot = ReactDOM.createRoot(el);

        catalogFlowRoot.render(React.createElement(CatalogGraphApp, {

          initialNodes: positionedNodes,

          initialEdges: rfEdges,

          unitFilter: catalogFilterUnit

        }));

        const fitBtn = document.getElementById("catalogFit");

        if (fitBtn) fitBtn.onclick = () => catalogFlowInst && catalogFlowInst.fitView({ padding: 0.15, duration: 500, maxZoom: 1.5 });

      }, 30);

      const unitChips = `<button class="catalog-unit-chip" data-unit-chip="" title="显示全部文章"><i style="background:transparent;border:1.5px solid rgba(31,42,48,.45)"></i>全部</button>` + units.map((u, gi) => `<button class="catalog-unit-chip" data-unit-chip="${esc(u.unit)}" title="筛选该单元文章"><i style="background:${palette[gi % palette.length]}"></i>${esc(u.unit)}</button>`).join("");

      return `

        <div class="catalog-graph-bar">

          <div class="catalog-view-toggle">

            <button data-catalog-view="list" type="button">列表</button>

            <button data-catalog-view="graph" class="active" type="button">图谱</button>

          </div>

          <div class="catalog-unit-chips">${unitChips}</div>

          <button id="catalogFit" class="tool" title="适配画布" type="button">⌖</button>

        </div>

        <div class="catalog-graph-title">

          <strong>文章关联图谱 · ${esc(current.grade)}</strong>

          <span>点击文章卡片打开全文与考点；拖动画布平移，滚轮缩放。</span>

        </div>

        <div id="catalogReactFlow" class="catalog-reactflow" aria-label="文章关联图谱"></div>

        <div id="catalogDetailPanel" class="catalog-detail-panel" hidden></div>

        <div class="catalog-graph-status">

          <span><strong>${units.length}</strong> 个单元 · <strong>${articles.length}</strong> 篇文章</span>

          <span class="catalog-legend">

            <span class="catalog-legend-item"><i style="background:transparent;border:2px dashed rgba(31,122,140,.8)"></i>同作者</span>

            <span class="catalog-legend-item"><i style="background:transparent;border:2px dashed rgba(187,107,35,.75)"></i>同年代</span>

            <span class="catalog-legend-item"><i style="background:transparent;border:2px dashed rgba(40,138,100,.75)"></i>同题材</span>

            <span class="catalog-legend-item"><i style="background:transparent;border:1.6px solid rgba(120,140,150,.55)"></i>同单元</span>

          </span>

          <span>点击单元标记聚焦 · 拖拽平移 · 滚轮缩放 · v5</span>

    function attachmentSignature(item) {

      if (!item) return "";

      if (item.type === "image") return "image:" + (item.src || "");

      if (item.type === "table") return "table:" + JSON.stringify(item.rows || []);

      return JSON.stringify(item);

    function renderQuestionAttachments(question, renderedAttachments) {

      const attachments = attachmentsForQuestion(question);

      if (!attachments.length) return '';

      const primaryImage = question && question.image ? String(question.image) : "";

      const visibleAttachments = attachments.filter(item => {

        if (item && item.type === 'image' && primaryImage && String(item.src || "") === primaryImage) return false;

        const signature = attachmentSignature(item);

        if (!renderedAttachments || !signature) return true;

        if (renderedAttachments.has(signature)) return false;

        renderedAttachments.add(signature);

        return true;

      });

      if (!visibleAttachments.length) return '';

      return visibleAttachments.map(item => {

        if (item.type === 'image') {

          const label = item.title || '查看原卷图片';

          return `<button class="qb-attachment-link" type="button" data-qb-img="${esc(item.src)}" data-caption="${esc(item.title || '原卷图片')}">🖼️ ${esc(label)}</button>`;

          const caption = item.title ? '<p class="question-attachment-title">' + esc(item.title) + '</p>' : '';

          const rows = (item.rows || []).map(row => '<tr>' + (row || []).map(cell => '<td>' + esc(cell) + '</td>').join('') + '</tr>').join('');

          return '<div class="question-attachment">' + caption + '<table class="question-table"><tbody>' + rows + '</tbody></table></div>';

        }

        return '';

      }).join('');

      if (isEssayQuestion(question)) {

        return renderMarkedText(question.text);

      }

      if (structuredPromptCount(question)) {

        return renderMarkedText(question.text)

          .replace(/([\uFF08(]\s*(?:\d+|[一二三四五六七八九十]+)\s*[\uFF09)])\s*[；;。]/g, "$1 请在下方对应输入框作答。");

      }

      const key = answerKeyFor(question);

      const saved = state.examAnswers[key] || {};

      const values = Array.isArray(saved.value) ? saved.value : [];

      let index = 0;

      const rendered = renderMarkedText(question.text).replace(/[\uFF3F]{2,}|_{2,}|[\u3000 ]{2,}|[\uFF08(]\s*[\uFF09)]/g, match => {

        const value = values[index] || "";

        const width = Math.min(260, Math.max(96, String(match).length * 16));

        const placeholder = /^[_＿\uFF3F]+$/.test(match) ? match : "＿＿＿";

        const input = `<input class="inline-blank blank-answer" style="width:${width}px" data-blank-index="${index}" value="${esc(value)}" placeholder=" ">`;

        index += 1;

        return input;

      });

      // 表格/积累表类 blank 题题干无下划线（如「完成下面的基础积累表」）→ 按 blankCount 补足输入框

      if (index === 0 && (question.blankCount || 0) > 0) {

        const extra = Array.from({ length: question.blankCount }, () => '<input class="inline-blank blank-answer" style="width:150px" data-blank-index="0" placeholder=" ">').join(" ");

        return `<div class="blank-append">${rendered}<div class="blank-list" style="margin-top:10px">${Array.from({ length: question.blankCount }, (_, k) => `<label class="blank-item"><span>第${k + 1}空</span><input class="blank-answer" data-blank-index="${k}" value="${esc(values[k] || "")}" placeholder="填写答案"></label>`).join("")}</div></div>`;

      }

      return rendered;

    }

    function renderQuestionContext(question) {

      return question.context && !question.contextHidden ? `<div class="question-context">${renderMarkedText(question.context)}</div>` : "";

    }

    function renderSectionContexts(questions) {

      const contexts = [];

      const images = [];

      questions.forEach(question => {

        const context = cleanDisplayText(question.context || "");

        if (context && !contexts.includes(context)) contexts.push(context);

        if (question.image && !images.includes(question.image)) images.push(question.image);

      });

      if (!contexts.length && !images.length) return "";

      const contextHtml = contexts.map((context, index) => `

        <div class="question-context section-context">

          ${contexts.length > 1 ? `<strong>材料${index + 1}</strong>\n` : ""}${esc(context)}

        </div>

      `).join("");

      const imageHtml = images.map(src => `<figure class="question-figure"><img src="${esc(src)}" alt="试卷图片资料"></figure>`).join("");

      return contextHtml + imageHtml;

    }

    function normalizeAnswerText(value) {

      return String(value || "").replace(/\s+/g, "").replace(/[\uFF0C\u3002\u3001\u201C\u201D\u2018\u2019\uFF1B\uFF1A\uFF1F?]/g, "").trim();

    }

    function splitReferenceAnswers(answer) {

      const raw = String(answer || "");

      const circled = [...raw.matchAll(/[\u2460-\u2469]\.?\s*([^\u2460-\u2469]+)/g)].map(match => match[1].trim());

      if (circled.length) return circled;

      return raw.split(/[\uFF1B;\uFF0C,\u3001\n]+/).map(item => item.trim()).filter(Boolean);

    }

    function renderAnswerPanel(question, revealSavedResult, navHtml, navAfter) {

      const key = answerKeyFor(question);

      const saved = state.examAnswers[key] || {};

      const mode = inferAnswerMode(question);

      const submitted = revealSavedResult === false ? false : saved.submitted;

      const resultClass = submitted ? (saved.correct ? "correct" : "wrong") : "";

      const resultText = submitted ? renderAnswerResult(question, saved) : "";

      const submitRow = `<div class="answer-submit-row">${navHtml || ""}<button class="submit-answer" type="button">${answerUi.submit}</button>${navAfter || ""}</div>`;

      if (mode === "choice") {

        const options = question.options && question.options.length

          ? question.options

          : ["A", "B", "C", "D"].map(key => ({ key, text: "" }));

        const savedChoices = Array.isArray(saved.value) ? saved.value : (saved.value ? [saved.value] : []);

        return `

          <div class="answer-panel" data-answer-key="${esc(key)}" data-answer-mode="choice" data-question-id="${esc(question.id)}" data-multiple="${question.multiple ? "true" : "false"}">

            <strong>${answerUi.choice}${question.multiple ? "\uFF08\u53ef\u591a\u9009\uFF09" : ""}</strong>

            <div class="choice-grid">

              ${options.map(option => `<button class="choice-btn ${savedChoices.includes(option.key) ? "active" : ""}" data-choice="${esc(option.key)}" type="button"><span class="choice-key">${esc(option.key)}</span>${renderMarkedText(option.text || option.key)}</button>`).join("")}

            </div>

            ${submitRow}

            <div class="answer-result ${resultClass}" ${submitted ? "" : "hidden"}>${resultText}</div>

          </div>

        `;

      }

      const values = Array.isArray(saved.value) ? saved.value : [saved.value || ""];

      if (isEssayQuestion(question)) {

        return `

          <div class="answer-panel essay-answer-panel" data-answer-key="${esc(key)}" data-answer-mode="essay" data-question-id="${esc(question.id)}">

            <strong>${answerUi.essay}</strong>

            <textarea class="blank-answer essay-answer" rows="12" data-blank-index="0" placeholder="${answerUi.essayPlaceholder}">${esc(values[0] || "")}</textarea>

          </div>

        `;

      }

      const structuredCount = structuredPromptCount(question);

      if (structuredCount) {

        return `

          <div class="answer-panel" data-answer-key="${esc(key)}" data-answer-mode="structured" data-question-id="${esc(question.id)}">

            <strong>${answerUi.text}</strong>

            <div class="blank-list">

              ${Array.from({ length: structuredCount }, (_, index) => `

                <label class="blank-item"><span>第${index + 1}点</span><input class="blank-answer" data-blank-index="${index}" value="${esc(values[index] || "")}" placeholder="概括第${index + 1}点"></label>

              `).join("")}

            </div>

            ${submitRow}

            <div class="answer-result ${resultClass}" ${submitted ? "" : "hidden"}>${resultText}</div>

          </div>

        `;

      }

      return `

        <div class="answer-panel" data-answer-key="${esc(key)}" data-answer-mode="${mode}" data-question-id="${esc(question.id)}">

          <strong>${mode === "blank" ? answerUi.blank : answerUi.text}</strong>

          ${mode === "blank" ? `<p class="answer-note">${answerUi.inlineBlankNote}</p>` : `

            <div class="blank-list">

              <label class="blank-item"><span>${answerUi.response}</span><textarea class="blank-answer" rows="4" data-blank-index="0" placeholder="${answerUi.textPlaceholder}">${esc(values[0] || "")}</textarea></label>

            </div>

          `}

          ${submitRow}

          <div class="answer-result ${resultClass}" ${submitted ? "" : "hidden"}>${resultText}</div>

        </div>

      `;

    }

    function renderAnswerResult(question, saved) {

      const answer = question.answer || "";

      const explanation = question.explanation || "";

      if (!answer) return answerUi.noReference;

      const status = saved.correct ? answerUi.correct : answerUi.wrong;

      return `<strong>${status}</strong><br>${answerUi.reference}${esc(answer)}${explanation ? `<br>${answerUi.explanation}${esc(explanation)}` : ""}`;

    }

    function evaluateAnswer(question, value) {

      const refs = splitReferenceAnswers(question.answer || "");

      if (!refs.length) return null;

      if (Array.isArray(value)) {

        if (!value.some(v => normalizeAnswerText(v))) return false;

        if (inferAnswerMode(question) === "choice") {

          if (question.combo) {

            const sel = value && value.length ? String(value[0]) : "";

            const opt = question.options.find(o => o.key === sel);

            if (!opt || !opt.values) return false;

            const a = opt.values.map(v => normalizeAnswerText(v)).filter(Boolean).sort().join("|");

            const b = (question.comboCorrect || []).map(v => normalizeAnswerText(v)).filter(Boolean).sort().join("|");

            return !!a && a === b;

          }

          const selected = value.map(normalizeAnswerText).filter(Boolean).sort().join("");

          const refSet = refs.map(r => normalizeAnswerText(r)).filter(Boolean).sort().join("");

          return !!selected && selected === refSet;

        }

        return value.every((item, index) => normalizeAnswerText(item) && normalizeAnswerText(item) === normalizeAnswerText(refs[index] || ""));

      }

      const normalized = normalizeAnswerText(value);

      return refs.some(ref => normalized && normalized === normalizeAnswerText(ref));

    }

    function bindAnswerControls(rootEl) {

      const questionById = Object.fromEntries(

        expandQBForDrill(drillAllQuestions())

          .filter(q => q.qb

            ? (q.answerMode === "choice" || cleanQBAnswer(q.answer || "").length > 0)

            : isObjectiveQBQuestion(q))

          .map(question => { const c = fillToChoice(question); return [c.id, c]; })

      );

      rootEl.querySelectorAll("[data-answer-mode='choice']").forEach(panel => {

              ? (currentValues.includes(btn.dataset.choice) ? currentValues.filter(item => item !== btn.dataset.choice) : [...currentValues, btn.dataset.choice])
